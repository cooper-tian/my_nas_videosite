<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f62d8">
<title>公募基金理论与实践题库</title>
<style>
/* ============ 基础 ============ */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
:root{
  color-scheme: light;
  --bg:#f7f8f9; --card:#ffffff; --card2:#fbfcfc;
  --ink:#2a3138; --ink2:#4a5563; --sub:#646e7b; --sub2:#646e7b;
  --line:#e7e9ec; --line2:#f1f2f4;
  --brand:#2f62d8; --brand2:#4c7be8; --tint:#eff3fb; --tint2:#e0e8f7;
  --ok:#14795c; --okbg:#eaf5f0; --okline:#c6e4d8;
  --no:#be3a3a; --nobg:#fbeded; --noline:#efd0d0;
  --warn:#93610b; --warnbg:#fbf3e3; --warnline:#eddcbb;
  --violet:#6551b8; --violetbg:#f2effb;
  --r:14px; --r-sm:10px;
  --sh:0 1px 2px rgba(41,49,56,.03), 0 8px 22px -16px rgba(41,49,56,.18);
  --sh-hover:0 2px 6px rgba(41,49,56,.05), 0 14px 30px -18px rgba(41,49,56,.22);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
html, body { margin:0; padding:0; }
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:80px;
}
button, input, select { font: inherit; color: inherit; }
button { cursor:pointer; border:none; background:none; }
h1,h2,h3,h4,p { margin:0; }
.wrap{ width:min(1120px, calc(100% - 32px)); margin:0 auto; }
.mono{ font-family:var(--mono); }

/* ============ 顶栏 ============ */
.topbar{
  position:sticky; top:0; z-index:50;
  background:color-mix(in srgb, var(--card) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(12px);
  border-bottom:1px solid var(--line);
}
.topbar .wrap{ display:flex; align-items:center; gap:18px; height:62px; }
.brand{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
.logo{
  width:34px; height:34px; border-radius:10px; display:grid; place-items:center;
  background:linear-gradient(140deg, var(--brand), var(--brand2));
  color:#fff; font-weight:700; font-size:16px; letter-spacing:0;
  box-shadow:0 6px 16px -8px var(--brand);
}
.brand b{ display:block; font-size:15px; line-height:1.25; letter-spacing:.2px; }
.brand small{ display:block; color:var(--sub2); font-size:11px; line-height:1.3; letter-spacing:.3px; }
.tabs{ display:flex; gap:2px; margin-left:auto; overflow-x:auto; scrollbar-width:none; min-width:0; }
.tabs::-webkit-scrollbar{ display:none; }
.tabs button{
  position:relative; padding:8px 14px; border-radius:9px; white-space:nowrap;
  color:var(--sub2); font-size:14px; font-weight:500; transition:.16s;
}
.tabs button:hover{ color:var(--ink); background:var(--line2); }
.tabs button.on{ color:var(--brand); background:var(--tint); font-weight:600; }
.tabs .n{
  display:inline-block; min-width:17px; height:17px; padding:0 5px; margin-left:5px;
  border-radius:9px; background:var(--no); color:#fff; font-size:10.5px; line-height:17px;
  font-weight:600; vertical-align:1px;
}
.tabs .n.zero{ display:none; }

/* ============ 通用组件 ============ */
.card{ background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--sh); }
.chips{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{
  padding:5px 11px; border-radius:999px; font-size:12.5px; color:var(--sub2);
  background:var(--card); border:1px solid var(--line); transition:.15s; white-space:nowrap;
}
.chip:hover{ border-color:var(--brand); color:var(--brand); }
.chip.on{ background:var(--brand); border-color:var(--brand); color:#fff; font-weight:600; }
.seg{ display:inline-flex; background:var(--line2); border-radius:9px; padding:2px; gap:2px; }
.seg button{ padding:5px 11px; border-radius:7px; font-size:12.5px; color:var(--sub2); transition:.15s; }
.seg button:hover{ color:var(--ink); }
.seg button.on{ background:var(--card); color:var(--ink); font-weight:600; box-shadow:0 1px 3px rgba(16,24,39,.1); }
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:9px 16px; border-radius:10px; font-size:14px; font-weight:600;
  background:var(--card); border:1px solid var(--line); color:var(--ink2); transition:.15s;
}
.btn:hover{ border-color:var(--brand); color:var(--brand); }
.btn.primary{ background:linear-gradient(140deg,var(--brand),var(--brand2)); border-color:transparent; color:#fff; box-shadow:0 8px 20px -12px var(--brand); }
.btn.primary:hover{ filter:brightness(1.06); color:#fff; }
.btn.ghost{ background:transparent; }
.btn.sm{ padding:6px 11px; font-size:12.5px; border-radius:8px; }
.btn.danger{ color:var(--no); }
.btn.danger:hover{ border-color:var(--no); color:var(--no); }
.btn:disabled{ opacity:.4; cursor:not-allowed; }
.badge{
  display:inline-block; padding:2px 8px; border-radius:6px; font-size:11.5px;
  background:var(--tint); color:var(--brand); font-weight:600; letter-spacing:.2px;
}
.badge.kp{ background:var(--line2); color:var(--sub2); font-weight:500; }
.badge.warn{ background:var(--warnbg); color:var(--warn); }
.badge.ok{ background:var(--okbg); color:var(--ok); }
.badge.no{ background:var(--nobg); color:var(--no); }
.muted{ color:var(--sub2); }
.tiny{ font-size:12px; }
.row{ display:flex; align-items:center; gap:10px; }
.spacer{ flex:1; }

/* ============ 刷题 ============ */
.pbar{ height:5px; border-radius:3px; background:var(--line2); overflow:hidden; }
.pbar > i{ display:block; height:100%; background:linear-gradient(90deg,var(--brand),var(--brand2)); transition:width .3s; }
.toolbar{ padding:14px 16px; display:flex; flex-direction:column; gap:11px; margin-bottom:14px; }
.toolbar .line{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.toolbar .lbl{ font-size:12px; color:var(--sub2); flex-shrink:0; letter-spacing:.3px; }
.toolbar .chips{ flex:1; min-width:0; }
.qmeta{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12px; color:var(--sub2); }
.qno{ font-family:var(--mono); font-size:12.5px; color:var(--sub2); }
.qcard{ padding:22px 24px 20px; margin-bottom:14px; }
.qstem{ font-size:17px; line-height:1.75; font-weight:600; letter-spacing:.1px; margin:12px 0 18px; white-space:pre-wrap; }
.opts{ display:flex; flex-direction:column; gap:9px; }
.opt{
  display:flex; align-items:flex-start; gap:11px; width:100%; text-align:left;
  padding:11px 14px; border:1px solid var(--line); border-radius:11px;
  background:var(--card); transition:.15s; line-height:1.65;
}
.opt:hover{ border-color:var(--brand); background:var(--tint); }
.opt .ltr{
  flex:0 0 24px; height:24px; border-radius:7px; display:grid; place-items:center;
  background:var(--line2); color:var(--sub2); font-size:12.5px; font-weight:700; margin-top:1px;
}
.opt .txt{ flex:1; white-space:pre-wrap; }
.opt.correct{ border-color:var(--ok); background:var(--okbg); }
.opt.correct .ltr{ background:var(--ok); color:#fff; }
.opt.wrong{ border-color:var(--no); background:var(--nobg); }
.opt.wrong .ltr{ background:var(--no); color:#fff; }
.opt.locked{ cursor:default; }
.opt.locked:hover{ border-color:var(--line); background:var(--card); }
.opt.correct.locked:hover{ border-color:var(--ok); background:var(--okbg); }
.opt.wrong.locked:hover{ border-color:var(--no); background:var(--nobg); }
.opt.dim{ opacity:.55; }

.verdict{ display:flex; align-items:center; gap:9px; font-weight:600; font-size:14.5px; margin-bottom:4px; }
.verdict.ok{ color:var(--ok); }
.verdict.no{ color:var(--no); }
.verdict .dot{ width:18px; height:18px; border-radius:50%; display:grid; place-items:center; color:#fff; font-size:11px; flex:0 0 18px; }
.verdict.ok .dot{ background:var(--ok); }
.verdict.no .dot{ background:var(--no); }

.ana{ margin-top:18px; display:flex; flex-direction:column; gap:10px; animation:slide .22s ease-out; }
@keyframes slide{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
.block{ border-radius:11px; padding:12px 14px; border:1px solid transparent; }
.block .h{ font-size:11.5px; letter-spacing:.8px; font-weight:700; margin-bottom:5px; display:flex; align-items:center; gap:6px; }
.block .h::before{ content:""; width:3px; height:12px; border-radius:2px; background:currentColor; }
.block p{ margin:0; font-size:14.5px; line-height:1.75; }
.b-plain{ background:var(--tint); border-color:var(--tint2); }
.b-plain .h{ color:var(--brand); }
.b-eg{ background:var(--warnbg); border-color:var(--warnline); }
.b-eg .h{ color:var(--warn); }
.b-trap{ background:var(--okbg); border-color:var(--okline); }
.b-trap .h{ color:var(--ok); }
.b-trap p{ font-weight:700; }
details.orig{ margin-top:2px; border:1px dashed var(--line); border-radius:10px; padding:2px 13px; }
details.orig summary{ cursor:pointer; font-size:12.5px; color:var(--sub2); padding:7px 0; list-style:none; display:flex; align-items:center; gap:6px; }
details.orig summary::-webkit-details-marker{ display:none; }
details.orig summary::before{ content:"▸"; transition:.15s; }
details.orig[open] summary::before{ transform:rotate(90deg); }
details.orig p{ font-size:13.5px; color:var(--sub2); line-height:1.75; margin:0 0 10px; }
.qfoot{ display:flex; align-items:center; gap:8px; margin-top:16px; flex-wrap:wrap; }
.kbd{
  font-family:var(--mono); font-size:11px; padding:1px 5px; border-radius:4px;
  border:1px solid var(--line); border-bottom-width:2px; color:var(--sub2); background:var(--card2);
}
.empty{ text-align:center; padding:60px 20px; color:var(--sub2); }
.empty .big{ font-size:15px; color:var(--ink2); font-weight:600; margin-bottom:6px; }
.tip{
  display:flex; align-items:center; gap:8px; padding:9px 13px; border-radius:10px;
  background:var(--tint); color:var(--brand); font-size:12.5px; margin-bottom:12px;
}
.tip button{ margin-left:auto; color:var(--brand); opacity:.7; font-size:12px; }

/* ============ 错题本 ============ */
.stat3{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:14px; }
.stat3 .card{ padding:14px 16px; }
.stat3 .k{ font-size:12px; color:var(--sub2); margin-bottom:2px; }
.stat3 .v{ font-size:23px; font-weight:700; letter-spacing:-.5px; font-variant-numeric:tabular-nums; }
.wrow{ padding:14px 16px; border-bottom:1px solid var(--line2); display:flex; gap:14px; align-items:flex-start; }
.wrow:last-child{ border-bottom:none; }
.wrow .body{ flex:1; min-width:0; }
.wrow .q{ font-size:14.5px; font-weight:600; line-height:1.65; margin:6px 0; }
.wrow .meta{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.wrow .act{ display:flex; flex-direction:row; gap:6px; flex-shrink:0; align-items:flex-start; }
.wcnt{ font-family:var(--mono); font-weight:700; color:var(--no); }
.wronglist{ overflow:hidden; }
.wsub{ display:flex; gap:14px; margin-top:6px; font-size:12.5px; color:var(--sub2); flex-wrap:wrap; }
.wsub b{ color:var(--ink2); font-weight:600; }
.wsub .x{ color:var(--no); }
.wsub .y{ color:var(--ok); }
.dotline{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:0 16px 14px; }
.tabline{ display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line2); flex-wrap:wrap; }

/* ============ 速记 ============ */
.fcard{ padding:28px 26px; min-height:300px; display:flex; flex-direction:column; justify-content:center; cursor:pointer; }
.fcard .stem{ font-size:17px; font-weight:600; line-height:1.8; text-align:center; white-space:pre-wrap; }
.fcard .hint{ text-align:center; color:var(--sub2); font-size:12.5px; margin-top:22px; }
.fcard .rev{ animation:fade .25s; }
@keyframes fade{ from{opacity:0} to{opacity:1} }
.fans{ margin-top:20px; text-align:center; }
.fans .big{ font-size:15px; line-height:1.7; font-weight:700; color:var(--ok); }
.fans .ltr{ display:inline-grid; place-items:center; width:26px; height:26px; border-radius:8px; background:var(--ok); color:#fff; font-weight:700; margin-right:8px; vertical-align:-6px; }
.fnav{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px; border-top:1px solid var(--line2); }
.slist{ overflow:hidden; }
.srow{ padding:11px 16px; border-bottom:1px solid var(--line2); cursor:pointer; transition:.12s; }
.srow:hover{ background:var(--card2); }
.srow .top{ display:flex; gap:10px; align-items:baseline; }
.srow .idx{ font-family:var(--mono); font-size:11.5px; color:var(--sub2); flex:0 0 34px; }
.srow .q{ flex:1; font-size:14px; line-height:1.6; }
.srow .a{ font-weight:700; color:var(--ok); flex:0 0 auto; font-size:13px; }
.srow .a b{ display:inline-grid; place-items:center; width:20px; height:20px; border-radius:6px; background:var(--okbg); color:var(--ok); margin-right:4px; }
.srow .detail{ display:none; margin:9px 0 2px 44px; padding-left:12px; border-left:2px solid var(--line); font-size:13.5px; color:var(--ink2); line-height:1.75; }
.srow.open{ background:var(--tint); }
.srow.open .detail{ display:block; }
.srow .detail .l{ color:var(--sub2); font-size:12px; margin-top:6px; }
.srow .detail .l b{ color:var(--warn); font-weight:600; }
.search{ display:flex; align-items:center; gap:8px; padding:10px 14px; border:1px solid var(--line); border-radius:11px; background:var(--card); }
.search input{ flex:1; border:none; outline:none; background:none; font-size:14px; }
.search input::placeholder{ color:var(--sub2); }

/* ============ 知识框架 ============ */
.flayout{ display:grid; grid-template-columns:236px 1fr; gap:16px; align-items:start; }
.fside{ position:sticky; top:78px; padding:10px; }
.fside a{
  display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:9px;
  color:var(--ink2); font-size:13.5px; text-decoration:none; transition:.14s; line-height:1.4;
}
.fside a:hover{ background:var(--line2); }
.fside a.on{ background:var(--tint); color:var(--brand); font-weight:600; }
.fside a .i{ font-family:var(--mono); font-size:11px; color:var(--sub2); width:14px; flex:0 0 14px; }
.fside a.on .i{ color:var(--brand); }
.fside .sep{ height:1px; background:var(--line); margin:8px 6px; }
.fmain{ min-width:0; }
.fhero{ padding:20px 24px; margin-bottom:14px; }
.fhero h2{ font-size:21px; letter-spacing:-.2px; margin-bottom:8px; }
.fhero .why{ color:var(--ink2); font-size:14px; line-height:1.8; }
.logic{
  margin-top:14px; padding:11px 14px; border-radius:10px; background:var(--tint);
  border:1px solid var(--tint2); font-size:13.5px; color:var(--brand); font-weight:600; line-height:1.7;
}
.fsec{ padding:18px 22px; margin-bottom:12px; }
.fsec h3{ font-size:15px; display:flex; align-items:center; gap:9px; margin-bottom:12px; }
.fsec h3 .idx{
  width:23px; height:23px; border-radius:7px; background:var(--tint); color:var(--brand);
  display:grid; place-items:center; font-size:12px; font-weight:700; flex:0 0 23px;
}
.pt{ display:grid; grid-template-columns:132px 1fr; gap:14px; padding:8px 0; border-top:1px dashed var(--line2); }
.pt:first-of-type{ border-top:none; }
.pt .k{ font-weight:600; font-size:13.5px; color:var(--ink); line-height:1.6; }
.pt .k .star{ color:var(--warn); font-size:10px; vertical-align:2px; margin-left:2px; }
.pt .v{ font-size:13.5px; color:var(--ink2); line-height:1.75; }
.pt.hit .k{ color:var(--brand); }
.pt.hit .v{ background:var(--warnbg); border-radius:4px; box-shadow:0 0 0 2px var(--warnbg); }
.ftable{ display:flex; flex-direction:column; gap:1px; background:var(--line2); border-radius:10px; overflow:hidden; }
.ftable .fr{ background:var(--card); padding:10px 13px; display:grid; grid-template-columns:120px 1fr; gap:12px; font-size:13.5px; }
.ftable .fr .n{ font-weight:600; color:var(--ink); }
.ftable .fr .f{ font-family:var(--mono); font-size:13px; color:var(--brand); }
.ftable .fr .u{ grid-column:2; font-size:12px; color:var(--sub2); margin-top:2px; }
.list{ display:flex; flex-direction:column; gap:8px; }
.li{ display:flex; gap:9px; font-size:13.5px; line-height:1.7; color:var(--ink2); }
.li .m{ flex:0 0 16px; color:var(--brand); font-weight:700; font-size:12px; margin-top:2px; }
.li.trap .m{ color:var(--no); }
.li.must .m{ color:var(--warn); }
.li.mnem .m{ color:var(--violet); }
.li b{ color:var(--ink); }
.mnembox{ background:var(--violetbg); border:1px solid color-mix(in srgb, var(--violet) 22%, transparent); border-radius:10px; padding:12px 14px; }
.mnembox .t{ font-size:11.5px; letter-spacing:.8px; font-weight:700; color:var(--violet); margin-bottom:6px; }
.mnembox .li{ color:var(--ink); font-weight:600; }
.numtable{ width:100%; border-collapse:collapse; font-size:13.5px; }
.numtable th{ text-align:left; font-size:11.5px; letter-spacing:.6px; color:var(--sub2); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--card); z-index:1; }
.numtable td{ padding:9px 10px; border-bottom:1px solid var(--line2); vertical-align:top; line-height:1.65; }
.numtable tr:hover td{ background:var(--card2); }
.numtable td.v{ font-weight:600; color:var(--brand); white-space:nowrap; }
.numtable td.n{ color:var(--sub2); font-size:12.5px; }
.conf{ padding:14px 16px; border-bottom:1px solid var(--line2); }
.conf .ab{ display:flex; align-items:center; gap:9px; font-weight:700; font-size:14px; margin-bottom:5px; }
.conf .ab .vs{ font-size:10.5px; color:var(--sub2); font-weight:500; letter-spacing:1px; }
.conf .d{ font-size:13.5px; color:var(--ink2); line-height:1.75; }

/* ============ 进度 ============ */
.kpis{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:14px; }
.kpi{ padding:15px 16px; }
.kpi .k{ font-size:12px; color:var(--sub2); }
.kpi .v{ font-size:25px; font-weight:700; letter-spacing:-.6px; font-variant-numeric:tabular-nums; margin-top:2px; }
.kpi .v small{ font-size:13px; color:var(--sub2); font-weight:500; letter-spacing:0; }
.chrow{ display:grid; grid-template-columns:170px 1fr 92px; gap:14px; align-items:center; padding:9px 0; border-top:1px dashed var(--line2); }
.chrow:first-child{ border-top:none; }
.chrow .nm{ font-size:13.5px; font-weight:500; }
.chrow .nm small{ color:var(--sub2); font-weight:400; margin-left:5px; font-size:11.5px; }
.chrow .bar{ height:7px; border-radius:4px; background:var(--line2); overflow:hidden; }
.chrow .bar i{ display:block; height:100%; border-radius:4px; background:linear-gradient(90deg,var(--brand),var(--brand2)); }
.chrow .pct{ text-align:right; font-size:12.5px; color:var(--sub2); font-variant-numeric:tabular-nums; }
.chrow .pct b{ color:var(--ink); font-size:13px; }
.chrow .pct b.none{ color:var(--sub2); font-weight:500; font-size:12px; }
.heat{ display:flex; gap:6px; align-items:flex-end; height:96px; padding:6px 2px; }
.heat .d{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:5px; height:100%; }
.heat .d i{ width:100%; max-width:36px; background:var(--line2); border-radius:5px 5px 3px 3px; min-height:4px; }
.heat .d.has i{ background:linear-gradient(180deg,var(--brand2),var(--brand)); }
.heat .d span{ font-size:10.5px; color:var(--sub2); }
.heat .d b{ font-size:11px; color:var(--ink2); font-variant-numeric:tabular-nums; }

/* ============ toast / 其他 ============ */
#toast{ position:fixed; left:50%; bottom:28px; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
.tmsg{
  background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:11px; font-size:13.5px;
  font-weight:500; box-shadow:0 12px 30px -10px rgba(0,0,0,.4); animation:tin .25s ease-out; max-width:86vw; text-align:center;
}
@keyframes tin{ from{opacity:0; transform:translateY(10px) scale(.96);} to{opacity:1; transform:none;} }
.foot{ text-align:center; color:var(--sub2); font-size:11.5px; padding:30px 0 10px; line-height:1.8; }

@media (max-width: 900px){
  .flayout{ grid-template-columns:1fr; }

<script type="application/json" id="BANK">{"meta":{"n":400,"build":"2026-10-19"},"ch":[{"id":1,"name":"基金法规与监管","short":"法规监管"},{"id":2,"name":"职业道德与合规内控","short":"职业合规"},{"id":3,"name":"基金销售与客户服务","short":"销售客服"},{"id":4,"name":"基金运作·估值·费用","short":"运作估值"},{"id":5,"name":"投资组合理论","short":"组合理论"},{"id":6,"name":"股票投资与估值","short":"股票估值"},{"id":7,"name":"债券投资","short":"债券"},{"id":8,"name":"衍生工具","short":"衍生"},{"id":9,"name":"业绩评价与归因","short":"业绩评价"},{"id":10,"name":"另类投资与创新产品","short":"另类创新"},{"id":11,"name":"交易·结算·市场","short":"交易结算"}],"q":[{"i":1,"c":9,"k":"信息比率与夏普","q":"下列关于夏普比率和信息比率的表述，错误的是（）。","o":["两者都是经总风险调整后的收益分析指标","信息比率是从主动管理的角度出发，描述风险调整后收益","信息比率越大可以说明在同样的超额收益水平下跟踪误差更小","夏普比率在组合超额收益为负数时，可能会产生错误的评价结论"],"a":0,"p":"信息比率的分母是跟踪误差，只衡量主动偏离基准带来的风险，属于主动管理视角；夏普比率的分母是组合总风险。A把信息比率也算成总风险调整，正是错误所在。","e":"两家奶茶店比手艺：夏普看整店总波动，信息比率只比超出隔壁连锁招牌配方的那部分偏差，偏离越小，同样的超额越值钱。","t":"夏普看总风险，信息比率只看跟踪误差","r":"信息比率是从主动管理的角度描述风险调整后收益，它不同于夏普比率从绝对收益和总风险角度来描述。"},{"i":2,"c":11,"k":"印花税调节","q":"下列关于印花税的说法中，错误的是（）。","o":["印花税是根据国家法律规定，在股票成交后买卖双方投资者按照规定的税率分别征收的税金","目前，我国A股印花税率为单边征收(只在卖出股票时征收),税率为0.05%","印花税率为固定税率，相关部门不可调节印花税率和征收方向","证券交易所代政府的税务机关向投资者征收印花税"],"a":2,"p":"印花税由证券交易所代税务机关扣缴，税率和征收方向都可以调整，是调节市场活跃度的工具。当前A股只在卖出时单边征收，税率0.05%，所以固定不可调的说法不成立。","e":"菜市场摊位费随时能涨能降：今天只向卖菜的一方收0.05%，明天可以两边都收，管理处一句话就改，摊主没法当成永远不动的规矩。","t":"印花税单边卖出0.05%，且可调","r":"相关部门可以通过调节印花税税率和征收方向等来调节交易费用，进而调控市场活跃度。"},{"i":3,"c":1,"k":"QDII投资顾问","q":"QDII可委托符合下列条件的境外投资顾问，下列条件错误的是（）","o":["在境外设立，经所在国家或地区监管机构批准从事投资管理业务；","所在国家或地区证券监管机构已与中国证监会签订双边监管合作谅解备忘录，并保持着有效的监管合作关系","经营投资管理业务达5年以上，最近1个会计年度管理的证券资产不少于100亿美元或等值货币；","有健全的治理结构和完善的内控制度，经营行为规范，最近3年没有受到所在国家或地区监管机构的重大处罚，没有重大事项正在接受司法部门、监管机构的立案调查。"],"a":3,"p":"境外投资顾问须经营投资管理业务满5年、最近一个会计年度管理证券资产不少于100亿美元，且最近5年无重大处罚。D把5年写成3年，门槛被放宽，所以它是错误条件。","e":"学校请外教，要求教龄满5年、带过的班规模折合100亿美元，还得最近5年没被教育局处分；说成3年没处分，标准就降了快一半。","t":"QDII顾问：5年经验、100亿美元、5年无处罚","r":"有健全的治理结构和完善的内控制度，经营行为规范，最近5年没有受到所在国家或地区监管机构的重大处罚，没有重大事项正在接受司法部门、监管机构的立案调查。"},{"i":4,"c":7,"k":"可转债赎回条款","q":"关于可转债的赎回权，以下说法正确的是（）。","o":["持有人在可转债跌破面值时行使赎回权","持有人在股价下跌时行使赎回权","发行人在约定的赎回条件被触发时可行使赎回权","发行人通过董事会决议后可以行使赎回权"],"a":2,"p":"赎回权握在发行人手里，只有股价涨到转股价一定倍数、触发约定条件时，公司才按约定价格赎回，目的是避免股本过度稀释。持有人没有这项权利，只能在转股和回售之间选。","e":"房东约定房租涨到两倍就收回房子自住：涨到位才触发，租客没资格因为房价跌了就要求房东收回，主动权在房东方。","t":"赎回是发行人的权利，触发条件才生效","r":"赎回条款是指发行企业有权在约定的条件触发时按照事先约定的价格赎回所发行的可转债的规定。一般在公司股票价格升至超过转换价格一定倍数时，公司为避免股本被过度稀释及支付可转换债券持有者过多的盈利而行使赎回权利。"},{"i":5,"c":8,"k":"期权价格因素","q":"下列关于影响期权价格的因素及其影响方向的说法错误的是（）。","o":["合约标的资产的分红增加，看跌期权价格上涨","合约标的資产的市场价格上涨，看涨期权价格上涨","无风险利率水平上升，看涨期权价格下跌","合约标的资产价格的波动率增加，看跌期权价格上涨"],"a":2,"p":"看涨期权只需先付权利金，行权款日后再付，利率越高这笔钱生息越多，看涨期权反而越贵，所以说利率上升它跌价是错的。分红增加、波动率上升时看跌期权涨价则都成立。","e":"打车预付定金锁定行程，存款利率越高，晚付尾款越划算，这张上车权越值钱；说利率一涨它就贬值，等于说钱多反而亏。","t":"无风险利率上升，看涨期权涨、看跌期权跌","r":"看涨期权买方只需支付期权费买入期权，其剩余资金可以无风险利率进行投资。因此当无风险利率上升时，看胀期权的价格随之升高。"},{"i":6,"c":4,"k":"估值重要性","q":"关于基金资产估值的重要性下列说法错误的是（）","o":["基金资产估值直接关系到基金投资者的利益，要求基金份额净值的计算必须准确。","由于直接与基金申购赎回相关所以基金份额净值必须是公允的。","每份基金都与基金的各项资产及各项负债按一定的比例一一对应","公募基金底层资产必须以市价法进行估值"],"a":3,"p":"份额净值要公允，因为它直接决定申购赎回价格，每份份额对应资产和负债的同一比例。但公募底层资产并非一律用市价法，停牌股、违约债等可以借助估值技术，绝对化的D错。","e":"合租分摊水电，账单清楚才能按份平摊；可有的表坏了、有的费还没出，只能估算，硬说每笔都必须按现成市价，就太绝对。","t":"净值要公允，但估值方法不止市价法","r":"基金管理人为了提高基金业绩从而达到吸引投资者的目的，有可能操纵估值结果，从而造成资产估值不公允。"},{"i":7,"c":6,"k":"风险溢价","q":"关于权益类证券的风险溢价，下列说法正确的是（）。","o":["A， 在相同的市场条件下 ， 风险溢价越高 ， 风险资产的期望收益率越高","风险溢价是指证券风险高于正常风险的部分","风险溢价可以是正数也可以是负数","风险资产期望收益率等于风险溢价"],"a":0,"p":"风险溢价是期望收益率超过无风险利率的补偿，同一市场条件下，要求的补偿越高，风险资产的期望收益率就越高，两者同向变动。B把它说成高于正常风险的部分，混淆了收益和风险。","e":"同事借钱给朋友开奶茶店，无风险存款年息3%，他要年化8%，多出的5%就是风险溢价；店越不确定，这5%要得越高。","t":"期望收益等于无风险利率加风险溢价","r":"风险较高的权益类证券、风险较高的公司对应着一个较高的风险溢价，其期望收益率一般也较高。"},{"i":8,"c":5,"k":"市场有效性","q":"关于市场有效性，以下表述正确的是（）。","o":["弱有效市场中任何信息都可能对证券价格产生影响","半强有效市场中可以使用基本面分析法获取超额利润","半强有效市场中可以通过分析公开信息获取超额利润","半强有效市场中可以通过内部信息获取超额利润"],"a":3,"p":"半强有效市场里股价已消化全部公开信息，基本面分析和看公告都赚不到超额收益，只有未公开的内部信息还能获利。弱有效市场否定的是技术分析，A、B、C都把有效性说反了。","e":"全班都看过同一份考试范围，靠它拿不到加分；只有提前拿到没公开的补考题，才算信息优势。公开信息人人有，内幕才稀缺。","t":"半强有效：公开信息无用，内幕仍可赚","r":"在一个弱有效的证券市场上，任何为了预测未来证券价格走势而对以往价格、交易量等历史信息所进行的技术分析都是徒劳的。如果市场是半强有效的，市场参与者就不可能从任何公开信息中获取超额利润，这意味着基本面分析方法无效。"},{"i":9,"c":2,"k":"控制环境","q":"内部控制基本要素的控制环境指（）","o":["基金管理人应当建立科学严密的风险评估体系，对公司内部外部风险进行识别、评估和分析，及时防范和化解风险。","基金管理人应当维护沟通渠道畅通，建立清晰的报告系统","是构成内部控制的基础，控制环境包括;经营理念和控制文化、公司治理结构、组织结构、员工道德素质等内容。","基金管理人应通过授权控制来控制业务操作，并贯穿业务活动始终"],"a":2,"p":"控制环境是内控的地基，管的是经营理念、治理结构、组织架构和员工道德这些软条件。风险评估、信息沟通、授权控制是另外几个要素，不能混着答，C正是控制环境的定义。","e":"开一家奶茶店，老板重不重视卫生、店长怎么分工、店员诚不诚实，决定制度能不能落地；冰柜温度计只是后面的具体控制手段。","t":"控制环境是地基：理念、治理、架构、人品","r":"控制环境是构成内部控制的基础，控制环境包括;经营理念和控制文化、公司治理结构、组织结构、员工道德素质等内容。"},{"i":10,"c":2,"k":"录像保存期限","q":"基金经营机构的交易时段客户交易区的监控录像资料，保存期限不得少于（）个月。","o":["3","6","9","18"],"a":1,"p":"客户交易区监控录像属于业务留痕资料，监管要求保存不少于6个月，方便事后查证销售过程和纠纷。3个月、9个月、18个月都是改数字的干扰项，记住6个月这条硬线。","e":"奶茶店收银台摄像头至少存半年，顾客说少找了钱，能翻出当时的录像对账；存3个月就删了，出了纠纷只能干瞪眼。","t":"客户交易区监控录像，保存不少于6个月","r":"基金经营机构的交易时段客户交易区的监控录像资料，保存期限不得少于6个月。"},{"i":11,"c":6,"k":"流动资产","q":"下列科目中，属于流动资产的是（）。","o":["无形资产","固定资产","长期股权投资","存货"],"a":3,"p":"流动资产指一年内能变现或耗用的项目，存货卖出去就变现金，属于流动资产。无形资产、固定资产、长期股权投资都要长期持有慢慢摊销，变现慢，归入非流动资产。","e":"宿舍囤的零食一学期内能吃掉或转卖，算手头活钱；自行车、电脑是家当，急着用钱时卖不掉，也卖不上价。","t":"存货一年内变现算流动，长期股权不流动","r":"企业的流动资产主要包括现金及现金等价物、应收票据、应收账款和存货等几项資产，它们能够在短期内快速变现，因而流动性很强。"},{"i":12,"c":5,"k":"基金平均仓位","q":"A股市场一直流传着88魔咒，指当开放式股票型基金的仓位水平逼近或超过了88％的水平，市场往往会出现阶段性调整。这个魔咒屡屡显灵，这里的88％是指纳入统计的开放式基金的股票仓位的（）。","o":["最大值","中位值","平均值","分位值"],"a":2,"p":"88魔咒说的是纳入统计的开放式股票型基金平均股票仓位逼近或超过88%，意味着机构弹药快用完，后续买盘不足，指数容易调整。最大值、中位值、分位值都不是这个口径。","e":"全班凑钱买零食，平均每人已花掉88块，剩下零钱不多，再想集体加购就吃力；看的是平均值，不是谁花得最多。","t":"88魔咒看的是股票基金平均仓位","r":"A股市场有“ 88魔咒”的说法，即股票型基金平均仓位超过88％后，指数将面临调整。"},{"i":13,"c":1,"k":"QFII持股比例","q":"QFII投资范围、持股比例的规定，单个境外投资者通过合格投资者持有一家上市公司股票的，持股比例不得超过该公司股份总数的（）","o":["2.5%","5%","10%","20%"],"a":2,"p":"单个境外投资者通过合格投资者持有一家上市公司，持股比例上限是该公司股份总数的10%，防止外资过度集中。5%、20%都不是这条红线，要记住单个投资者加10%两个限定。","e":"合伙开奶茶店，一个外来投资人最多只能占一成股份，再多就威胁创始团队控制权，超过10%这条线就得停下来。","t":"QFII单个境外投资者持股不超10%","r":"单个境外投资者通过合格投资者持有一家上市公司股票的，持股比例不得超过该公司股份总数的10%;"},{"i":14,"c":7,"k":"拱形收益率曲线","q":"（）的期限结构特征是，期限相对较短的债券，利率与期限成正向关系，而期限较长的债券，利率与期限成反向关系。","o":["拱形收益率曲线","上升收益率曲线","水平收益率曲线","下降益率曲线"],"a":0,"p":"拱形收益率曲线先上后下：短端利率随期限上升，长端反而随期限下降，整体像拱门。上升曲线全程向上，下降曲线全程向下，水平曲线基本一条直线，都不符合先升后降。","e":"爬坡爬到半山腰就下坡，前一段越走越高，后一段越走越低；上升曲线一路向上，下降曲线一路向下，只有拱形会拐弯。","t":"短端向上、长端向下，才是拱形曲线","r":"拱形收益率曲线的结构特征是：期限相对较短的债券，利率与期限成正向关系，而期限相对较长的债券，利率与期限呈反向关系。"},{"i":15,"c":1,"k":"托管人实收资本","q":"QFII托管人资格中关于托管人的实收资本不少于（）人民币。","o":["30亿","50亿","60亿","80亿"],"a":3,"p":"QFII托管人门槛之一是实收资本不少于80亿元人民币，还要有足够的外汇与结算能力。30亿、50亿、60亿都是故意设低的干扰数字，记准80亿整。","e":"给留学生当监护人，学校要求家长存款证明至少80万才放心把孩子的钱交给你管；50万看着不少，仍然不够格。","t":"QFII托管人实收资本不低于80亿元","r":"QFII托管人资格中关于托管人的实收资本不少于80亿人民币。"},{"i":16,"c":4,"k":"QDII净值披露","q":"QDII基金的份额净值应当在估值日后（）内披露。","o":["1个工作日","2个工作日","3个工作日","4个工作日"],"a":1,"p":"QDII投资海外，估值要等境外市场收盘和汇率，所以份额净值在估值日后2个工作日内披露，比境内基金慢一天。1个、3个、4个工作日都是故意改错的干扰数字。","e":"海淘下单后要等海外仓发货、清关，物流信息两天后才更新；国内同城快递隔天就到，慢的这一档就是2个工作日。","t":"QDII净值：估值日后2个工作日内披露","r":""},{"i":17,"c":4,"k":"会计核算频率","q":"目前，我国的基金会计核算已经细化到（）","o":["日","月","季度","年"],"a":0,"p":"我国基金会计核算已细化到日，每天要估值、算份额净值、记费用和损益，才能支撑每个交易日的申赎定价。按月、按季、按年都太粗，跟不上净值披露的节奏。","e":"奶茶店每天打烊都要点一遍现金和原料，才知道今天赚没赚；一个月才盘一次账，中途进货和折扣全乱了。","t":"基金会计算到日，每日估值出净值","r":""},{"i":18,"c":1,"k":"认购与申购","q":"在基金募集期限内购买基金份额的行为通常被称为基金的（）。","o":["交易","申购","认购","转入"],"a":2,"p":"募集期内、基金还没成立时买份额叫认购，钱先进募集账户，成立后才按净值折算份额；成立后的日常买入才叫申购。交易和转入都不是这个阶段该用的说法。","e":"新奶茶店开业前卖预售卡，充100得120，这算认购；开业后再充值只能按原价，那才是申购，时点和价格都不同。","t":"募集期买叫认购，成立后买叫申购","r":"在基金募集期限内购买基金份额的行为通常被称为基金的认购。"},{"i":19,"c":4,"k":"影子定价偏离度","q":"货币市场基金在临时报告中披露偏离度信息。当影子定价与摊余成本法确定的基金资产净值偏离度的绝对值达到或者超过（）时，基金管理人将在事件发生之日起（）日内就此事项进行临时报告。","o":["0.25% 2","0.5% 2","0.1% 5","2%1"],"a":1,"p":"货币基金用影子定价和摊余成本法两条线算净值，偏离绝对值达到或超过0.5%，管理人要在2日内发临时报告。0.25%、0.1%和2%都是改数字的干扰项。","e":"家里记账按原价记，月底按市价一算差了0.5%以上，两天内必须跟合伙人报备；差得少就不用惊动大家。","t":"偏离度达0.5%，2日内临时报告","r":"在临时报告中披露偏离度信息。当影子定价与摊余成本法确定的基金资产净值偏离度的绝对值达到或者超过0.5%时，基金管理人将在事件发生之日起2日内就此事项进行临时报告。"},{"i":20,"c":4,"k":"基金资产估值","q":"（）是指通过对基金所拥有的全部资产及所有负债按一定的原则和方法进行估算，进而确定基金资产公允价值的过程","o":["基金资产营销","基金产品设计","基金资产估值","基金产品费用"],"a":2,"p":"基金资产估值就是把全部资产和负债按既定原则方法估算，得出公允价值，再除以份额数得到净值。营销、产品设计、费用都不涉及对这些资产负债的重新计价。","e":"月底盘宿舍公共基金：现钱、没报销的账单、欠室友的奶茶钱都折算清楚，才知道每人该分多少；这个盘点过程就是估值。","t":"估值就是把全部资产负债重估出公允价值","r":""},{"i":21,"c":7,"k":"债券基金收益","q":"以下属于债券型基金收益来源的是？","o":["杠杆收益","票息收益","资本利得收益","以上都是"],"a":3,"p":"债券基金既吃票息，也赚利率下行带来的资本利得，还能通过回购加杠杆放大收益，三条腿都算来源，所以以上都是成立。只说票息会漏掉价差和杠杆这两块。","e":"房东收租金是票息，房价涨了转手是资本利得，拿房子抵押再买一套是杠杆，三笔钱最后都进同一个钱包。","t":"债券基金收益等于票息加资本利得加杠杆","r":""},{"i":22,"c":9,"k":"跟踪误差","q":"在选择指数基金时，最重要的参考指标是什么？","o":["基金规模","成立时间","跟踪误差","过往收益率"],"a":2,"p":"指数基金的任务是复制指数，跟踪误差越小说明跟得越紧，所以它才是挑选时的核心指标。规模大、成立久、过往收益高都只是辅助，收益高也可能只是运气或风格偏离。","e":"跟着导航走，绕路越少越靠谱；车大、开得久不代表路线准，最终看的是和原路线偏差多少米，偏差越小越省心。","t":"挑指数基金先看跟踪误差，越小越好","r":"对于指数基金而言，最重要的是能否准确跟踪目标指数，因此跟踪误差是衡量指数基金运作效果的关键指标。跟踪误差越小，说明基金追踪指数的能力越强。"},{"i":23,"c":1,"k":"季度报告时限","q":"一般来说，基金管理人应当在每个季度结束之日起（）个工作日内，编制完成基金季度报告","o":["5","10","15","20"],"a":2,"p":"基金季度报告要在季度结束之日起15个工作日内编制完成并披露，半年度报告与年度报告的时限还要长一些。5个、10个、20个工作日都是把数字改错的干扰项。","e":"小组作业每季度交一次总结，老师给的期限是季度结束后15个工作日内上传，拖到20天算逾期，5天又太紧。","t":"季报须在季度结束后15个工作日内披露","r":""},{"i":24,"c":1,"k":"集合理财","q":"将众多投资者的资金集中起来，并委托基金管理人进行共同投资，表现了证券投资基金（）的特点","o":["风险共担","集合理财","分散风险","盈余共享"],"a":1,"p":"把众多投资者的钱汇集起来交给管理人统一投资，体现的是集合理财：小钱凑大钱、统一决策。分散风险是组合效果，风险共担和盈余共享是收益分配结果，不是问的特点。","e":"整层宿舍凑份子买一箱水果，一个人买不起也吃不完，凑起来批发价更低、品种更多，这就是把钱合在一起办一件事。","t":"凑钱交给专人管，核心是集合理财","r":""},{"i":25,"c":6,"k":"自上而下策略","q":"小李通过分析宏观经济形势、国家产业政策和对比海外市场情况，认为半导体行业具有较大发展前景，于是通过申购半导体ETF来投资半导体行业。小李的策略为（）","o":["自上而下策略","自下而上策略","技术分析策略","被动投资策略"],"a":0,"p":"小李先从宏观经济、产业政策判断行业景气，再落到具体ETF，这条从大环境到细分的路径就是自上而下。自下而上从个股财务估值出发，技术分析只看价格图形，都不符合。","e":"先看今年天气和旅游政策判断哪个景区会火，再决定买哪家民宿的股份；先挑店再看行业，顺序正好相反。","t":"先宏观行业、后个股，就是自上而下","r":""},{"i":26,"c":4,"k":"基金运作费","q":"下列不属于基金运作费的是","o":["审计费用","申购费用","开户费用","律师费用"],"a":1,"p":"申购费是投资者买卖基金时一次性付的销售费用，进销售机构口袋，不由基金资产承担。审计费、开户费、律师费都从基金资产列支，属于运作费，别把两类费用混在一起。","e":"办健身卡交的开卡手续费归前台收，不算场馆的水电保洁；水电保洁是场馆日常运营成本，从会员费里统一出。","t":"申购费是销售费，审计律师开户才是运作费","r":""},{"i":27,"c":10,"k":"上市开放式基金","q":"（）是我国对证券投资基金的一种本土化创新","o":["收入型基金","私募基金","保本基金","上市开放式基金"],"a":3,"p":"上市开放式基金即LOF，把开放式基金的申购赎回和交易所上市交易结合起来，是我国的本土创新。收入型、保本、私募在境外早有先例，算不上中国独创。","e":"一家奶茶店既能到店点单，也能在外卖平台下单，两种买法同一份菜单，这种两条腿走路的设计才是本地首创。","t":"LOF上市开放式基金，中国本土创新","r":""},{"i":28,"c":10,"k":"ETF联接比例","q":"根据中国证监会的相关指引，ETF联接基金投资于目标ETF的资产不得低于基金资产净值的（）","o":["0.75","0.8","0.85","0.9"],"a":3,"p":"ETF联接基金至少要把90%的基金资产投到目标ETF上，剩下的现金用来应付赎回，所以它本质是帮场外投资者间接买ETF。75%、80%、85%都是调低的干扰数字。","e":"帮室友代购演唱会票，规定至少九成预算必须真买票，剩一成留作手续费和退票垫付，达不到九成就不算代购。","t":"ETF联接基金投目标ETF不低于90%","r":""},{"i":29,"c":6,"k":"宏观经济指标","q":"以下不属于宏观经济指标的是（）。","o":["采购经理指数","资本结构","通货膨胀","国内生产总值"],"a":1,"p":"资本结构说的是企业负债和股权的比例，是公司自己的财务安排，属于微观指标。GDP、通胀、采购经理指数都描述整体经济冷热，才是宏观指标，看宏观不能盯某家公司怎么借钱。","e":"看小区房价走势要看成交均价、看房人数；某户人家贷款几成、首付多少，只说明这家的家底，代表不了整个小区。","t":"资本结构是微观，GDP通胀PMI才宏观","r":"宏观经济指标主要包括国内生产总值、通货膨胀、利率、汇率、预算赤字、失业率、采购经理指数。"},{"i":30,"c":11,"k":"净额结算","q":"以下产品中，使用净额结算方式的是（）。","o":["私募债券转让","深市权证行权","货币ETF申购","中小板股票"],"a":3,"p":"通过交易所达成的股票交易一般走净额结算，买卖双方当天应收应付轧差后只结差额，中小板股票就是典型。私募债转让、权证行权、货币ETF申购多采用全额结算，逐笔足额划付。","e":"室友互相代付：你欠我30、我欠你20，月底只结10块差价，这就是净额；各笔必须原样付清，就是全额。","t":"交易所股票净额轧差，逐笔足额是全额","r":"一般情况下通过证券交易所达成的交易需要采用净额结算方式。私募债券转让、深市权证行权、货币ETF申购都采用全额结算方式。"},{"i":31,"c":6,"k":"研究部职能","q":"基金公司的（）是为基金投资运作提供支持，主要从事宏观、行业和上市公司投资价值研究分析的部门。","o":["风险管理部","交易部","投资部","研究部"],"a":3,"p":"研究部负责宏观、行业和上市公司的价值分析，为投资部提供决策支持，本身不下单。投资部管组合，交易部执行指令，风险管理部管限额和监控，几个部门职能各不相同。","e":"球队里研究部像球探，负责看录像、写报告挑球员；教练决定谁上场，后勤负责订票，球探不直接排首发。","t":"研究部出报告，投资部做决策，交易部下单","r":""},{"i":32,"c":6,"k":"价值型基金","q":"如果基金的平均市盈率、平均市净率小于市场指数的市盈率和市净率，可以认为该股票型基金属于（）","o":["成长型基金","价值型基金","大盘股基金","小盘股基金"],"a":1,"p":"市盈率、市净率都低于市场指数，说明买的是价格相对便宜、被低估的股票，属于价值型。成长型恰恰相反，PE、PB通常偏高；大小盘看的是市值，不是估值倍数。","e":"同样的二手自行车，别人标500，这辆只要300且车况不差，属于捡便宜；专挑新款高价的，是另一种玩法。","t":"PE、PB低是价值型，高是成长型","r":""},{"i":33,"c":7,"k":"债券收益率因素","q":"影响债券收益率的因素有（）。Ⅰ. 流动性风险Ⅱ. 期限风险Ⅲ. 供需变化Ⅳ. 对未来收益率变化的预期","o":["Ⅰ、Ⅱ、Ⅲ、Ⅳ","Ⅱ、Ⅲ、Ⅳ","Ⅰ、Ⅱ、Ⅳ","Ⅰ、Ⅱ、Ⅲ"],"a":0,"p":"债券收益率由多重因素共同决定：期限越长要求期限风险补偿，流动性差的要流动性溢价，市场供需变化和投资者对未来利率的预期也会推高或压低收益率，四项都成立。","e":"借钱给朋友：借三年比借三个月要价高，急用钱难转手要加价，最近借钱的人多、放贷的人少，利率也会跟着涨。","t":"期限、流动性、供需、预期，四因素全选","r":"由于到期期限不同，对未来收益率变化的预期、流动性风险、期限风险以及市场上不同期限债券的供给和需求等因素都会影响债券的收益率。"},{"i":34,"c":3,"k":"基金赎回","q":"关于基金的赎回，以下哪个描述是正确的？","o":["基金赎回只能在交易日进行","投资者可以随时发起赎回开放式基金份额","基金赎回只能在申购时点进行","基金赎回需要提前预约"],"a":1,"p":"赎回是投资者的单方权利，开放日内随时可以提交申请，不用预约，也不要求与申购时点绑定，T日申请按当日净值算。A把它限定得过死，所以不选，正确表述是随时可赎回。","e":"办了健身卡想退，随时能到前台提出，不必挑办卡那天，也不用提前一周打招呼；只在某一天才受理的说法站不住。","t":"开放式基金开放日随时可赎回，无需预约","r":"投资者可以随时赎回基金份额，没有时间限制。因此，答案为B。"},{"i":35,"c":2,"k":"内控机制建设","q":"关于内控机制在建设需加强的四个方面说法错误的是（）","o":["在内控机构设置上，要重点考虑眼前的商业利润，但也要重专职内部控制机构建立的偏向。","在建立内控制度上，不能重内部管理制度建立、不注重内部核心部门“防火墙”制度建立的偏向。","在执行内控制度上，不能重非经常性发生事项控制、不注重经常性事项控制的偏向","在监督内部控制上，不能重程序监督、不注重对“内部人”监督的偏向。"],"a":0,"p":"内控建设要防止重眼前商业利润、轻专职内控机构的偏向，内控部门必须独立于业务。防火墙、经常性事项控制、对内部人的监督都是该加强的方向，那几条说法本身没错。","e":"奶茶店不能为了多卖几杯就让店长既管收银又管盘账，必须单独设个人盯账；只算今天赚多少，迟早出窟窿。","t":"内控机构要独立，不能只盯眼前利润","r":"在监督内部控制上，不能重程序监督、不注重对“内部人”监督的偏向。"},{"i":36,"c":7,"k":"即期与远期利率","q":"关于即期利率和远期利率，以下说法中正确的是（）。","o":["远期利率即预期在未来特定日期的利率水平","即期利率不等于期间任何时期的远期利率","投资者不能通过不同期限的即期利率算出期间内的远期利率","即期利率和远期利率之间没有相关性"],"a":0,"p":"远期利率是隐含在当前即期利率里、从未来某一时点到另一时点的利率，可以理解为市场对未来利率的预期。用不同期限的即期利率就能倒算出它，说两者无关或算不出都错。","e":"一年期存款利率2%、两年期2.5%，可以倒推出第二年的利率约3%，这就是远期利率，它藏在两个即期利率的差里。","t":"远期利率藏在不同期限即期利率里","r":"远期利率指的是资金的远期价格。它是指隐含在给定的即期利率中从未来的某一时点到另一时点的利率水平。"},{"i":37,"c":10,"k":"另类投资局限","q":"关于另类投资的局限性，下列说法错误的是（）。","o":["相比传统投资产品，另类投资缺乏管制、信息的透明度低","大多数另类投资产品的流动性较差，不容易变现","个人投资者相比机构投资者更难获得有关另类投资产品市场变动的重要信息","对另类投资产品的估价是基于一系列假设，数据来源可靠，估价准确性较高"],"a":3,"p":"另类投资估值靠模型和假设，交易少、可比价格缺，数据来源也未必可靠，准确性恰恰是它的短板。D说估价准确度高，与事实相反；透明度低、流动性差、信息不对称都成立。","e":"给一幅祖传字画估价，只能参考几场拍卖和专家经验，没有天天成交的市价，估出来的数字上下能差一倍。","t":"另类投资估值靠假设，准确性低是短板","r":"另类投资估值难度大，难以对资产价值进行准确评估。"},{"i":38,"c":1,"k":"募集流程","q":"基金的募集一般要经过（）（）（）（）等四个步骤。","o":["注册 发售 申请 基金合同生效","申请 注册 发售 基金合同生效","基金合同生效 申请 注册 发售","发售 申请 注册 基金合同生效"],"a":1,"p":"募集先由管理人向证监会提交申请，获准注册后才能公开宣传发售，募集期满满足条件再宣告基金合同生效，顺序是申请、注册、发售、生效。把注册放到申请前面或生效放最前都错。","e":"办一场校园演出：先打申请、拿到批文，再卖票宣传，最后正式开演；先卖票再申请，或者先开演后批，都乱套。","t":"募集四步：申请、注册、发售、合同生效","r":"基金募集一般要经过申请、注册、发售、基金合同生效"},{"i":39,"c":4,"k":"估值披露频率","q":"关于基金资产估值需要考虑的因素说法错误的是（）","o":["我国的开放式基金于每个交易日估值，并于当日公告基金份额净值。封闭式基金每周披露一次基金份额净值，但每个交易日也都进行估值。","当基金只投资于交易活跃的证券时，对其资产进行估值较为容易。","基金投资于交易不活跃的证券时，资产估值问题则要复杂得多。","估值方法的一致性是指基金在进行资产估值时均应采取同样的估值方法，遵守同样的估值规则"],"a":0,"p":"开放式基金每个交易日估值，但份额净值是次日公告，不是当日，A把公告时点提前了一天。封闭式基金每周披露一次净值、却仍每日估值，活跃证券好估值、不活跃证券难估值也都对。","e":"食堂每天闭店后盘点，第二天的价目表才贴出来；当天就挂出明天菜价，等于把还没算完的账提前公布了。","t":"开放式基金当日估值，次日公告净值","r":"我国的开放式基金于每个交易日估值，并于次日公告基金份额净值。"},{"i":40,"c":5,"k":"投资策略稳定性","q":"关于基金的投资策略，以下哪个描述是正确的？","o":["基金的投资策略应当根据市场走势随时调整","基金的投资策略应当保持长期稳定","基金的投资策略应当以追求短期收益为主","基金的投资策略应当以追求高风险高收益为主"],"a":1,"p":"合同和招募说明书里写明的投资目标、范围与策略是给持有人的承诺，应当长期稳定执行，频繁跟着行情改会造成风格漂移、失去可预期性。追短期收益或一味高风险高收益都不是应有定位。","e":"办健身卡时说好主打减脂课，不能看隔壁流行瑜伽就改课表；会员按原计划续费，店却天天换项目，谁还敢办。","t":"投资策略写进合同，长期稳定不漂移","r":"基金的投资策略应当保持长期稳定，而不是频繁调整。这是因为长期稳定的投资策略有助于基金经理更好地执行其投资理念和策略，从而获得更好的长期回报。因此，答案为B。"},{"i":41,"c":1,"k":"境外投资法规","q":"境内股权投资基金投资于境外企业，应遵循的法律法规包括","o":["《境外投资管理办法》、《中外合作经营法》","《中外合作经营企业法》、《中外合资经营法》","《中外合资经营法》、《境外投资项目核准和备案管理办法》","《境外投资管理办法》、《境外投资项目核准和备案管理办法》"],"a":2,"p":"境内基金投境外企业要走两条线，外资准入受中外合资经营法管，项目出海要过境外投资项目核准和备案管理办法，两法缺一不可，所以选把它们配成对的选项。干扰项用中外合作经营法顶替，合作经营管的是合作企业，不是境外投资主线。","e":"想开奶茶店去海外加盟，得先看当地允不允许外资入股，再向国内报批这笔对外投资，两道手续都盖章才能开张，缺一道就卡住。","t":"外资准入看合资法，出海立项看核准备案，两部一起记","r":""},{"i":42,"c":7,"k":"信用风险管理","q":"信用风险管理的措施不包括（）。","o":["建立债券投资组合久期管理体系","建立交易对手信用评级制度","建立严格的信用风险监控体系","建立针对债券发行人的内部信用评级制度"],"a":0,"p":"信用风险防的是发行人或交易对手还不上钱，所以内部评级、交易对手评级、监控体系都对路。久期衡量的是债券价格对利率变动的敏感度，久期管理治的是利率风险，跟谁违约无关，因此它不在信用风险措施之列。","e":"借钱给同学前查他以往还钱记录、设个额度上限，这是防赖账；而盯着银行存款利率涨跌调存期，防的是利息变化，两码事。","t":"久期管的是利率风险，评级才管违约风险","r":"信用风险管理的主要措施包括：（l )建立针对债券发行人的内部信用评级制度，结合外部信用评级，进行发行人信用风险管理。（2）建立交易对手信用评级制度，根据交易对手的资质、交易记录、信用记录和交收违约记录等因素对交易对手进行信用评级，并定期更新。（3）建立严格的信用风险监控体系，对信用风险及时发现、汇报和处理。基金公司可对其管理的所有投资组合与同一交易对手的交易集中度进行限制和监控。"},{"i":43,"c":2,"k":"操作风险","q":"基金投资交易执行过程中的风险主要体现在（）","o":["信用风险","操作风险","市场风险","政策风险"],"a":1,"p":"交易执行环节拼的是下单、分配、确认这些动作是否按流程走，人员失误、系统故障、越权下单才是主要风险来源，所以归为操作风险。信用风险看对手方违约，市场风险看价格波动，政策风险看规则变动，都不在交易执行这个动作层面。","e":"食堂打饭窗口，菜价没变、也没人赖账，但阿姨手一抖打错卡、机器刷不上，队伍就乱了，这类差错就是操作层面的。","t":"执行环节出岔子，是人、系统、流程的操作风险","r":"基金投资交易执行过程中的风险主要体现在两个方面，一是投资交易过程中的合规风险，二是操作风险。"},{"i":44,"c":4,"k":"基金交易费","q":"下列选项中属于基金交易费的是（）","o":["印花税","上市年费","管理费","审计费"],"a":0,"p":"交易费是买卖证券那一刻按成交额发生的钱，印花税跟着每笔股票成交走，所以算交易费。管理费是按资产净值逐日计提的运作费，上市年费和审计费是维持基金存续的中介服务费，都不随某笔买卖发生。","e":"像菜市场买菜要交的过秤费，只有真正成交那一笔才收；摊位月租和请人查账的钱，天天都得掏，性质完全不同。","t":"印花税随交易走，管理费按净值提","r":"印花税是证券交易过程中发生的费用，属于基金交易费"},{"i":45,"c":1,"k":"QDII范围","q":"投资于以下哪个地区的基金有可能不是QDII基金？","o":["美国","法国","日本","香港"],"a":3,"p":"QDII是拿人民币换成外汇去境外市场投资，香港市场虽在境外，但属于中国境内关外的特别安排，投香港的产品可用港股通等渠道，未必走QDII额度，所以它有可能不是QDII。美法日都在境外，只能靠QDII出海。","e":"从广州去香港像坐高铁直达，刷个通行证就行；去美国法国日本则要办签证、换外币，手续完全不同，后者才叫真正出海。","t":"投香港未必是QDII，港股通也能去","r":""},{"i":46,"c":1,"k":"年报签发要求","q":"为了进一步保障基金信息质量，法规规定基金年度报告应经（）以上独立董事签字同意，并由董事长签发。","o":["3/ 4","1/ 4","2/ 3","1/ 3"],"a":2,"p":"年报要经三分之二以上独立董事签字同意，再由董事长签发，用高比例独董把关防止大股东操纵披露。三分之一只能保证少数，四分之一更弱，二分之一在独董席位有限时容易被凑出，所以门槛定在2/3。","e":"宿舍六个人凑钱买冰箱，得有四个人也就是三分之二点头才能买，两个人同意就下单，剩下的人容易觉得被代表。","t":"年报要2/3独董签字，董事长签发","r":"为了进一步保障基金信息质量，法规规定基金年度报告应经2/3以上独立董事签字同意，并由董事长签发。"},{"i":47,"c":10,"k":"另类投资基金","q":"（）是指投资于传统的股票、债券之外的金融和实物资产的基金，如房地产、证券化资产等","o":["证券投资基金","风险投资基金","另类投资基金","对冲基金"],"a":2,"p":"定义的关键词是传统股债之外，房地产、证券化资产这类实物和结构化的东西不像股票债券那样在公开市场按份报价，所以统称另类投资。证券投资基金是投股债的母概念，风险投资只覆盖未上市企业一段，对冲基金按策略命名，都框不住。","e":"宿舍四个人凑钱，别人买股票基金，你俩合伙盘下校门口奶茶店再转手，钱投的是看得见摸得着的实体，这就是另类。","t":"股债之外投实物和私募，都叫另类","r":""},{"i":48,"c":4,"k":"申赎定价依据","q":"开放式基金的申赎价格主要依据什么确定？","o":["基金经理决定","市场供求关系","基金单位净值","上一日收盘价"],"a":2,"p":"开放式基金每天收盘后把全部资产按市价估值、扣掉负债，除以总份额得到单位净值，申购赎回就按这个净值加减费用成交。基金经理不能自己定价，市场供求也不直接决定，因为份额随时可按净值申赎，价格被套利拉回净值。","e":"像奶茶店的股份，店里设备原料减去欠款，除以总股数就是每股值多少，有人想入股退股都按这个算，不是老板随口报价。","t":"开放式申赎看净值，不看供求和经理报价","r":"开放式基金的买卖价格以基金单位净值为基础进行计算。"},{"i":49,"c":6,"k":"自下而上策略","q":"自下而上策略最终会落实在（）的选择。","o":["大类资产","行业","风格","个股"],"a":3,"p":"自下而上是从一个个公司入手，研究它的产品、财报、管理层，最后落到买哪只股票，宏观和行业只是背景。自上而下相反，先定大类资产、再选行业、最后才挑个股，所以大类资产和行业是它的起点。","e":"逛超市挑酸奶，自下而上就是蹲在冷柜前逐盒看配料表和日期，选中最满意那盒；自上而下是先定逛哪个区，再看哪个牌子。","t":"自下而上落到个股，自上而下先定资产行业","r":""},{"i":50,"c":11,"k":"结算代理资格","q":"可以在银行间债券交易市场开展结算代理业务的金融机构法人需经（）批准。","o":["中国人民银行","国务院","国家金融监管总局","中国证监会"],"a":0,"p":"银行间债券市场由人民银行主管，结算代理业务是代别人办债券结算，属于这个市场的准入资格，所以由中国人民银行批准。证监会管交易所市场，国务院定大政方针，金监总局管银行保险机构，但都不发这张结算代理牌照。","e":"银行间市场像小区内部的业主群，群主是人民银行，谁能替邻居代收代付得群主点头；交易所市场是另一个群，管理员是证监会。","t":"银行间市场的事找人民银行，结算代理它批","r":"结算代理制度，是指经中国人民银行批准可以开展结算代理业务的金融机构法人，受市场其他参与者的委托，为其办理债券结算业务的制度。"},{"i":51,"c":3,"k":"申购费持有期","q":"申购费用对于持有期低于（）年不得免收","o":["1","2","3","5"],"a":2,"p":"申购费是买入时一次性收的钱，监管允许长期持有后减免，但门槛卡在3年，持有不满3年一律不免。这条用来鼓励长期投资、抑制短线资金进进出出。选项给1年、2年、5年都不对，记住年份只有3这一档。","e":"像健身房年卡，办卡时收的开卡费，练满三年才退给你；去了两个月就想退，开卡费一分不退，就是逼你别三天打鱼。","t":"申购费免收看3年，不满3年一律收","r":"对于持有期低于3年不得免收"},{"i":52,"c":7,"k":"高收益债策略","q":"采用高收益债策略的基金主要投资于垃圾债券，其投资级别属于（），该类债券含较高的（）。","o":["投机级；利率风险","投资级；利率风险","投机级；信用风险","投资级；信用风险"],"a":2,"p":"垃圾债就是信用评级在投资级以下的债，属于投机级，因为发债公司资质弱、违约概率高，所以最突出的是信用风险，得靠更高的票息补偿。利率风险所有债券都有，不是它区别于其他债的特征，投资级更是说反了。","e":"借钱给隔壁总拖欠房租的同学，利息要得高才划算，怕的是他跑路不还；至于银行利率涨跌，那是所有借款人都要面对的事。","t":"垃圾债是投机级，怕的是违约不是利率","r":""},{"i":53,"c":3,"k":"销售专业性","q":"营销人员要掌握基金专业知识说明基金销售的（）","o":["服务性","规范性","专业性","适用性"],"a":2,"p":"要讲清基金类型、费率结构、风险收益特征，靠的是从业者懂产品懂市场，这就是专业性。规范性讲的是按法规和业务流程办事，适用性讲把合适产品卖给合适的人，服务性讲态度和体验，都不对应掌握知识这条。","e":"去手机店买手机，店员能说清处理器、续航、拍照差别，你才敢下单；只会说欢迎光临却答不上参数，那叫热情不叫专业。","t":"懂产品会讲风险收益，是专业性不是规范性","r":"营销人员要掌握基金专业知识说明基金销售的专业性"},{"i":54,"c":2,"k":"内控有效性","q":"内部控制的（）指内部控制必须讲求效率和效果、所有的控制制度必须得到贯彻执行。","o":["健全性原则","有效性原则","成本效益原则","相互制约原则"],"a":1,"p":"有效性强调制度不能挂在墙上，必须落地执行、还得讲效率和效果，所以题干两句话都指向它。健全性看制度覆盖是否全面无死角，成本效益看控制成本是否小于收益，相互制约看岗位之间能否互相牵制。","e":"宿舍定的熄灯规矩写得再全，如果没人真关灯、关了还影响第二天上课，就是没效果；有效讲的是定了一定照做且有好处。","t":"有效等于执行到位且有效果，不是制度多","r":"有效性指内部控制必须讲求效率和效果、所有的控制制度必须得到贯彻执行。"},{"i":55,"c":10,"k":"房地产与通胀","q":"在整个宏观经济因素当中，对房地产投资影响最大的因素是（）。","o":["风险性","通货膨胀","流动性","信息不对称程度"],"a":1,"p":"房地产是实物资产，租金和房价会跟着物价走，通胀一来建材人工都涨价，房子名义价值水涨船高，所以通胀被认为是对房地产投资影响最大的宏观因素。风险性、流动性是资产自身的属性，信息不对称是市场特征，都不属于宏观经济因素。","e":"奶茶店房东每年涨租，理由是面粉糖奶都贵了；你转手卖店面时报价也跟着涨，房子跟着物价走，钱反而不值钱。","t":"抗通胀是房子最大卖点，宏观里排第一","r":"通货膨胀在整个宏观经济因素当中，是对房地产投资影响最大的因素。"},{"i":56,"c":3,"k":"及时性原则","q":"基金产品的风险评价和基金投资人的风险承受能力评价应当根据实际情况及时更新。上述所指是基金销售适用性的（）原则","o":["投资人利益优先","全面性","客观性","及时性"],"a":3,"p":"关键词是及时更新，产品风险等级和客户承受能力都不是一成不变，客户换了工作、产品改了投向，评价就得跟着刷新，否则匹配结论过期。客观性讲用统一标准量化打分，全面性讲覆盖所有产品和客户，投资人利益优先讲冲突时向客户倾斜。","e":"去年做风险测评还是稳健型，今年买了房月供压力大，券商却还推高波动产品，就是没及时更新；匹配得按最新情况算。","t":"风险测评要随人随产品更新，这是及时性","r":"及时性原则指基金产品的风险评价和基金投资人的风险承受能力评价应当根据实际情况及时更新。"},{"i":57,"c":4,"k":"估值频率","q":"我国封闭式基金的估值频率是（）。","o":["每月","每个交易日","每周","每半个月"],"a":1,"p":"封闭式基金份额不能随时申赎，但持有的股票债券天天在变价，所以每个交易日都要估值算净值，只是对外披露是每周一次，估值和披露两个频率别混。每月、每周、每半月都是披露或对账单的节奏，不是估值节奏。","e":"像体重秤，每天站上去记一次数字才是估值；可你只在周末发朋友圈报一次，那是披露，天天称不等于天天公开晒。","t":"封闭式每个交易日估值，每周披露净值","r":"封闭式基金每周披露一次基金份额净值，但每个交易日都进行估值。"},{"i":58,"c":1,"k":"持有人大会表决","q":"转换基金运作方式，应当经参加基金份额持有人大会的基金份额持有人所持表决权的（）以上通过","o":["1/2","1/3","1/4","2/3"],"a":3,"p":"转换运作方式、提前终止合同、更换托管人这类伤筋动骨的特别决议，要经参会持有人所持表决权的三分之二以上通过，普通事项才用半数。门槛抬高是为了防止大额资金凭简单多数就改掉产品的基本形态。","e":"六个人合租，想从整租改成隔断分租，这种改变房子基本用法的决定得四个人以上同意；只是定个倒垃圾的日子，过半就行。","t":"改运作方式等特别决议是2/3，普通事项过半","r":""},{"i":59,"c":1,"k":"QFII制度","q":"我国通过制度安排允许符合条件的境外机构投资者汇入一定额度的外汇资金，转换为我国货币，通过境内专门机构严格监管的账户投资境内证券市场，其在境内的资本利得、股息红利等经相关机构审核后方可汇出境外的制度指的是（）","o":["QFII","QDII","REITs","基金互认"],"a":0,"p":"题干说的是境外机构把外汇汇进来换成人民币，投境内市场，赚的钱要审核后才能汇出，这是合格境外机构投资者即QFII。QDII正好相反，是境内机构出去投，REITs是资产证券化产品，基金互认是两地基金互相销售，都不对。","e":"像外地朋友把钱汇到广州，用你的会员卡进本地健身房消费，赚的课时费要登记后才能带走，这就是QFII；你去外地办卡则是QDII。","t":"外资进来是QFII，内资出去是QDII","r":""},{"i":60,"c":7,"k":"降息应对","q":"预期央行可能降息，在基金合同允许范围内，为提高债券基金的收益率，基金经理可能进行的操作有（）。\nⅠ. 提高杠杆率\nⅡ. 降低杠杆率\nⅢ. 提高组合久期\nⅣ. 降低组合久期","o":["Ⅱ、Ⅲ","Ⅰ、Ⅳ","Ⅱ、Ⅳ","Ⅰ、Ⅲ"],"a":3,"p":"预判降息意味着借钱更便宜、债券价格会涨，所以两手都往上加：提高杠杆放大持仓吃价差，拉长久期让价格对利率下行更敏感。降低杠杆和缩短久期是防守动作，适合预判加息时用，方向正好反了。","e":"知道下周奶茶原料要降价，你会借钱多囤货，还专挑保质期长的囤，赚得更多；反过来预期涨价才该少囤快卖。","t":"降息就加杠杆拉久期，加息反过来","r":"预期央行可能降息，借贷成本将会下降，基金经理可能提高杠杆率；另一方面，降息会使得债券价格上升，基金经理可能会提高组合久期，增加债券基金对利率变化的敏感度，博取较高收益。"},{"i":61,"c":1,"k":"募集披露文件","q":"（）不属于基金募集期间的三大信息披露文件","o":["基金合同","基金招募说明书","基金托管协议","基金管理相关法规"],"a":3,"p":"募集期要披露的是基金合同、招募说明书和基金托管协议这三份，分别定当事人权利义务、产品说明书、托管职责，都属于这只产品的契约文件。基金管理相关法规是监管机关颁行的行业规则，对所有基金通用，不是单只基金的披露文件。","e":"租房子要看租赁合同、房屋说明书、物业托管协议三份，都是这套房的；而住建局的租房管理规定是所有房子通用的，不算这套房的材料。","t":"募集三件套是合同、招募书、托管协议","r":""},{"i":62,"c":6,"k":"科技传媒通信","q":"TMT基金大概率不会投资以下哪个行业？","o":["计算机","煤炭","半导体","通信"],"a":1,"p":"TMT是科技、传媒、通信三条线的合称，计算机、半导体属科技硬件，通信属网络基础设施，都在这条线上。煤炭是采掘业里的传统能源，靠挖煤卖煤赚钱，跟信息技术毫无关系，所以大概率不在TMT基金的投资范围。","e":"宿舍楼下开家手机配件加打印店，算科技服务；隔壁煤场卖煤球，生意再火也进不了这个圈子，行业属性完全不同。","t":"TMT只装科技传媒通信，煤炭是传统能源","r":""},{"i":63,"c":10,"k":"另类资产","q":"以下哪项属于另类资产？","o":["货币市场型基金","债券型基金","股票型基金","REITs"],"a":3,"p":"另类资产指股债之外的东西，REITs把写字楼、商场打包上市，底层是不动产收租现金流，所以属另类。货币基金、债券基金、股票基金正好是传统三大类，都在股债范畴里，不是另类。","e":"你和同学凑钱买下校门口一间商铺收租，再把收益按份分给大家，这份额像股票能转手，但底下是房子，属另类。","t":"REITs底下是房子收租，属另类不是股票","r":""},{"i":64,"c":3,"k":"客户服务规范性","q":"在基金销售过程中，基金认购、申购、赎回等交易都具有详细的业务规则，销售机构提供服务是必须遵守法律法规和业务规则。体现了基金客户服务的（）","o":["专业性","规范性","持续性","时效性"],"a":1,"p":"认购申购赎回每一步都有业务规则，销售机构必须照章办事，这叫规范性，重点是守规矩不走样。专业性讲从业人员懂不懂产品，持续性讲服务能不能长期跟上，时效性讲响应快不快，题干强调的是遵守法律法规和流程。","e":"去银行办卡，柜员按流程核对身份证、让你签字、留存复印件，一步不省，这就是规范；服务态度再好，漏了核实也不行。","t":"按业务规则办事是规范性，别选专业性","r":"规范性指在基金销售过程中，基金认购、申购、赎回等交易都具有详细的业务规则，销售机构提供服务是必须遵守法律法规和业务规则。"},{"i":65,"c":3,"k":"销售适用性","q":"基金销售适用性要求基金销售机构应当对基金投资人销售不同（）等级的产品","o":["收益","风险","资金限制","信用"],"a":1,"p":"适用性的核心是把合适的产品卖给合适的人，匹配的尺子是风险等级：先给产品评级，再给客户测评，同一等级才能对接。收益高低、资金门槛、信用记录都不是匹配依据，高收益产品未必适合保守型客户。","e":"给刚存下生活费的大一新生推高波动行业基金，就像把辣锅端给不能吃辣的人，等级不匹配，出了事是销售方的责任。","t":"适用性匹配的是风险等级，不是收益","r":""},{"i":66,"c":5,"k":"非系统性风险","q":"投资组合内的资产数量增多可以分散（）。","o":["系统性风险","非系统性风险","市场风险","价格风险"],"a":1,"p":"多买几只不同行业的股票，个别公司出事对组合的冲击就被摊薄，这类只影响单个公司的风险叫非系统性风险，能靠分散化消掉。系统性风险来自利率、政策、经济周期，所有股票一起跌，买再多只也躲不开。","e":"摆摊卖货多进几种品类，某一种卖不动还有别的撑着；整条街修路没人来，卖什么都亏，这种风险分散不掉。","t":"分散化只能消非系统性风险，系统性的躲不掉","r":""},{"i":67,"c":4,"k":"基金税收","q":"下列投资行为所获得的收入需要交纳的所得税是（）。","o":["机构投资者获得的基金分红款","个人投资者买卖基金份额获得的差价收入","个人投资者获得的基金分红款","机构投资者在境内买卖基金份额获得的差价收入"],"a":3,"p":"机构在境内买卖基金份额赚的差价要并入企业应纳税所得额，缴企业所得税，这是唯一要交税的选项。机构从基金分到的收益暂不征企业所得税，个人买卖份额的差价和从基金分到的收益也都暂免个人所得税。","e":"奶茶店以公司名义低买高卖基金赚了钱，这笔差价要算进公司利润报税；老板个人账户买卖基金的差价，眼下先不用交。","t":"机构买卖基金份额的差价要交企业所得税","r":"机构投资者在境内买卖基金份额获得的差价收入，应并入企业的应纳税所得额，征收企业所得税；机构投资者从基金分配中获得的收入，暂不征收企业所得税。个人投资者买卖基金份额获得的差价收入，在对个人买卖股票的差价收入未恢复征收个人所得税以前，暂不征收个人所得税。个人投资者从基金分配中取得的收入，暂不征收个人所得税。"},{"i":68,"c":10,"k":"FOF投资对象","q":"关于FOF（FundofFunds）基金，以下描述正确的是：","o":["FOF基金直接投资于股票、债券等有价证券","FOF基金投资的对象主要是其他基金产品","FOF基金的风险低于所有类型的单一基金","FOF基金的管理费率比一般基金要低"],"a":1,"p":"FOF是基金中的基金，钱先交给母基金，母基金再去买一堆子基金，不直接买股票债券，所以投的主要是其他基金产品。它靠两层组合分散风险，但做不到低于所有单一基金；两层收费叠加，综合费率通常更高。","e":"像点外卖不直接买菜，而是买一份拼单套餐，里面是好几家店的菜；省了挑的功夫，但平台抽两道佣金，总价未必低。","t":"FOF买基金不买股债，两层收费费率更高","r":"FOF基金并不直接投资于股票、债券等有价证券，而是主要投资于其他基金产品，以实现资产配置的多元化和风险分散。虽然FOF基金能够通过组合投资降低风险，但并不能保证其风险始终低于所有类型的单一基金；相反，由于多层收费机制，FOF基金的综合管理费率往往较高。"},{"i":69,"c":6,"k":"长期价值投资","q":"关于基金的投资策略，下列哪项描述是正确的？","o":["基金的投资策略应完全复制市场指数","基金的投资策略应根据个人偏好进行调整","基金的投资策略应以长期价值投资为主","基金的投资策略应追求短期内的高收益"],"a":2,"p":"基金管的是持有人长期攒下的钱，主流做法是深挖公司基本面、长期持有赚企业成长的钱，这样才扛得住短期波动。说所有基金都应完全复制指数，是把被动产品一种做法当成唯一答案；按个人偏好调仓、追逐短期高收益，都违背受托理财的定位。","e":"像攒钱买校门口那家口碑老店的股份，看的是它十年后还在不在、能不能稳定分红，而不是它今天涨了几块钱。","t":"公募主流是长期价值投资，不是追短线","r":"长期价值投资策略强调对公司的深入分析和长期持有，旨在获取公司长期增长带来的价值。因此，C选项描述是正确的。"},{"i":70,"c":10,"k":"重要货基指标","q":"下列哪项不属于重要货币市场基金的投资运作指标应当符合的要求？","o":["持有一家公司发行的证券市值不得超过基金资产净值的 5%","投资于具有基金托管人资格的同一商业银行发行的金融工具占基金资产净值的比例不得超过 15%","投资组合中现金、国债、中央银行票据、政策性金融债券以及 5 个交易日内到期的其他金融工具占基金资产净值的比例合计不得低于 20%","投资组合的平均剩余期限不得超过 60 天"],"a":3,"p":"重要货基规模大、持有人多，监管把久期卡得更死，平均剩余期限上限是90天，题干写60天就错了。另外三项都是硬指标：单一公司证券不超净值5%，托管行发行的工具不超15%，现金和5个交易日内到期资产合计不低于20%。","e":"你替全班管活动费，人越多越不敢把钱长期借出去，规定最多借90天；有人说只能借60天，那是不存在的更严规矩。","t":"重要货基久期上限90天，普通货基120天","r":""},{"i":71,"c":1,"k":"披露规范性","q":"基金信息披露形式规范性原则指的是（）","o":["基金信息必须依照法定的内容和格式进行披露，以保证披露信息的可比性。","要求信息披露要简明扼要、通俗易懂、避免冗长、技术性用语。","基金披露的信息为一般公众投资者所获取。","最根本、最重要的原则，要求以客观事实为基础，以没有扭曲和不加粉饰的方式反映真实状态。"],"a":0,"p":"规范性管的是形式，必须按法定内容和格式来写，好处是各家基金的报告长得一样、能横向比较。简明通俗是易解性原则，面向一般公众是可获性原则，客观真实是真实性原则，那是根本原则，别混。","e":"像四六级成绩单全国一个格式，分数、姓名、考号位置固定，用人单位一眼就能横向比；各校要自创一套格式，就没法比了。","t":"规范就是按法定格式写，为的是可比","r":"规范性原则指基金信息必须依照法定的内容和格式进行披露，以保证披露信息的可比性。"},{"i":72,"c":6,"k":"杜邦分析","q":"A公司2015年销售收入较2014年增加10%,但总资产、净资产、净利润未发生变化，则以下关于A公司2015年财务比率变化的说法正确的是（）。","o":["总资产周转率上升；权益乘数上升","销售利润率下降，总资产周转率下降","净资产收益率不变，销售利润率不变","权益乘数不变，净资产收益率不变"],"a":3,"p":"权益乘数等于总资产除以净资产，两者都没动，所以它不变；净资产收益率等于净利润除以净资产，也都没动，所以不变。销售收入涨了一成而总资产没变，总资产周转率其实上升；净利润没变而收入多了，销售利润率反而下降，干扰项就说反了。","e":"奶茶店今年多卖了一成，但店面设备和本钱都没加，等于同样的摊子转得更快，赚的钱却没多，每一块钱收入的利润就薄了。","t":"分子分母同变才不变，先看谁动了","r":"总资产周转率=销售收入/年均总资产，销售收入增加，总资产不变，总资产周转率上升。权益乘数=总资产/所有者权益，总资产、净资产均不变，权益乘数不变。销售利润率=净利润/销售收入，销售收入增加，净利润不变，销售利润率下降。净资产收益率=净利润/所有者权益，净资产、净利润不变，净资产收益率不变。"},{"i":73,"c":1,"k":"沪深港通意义","q":"沪港通和深港通开通的重要意义，不包括（）。","o":["维护港币与美元的联系汇率制度","推动人民币跨境资本流动","刺激人民币资产需求，加大人民币交投量","构建良好的人民币回流机制"],"a":0,"p":"沪深港通的意义都围绕人民币：让境外资金买A股刺激人民币资产需求、带动跨境资本流动、给离岸人民币开一条回流渠道、完善国内资本市场。港币与美元挂钩是香港自己的货币制度安排，跟沪深港通开通没有因果关系。","e":"像两个小区之间开了道小门，方便住户互相串门买菜、把钱带回来花；隔壁小区用什么货币结算，跟这道门没关系。","t":"沪深港通为人民币，扯港币联系汇率就错","r":"沪港通及深港通的开通，在内地与香港之间搭建起资本流通的桥梁，极大地活跃了人民币资本市场。其重要意义表现为以下四个方面：1）刺激人民币资产需求，加大人民币交投量。（2）推动人民币跨境资本流动。（3）构建良好的人民币回流机制。（4）完善国内资本市场。"},{"i":74,"c":10,"k":"LOF交易规则","q":"下列关于LOF份额申购和赎回的说法，错误的是（）","o":["LOF采用金额申购，份额赎回原则","T日买入LOF的基金份额，当日可以在深圳证券交易所卖出或者赎回","LOF场内申购申报单位为1元人民币","LOF赎回申报单位为1份基金份额"],"a":1,"p":"场内买入的LOF份额当天不能卖也不能赎回，要等到次一交易日，T日买入当日就能卖出或赎回的说法是错的。另外三项都对：申购按金额、赎回按份额，场内申购以1元为申报单位，赎回以1份为申报单位。","e":"像食堂打包，今天买的饭票今天不能退，得等明天窗口开了才办；退回按份数算，充值却按钱数报，两套单位别搞反。","t":"LOF场内T日买入，T+1才能卖或赎回","r":""},{"i":75,"c":4,"k":"基金分红","q":"关于基金分红方式，以下说法正确的是？","o":["分红只能采取现金分红的方式","分红后，基金单位净值会相应减少","分红再投资不会增加投资者的实际持有份额","分红前后，投资者持有的总资产改变"],"a":1,"p":"分红是把基金账上的钱分给持有人，资产少了，份额不变，单位净值自然要往下调，这叫除息。分红有现金分红和红利再投资两种；选再投资份额会增加；不论哪种，分红前后持有人总资产都不变，只是左口袋换右口袋。","e":"你和室友凑的公共钱包剩100元，拿出20元分给大家，钱包只剩80，但每人手里多了20，总共还是100。","t":"分红必除息，净值降但总资产不变","r":"基金分红有两种方式，现金分红和红利再投资。无论是何种分红方式，分红后基金单位净值都会相应减少，但若选择红利再投资，投资者的实际持有份额会增加。分红前后，如果不考虑分红再投资带来的份额增加，投资者持有的总资产并不改变。"},{"i":76,"c":9,"k":"信息比率","q":"信息比率是单位跟踪误差所对应的（）。","o":["相对收益","超额收益","绝对收益","部分收益"],"a":1,"p":"信息比率是组合相对基准多赚的那部分收益除以跟踪误差，也就是每个单位跟踪误差换来多少超额收益，衡量主动管理挤出来的钱值不值。相对收益是笼统比较，绝对收益是组合自己的涨幅，部分收益不是术语。","e":"你请家教多花每小时50元，成绩比自学高10分，这10分除以50元就是家教的性价比；跟踪误差是学费，超额收益是提分。","t":"信息比率等于超额收益除以跟踪误差","r":"信息比率是单位跟踪误差所对应的超颔收益。"},{"i":77,"c":7,"k":"可转债属性","q":"假设权益市场大幅上涨，以下选项中哪类债券基金的业绩表现最好？","o":["可转债基金","短债基金","高等级信用债基金","利率债基金"],"a":0,"p":"可转债既有债底又能按约定价转成股票，正股一涨，转股价值跟着抬，价格弹性接近股票，所以权益市场大涨时它涨得最猛。短债、高等级信用债、利率债都只吃票息和利率下行，跟股市涨跌基本无关，弹性最小。","e":"像奶茶店的员工股，平时拿固定工资，店里生意爆好还能按低价换成股份分红，行情一来他赚得比只拿死工资的同事多。","t":"股市大涨买可转债基金，股性最足","r":""},{"i":78,"c":6,"k":"投资策略类型","q":"王先生通过分析宏观经济形势和国家产业政策，认为医药行业具有较大发展前景，于是通过购买医药ETF基金以加大对医疗行业证券投资。王先生的策略为（）。Ⅰ.自上而下策略Ⅱ.自下而上策略Ⅲ.主动投资策略Ⅳ.被动投资策略","o":["Ⅰ、IV","Ⅱ、IV","Ⅰ、Ⅲ","Ⅱ、Ⅲ"],"a":0,"p":"先从宏观经济和产业政策入手锁定医药行业，再买对应产品，这是自上而下；ETF是跟踪指数的工具，买它等于被动投资，不挑个股。所以Ⅰ和Ⅳ成立。自下而上要先看单个公司，主动投资要基金经理选股，都与题干动作不符。","e":"像买整箱的水果礼盒而不是一个个挑，先看今年哪个产区丰收再定买哪箱，省事但不选果，这就是自上而下加被动。","t":"先看宏观行业再买ETF，是自上而下加被动","r":"自上而下策略从宏观形势及行业、板块特征入手，明确大类资产、国家、行业的配置，然后再挑选相应的股票作为投资标的，实现配置目标。一般ETF基金采用被动跟踪指数投资策略。"},{"i":79,"c":4,"k":"增值税主体","q":"基金运营过程中发生的增值税的缴纳主体是（）。","o":["基金管理人","沪深交易所","基金托管人","券商"],"a":0,"p":"资管产品运营中产生的增值税应税行为，纳税人认定为管理人，因为基金本身不是纳税主体，由管理人去申报缴纳。托管人只管保管和清算，交易所和券商是交易通道，都不承担这笔税。","e":"合租房子交水电，燃气公司只认签合同的那个室友，钱从公共账户出但单子挂他名下，他就是缴费主体，对应管理人。","t":"基金运营增值税由管理人申报缴纳","r":"2016年12月财政部、国家税务总局发布的《关于明确金融、房地产开发、教育辅助服务等增值税政策的通知》规定：“资管产品运营过程中发生的增值税应税行为，以资管产品管理人为 增值税纳税人”。"},{"i":80,"c":4,"k":"财务报告分析","q":"一般来说，以下项目中不体现在基金财务会计报告中的是（）。","o":["基金持有人明细","基金分红能力","基金盈利能力","基金费用情况"],"a":0,"p":"财务会计报告看的是钱的来龙去脉，持仓结构、盈利能力、分红能力、收入和费用、份额变动都在里面，分析的是基金这个盘子。持有人明细属于客户信息，涉及个人隐私，不进公开的财务报告，也不在分析框架里。","e":"奶茶店给投资人看的账本有卖了多少钱、花了多少、赚了多少、还剩多少本钱，但不会把每个顾客的姓名电话列上去。","t":"财报看钱不看人，持有人明细不进报告","r":"一般来说，对股票型基金及混合型基金的财务会计报告的分析包括以下方面：（1）基金持仓结构分析。（2）基金盈利能力和分红能力分析。（3）基金收入情况分析。（4）基金费用情况分析。（5）基金份额变动分析。（6）基金投资风格分析。"},{"i":81,"c":4,"k":"管理费率差异","q":"债券型基金的管理费率一般___股票型基金","o":["低于","等于","高于","以上选项均不对"],"a":0,"p":"债券价格波动小、研究投入少，管理费自然收得便宜，债基常见零点三到零点七个百分点，股票基金常到一个点以上，所以债基费率更低。以为债基赚钱慢就该多收费，是把费率和收益混为一谈。","e":"就像健身房私教课，器械课便宜、一对一贵；债基是管好一篮子借条，活少所以收费低，股票基金要天天盯公司，收费自然高。","t":"债基管借条，股基管公司，费率债低股高","r":""},{"i":82,"c":7,"k":"中长债投资范围","q":"中长债基金不可投资以下哪类债券？","o":["中期票据","短期融资券","企业债","可转债"],"a":3,"p":"可转债能按约定转成股票，涨跌跟着正股走，波动像股票，带权益性质，纯债定位的中长债基金不能买。短期融资券、中期票据和企业债都只是普通借条，期限不同，属于可投范围。","e":"好比租房只租民宅，可转债是能改成商铺的房子，性质变了；中长债基金签的是纯债合同，这类能转股的资产一律不碰。","t":"能转股的可转债不算纯债，中长债基金不能碰","r":""},{"i":83,"c":11,"k":"质押式回购","q":"下列交易中，债券的所有权没有发生转移的是（）。","o":["质押式回购","债券的即期交易","债券的远期交易","买断式回购"],"a":0,"p":"质押式回购是拿债券当担保借钱，券只被冻结，所有权仍留在正回购方，逆回购方无权处置；买断式回购要把券过户给对方，到期再按约定价买回，所有权真转移。即期和远期交易同样要过户。","e":"像把金项链押给当铺换现金，项链还是你的，只是不能戴；买断式则像直接把项链卖给对方，约定下月原价买回，期间归人家。","t":"质押只冻结不过户，买断式先过户再按约买回","r":"在交易期间，对于质押式回购，质押的国债的所有权仍属于国债的出让方（正回购方) , 受让方（逆回购方）无权处置，国债被证券交易中心冻结；对于买断式回购，出售的国债的所有权转移给国债的受让方（逆回购方），受让方有权处置该国债，只需在到期日按约定价格回售先前的国债。"},{"i":84,"c":3,"k":"宣传材料风险提示","q":"电视、电影、互联网资料、公共网站链接形式的宣传推介材料应当包括为时至少（）秒钟的影像显示，提示投资人注意风险并参考该基金的销售文件。","o":["1","3","5","10"],"a":2,"p":"电视、电影、互联网资料、公共网站链接这类视听推介材料，必须插入为时至少5秒的影像提示，提醒投资人注意风险并阅读销售文件。1秒3秒短到根本看不清，10秒又不是硬性下限。","e":"像奶茶店广告最后必须打出的图片仅供参考，得停够5秒让人看清；只闪1秒，观众根本来不及意识到风险。","t":"视听类推介的风险提示：至少停够5秒","r":"电视、电影、互联网资料、公共网站链接形式的宣传推介材料应当包括为时至少5秒钟的影像显示，提示投资人注意风险并参考该基金的销售文件。"},{"i":85,"c":1,"k":"托管资格取消","q":"连续（）年没有开展基金托管业务的基金托管人将会被取消基金托管资格","o":["2","3","4","5"],"a":1,"p":"托管牌照不能占着不用，连续3年没有开展基金托管业务就取消资格，三年足以证明这家机构根本不打算做这块业务。2年、4年、5年都是干扰数字，硬门槛只有3年。","e":"像办了健身年卡却连续3年一次没去，店家直接把卡收回；托管资格也是占着牌照不干活，到期就得把位置让出来。","t":"托管资格：连续3年不干活就取消","r":""},{"i":86,"c":5,"k":"实际利率","q":"名义利率为10%,通货膨胀率为-2%,则实际利率是(）","o":["8%","24%","6%","12%"],"a":3,"p":"实际利率约等于名义利率减通胀率，通胀是负2%说明在通缩、钱更值钱，减负数等于加2，10%加2%得12%。选8%的人是方向搞反，把通缩当成通胀又加了一笔。","e":"你借出100元收10元利息，同期物价跌2%，同样100元能多买2%的东西，等于多赚2元，加起来实际赚12元。","t":"实际利率＝名义减通胀，负通胀要加回来","r":"实际利率=10%-(-2%)=12%。"},{"i":87,"c":2,"k":"保密义务范围","q":"基金从业人员在执业过程中接触到的秘密，不包括","o":["商业秘密","客户资料","招募说明书","内幕信息"],"a":2,"p":"招募说明书是依法公开披露、谁都能下载的文件，本来就不算秘密；商业秘密、客户资料、内幕信息都是职务中获知且不能外传的信息，泄露会损害客户或市场。所以不含招募说明书。","e":"像奶茶店配方和会员名单不能外传，但贴在门口的价目表人人可看；招募说明书就是那张公开价目表。","t":"公开披露的不算秘密，招募说明书人人可看","r":""},{"i":88,"c":11,"k":"隐性成本","q":"以下交易成本中，属于隐性成本的是（）","o":["经纪商佣金","印花税","结算所规费","冲击成本"],"a":3,"p":"冲击成本指下单量太大，把买入价越买越高或卖出价越卖越低的那部分损失，账上看不见、没人开发票，属于隐性成本；佣金、印花税、结算规费都明码标价，对账单上能查，是显性支出。","e":"你想一次买光整条街的奶茶，越买价格越涨，多付的钱没人开票；而打车软件的服务费清清楚楚写在账单上。","t":"看得见的是显性，冲击成本藏在价里","r":""},{"i":89,"c":4,"k":"赎回费归属","q":"开放式基金赎回费在扣除手续费后，余额不得低于赎回费总额的","o":["95%","90%","25％","15%"],"a":2,"p":"赎回费扣掉必要手续费后，余额不得低于赎回费总额的25%，这部分要留在基金资产里归剩余持有人，补偿他们被摊薄的交易成本，其余才归销售机构。95%、90%是把比例记成了给持有人的错觉。","e":"像合租提前退租，押金里至少留四分之一补公共开销，不能让留下的人替你垫钱；剩下的才轮到中介拿。","t":"赎回费至少25%留在基金资产里","r":"赎回费在扣除手续费后，余额不得低于赎回费总额的25％"},{"i":90,"c":8,"k":"国债期货品种","q":"目前中国金融期货交易所已有的国债期货不包括","o":["1年期国债期货","5年期国债期货","10年期国债期货","30年期国债期货"],"a":0,"p":"中金所已上市2年期、5年期、10年期和30年期国债期货，就是没有1年期这个品种，短端利率风险用2年期合约对冲已经够用。看到1年期要立刻警觉，它是凑数的干扰项。","e":"像手机套餐只有小中大和超大四档，没有迷你杯；国债期货也是2年起步，1年期是硬凑出来的选项。","t":"国债期货只有2、5、10、30年，无1年","r":""},{"i":91,"c":1,"k":"境外投资范围","q":"QDII投资范围不包括（）","o":["银行存款","可转让存单","住房按揭支持证券","房地产抵押按揭"],"a":3,"p":"QDII可以买境外银行存款、可转让存单、住房按揭支持证券等证券类资产，但不能直接投房地产抵押按揭这类不动产和贷款资产，条例把它列进了禁止清单。支持证券是证券化产品，按揭本身不是。","e":"像代购能替你买国外的化妆品和零食，却不能在国外替你买套房、接一笔房贷；按揭是贷款不是证券，清单里没有。","t":"QDII买证券，不碰按揭和不动产","r":"D选项为禁止投资的产品"},{"i":92,"c":4,"k":"摊余成本法","q":"以下不属于摊余成本法债券型基金的优点的是？","o":["净值波动较小","收益确定性高","持有体验好","能够实现保本"],"a":3,"p":"摊余成本法把买入时的折溢价在剩余期限内平均摊销，每天收益差不多，所以净值波动小、收益确定性高、持有体验好；但它只是记账方法，资产照样会违约，绝不可能承诺保本。","e":"像把一年房租平摊到12个月记账，每月看着一样，但租客真跑路还是亏；账面平稳不等于有人给你兜底。","t":"摊余成本只熨平波动，绝不等于保本","r":""},{"i":93,"c":2,"k":"内控五要素","q":"基金管理人应当建立清晰的报告系统，体现了内部控制中（）的重要性","o":["信息沟通","内部控制","控制活动","控制环境"],"a":0,"p":"内控五要素是控制环境、风险评估、控制活动、信息沟通、内部监督。报告系统解决的是信息在上下级、部门之间传得通传得快，正对应信息沟通。控制活动是具体的审批授权措施，控制环境是治理基调。","e":"像宿舍查寝，谁发现违规要能一层层报上去；没有清晰的汇报路线，问题都烂在楼层长手里，这就是沟通不畅。","t":"报告系统通上下，对应信息沟通要素","r":""},{"i":94,"c":5,"k":"股票风险性","q":"由于观察到最近股票价格因政治事件发生波动，小明赎回了手中的股票型基金并换成了债券型基金，这是因为股票的（）增大。","o":["期限性","流动性","风险性","收益性"],"a":2,"p":"政治事件让股价上蹿下跳，说明未来收益的不确定性变大，这正是风险性的含义；小明赎回股基换债基就是降低不确定性。期限性讲股票没有到期日，流动性讲能否快速变现，收益性讲回报高低。","e":"像奶茶店遇上修路封街，客流说没就没，你敢不敢续租就看这份不确定；不确定性变大，就是风险性上升。","t":"波动变大就是风险性，不是流动性","r":""},{"i":95,"c":1,"k":"境外机构准入","q":"资产管理公司（即基金管理公司），申请QFII，其经营资产管理业务应在（）以上，最近一个会计年度管理的证券资产不少于（）美元","o":["1年 3亿","2年 5亿","3年 2亿","5年 10亿"],"a":1,"p":"资产管理机构申请QFII，要经营资产管理业务满2年，且最近一个会计年度管理的证券资产不少于5亿美元，两个数字缺一不可。3年、2亿、10亿都是把年限和规模错配出来的干扰项。","e":"像申请校外实习基地，要求开张满2年、去年经手的项目金额不低于5亿；年限和规模必须同时达标，缺一样就被打回。","t":"QFII资管机构：2年经验加5亿美元","r":"资产管理机构经营资产管理业务2年以上，最近一个会计年度管理的证券资产不少于5亿美元;"},{"i":96,"c":4,"k":"估值责任人","q":"我国基金资产估值的责任人是（）","o":["基金管理人","基金托管人","基金份额持有人","基金销售机构"],"a":0,"p":"基金资产估值由基金管理人负责，要按合同约定的方法和频率算净值并对结果负责；托管人只是复核估值结果，发现错误要求改正，销售机构更不参与估值。所以责任人是管理人。","e":"像合租时定一个人管账，每月算清水电燃气；房东只负责复核，账算错了责任人还是他，不能推给房东或中介。","t":"估值是管理人的活，托管人只复核","r":"我国基金资产估值责任人是基金管理人"},{"i":97,"c":11,"k":"交易指令流程","q":"交易指令在基金公司内部执行的流程为（）。Ⅰ.交易员择机执行指令Ⅱ.相关人员审核指令Ⅲ.基金经理下达指令","o":["Ⅰ.Ⅱ.Ⅲ","Ⅱ.Ⅲ.Ⅰ","Ⅰ.Ⅲ.Ⅱ","Ⅲ.Ⅱ.Ⅰ"],"a":3,"p":"先由基金经理在自己权限内下达指令，再经交易系统或相关负责人审核价格、数量的合法合规性，违规的退回，通过的才分给交易员择机执行。顺序是先下达、再审核、最后执行。","e":"像点外卖：你先下单，平台风控检查地址和金额，通过了骑手才出发去找最顺路的时间取餐；顺序反了就乱套。","t":"基金经理下单，风控审核，交易员执行","r":"交易指令在基金公司内部执行情况如下：首先，在自主权限内，基金经理通过交易系统向交易室下达交易指令。其次，交易系统或相关负責人员审核投資指令（价格、数量）的合法合规性，违规指令将被拦截，反馈给基金经理。其他指令被分发给交易员。最后，交易员接收到指令后有权根据自身对市场的判断选择合适时机完成"},{"i":98,"c":1,"k":"更换托管人期限","q":"基金托管人职责终止的，基金份额持有人大会应当在（）内选任新基金托管人","o":["三个月","六个月","九个月","一年"],"a":1,"p":"托管人职责终止后，基金份额持有人大会要在6个月内选任新的托管人，避免基金资产长时间没人看管。三个月太短来不及走完程序，九个月、一年又拖得太久。","e":"像小区换物业，必须在6个月内选出新管家，空档期由业委会临时盯账，不能让维修基金一直没人管。","t":"托管人走人，6个月内必须选出接班的","r":""},{"i":99,"c":1,"k":"募集期限","q":"基金管理人应当自收到核准文件之日起个（）月内进行基金份额的发售。","o":["1","2","3","6"],"a":3,"p":"拿到核准文件后必须在6个月内启动基金份额发售，超过这个期限批文失效，得重新申报，监管怕的是批了不卖、占着额度等风口。1个月、2个月、3个月都是故意做小的干扰项。","e":"像抢到的餐饮消费券写明6个月内必须用掉，过期作废；基金批文也是限期入场券，拖过期就得重新排队申请。","t":"批文6个月内必须开卖，过期作废","r":"基金管理人应当自收到核准文件之日起个6月内进行基金份额的发售。"},{"i":100,"c":1,"k":"基金清盘条件","q":"以下哪种情况可能触发基金清盘？","o":["基金持有人大会决定终止基金合同","基金连续60个工作日出现基金份额持有人数量不满200人的情况","基金资产净值连续60个工作日低于5000万元人民币","以上所有情况都可能触发基金清盘"],"a":3,"p":"持有人大会决定终止合同、连续60个工作日持有人数量不满200人、连续60个工作日资产净值低于5000万元，三种情形都能触发清盘。前三项各自成立，所以只能选以上所有情况都可能。","e":"像奶茶店关店：股东开会决定关、连续两个月每天客人不到200、账上现金跌破5000万，任一条都够贴转让告示。","t":"200人、5000万，连续60个工作日","r":"按照中国证监会的相关规定，当基金规模持续过小、持有人大会决定终止基金合同、或者出现法律法规规定的其他情形时，均有可能触发基金清盘。"},{"i":101,"c":3,"k":"销售禁止行为","q":"关于基金的销售，下列哪项描述是错误的？","o":["基金的销售渠道包括银行、证券公司、第三方基金销售平台等","基金的销售人员在销售过程中应对投资者进行风险提示","基金的销售过程应遵循公平、公正、公开的原则","基金的销售人员可以为了销售业绩而夸大宣传或虚假宣传"],"a":3,"p":"销售必须如实告知、充分揭示风险，夸大或虚假宣传直接违法，属于明令禁止的行为，所以这句话本身错。银行、券商、第三方平台都是合法渠道，风险提示和公平公正公开也都是必须遵守的原则。","e":"像奶茶店把可能好喝吹成喝了必瘦，属于虚假宣传要吃罚单；基金销售更不能为了冲业绩瞎吹，罚得更重。","t":"销售可以提示风险，不能夸大宣传","r":"这是错误的做法，因为基金销售人员在销售过程中必须遵守法律法规和行业规范，确保投资者的利益和市场的公平性。因此，D选项描述是错误的。"},{"i":102,"c":3,"k":"生命周期风险","q":"关于个人投资者的特征，以下表述错误的是（）。","o":["影响个人投资者需求的基本因素是他们在生命周期中所处的阶段","个人投资者的就业状态和家庭状况会对其投资需求产生多方面的影响","随着年龄的增长，个人投资者的风险承受能力和风险承受意愿逐渐递增","个人投资者不同的财务状况会在很大程度上影响其投资需求"],"a":2,"p":"年龄越大，收入增长空间收窄、医疗支出上升、投资期限变短，风险承受能力和意愿通常递减而不是递增，所以这句表述错。生命周期阶段、就业家庭状况、财务状况确实都影响投资需求。","e":"二十多岁亏了还能加班赚回来，六十岁亏的是养老钱；越往后越不敢冒险，承受力只会一年年往下走。","t":"年龄越大越怕亏，承受力是递减不是递增","r":"随着年龄的增长，个人投资者的风险承受能力和风险承受意愿逐渐递减。"},{"i":103,"c":10,"k":"底层资产计量","q":"以下关于公募REITs的说法，错误的是","o":["公募REITs将80%以上基金资产通过基础设施ABS，投向基础设施领域","公募REITs的收益来源主要是底层资产运营所产生的收入","目前底层资产通常采用公允价值进行计量","公募REITs的净值更新频率一般低于普通的封闭式基金"],"a":2,"p":"公募REITs的底层基础设施资产目前按成本模式计量并计提折旧，不是公允价值，所以这句错。80%以上资产通过基础设施ABS投向基础设施、收益来自底层运营收入、净值披露频率低于普通封闭式基金，都对。","e":"像家里那套出租房按当年买入价减折旧记账，不跟着中介挂牌价天天调；REITs底层资产也这么算，净值才不飘。","t":"REITs底层按成本计量，不用公允价值","r":""},{"i":104,"c":5,"k":"期望收益含义","q":"关于投资产品的预期收益，以下表述错误的是（）。","o":["信用风险较高债券的预期收益通常高于信用风险较低债券的预期收益","风险资产的预期收益通常高于无风险资产的预期收益","期限较长债券的预期收益通常高于期限较短债券的预期收益","某投资产品的预期收益为正，则投资者投资该产品不会亏损"],"a":3,"p":"预期收益是各种可能收益按概率加权算出的平均值，正数只说明平均为正，实际结果仍可能落在亏损那一侧，方差越大偏离越厉害，所以不能保证不亏。信用风险高、期限长的债券预期收益更高，这些都对。","e":"像抽盲盒，平均每盒值60元，可你手里这盒也许是空盒；平均数好看，单次结果照样可能亏钱，这就是不确定性。","t":"期望收益为正，不代表每笔都不亏","r":"资产收益率往往是不确定的，期望收益率是收益率的期望值。方差和标准差是估计资产实际收益率与期望收益率之间可能偏离程度的测度方法，方差值越大，实际收益率与预收益率之间的偏差就越大。D项，即使期望收益为正，也无法保证实际收益为正。"},{"i":105,"c":8,"k":"期货远期风险","q":"下列关于期货合约的定义的说法中，错误的是（）。","o":["期货有利于降低投资者的操作成本，提高资产配置效率","期货合约一般采用现金结算","相比远期合约，期货合约的信用风险更大一些","期货合约通常分为商品期货和金融期货"],"a":2,"p":"期货在交易所集中交易，每日无负债结算，有保证金和清算所担保，违约风险很小；远期是场外私下签约，对方赖账你没办法，信用风险才更大。期货多对冲平仓、也可现金结算，分商品和金融两类。","e":"像走平台担保的二手转卖，钱货有平台兜底；私下微信转账约好下周交货，对方跑单你只能干瞪眼讨说法。","t":"期货有交易所担保，远期才是信用风险大","r":"远期合约的履行没有保证，当价格变动对其中一方有利时，交易对手有可能没有能力或没有意愿按规定履行合约，因此，远期合约的违约风险会比较高。"},{"i":106,"c":2,"k":"信息披露控制","q":"关于信息披露制度控制说法错误的是（）","o":["公司应当按照法律法规和中国证监会有关规定，建立完善的信息披露制度，保证公开披露的信息真实、准确、完整、及时。","公司应当有相应的部门或岗位负责信息披露工作，进行信息的组织、审核和发布。","信息披露控制不包括对掌握非公开信息人员的行为控制","公司应当加强对公司信息披露的检查和评价，对存在的问题及时提出改进办法，对信息披露出现的失误提出处理意见，并追究相关人员的责任。"],"a":2,"p":"信息披露内控恰恰要把掌握非公开信息的人员管起来，包括登记知情人、限制买卖、保密管理，防止有人抢在公告前动手。说不包括正好说反，所以是错误表述。真实准确完整及时、专人负责、检查追责都对。","e":"像班级群公布成绩前，先拿到表格的人不能提前外传；老师要登记谁看过这张表，这就是管住知情人。","t":"披露内控恰恰要管住掌握内幕的人","r":"信息披露制度包括对掌握非公开信息人员的行为控制"},{"i":107,"c":10,"k":"私募股权风险","q":"关于私募股权投资的风险收益特征，以下表述正确的是（）。","o":["危机投资往往被认为是具有中等风险的战略","投资私募股权的风险一般低于货币市场基金","风险投资被认为是私募股权投资中处于高风险领域的战略","并购投资通常具有收益波动性较低的特征"],"a":2,"p":"风险投资投的是早期新技术企业，十家可能九家失败，属于私募股权里风险最高的一档；危机投资是低价买困境资产，并购投资用杠杆、波动不小但不算低风险。私募股权流动性差，风险远高于货币基金。","e":"像投大学城刚开张的奶茶新品牌，十家里能活一家就不错；这种早期下注，天生就是高风险玩法，赔光也常见。","t":"风险投资投早期，是私募股权里最高风险","r":"私募股权投资通常采用非公开募集的形式筹集资金，不能在公开市场上进行交易，流动性较差。私募股权投资包含多种形式，最为广泛使用的战略包括风险投资、成长权益、并购投资、危机投资和投资私募股权二级市场等。风险投资被认为是私募股权投资中处于高风险领域的战略。"},{"i":108,"c":11,"k":"见券付款","q":"关于银行间债券市场见券付款的结算方式，以下说法错误的是（）。","o":["付券方有一个风险敞口","等到日终券仍不足时，生成失败交割单","通常收券方信用比收款方好","券足等款到日终仍无付款指令，生成失败交割单，下一交易日解冻债券"],"a":3,"p":"见券付款是先把券划给对方、再等对方付款，付券方因此留下券已出手、钱还没到的敞口，风险落在付券方身上。日终券不足或款不到都会生成失败交割单，把它说成下一交易日解冻，细节就错了。","e":"像二手转卖先把手机寄给买家再等转账，手机已经不在你手上，钱没到你就只能干等，风险全在你这边。","t":"见券付款先给券，风险落在付券方","r":"券足等款到日终仍无付款指令，生成失败交割单并解冻债券。"},{"i":109,"c":9,"k":"归因数据来源","q":"Brinson模型是一种基于（）数据对组合业绩进行归因的模型。","o":["净值","财务报表","持仓","净值&财务报表"],"a":2,"p":"Brinson把组合与基准的收益差拆成资产配置、个股选择和交互三项，必须知道组合实际持了哪些行业和个股、各占多少权重，所以基础数据是持仓；净值只给总收益，拆不开来源，财务报表更不相关。","e":"像复盘一顿饭为什么超支，得看你实际点了哪几道菜、各多少钱；只看总账单，永远不知道是肉贵还是菜点多。","t":"Brinson拆配置和选股，靠持仓数据","r":""},{"i":110,"c":4,"k":"认购查询时点","q":"投资者T日提交认购申请后，可于（）日起到办理认购的网点查询认购申请的受理情况","o":["T+0","T+1","T+2","T+3"],"a":2,"p":"认购申请当天只是提交，销售机构要汇总上报、注册登记机构确认，所以到T+2日才能到网点查到申请是否被受理；T+0和T+1流程还没走完，查不到结果。","e":"像双十一付款后要等两天才查到订单是否已进仓，付款那刻只是提交，仓库确认了才算受理，急也没用。","t":"认购当天只提交，T+2才查受理","r":""},{"i":111,"c":7,"k":"可转债基金","q":"以下类型的债券型基金中一般情况下收益波动最大的是？","o":["可转债基金","中短债基金","中长期纯债基金","超短债基金"],"a":0,"p":"可转债基金持有一篮子可转债，转股价值和正股价格联动，股市涨跌会直接放大波动，所以是债基里波动最大的一类；中短债、超短债、中长期纯债主要受利率影响，久期越短越稳。","e":"像奶茶店兼卖股票，主业是茶但顺带炒股，生意好坏跟着股市一起摇；纯债基金只卖茶，收入平稳得多。","t":"债基里带股性的可转债基金波动最大","r":""},{"i":112,"c":1,"k":"发起式基金","q":"发起式基金的基金合同生效（）年后，若基金资产净值低于（）亿元，基金合同自动终止","o":["2；2","2；3","3；2","3；3"],"a":2,"p":"发起式基金成立满3年，如果资产净值还不到2亿元，合同自动终止，这是宽进严出的设计：成立门槛低，但三年考核不过关就清盘。2年、3亿、3年3亿都是把两个数字调换的干扰项。","e":"像学校给创业社团三年观察期，三年后营业额不到2万元就自动注销；时间到了规模不够，没有商量余地。","t":"发起式：3年、2亿，不够就终止","r":""},{"i":113,"c":4,"k":"销售服务费","q":"收取销售服务费的基金通常不收取（）。","o":["转换费 认购费","管理费 交易费","托管费 管理费","申购费 赎回费"],"a":3,"p":"销售服务费按日计提、持续收取，用来覆盖渠道维护成本，为了不重复收费，收销售服务费的份额一般免申购费和赎回费，改从净值里天天扣一点。管理费、托管费、转换费照旧要收。","e":"像健身房月卡和单次票二选一：办了月卡就不再收单次进场费；销售服务费就是那张月卡，天天扣一点。","t":"收销售服务费，就免申购费和赎回费","r":"收取销售服务费的基金通常不收取申购费和赎回费"},{"i":114,"c":1,"k":"基金互认","q":"中国证监会最早与（）证券监督机构启动了基金互认工作。","o":["马来西亚","新加坡","日本","中国香港地区"],"a":3,"p":"内地与中国香港的基金互认在2015年7月落地，是最早启动的互认安排，所以答案是中国香港地区；新加坡、日本、马来西亚都不是首批互认对象，别记混。","e":"像学校最先跟隔壁校区互通饭卡，基金互认也是先和香港搭桥，2015年7月开通，两边基金能互相卖。","t":"基金互认第一站是中国香港，2015年落地","r":""},{"i":115,"c":10,"k":"零售房地产","q":"以下属于零售房地产的是（）。","o":["购物中心","写字楼","酒店","养老院"],"a":0,"p":"零售房地产指购物中心、商业街这类专门建来出租给零售商经营的物业，租金跟客流和销售额挂钩；写字楼租给公司办公，酒店和养老院分别属于酒店及休闲、医疗类物业，都不算零售。","e":"像万达广场里一间间铺位，房东收的是奶茶店和服装店的租金，客流旺租金就涨，这就是零售房地产。","t":"零售房地产就是购物中心，租给零售商","r":"商业房地产投資以出租而赚取收益为目的，其投资对象主要包括写字楼、零售房地产等设施。零房地产是指如购物中心、商业购物中心和其他用于零目的而建设的建筑物。所有者将房地产出租给零售商进行经营。"},{"i":116,"c":4,"k":"杠杆率上限","q":"封闭式债券型基金的杠杆率上限是？","o":["1","1.4","1.6","2"],"a":3,"p":"封闭式债基没有日常赎回压力，总资产最多可以做到净资产的2倍，即200%杠杆；开放式基金要随时应付赎回，杠杆上限只有140%。1.4、1.6是把两个数字混着记的结果。","e":"像房东敢把整套房租下来再转租，是因为两年内不会有人退租；随时可能被退租的合租房，就不敢借那么多钱。","t":"封闭式债基2倍，开放式只有1.4倍","r":""},{"i":117,"c":3,"k":"宣传图表要求","q":"基金宣传推介材料有统计图表的，应当（）","o":["公平 准确","清晰 公平","清晰 准确","公平 清晰"],"a":2,"p":"推介材料里出现统计图表的，必须清晰、准确：不能模糊到看不清，不能截取有利区间，也不能把不同口径数据拼在一起误导人。公平讲的是对待所有投资者，不是图表的格式要求。","e":"像奶茶店海报把销量曲线只截最近一周的高点，看着一路向上；要求图表清晰准确，就是不许这么剪。","t":"宣传图表只认两个字：清晰、准确","r":"基金宣传推介材料有统计图表的应当清晰准确"},{"i":118,"c":4,"k":"估值披露频率","q":"我国开放式基金每（）估值，并于（）公告基金份额净值","o":["交易日；次日","交易日；当日","周；次周","月；次月"],"a":0,"p":"开放式基金每个交易日都要估值一次，算出份额净值后在次日公告，因为申赎按当日净值成交，投资者第二天才能知道成交价。周度、月度是早年封闭式或特定产品的做法。","e":"像点外卖第二天才出账单，你知道今天下了单，但具体花多少要等次日结算；基金净值也是隔一天公布。","t":"每个交易日都估值，净值次日公告","r":""},{"i":119,"c":7,"k":"贴现债券","q":"发行时不规定利率，券面也不附息票的债券是","o":["浮动利率债券","附息债券","息票累积债券","贴现债券"],"a":3,"p":"贴现债券发行时按低于面值的价格卖出，不规定利率、不附息票，到期按面值还本，买价与面值的差价就是利息，所以叫贴现。浮动利率、附息、息票累积债券都会约定票面利率并定期付息。","e":"像花950元买一张到期给1000元的券，中间不付任何利息，50元差价就是你的收益，这就是贴现。","t":"不写利率不附息票，折价买、面值还","r":""},{"i":120,"c":8,"k":"债券远期限额","q":"任何一家市场参与者（基金公司为单只基金），买入或卖出单只债券远期交易总额不超过该债券流通量（）","o":["5%","15%","20%","25%"],"a":2,"p":"任何一家市场参与者，基金公司按单只基金计算，买入或卖出单只债券的远期交易总额不得超过该债券流通量的20%，防止一家机构把远期头寸做得太大、到期交割时冲击市场。5%、15%、25%都不对。","e":"像小区里只有100箱团购牛奶，规定一户最多订20箱，免得一家扫货让别人拿不到货，远期交易也怕一家独大。","t":"单只债券远期，最多占流通量20%","r":"任何一家市场参与者（基金公司为单只基金）， 买入或卖出单只债券远期交易总额不超过该债券流通量20%"},{"i":121,"c":1,"k":"季报披露时点","q":"基金管理人应在每季结束后（）个工作日内，在指定报刊和管理人网站上披露基金季度报告。","o":["5","10","15","20"],"a":2,"p":"季报反映的是未经审计的季度运作情况，讲究时效，所以季末后15个工作日内必须同时登上指定报刊和管理人网站；5个工作日太赶，20日已超过法定上限，别把半年报的60日、年报的90日挪过来用。","e":"像奶茶店每季度末要给合伙人交经营小结，老板给自己留15天理清账单，赶在下一次进货前贴到店门口，超过这个窗口，合伙人就会怀疑你在遮掩亏损。","t":"季报15个工作日，半年报60日，年报90日","r":"在每季结束后15个工作日内，在指定报刊和管理人网站上披露基金季度报告。"},{"i":122,"c":5,"k":"系统性风险","q":"以下风险中属于系统性风险的一共有（）种。Ⅰ.央行加息导致国债价格下跌。Ⅱ.汇率波动导致海外资产价格波动。Ⅲ.局部冲突导致冲突国金融市场动荡。Ⅳ.央行采取紧缩性财政政策调整经济结构，导致经济增速放缓","o":["2","4","3","1"],"a":1,"p":"系统性风险来自利率、汇率、物价、政治、经济增速这类全局变量，一发作整个市场一起跌，换股也躲不掉，所以加息、汇率波动、地区冲突、紧缩政策四种全算，答案是4种；把局部冲突当成个别公司的风险，是最常见的误判。","e":"像暴雨天整条街的奶茶店都没客人，不是哪家服务差，而是天气这个全局变量在作怪，你手里攥着十个不同品牌的会员卡，照样没人排队。","t":"加息、汇率、冲突、紧缩都是系统性风险","r":"系统性风险，也可称为市场风险，是由经济坏境因素的变化引起的整个金融市场的不确定性的加强，其冲击是属于全面性的，主要包括经济增长、利率、汇率与物价波动以及政治因素的干扰等"},{"i":123,"c":1,"k":"公募不得做空","q":"下列哪项不是国内公募权益基金的投资策略？","o":["成长投资策略","价值投资策略","做空投资策略","量化投资策略"],"a":2,"p":"国内公募权益基金只能在多头框架里赚钱，靠买入并持有优质股票获利，成长、价值、量化三种都是在这个框架内挑股；做空要先融券或反向持有股指期货，公募的投资范围不允许把它当主要策略。","e":"像校园二手转卖只能先低价收进电动车再高价卖出；想做空得先借别人的车去卖，可宿舍楼下根本没这个借车规矩，你连车都拿不到。","t":"公募权益只做多，做空不是它的策略","r":""},{"i":124,"c":4,"k":"基金费用分类","q":"基金的交易费用不包括（）。","o":["托管费","申购费","赎回费","销售服务费"],"a":0,"p":"托管费是银行替基金保管资产收的报酬，按前一日基金资产净值乘约定费率逐日计提，直接从基金财产里扣，属于运作费用；申购费、赎回费和销售服务费都发生在投资者买卖或持有环节，才是交易类费用。","e":"像租房：中介费是成交那一刻才掏的钱，物业费却每天挂在房子上、由房东从租金里扣走，两者根本不是同一笔账。","t":"托管费逐日计提，属运作费不是交易费","r":""},{"i":125,"c":7,"k":"到期收益率假设","q":"关于债券的到期收益率计算的隐含假设，以下表述正确的是（）。\nⅠ. 投资者的投资策略是持有到期\nⅡ. 投资者的投资策略是交易套利\nⅢ. 利息再投资收益率可变\nⅣ. 利息再投资收益率不变","o":["Ⅱ、Ⅳ","Ⅰ、Ⅲ","Ⅰ、Ⅳ","Ⅱ、Ⅲ"],"a":2,"p":"到期收益率是把未来全部现金流按同一个利率折现、令其等于当前价格求出的报酬率，前提是你真的持有到期、中途不卖，且每期利息都能按这个收益率再投出去，所以Ⅰ和Ⅳ成立；若中途交易套利、再投资利率浮动，算出的数就不再是承诺收益。","e":"像办三年期奶茶储值卡：只有你抱着卡到期不退、每次返的现金还继续买同款，宣传的年化才兑现；中途卡涨价你转手卖掉，结果立刻变形。","t":"到期收益率假设持有到期且再投资率不变","r":"到期收益率隐含两个重要假设：一是投资者持有至到期，二是利息再投资收益率不变。"},{"i":126,"c":9,"k":"组合群收益计算","q":"根据全球投业绩标准关于收益率计算的具体条款，自2006年1月1日起，投资管理机构必须至少（）一次计算组合群的收益，并使用个别投资组合的收益以资产加权计算。","o":["每周","每月","每季度","每年"],"a":2,"p":"全球投资业绩标准要求自2006年1月1日起，投资管理机构至少每季度计算一次组合群收益，并用各组合收益按资产规模加权，免得大资金账户被小账户平均掉；每月或每年才统计一次，都达不到这条最低频率。","e":"像奶茶店汇总各门店业绩，要按营业额加权，而且至少每季度结一次账；一个学期才汇总一回，中途换过店长的那家店，数字早就串了。","t":"组合群至少每季度算一次，按资产加权","r":"自2006年1月1日起，投资管理机构必须至少每季度一次计算组合群的收益，并使用个别投资组合的收益以资产加权计算。"},{"i":127,"c":2,"k":"核心保密区域","q":"在基金公司的投资管理部门中，属于基金公司的核心保密区域，执行最严格的保密要求的部门是（）。","o":["投资决策委员会","投资部","研究部","交易部"],"a":3,"p":"交易部握着全公司所有组合的买卖指令、时点和数量，一旦外泄等于把底牌亮给对手，因此被划为最严格的核心保密区，进出受限、通讯受控；投委会和研究部虽重要，接触的只是决策方向和研究成果，敏感度低一档。","e":"像奶茶店新品配方：研发部知道要出什么口味，但只有后厨操作台清楚每天几点、往哪家店送多少杯，这张送货单被同行看到，配方就白保密了。","t":"交易部握着全部买卖指令，保密级别最高","r":"基金交易部属于基金公司的核心保密区域，执行最严格的保密要求。"},{"i":128,"c":1,"k":"本金锁定期","q":"养老基金、保险基金、共同基金等类型的合格境外机构投资者，以及合格投资者发起设立的开放式中国基金的投资本金锁定期为（）个月","o":["1","3","5","6"],"a":1,"p":"养老基金、保险基金、共同基金这类长期资金，加上合格投资者发起的开放式中国基金，本金只锁3个月，比其他境外机构更宽松，因为监管认定它们不会快进快出；1个月、5个月、6个月都是干扰数字。","e":"像健身房的长期会员卡：老客户只押3个月就能退，临时来的散客要押更久，因为店家怕他们练两天就退卡走人。","t":"长期资金类QFII，本金只锁3个月","r":"养老基金、保险基金、共同基金等类型的合格境外机构投资者，以及合格投资者发起设立的开放式中国基金的投资本金锁定期为3个月"},{"i":129,"c":10,"k":"持有人披露","q":"相比与场外股票基金，股票ETF能多披露以下哪类信息？","o":["资产净值","前十大重仓股","前十大持有人","股票投资收益"],"a":2,"p":"股票ETF在交易所上市，要按上市基金的要求定期公布前十大持有人名单，让市场看清谁在重仓；场外开放式股票基金披露资产净值、前十大重仓股和投资收益，持有人结构不属于它必须亮出的项目。","e":"像把电动车摆到公开摊位寄卖要登记十大买主，私下转手的那台只需说清车况和售价，谁买走了不必公开。","t":"ETF上市交易，要多披露前十大持有人","r":""},{"i":130,"c":7,"k":"利率与债价","q":"假设其他条件不变，当利率下降时，债券价格将___,债券基金的净值将___?","o":["上升，下降","上升，上升","下降，下降","下降，上升"],"a":1,"p":"债券票息是固定的，市场利率一降，新发债券给的利息变少，手里这张老债就显得值钱，价格随之上升；债券基金主要持有债券，估值涨了净值跟着涨，所以两个空都填上升，方向完全同向。","e":"像你去年按3%借给朋友1万元，今年银行只给1.5%，这张借条转手就能卖更高价，因为别人再也拿不到3%了。","t":"利率跌、债价涨，债基净值同步涨","r":""},{"i":131,"c":1,"k":"金额认购","q":"开放式基金的认购采取（）认购的方式","o":["份额","金额","数量","对价"],"a":1,"p":"开放式基金没有固定价格，认购时你报的是投多少钱，再按面值1元加认购费折算成份额，所以叫金额认购；报份额数量的是封闭式基金和ETF，它们在募集时价格与份额都已定死，不用现场折算。","e":"像奶茶店充值：你说充100元，系统按当日单价折成多少杯；先报我要12杯的那是提前谈好的团购套餐，逻辑不一样。","t":"开放式基金报金额，封闭式报份额","r":"开放式基金的认购采取金额认购的方式"},{"i":132,"c":2,"k":"大额交易报告","q":"基金销售机构应根据中国人民银行《金融机构大额交易和可疑交易报告管理办法》第九条和第十条，检测客户资金收支或款项划转情况，对符合大额交易标准的，在该大额交易发生后（）个工作日内，向反洗钱检测分析中心报告。","o":["1","3","5","10"],"a":2,"p":"大额交易讲究事后留痕、快速上报，交易发生后5个工作日内必须报送中国反洗钱监测分析中心，给的是工作日不是自然日；1日、3日是可疑交易的即时报送节奏，10日已经超期。","e":"像宿舍楼下小卖部突然收到陌生人转来一大笔钱，店长要在五个工作日内报给辅导员，报晚了钱早被转走，线索就断了。","t":"大额交易5个工作日报反洗钱中心","r":"基金销售机构应根据中国人民银行《金融机构大额交易和可疑交易报告管理办法》规定，检测客户资金收支或款项划转情况，对符合大额交易标准的，在该大额交易发生后5个工作日内，向反洗钱检测分析中心报告。"},{"i":133,"c":1,"k":"多币种份额","q":"某只QDII基金设有人民币份额和美元份额，下列说法错误的是","o":["申购人民币份额时支付人民币，赎回时也得到人民币","美元份额申赎对应的货币都是美元","受汇率影响两类份额的净值涨跌幅度相同","美元份额的基金净值以美元为单位计算和披露"],"a":2,"p":"人民币份额和美元份额背后是同一个境外资产池，但人民币份额的净值要按汇率折算，美元份额直接用美元计价，汇率一动，两种货币表示的涨跌幅就对不上；只有忽略汇率时才会相同，所以说幅度相同是错的。","e":"像同一杯奶茶国内卖15元、美国卖2美元，美元升值后美国人看到的价格没变，国内折算过去的价格却变了，两边涨幅自然不一致。","t":"同一资产池，汇率让两种份额涨跌幅不同","r":""},{"i":134,"c":11,"k":"货币市场功能","q":"关于货币市场工具，以下表述正确的是（）。","o":["货币市场工具为企业融通长期资金提供了有效的手段","货币市场工具交易形成的长期利率是判断市场上银根松紧程度的重要指标","货币市场工具交易形成的长期利率在整个市场的利率体系中充当了基准利率","货币市场工具为商业银行管理流动性提供了有效手段"],"a":3,"p":"货币市场工具期限在一年以内、流动性好，银行把多余头寸放进同业拆借和回购，缺钱时随时取回，正好用来调节流动性；它融通的是短期资金、形成的是短期利率，说长期资金和长期利率都错位了。","e":"像奶茶店的备用金抽屉：旺季多出的零钱先扔进去随时能拿，进货缺钱立刻补上，这个抽屉不是用来存三年定期的。","t":"货币市场管短期流动性，利率也是短期的","r":"货币市场工具因其具有良好的流动性和对经济环境的敏感性，在金融市场中发挥着十分重要的功能：一方面，货币市场工具为商业银行管理流动性以及企业融通短期资金提供了有效的手段；另一方面，因货币市场工具交易而形成的短期利率在整个市场的利率体系中充当了基准利率，为市场上其余证券利率的确定提供了重要的参考依据，是判断市场上银根松紧程度的重要"},{"i":135,"c":4,"k":"估值频率","q":"目前，我国开放式基金的估值频率为（）。","o":["每个自然日估值，当日披露份额净值","每个交易日估值，次日披露份额净值","每个交易日估值，每周披露一次份额净值","每个自然日估值，次日披露份额净值"],"a":1,"p":"开放式基金按申赎当天的价格成交，所以每个交易日收盘后必须估值一次，算出份额净值并在次日公告；每个自然日估值会把周末和节假日也算进去，每周披露一次则是封闭式基金的做法，别搞混。","e":"像网约车司机每天跑完收车就结账，第二天早上给你发流水单，周末不出车就不结，这就是每个交易日估值、次日披露。","t":"T日估值、T加1披露，封闭式才每周","r":"目前，我国的开放式基金于每个交易日估值，并于次日公告基金份额净值。封闭式基金每周披露一次基金份额净值，但每个交易日也都进行估值。"},{"i":136,"c":10,"k":"私募J曲线","q":"下列关于反映私募股权基金收益状况的J曲线的说法中，错误的是（)。","o":["投资者在考察其所投资的私募股权基金收益状况时，会画出J曲线","J曲线以投资金额为横轴，收益率为纵轴","对投资者而言，J曲线意味着在长期投资项目中，如果过度注重短期收益，就不利于实现长期收益目标","对私募股权基金管理者而言，J曲线意味着要尽量缩短该曲线，尽快达到投资者所希望的收益回报"],"a":1,"p":"J曲线画的是时间与收益率的关系：前期只投钱没退出，收益率为负、曲线往下走，后期项目退出、收益抬升，整体像个字母J；说横轴是投资金额就错了，那样画出来的是收益分布而不是时间序列。","e":"像健身房办年卡：头三个月一直交钱没效果，体重往下掉，半年后开始变瘦，一年回头再看整条线才像字母J。","t":"横轴是时间、纵轴是收益率，别记成金额","r":"J曲线是以时间为横轴、以收益率为纵轴的一条曲线。"},{"i":137,"c":8,"k":"投机功能","q":"下列关于期货交易中的“投机“的表述中，错误的是（）。","o":["投机者承担了套期保值交易转移的风险","投机者承担了风险，并提供风险资金","投机交易减弱了市场的流动性","投机者是使套期保值得以实现的重要力量"],"a":2,"p":"投机者用自己的钱在期货市场频繁买卖，替套保者接走了价格风险，同时把买卖盘做厚，流动性是被增强而不是减弱；说投机减弱流动性正好说反，另外三项都成立。","e":"像演唱会门口的票贩子：他们敢接别人不敢接的票，想退票的人随时能出手，场子反而更热闹，流动性就是这么来的。","t":"投机接走风险、加厚流动性，不是减弱","r":"投机交易增强了市场的流动性，承担了套期保值交易转移的风险，是期货市场正常运营的保证。"},{"i":138,"c":3,"k":"暂停大额申购","q":"以下哪种情况可能导致基金暂停大额申购？","o":["基金规模快速扩大，为保持投资策略的稳定性","基金经理更换，新的投资策略正在制定中","市场流动性充裕，投资机会丰富","基金份额净值持续大幅上涨"],"a":0,"p":"基金规模短期猛增，钱多到没处买，原有持仓被摊薄、策略容量被撑破，为保护老持有人收益不被稀释，管理人就会限购甚至暂停大额申购；基金经理换人不构成理由，市场机会多更不该关门。","e":"像只有四口锅的小面馆，一天涌进200人的旅行团，老板只能挂出每桌限点两碗，硬接单谁都吃不上熟的。","t":"规模暴涨摊薄收益，限购护老持有人","r":"当基金规模过快增长时，为了保护现有基金份额持有人的利益，以及维持基金管理人原有投资策略的有效执行，基金可能会暂停大额申购。"},{"i":139,"c":5,"k":"战略资产配置","q":"下列关于战略资产配置的说法中，错误的是（）。","o":["是一种事前的、整体性的规划和安排","确定的是资产组合中各主要大类资产的投资比例","需考虑投资者的风险承受能力","需经常根据资产的短期波动进行动态调整"],"a":3,"p":"战略资产配置盯的是三年以上的长期目标，先按风险承受能力定好各大类资产的基准比例，定完就少动，短期波动交给战术配置去应付；说它要频繁随短期波动调整，正好把战略和战术弄反了。","e":"像减肥定下每天主食一拳、蛋白质两拳的长期框架，体重某天涨了半斤也不改菜单，临时少吃一顿那才叫战术调整。","t":"战略定长期比例，短期波动交给战术","r":"战略证券资产配置是在一个较长时期内追求长期回报为目标的资产配置，因此，往往忽略资产的短期波动。"},{"i":140,"c":3,"k":"有效沟通","q":"基金客户服务原则中有效沟通原则指","o":["企业生存离不开客户，客户的满意是客服人员追求的目标。","每一位客服人员应站在客户的角度，理解客户，尊重客户，一切为客户着想，为客户提供高品质，高效率的服务。出现分歧时，更要急客户之所急，耐心细致地与客户沟通具体细节，不能臆测客户需求，切忌草率行事。","基金投资涉及投资人身份、地位、财富等信息，基金销售机构应建立严格保密制度，及时维护和更新持有人信息，防范信息不当使用。","基金的认购、申购、赎回等交易具有详细的业务规则，销售机构在提供服务时必须要遵守法律法规和业务规则。"],"a":1,"p":"有效沟通讲的是站在客户立场把话讲透：先理解他的处境和真实需求，出现分歧时耐着性子核对细节，绝不替客户猜需求；保密、守法、客户满意分别是另外几条原则，别混成一锅。","e":"像室友说随便吃点，你得问清是没钱还是没胃口，直接点最辣的火锅就是臆测需求，这顿饭等于没沟通。","t":"有效沟通等于换位加问清细节，不臆测","r":"有效沟通原则指每一位客服人员应站在客户的角度，理解客户，尊重客户，一切为客户着想，为客户提供高品质，高效率的服务。出现分歧时，更要急客户之所急，耐心细致地与客户沟通具体细节，不能臆测客户需求，切记草率行事。"},{"i":141,"c":10,"k":"大宗商品特征","q":"下列关于大宗商品的说法中，错误的是（）。","o":["大宗商品可以进入流通领域，但不包括零售环节","在金融投资市场，大宗商品具有异质化、可交易等特征","大宗商品具有商品属性，可用于工农业生产与消费的使用","大宗商品的期货及现货的价格变动会直接影响整个经济体系"],"a":1,"p":"大宗商品是标准化的大批量物资，同品种之间几乎没有差别，所以才能统一报价、集中交易；说它异质化恰好相反，异质化是艺术品和定制品的特点，一颗一个样就没法批量定价。","e":"像菜市场的标准土豆：同一规格一袋袋过秤，谁家的都一样，才能按斤报价；要是每颗土豆长得都不同，就只能一个个谈价。","t":"大宗商品同质化、可交易、不进零售","r":"大宗商品是指具有实体，可进入流通领域，但并非在零售环节进行销售，具有商品属性，用于工农业生产与消费使用的大批量买卖的物资商品。大宗商品具有同质化、可交易等特征，供需和交易量都非常大。"},{"i":142,"c":3,"k":"赎回费归属","q":"不收取基金销售服务费的，对持续持有期长于6个月，应当将不低于赎回费总额的（）计入基金财产","o":["25%","50%","60%","75%"],"a":0,"p":"持有超过6个月还收的那笔赎回费，本质是补偿留下来的持有人，所以不低于25%必须计入基金财产；收销售服务费的基金另有一套安排，门槛比例不同。关键记长于6个月、不低于四分之一。","e":"像合租半年后提前退租，押金里至少四分之一要留下补贴继续住的室友，不能整笔进房东口袋，剩下才谈扣款。","t":"持有长于6个月，赎回费25%归基金财产","r":"不收取销售服务费的，对持续持有期长于6个月，应当将不低于赎回费总额的25%计入基金财产"},{"i":143,"c":4,"k":"基金税收","q":"个人投资者从基金分配中获得的下列收入，目前需要征收个人所得税的是（)。","o":["定期存款利息收入","国债利息收入","股利收入","买卖股票差价收入"],"a":2,"p":"基金把股票分红转给个人投资者时，上市公司已按20%代扣代缴个人所得税，这笔钱跑不掉；国债利息和买卖股票差价目前暂不征收，存款利息也有免税安排，四类收入里只有股利要交。","e":"像宿舍合伙买股票收分红，钱到账前就被扣掉两成税；要是卖掉赚差价，这部分暂时不用交，差别就在分红和差价四个字。","t":"股利收入交20%个税，差价暂免","r":"个人投资者从基金分配中获得的股票的股利收入、企业债券的利息收入，由上市公司、发行債券的企业和银行在向基金支付上述入时，代扣代缴20％的个人所得税。个人投资者从基金分配中获得的国债利息、买卖股票差价收入，在国债利息收入、个人买卖股票差价收入未恢复征收所得税以前，暂不征收所得税。"},{"i":144,"c":7,"k":"债券基金特点","q":"与股票型基金相比，债券型基金一般具有以下哪个特点？","o":["高风险，高收益","较低风险，较低收益","低风险，高收益","高风险，低收益"],"a":1,"p":"债券基金收益主要来自票息和利率变动，本金波动小，风险低于股票基金；但票息有上限，长期回报也低于股票，所以是较低风险较低收益；低风险还能高收益等于白捡钱，市场上不存在。","e":"像把钱借给亲戚收年息4%，比投朋友的创业项目稳得多，可一年也就那点利息，别指望它跑出股票的涨法。","t":"债基低风险对应低收益，别贪高收益","r":""},{"i":145,"c":3,"k":"市场细分原则","q":"（）指完成市场细分后，销售机构有能力向某一细分市场提供其所需的基金产品和服务，即该细分市场易于开发、便于进入的。","o":["易入原则","可测原则","成长原则","识别原则"],"a":0,"p":"市场细分要过四道关：能测量是可测，有增长空间是成长，能认出来是识别，进得去是易入。题干强调销售机构有能力把产品送进这个细分市场、开发成本低，说的正是易入原则。","e":"像外卖平台挑新片区：先看单量能不能算清、有没有增长，再看骑手进不进得去，最后选一条街就能铺开的小区先试点。","t":"易入就是进得去、好开发，别和可测成长混","r":"易入原则指完成市场细分后，销售机构有能力向某一细分市场供其所需的基金产品和服务，即该细分市场易于开发、便于进入的。"},{"i":146,"c":1,"k":"持有人大会公告","q":"管理人召集基金份额持有人大会的，应至少提前（）日公告大会的召开时间、会议形式、审议事项、议事程序和表决方式等事项。","o":["5","10","20","30"],"a":3,"p":"持有人大会要改基金合同、换托管人这类大事，必须给持有人足够准备时间，所以管理人至少提前30日公告时间、形式、审议事项、议事程序和表决方式；5日、10日太仓促，20日仍不够。","e":"像小区要投票换物业，业委会至少提前30天把议题和表决方式贴到公告栏，临时通知明天开会，业主肯定不认。","t":"持有人大会必须至少提前30日公告","r":"管理人召集基金份额持有人大会的，应至少提前30日公告大会的召开时间、会议形式、审议事项、议事程序和表决方式等事项。"},{"i":147,"c":11,"k":"货币市场利率","q":"货币市场产生于信用活动，其交易价格为（）。","o":["汇率","利率","存款准备金率","超储率"],"a":1,"p":"货币市场借的是短期资金，价格就是借钱的价格即利率，同业拆借、回购、票据都按利率报价；汇率是两种货币的兑换比价，准备金率是央行调控工具，都不是这个市场自己形成的资金价格。","e":"像同学之间借500元救急，说好一周还520，多出的20元就是这笔短钱的价格，用利率表示；换成人民币兑美元的比例，那是另一码事。","t":"货币市场交易的是钱，价格就是利率","r":"货币市场工具产生于信用活动，交易价格为利率，是固定收益证券的一部分。"},{"i":148,"c":1,"k":"募集失败退款","q":"基金募集失败在基金募集期限届满后（）日内返还投资人已交纳的款项，并加计银行同期存款利息。","o":["10","20","30","60"],"a":2,"p":"募集期满没达到成立条件，基金就不能成立，管理人要在30日内把已交款项退给投资人，还要按银行同期存款利率加计利息，不能让投资者的钱白放；10日、20日都短于法定期限。","e":"像团购电动车凑不够人数，店家要在30天内把定金原路退回，还得算上这几个月的银行利息，不能白用你的钱。","t":"募集失败30日内退款，还要加银行利息","r":"在基金募集期限届满后30日内返还投资人已交纳的款项，并加计银行同期存款利息。"},{"i":149,"c":11,"k":"做市商收入","q":"在报价驱动中，做市商的收入来源是（）。","o":["投机收入","手续费、佣金收入","投资收入","买卖证券的差价"],"a":3,"p":"报价驱动市场里，做市商同时挂出买价和卖价，买价略低、卖价略高，靠这个价差吃饭，同时承担存货风险；佣金是经纪人的收入，投机收入和投资收入都不属于做市商的商业模式。","e":"像校园里倒卖二手电动车的，600元收进、700元卖出，赚的就是中间100元差价；只帮你牵线收50元介绍费的，那才是经纪人。","t":"做市商吃买卖价差，经纪人收佣金","r":"做市商的利润主要来源于证券买卖差价，而经纪人的利润则主要来源于给投资者提供经纪业务的佣金。"},{"i":150,"c":7,"k":"免疫策略","q":"关于债券基金经理通常使用的免疫策略的种类，以下选项错误的是（）。","o":["所得免疫","或有免疫","价格免疫","收益免疫"],"a":3,"p":"债券免疫常用三类：所得免疫保证未来现金流够用，价格免疫让资产与负债对利率变动同步，或有免疫只在跌破底线时才启动保底；收益免疫是拼出来的名字，并没有这种策略，收益本身就是免疫要保护的对象。","e":"像为四年后的学费攒钱：锁定每年到账利息、让存款和学费对利率同涨同跌、只在跌破底线时出手，这三招对应三类免疫，没有多赚点那种免疫。","t":"免疫只有所得、价格、或有，没有收益免疫","r":"常用的免疫策略主要包括：所得免疫、价格免疫和或有免疫。"},{"i":151,"c":4,"k":"财务报告披露","q":"基金财务会计报告至少披露会计报表和会计报表附注内容的为（）","o":["季度 年度","月度 季度","季度 半年度","半年度 年度"],"a":3,"p":"只有半年度报告和年度报告才要求同时披露会计报表和会计报表附注，因为附注要解释会计政策、关联交易等细节，篇幅大、编制成本高；季报只披露简要财务指标，不做完整报表加附注。","e":"像奶茶店给合伙人交账：每月只发一张营业额截图，半年和年底才把完整账本连同原料费为什么涨了的说明一起交上去。","t":"报表加附注，只在半年报和年报里","r":"基金财务会计报告至少披露会计报表和会计报表附注内容的为半年度和年度报表"},{"i":152,"c":4,"k":"基金收入来源","q":"基金收入的主要来源不包括","o":["利息收入","资本利得","股息收入","基金管理费"],"a":3,"p":"基金的收入来自它持有的资产：债券利息、股票股息、买卖证券的差价，这三项都进基金财产；管理费是管理人向基金收取的报酬，属于费用支出，方向正好相反，不可能被算成收入。","e":"像合租房的收入是室友交的租金和水电结余，物业公司收的管理费是往外掏的钱，你没法把它记成自己赚的。","t":"管理费是支出，利息股息差价才是收入","r":""},{"i":153,"c":8,"k":"信用违约互换","q":"2008年在美国爆发的金融危机，随后蔓延至全球，导致这场危机的重要衍生金融工具是（）。","o":["信用违约互换","期权合约","外汇期货","私募股权"],"a":0,"p":"2008年危机的核心是把次级房贷打包成证券，再用信用违约互换给这些债券上保险，CDS名义规模远超底层资产，一家违约就连环爆仓；期权和外汇期货只是常规工具，不是这场危机的引爆点。","e":"像全班互相给同学买考试不过就赔钱的保单，卖保单的收保费收上瘾，真有一批人挂科，赔付链条瞬间崩掉。","t":"2008年危机的引爆点是信用违约互换","r":"在2008年发生的全球性金融危机当中，导致大量金融机构陷入危机的最重要的衍生金融工具正是信用违约互换。"},{"i":154,"c":10,"k":"快速赎回上限","q":"目前，单只货币基金，日内快速赎回的金额上限为（）","o":["1万元","2万元","5万元","10万元"],"a":0,"p":"监管给货币基金当日赎回、当日到账的垫资服务设了天花板：单只基金、单个投资者单日快速赎回上限1万元，防止机构把它当活期钱包搞套利；2万元、5万元、10万元都超过了这条线。","e":"像宿舍楼下便利店推出秒退押金窗口，一次最多退1万元，超过就得走普通流程等一天，免得有人天天搬钱套利。","t":"单只货币基金快赎，单日上限1万元","r":""},{"i":155,"c":3,"k":"风险等级","q":"基金风险等级不包括（）等级","o":["低风险","中风险","高风险","零风险"],"a":3,"p":"基金风险等级按低、中低、中、中高、高来划分，任何基金净值都会波动，没有零风险这一档；货币基金风险再低也只标低风险，把零风险当成一个等级是典型误判。","e":"像健身房入会问卷只让你勾从不运动、偶尔、经常，填我永远不会受伤根本没这个选项，因为不存在这种状态。","t":"基金最低就是低风险，没有零风险档","r":"基金投资人风险承受能力没有创新型说法"},{"i":156,"c":1,"k":"披露原则","q":"基金信息披露内容应遵循的基本原则不包括（）","o":["真实性原则","准确性原则","易得性原则","及时性原则"],"a":2,"p":"信息披露原则分内容和形式两组：内容上要真实、准确、完整、及时，形式上才讲易得性、规范性和可比性。易得性管的是信息放在哪、好不好找，属于形式要求，不在内容原则之列。","e":"像班级通知：内容必须真实说清考试时间和地点，这是内容要求；贴不贴到宿舍门口让人一眼看到，那是形式要求，两码事。","t":"易得性管好不好找，属形式不属内容","r":"易得性原则属于基金信息披露形式方面原则"},{"i":157,"c":3,"k":"投资决策教育","q":"（）指对投资产品和服务做出选择的行为或过程，它是整个投资者教育体系的基础。","o":["投资决策教育","资产配置教育","风险管理教育","权益保护教育"],"a":0,"p":"投资者教育分四块：投资决策、资产配置、风险管理、权益保护。其中教人怎么在产品和买卖时点上做选择的那一块，是全部教育的地基，先会挑，才谈得上配置、控风险和维护权益。","e":"像新生食堂教育：先教怎么点菜，再教荤素怎么搭配、剩菜怎么处理、被坑了怎么投诉，顺序不能倒，第一步就是决策。","t":"投资决策教育打底，才谈配置和风控","r":"投资决策教育指对投资产品和服务做出选择的行为或过程，它是整个投资者教育体系的基础。"},{"i":158,"c":3,"k":"销售适用性","q":"a10小王急需用钱,他应该买（）。","o":["近期收益排名靠前的基金","承诺收益的基金","明星基金经理管理的基金","根据自身风险偏好水平、风险承担能力和预期收益选择基金"],"a":3,"p":"选基金要先把人看清楚：能承受多大波动、这笔钱多久不用、想要多少收益，再去匹配产品；近期排名、承诺收益、明星经理都是外部噱头，其中承诺收益本身还违规，急用钱更不能买高波动品种。","e":"像相亲不能只看对方朋友圈精修图，要问清作息、消费观和家庭负担再决定见不见第二次，否则处三个月就崩。","t":"先量自己能扛多大波动，再挑基金","r":""},{"i":159,"c":9,"k":"股票基金风险指标","q":"下列指标中不能反映股票基金风险的是（）。","o":["标准差","贝塔系数","持股集中度","久期"],"a":3,"p":"标准差衡量净值波动幅度，贝塔衡量相对大盘的敏感度，持股集中度衡量押注几只票，三者都是股票基金的风险尺子；久期量的是债券价格对利率变动的敏感度，跟股票组合没有对应关系。","e":"像体检：标准差是心跳波动，贝塔是对咖啡因的敏感度，集中度是只吃一种菜，久期相当于测酒量，跟这一桌菜无关。","t":"久期是债券的尺子，股票基金不看久期","r":"常用来反映股票基金风险的指标有标准差、β系数、持股集中度、行业投资集中度、持股数量等。"},{"i":160,"c":1,"k":"RQFII风险","q":"RQFII产品投资我国资本市场时，所面临的市场风险不包括","o":["政策风险","利率风险","经济波动风险","汇率风险"],"a":3,"p":"RQFII是拿境外人民币投回境内，资金进出都以人民币计价，基金资产本身不涉及换汇，所以不承担汇率风险；政策调整、利率变动、经济周期波动都会打到境内资产价格上，这三项才是它的市场风险。","e":"像留学生用人民币在国内校园卡消费，食堂涨价、学校改规则都会影响他，但他根本不用换汇，汇率涨跌跟这顿饭无关。","t":"RQFII拿人民币投境内，不担汇率风险","r":""},{"i":161,"c":2,"k":"客户身份资料保存","q":"基金经营机构的客户身份资料自业务关系结束或一次性交易记账当年记起至少保存（）年。","o":["1","2","3","5"],"a":3,"p":"客户身份资料和交易记录是反洗钱追溯的底稿，监管要求从业务关系结束或一次性交易记账当年起至少保存5年，方便日后核查资金来源。记成1年或3年会漏掉追溯期，混淆了不同资料的保存年限。","e":"像健身房办年卡要留身份证复印件，你退卡后这份档案还得锁在柜子里满5年，系统升级、教练离职都不能删。","t":"客户身份资料至少存5年，别记成3年","r":"基金经营机构的客户身份资料自业务关系结束或一次性交易记账当年记起至少保存5年。"},{"i":162,"c":10,"k":"参考净值频率","q":"证券交易所在开市后根据ETF申购、赎回清单和组合证券由各只证券的实时成交数据计算并每（）提供一次基金份额参考净值","o":["1天","1小时","1分钟","15秒"],"a":3,"p":"交易所把申购赎回清单里每只成分股的实时成交价加权汇总，算出份额参考净值，行情每15秒刷新一次，方便投资者随时比对场内价格是否偏离净值。1分钟太慢，1天一次那是收盘后的正式净值。","e":"像点外卖时平台每15秒刷新一次骑手位置，ETF的参考净值也是15秒一更的实时价签，用来对照场内报价贵不贵。","t":"参考净值15秒一刷，收盘净值一天一次","r":""},{"i":163,"c":5,"k":"均值方差模型","q":"谁提出的均值-方差模型？","o":["尤金·法玛","哈里·马克维茨","威廉·夏普","马克·卡哈特"],"a":1,"p":"马克维茨1952年用期望收益代表收益、方差代表风险，把选股变成在两者之间求最优组合，奠定现代组合理论。夏普在此基础上加入无风险资产推出资本资产定价模型，法玛提出的是有效市场假说。","e":"像配一杯奶茶，先把每种搭配的期望好喝程度和口味波动列出来，再挑波动小、期望高的那杯，这就是均值方差。","t":"均值方差归马克维茨，夏普加了无风险资产","r":""},{"i":164,"c":1,"k":"基金国际化","q":"投资基金国际化目的主要在于把握各国证券价格上升潜力，并在一定程度上（）。","o":["提高投资收益","提高企业信誉","分散投资风险","提高基金知名度"],"a":2,"p":"各国股市涨跌不同步，把钱同时投到多个国家，一个市场下跌时另一个可能上涨，组合整体波动被摊薄，所以国际化在追逐海外上涨潜力之外，核心是分散单一市场风险。提高知名度、信誉都不是配置海外资产的目的。","e":"像把20万分成两份，10万买A股基金、10万买美股基金，A股跌的时候美股反而涨，两边的波动互相抵消，整体就稳了。","t":"出海不为名气，为的是不把鸡蛋放一个篮","r":"其目的主要在于把握各国证券价格上升潜力，并在一定程度分散风险。"},{"i":165,"c":3,"k":"宣传材料备案","q":"其他基金销售机构的基金宣传推介材料，应当自向公众分发或者发布之日起（）个工作日内报工商注册登记所在地中国证监会派出机构备案。","o":["1","5","10","15"],"a":1,"p":"宣传推介材料发出后，销售机构要在5个工作日内向工商注册地证监局备案，给监管留事后核查的窗口。1个工作日常见于别类事项，10日、15日是其他报送的时限，混在一起就容易选错。","e":"像社团办活动，海报贴出去那天起5个工作日内必须把方案报到学院备案，不能等结束再补交，晚了会被通报批评。","t":"宣传材料发布起5个工作日备案，不是10日","r":"其他基金销售机构的基金宣传推介材料，自向公众分发或者发布之日起5个工作日内报工商注册登记所在地中国证监会派出机构机构备案。"},{"i":166,"c":1,"k":"沪港通机制","q":"下列关于沪港通的说法中正确的是（）。","o":["沪港通指投资者委托香港经纪商或内地经纪商直接买卖香港上市股票的行为","通过沪港通进行股票买卖一般限定为机构投资者，普通投资者目前还不能通过沪港通进行投资","沪港通分为沪股通和港股通，其中港股通需要投资者委托内地证券服务公司，经由上交所设立的证券服务公司，向香港联合交易所进行买卖申报","投资者可以直接通过交易所进行港股或内地股权的买卖"],"a":2,"p":"港股通是内地投资者买港股，路径为委托内地券商，经上交所设在香港的证券服务公司向联交所申报；沪股通方向正好相反。个人投资者同样能参与，也不能绕过交易所直接成交，把两个方向混为一谈的那项就错了。","e":"像跨境代购：你不去香港，先把单子交给内地代理，再由代理对接香港的合作方下单，多一层中转，货才出得来，绕不开这一环。","t":"港股通：内地券商转上交所服务公司报联交所","r":"沪港通分为沪股通和港股通两个部分。所谓沪股通，就是投资者委托香港经纪商，经由香港联合交易所设立的证券交易服务公司，向上海证券交易所进行申报（买卖盘传递），买卖规定范围内的上海证券交易所上市的股票。而港股通就是投资者委托内地证券服务公司，经由上海证券交易所设立的证券交易服务公司，向香港联合交易所进行申报（买卖盘传递），买卖规定范围内的香港联合交易所上市的股票。"},{"i":167,"c":2,"k":"基金从业资格","q":"需要取得基金从业资格的是（）","o":["证券公司总部及营业网点从事基金宣传推介的人员","商业银行总行各级分行及营业网点从事基金宣传推介的人员","负责基金销售业务的管理人员","以上皆是"],"a":3,"p":"基金销售链条上，凡是做宣传推介、办理销售和管销售业务的人都要持证，券商总部与营业部人员、银行总分行及网点人员、销售管理人员无一例外，三项都要选。只挑一线人员会漏掉管理岗。","e":"像奶茶店上新品，写海报的、门店点单的、排班的店长，都得先拿到食品安全证，缺一个人就开卖不了，谁都不能例外。","t":"宣传、销售、管理岗，一个都不能少，都要持证","r":"负责基金销售业务的管理人员应取得基金从业资格"},{"i":168,"c":1,"k":"境外投资基金","q":"什么是QDII基金？","o":["投资于国内市场的开放式基金","投资于全球主要股票市场的指数基金","允许境内投资者投资海外市场的基金","由政府主导的投资海外债券的基金"],"a":2,"p":"QDII是合格境内机构投资者，由境内基金公司募集人民币、换成外汇投境外股票债券，让普通人不出境也能买全球资产。它不等于指数基金，也不是政府主导的债券基金，投资范围由合同约定。","e":"像小区团购智利车厘子，你不去产地，由团长统一收人民币、统一换汇再找海外供应商发货，中间隔着换汇和跨境结算。","t":"QDII关键词是境内募资、出境投资","r":"QDII基金（Qualified Domestic Institutional Investor）是指符合条件的境内机构投资者，通过设立基金的方式，让境内居民能够投资海外市场的一种基金产品。"},{"i":169,"c":7,"k":"收益率曲线","q":"关于国债收益率曲线，以下表述错误的是（）。","o":["国债收益率曲线是反映即期利率的有效途径","国债收益率曲线是市场无风险利率最适合的替代","国债收益率曲线反映了对未来通货膨胀的预期","国债收益率曲线为各种债券提供了定价的基准"],"a":0,"p":"国债没有违约风险，其收益率曲线是市场无风险利率最合适的替代，也为各类债券和投资项目提供定价基准，曲线的水平和斜率还包含对未来通胀和经济走势的预期。它反映的是远期利率而非即期利率，所以那条表述错了。","e":"像银行挂出1年、3年
