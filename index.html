<script>
(function () {
  'use strict';

  /* ================= 数据 ================= */
  var BANK = JSON.parse(document.getElementById('BANK').textContent);
  var Q = BANK.q, FW = BANK.fw, CHS = BANK.ch, SUM = BANK.sum;
  var N = Q.length;
  var byId = new Map(Q.map(function (q) { return [q.i, q]; }));
  var LETTER = ['A', 'B', 'C', 'D'];

  function chOf(id) {
    for (var k = 0; k < CHS.length; k++) if (CHS[k].id === id) return CHS[k];
    return { id: id, name: '其他', short: '其他' };
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* ================= 存储 ================= */
  var KEY = 'gongmu.v2.';
  var mem = {};
  function get(k, def) {
    if (Object.prototype.hasOwnProperty.call(mem, k)) return mem[k];
    try {
      var v = localStorage.getItem(KEY + k);
      return v ? JSON.parse(v) : def;
    } catch (e) { return def; }
  }
  function set(k, v) {
    mem[k] = v;
    try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) { /* 忽略 */ }
  }

  var ui = Object.assign(
    { tab: 'practice', ch: 0, mode: 'all', order: 'seq' },
    get('ui', {})
  );
  var prog = window.gongmuNormalize('prog', get('prog', {}));
  var wrong = window.gongmuNormalize('wrong', get('wrong', {}));
  var marks = window.gongmuNormalize('marks', get('marks', {}));
  var days = window.gongmuNormalize('days', get('days', {}));
  // 先修复已有缓存，不删除有效记录，也不把读取过程标为新答题。
  set('prog', prog); set('wrong', wrong); set('marks', marks); set('days', days);

  var saveTimer = null;
  function save(now) {
    if (saveTimer) clearTimeout(saveTimer);
    var fn = function () {
      set('ui', ui); set('prog', prog); set('wrong', wrong);
      set('marks', marks); set('days', days);
    };
    if (now) { fn(); return; }
    saveTimer = setTimeout(fn, 150);
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function dkey(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function dayLabel(d) { return (d.getMonth() + 1) + '/' + d.getDate(); }
  function when(ts) {
    if (!ts) return '';
    var d = new Date(ts), now = new Date();
    var diff = (now - d) / 86400000;
    if (dkey(d) === dkey(now)) return '今天';
    if (diff < 2) return '昨天';
    if (diff < 7) return Math.floor(diff) + ' 天前';
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  /* ================= 统计 ================= */
  function stats() {
    var seen = 0, right = 0, total = 0, i;
    for (i in prog) if (Object.prototype.hasOwnProperty.call(prog, i)) {
      seen++; total += prog[i].s || 0; right += prog[i].r || 0;
    }
    var wb = Object.keys(wrong), todo = 0, done = 0, nsum = 0;
    wb.forEach(function (i) {
      var w = wrong[i];
      if ((w.st || 0) >= 2) done++; else todo++;
      nsum += w.n || 0;
    });
    return {
      seen: seen, right: right, total: total,
      acc: total ? Math.round(right / total * 100) : 0,
      wb: wb.length, todo: todo, done: done, nsum: nsum,
      today: days[dkey()] || 0
    };
  }
  function chStats(cid) {
    var qs = Q.filter(function (q) { return q.c === cid; });
    var seen = 0, r = 0, t = 0;
    qs.forEach(function (q) {
      var p = prog[q.i];
      if (p) { seen++; t += p.s || 0; r += p.r || 0; }
    });
    return { total: qs.length, seen: seen, acc: t ? Math.round(r / t * 100) : 0 };
  }

  /* ================= 会话 ================= */
  var chosen = new Map();   // 本题库页面内：i -> 选项索引
  var sess = null;          // {ids, pos, label}
  var wbOpen = {};
  var cards = { ids: [], idx: 0, rev: false, ch: 0, shuffled: false, mode: 'card', q: '' };
  var fwSel = 1, fwQuery = '';
  var wbTab = 'todo', wbSort = 'n';

  function idsFor(ch, mode, order) {
    var a = ch ? Q.filter(function (q) { return q.c === ch; }) : Q.slice();
    if (mode === 'undone') a = a.filter(function (q) { return !prog[q.i]; });
    else if (mode === 'wrong') a = a.filter(function (q) { return wrong[q.i] && (wrong[q.i].st || 0) < 2; });
    else if (mode === 'marked') a = a.filter(function (q) { return marks[q.i]; });
    if (order === 'rand') {
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
    } else if (order === 'weak') {
      a = a.slice().sort(function (x, y) {
        return ((wrong[y.i] && wrong[y.i].n) || 0) - ((wrong[x.i] && wrong[x.i].n) || 0);
      });
    }
    return a.map(function (q) { return q.i; });
  }

  function ensureSess() {
    if (sess) return;
    if (ui.mode === 'wrong') {
      var wids = Object.keys(wrong).filter(function (i) { return byId.has(+i) && wrong[i] && typeof wrong[i] === 'object' && (wrong[i].st || 0) < 2; });
      if (ui.ch) wids = wids.filter(function (i) { return byId.get(+i).c === ui.ch; });
      wids.sort(function (a, b) { return (wrong[b].n || 0) - (wrong[a].n || 0); });
      sess = { ids: wids.map(Number), pos: 0, label: '' };
      if (wids.length) sess.label = '错题重练';
    } else {
      sess = { ids: idsFor(ui.ch, ui.mode, ui.order), pos: 0, label: '' };
    }
    // 回到上次做到的那道题
    if (ui.last && sess.ids.length) {
      var at = sess.ids.indexOf(ui.last);
      if (at >= 0) sess.pos = at;
    }
  }

  function start(opt) {
    opt = opt || {};
    var ids = opt.ids || idsFor(ui.ch, ui.mode, ui.order);
    sess = { ids: ids, pos: Math.min(opt.pos || 0, Math.max(0, ids.length - 1)), label: opt.label || '' };
    ui.tab = 'practice';
    save(); render();
    setTimeout(scrollCard, 30);
  }

  function scrollCard() {
    var el = document.querySelector('.qcard');
    if (!el) return;
    var y = el.getBoundingClientRect().top + window.pageYOffset - 74;
    if (window.pageYOffset > y || window.pageYOffset < y - 300) {
      window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
    }
  }

  /* ================= 答题 ================= */
  function answer(pick) {
    ensureSess();
    if (!sess || !sess.ids.length) return;
    var id = sess.ids[sess.pos];
    var q = byId.get(id);
    if (!q || chosen.has(id)) return;
    chosen.set(id, pick);
    var ok = pick === q.a;

    var p = prog[id] || { s: 0, r: 0, t: 0 };
    p.s++; if (ok) p.r++; p.t = Date.now(); prog[id] = p;

    var k = dkey();
    days[k] = (days[k] || 0) + 1;

    var w = wrong[id];
    if (!ok) {
      if (!w) w = wrong[id] = { n: 0, st: 0 };
      w.n++; w.st = 0; w.t = Date.now(); w.pick = pick;
      if (w.n === 1) toast('已存入错题本 · 错 1 次');
      else toast('错题本 · 这题已错 ' + w.n + ' 次');
    } else if (w) {
      w.st = (w.st || 0) + 1; w.t = Date.now();
      if (w.st >= 2) toast('连续答对 2 次，这题已掌握');
      else toast('连续答对 1 次，再对 1 次即掌握');
    }
    save();
    render();
  }

  /* ================= 视图：刷题 ================= */
  function viewPractice() {
    ensureSess();
    var h = '';
    var s = stats();

    // 工具条
    h += '<div class="toolbar card">';
    h += '<div class="line chline"><span class="lbl">范围</span><div class="chips">';
    h += chip(0, '全部 400', ui.ch === 0);
    CHS.forEach(function (c) {
      var n = Q.filter(function (q) { return q.c === c.id; }).length;
      h += chip(c.id, c.short + ' ' + n, ui.ch === c.id);
    });
    h += '</div></div><div class="line"><span class="lbl">题库</span><div class="seg">';
    [['all', '全部'], ['undone', '未做'], ['wrong', '错题'], ['marked', '收藏']].forEach(function (m) {
      h += '<button data-act="mode" data-v="' + m[0] + '" class="' + (ui.mode === m[0] ? 'on' : '') + '">' + m[1] + '</button>';
    });
    h += '</div><span class="lbl">顺序</span><div class="seg">';
    [['seq', '顺序'], ['rand', '随机'], ['weak', '薄弱优先']].forEach(function (m) {
      h += '<button data-act="order" data-v="' + m[0] + '" class="' + (ui.order === m[0] ? 'on' : '') + '">' + m[1] + '</button>';
    });
    h += '</div><span class="spacer"></span><span class="tiny muted">全库已练 ' + s.seen + ' / ' + N + ' · 正确率 ' + s.acc + '%</span>';
    h += '</div></div>';

    if (!sess.ids.length) {
      h += '<div class="card empty"><div class="big">这个范围里没有题目</div><div class="tiny">换个范围，或把「题库」切回「全部」</div></div>';
      return h;
    }

    var tot = sess.ids.length;
    var pos = sess.pos;
    var done = 0;
    sess.ids.forEach(function (i) { if (chosen.has(i)) done++; });
    h += '<div class="pbar" style="margin-bottom:6px"><i style="width:' + (done / tot * 100) + '%"></i></div>';
    h += '<div class="row tiny muted" style="margin-bottom:12px"><span>' + (sess.label || labelOf(ui)) + ' · 第 ' + (pos + 1) + ' / ' + tot + ' 题</span><span class="spacer"></span><span>本轮已答 ' + done + '</span></div>';

    var q = byId.get(sess.ids[pos]);
    var picked = chosen.has(q.i) ? chosen.get(q.i) : -1;
    var answered = picked >= 0;
    var ok = picked === q.a;
    var w = wrong[q.i];
    var ch = chOf(q.c);
    if (ui.last !== q.i) { ui.last = q.i; save(); }

    h += '<div class="qcard card">';
    h += '<div class="qmeta"><span class="qno">#' + pad(q.i) + '</span>';
    h += '<span class="badge">' + esc(ch.name) + '</span>';
    h += '<span class="badge kp">' + esc(q.k) + '</span>';
    if (w) h += '<span class="badge no">错过 ' + w.n + ' 次</span>';
    if (marks[q.i]) h += '<span class="badge warn">已收藏</span>';
    h += '</div>';

    h += '<div class="qstem">' + esc(q.q) + '</div>';
    h += '<div class="opts">';
    for (var i = 0; i < 4; i++) {
      var cls = 'opt';
      if (answered) {
        cls += ' locked';
        if (i === q.a) cls += ' correct';
        else if (i === picked) cls += ' wrong';
        else cls += ' dim';
      }
      h += '<button class="' + cls + '" data-act="pick" data-v="' + i + '">';
      h += '<span class="ltr">' + LETTER[i] + '</span>';
      h += '<span class="txt">' + esc(q.o[i]) + '</span></button>';
    }
    h += '</div>';

    if (answered) {
      h += '<div class="ana">';
      h += '<div class="verdict ' + (ok ? 'ok' : 'no') + '"><span class="dot">' + (ok ? '✓' : '✕') + '</span>';
      h += ok ? '答对了' : '答错了 · 正确答案是 ' + LETTER[q.a];
      h += '</div>';
      h += '<div class="block b-plain"><div class="h">一句话听懂</div><p>' + esc(q.p) + '</p></div>';
      h += '<div class="block b-eg"><div class="h">生活里这么想</div><p>' + esc(q.e) + '</p></div>';
      h += '<div class="block b-trap"><div class="h">记住这一句</div><p>' + esc(q.t) + '</p></div>';
      if (q.r) h += '<details class="orig"><summary>教材原文解析</summary><p>' + esc(q.r) + '</p></details>';
      h += '</div>';
    }

    h += '<div class="qfoot">';
    h += '<button class="btn sm" data-act="prev"' + (pos === 0 ? ' disabled' : '') + '>← 上一题</button>';
    h += '<button class="btn sm primary" data-act="next">' + (pos === tot - 1 ? '完成，回到第一题' : '下一题 →') + '</button>';
    if (answered) h += '<button class="btn sm ghost" data-act="relearn">跳到速记</button>';
    h += '<span class="spacer"></span>';
    h += '<button class="btn sm ghost" data-act="mark">' + (marks[q.i] ? '★ 已收藏' : '☆ 收藏') + '</button>';
    if (w) h += '<button class="btn sm ghost danger" data-act="unwrong">移出错题</button>';
    else h += '<button class="btn sm ghost" data-act="addwrong">加进错题</button>';
    h += '</div>';

    h += '<div class="tiny muted" style="margin-top:12px;display:flex;gap:14px;flex-wrap:wrap">';
    h += '<span><span class="kbd">A</span><span class="kbd">B</span><span class="kbd">C</span><span class="kbd">D</span> 选答案</span>';
    h += '<span><span class="kbd">→</span><span class="kbd">Enter</span> 下一题</span>';
    h += '<span><span class="kbd">←</span> 上一题</span>';
    h += '</div>';

    h += '</div>';
    return h;
  }

  function chip(v, text, on) {
    return '<button class="chip' + (on ? ' on' : '') + '" data-act="ch" data-v="' + v + '">' + esc(text) + '</button>';
  }
  function labelOf(u) {
    var s = u.ch ? chOf(u.ch).short : '全部题库';
    var m = { all: '', undone: '未做', wrong: '错题', marked: '收藏' }[u.mode] || '';
    return s + (m ? ' · ' + m : '');
  }

  /* ================= 视图：错题本 ================= */
  function viewWrong() {
    var s = stats();
    var ids = Object.keys(wrong).map(Number).filter(function (i) { return byId.has(i) && wrong[i] && typeof wrong[i] === 'object'; });
    if (wbTab === 'todo') ids = ids.filter(function (i) { return (wrong[i].st || 0) < 2; });
    else if (wbTab === 'done') ids = ids.filter(function (i) { return (wrong[i].st || 0) >= 2; });
    ids.sort(function (a, b) {
      if (wbSort === 'n') return (wrong[b].n || 0) - (wrong[a].n || 0);
      return (wrong[b].t || 0) - (wrong[a].t || 0);
    });

    var h = '';
    h += '<div class="stat3">';
    h += '<div class="card"><div class="k">待巩固</div><div class="v" style="color:var(--no)">' + s.todo + '</div></div>';
    h += '<div class="card"><div class="k">已掌握</div><div class="v" style="color:var(--ok)">' + s.done + '</div></div>';
    h += '<div class="card"><div class="k">累计错误次数</div><div class="v">' + s.nsum + '</div></div>';
    h += '</div>';

    if (!ids.length) {
      h += '<div class="card empty"><div class="big">' + (wbTab === 'done' ? '还没有已掌握的题' : '错题本是空的') + '</div>';
      h += '<div class="tiny">刷题时答错的题会自动进来，按错误次数自动排序</div></div>';
      return h;
    }

    h += '<div class="card wronglist">';
    h += '<div class="tabline"><div class="seg">';
    [['todo', '待巩固 ' + s.todo], ['done', '已掌握 ' + s.done], ['all', '全部 ' + s.wb]].forEach(function (t) {
      h += '<button data-act="wbtab" data-v="' + t[0] + '" class="' + (wbTab === t[0] ? 'on' : '') + '">' + t[1] + '</button>';
    });
    h += '</div><div class="seg">';
    [['n', '错误最多'], ['t', '最近错的']].forEach(function (t) {
      h += '<button data-act="wbsort" data-v="' + t[0] + '" class="' + (wbSort === t[0] ? 'on' : '') + '">' + t[1] + '</button>';
    });
    h += '</div><span class="spacer"></span>';
    h += '<button class="btn sm primary" data-act="redrill">重练待巩固</button>';
    if (s.done) h += '<button class="btn sm ghost" data-act="cleardone">清理已掌握</button>';
    h += '</div>';

    ids.forEach(function (i) {
      var q = byId.get(i), w = wrong[i];
      var mastered = (w.st || 0) >= 2;
      h += '<div class="wrow">';
      h += '<div class="body">';
      h += '<div class="meta"><span class="qno">#' + pad(i) + '</span>';
      h += '<span class="badge kp">' + esc(chOf(q.c).short) + '</span>';
      h += '<span class="badge kp">' + esc(q.k) + '</span>';
      h += '<span class="badge no">错 <span class="wcnt">' + (w.n || 1) + '</span> 次</span>';
      if (mastered) h += '<span class="badge ok">已掌握</span>';
      h += '</div>';
      h += '<div class="q">' + esc(q.q) + '</div>';
      h += '<div class="wsub">';
      if (typeof w.pick === 'number') h += '<span>上次选 <b class="x">' + LETTER[w.pick] + '</b></span>';
      h += '<span>正确答案 <b class="y">' + LETTER[q.a] + '</b></span>';
      if (w.st) h += '<span>连续答对 ' + w.st + ' 次</span>';
      h += '<span>' + when(w.t) + '</span>';
      h += '</div>';
      if (wbOpen[i]) {
        h += '<div class="ana" style="margin-top:10px">';
        h += '<div class="block b-plain"><div class="h">一句话听懂</div><p>' + esc(q.p) + '</p></div>';
        h += '<div class="block b-eg"><div class="h">生活里这么想</div><p>' + esc(q.e) + '</p></div>';
        h += '<div class="block b-trap"><div class="h">记住这一句</div><p>' + esc(q.t) + '</p></div>';
        h += '</div>';
      }
      h += '</div>';
      h += '<div class="act">';
      h += '<button class="btn sm" data-act="redo" data-v="' + i + '">重做</button>';
      h += '<button class="btn sm ghost" data-act="wopen" data-v="' + i + '">' + (wbOpen[i] ? '收起' : '看解析') + '</button>';
      h += '<button class="btn sm ghost danger" data-act="unwrong" data-v="' + i + '">移除</button>';
      h += '</div></div>';
    });
    h += '</div>';
    return h;
  }

  /* ================= 视图：速记 ================= */
  function cardIds() {
    var a = cards.ch ? Q.filter(function (q) { return q.c === cards.ch; }) : Q.slice();
    if (cards.shuffled) {
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
    }
    return a.map(function (q) { return q.i; });
  }
  function ensureCards() {
    var sig = cards.ch + '|' + cards.shuffled;
    if (cards.sig === sig && cards.ids.length) {
      if (cards.jumpTo) {
        var j = cards.ids.indexOf(cards.jumpTo);
        if (j >= 0) cards.idx = j;
        cards.jumpTo = null;
      }
      return;
    }
    cards.sig = sig;
    cards.ids = cardIds();
    cards.idx = Math.min(cards.idx, Math.max(0, cards.ids.length - 1));
    if (cards.jumpTo) {
      var k = cards.ids.indexOf(cards.jumpTo);
      if (k >= 0) cards.idx = k;
      cards.jumpTo = null;
    }
  }

  function viewCards() {
    ensureCards();
    var h = '';
    h += '<div class="toolbar card">';
    h += '<div class="line chline"><span class="lbl">范围</span><div class="chips">';
    h += '<button class="chip' + (cards.ch === 0 ? ' on' : '') + '" data-act="cch" data-v="0">全部 400</button>';
    CHS.forEach(function (c) {
      h += '<button class="chip' + (cards.ch === c.id ? ' on' : '') + '" data-act="cch" data-v="' + c.id + '">' + esc(c.short) + '</button>';
    });
    h += '</div></div><div class="line"><span class="lbl">模式</span><div class="seg">';
    [['card', '卡片速记'], ['list', '清单速记']].forEach(function (m) {
      h += '<button data-act="cmode" data-v="' + m[0] + '" class="' + (cards.mode === m[0] ? 'on' : '') + '">' + m[1] + '</button>';
    });
    h += '</div><button class="chip' + (cards.shuffled ? ' on' : '') + '" data-act="shuffle">乱序</button>';
    h += '<span class="spacer"></span><span class="tiny muted">共 ' + cards.ids.length + ' 题</span>';
    h += '</div></div>';

    if (cards.mode === 'list') {
      h += '<div class="search" style="margin-bottom:12px"><span class="muted">🔍</span><input id="cardSearch" placeholder="搜索题干、考点或答案关键词…" value="' + esc(cards.q) + '"></div>';
      var qq = cards.q.trim();
      var list = cards.ids;
      if (qq) {
        list = list.filter(function (i) {
          var q = byId.get(i);
          var hay = q.q + q.k + q.o[q.a] + q.o[0] + q.o[1] + q.o[2] + q.o[3];
          return hay.indexOf(qq) >= 0;
        });
      }
      if (!list.length) return h + '<div class="card empty"><div class="big">没有匹配的题目</div></div>';
      h += '<div class="card slist">';
      list.forEach(function (i) {
        var q = byId.get(i);
        h += '<div class="srow" data-act="sopen" data-v="' + i + '">';
        h += '<div class="top"><span class="idx">' + pad(i) + '</span>';
        h += '<span class="q">' + esc(q.q) + '</span>';
        h += '<span class="a"><b>' + LETTER[q.a] + '</b>' + esc(q.o[q.a].slice(0, 22)) + (q.o[q.a].length > 22 ? '…' : '') + '</span></div>';
        h += '<div class="detail"><div class="l" style="margin-top:0">考点 · ' + esc(chOf(q.c).short) + ' / ' + esc(q.k) + '</div>';
        h += '<div style="margin-top:6px">' + esc(q.p) + '</div>';
        h += '<div class="l"><b>记住：</b>' + esc(q.t) + '</div></div>';
        h += '</div>';
      });
      h += '</div>';
      return h;
    }

    // 卡片模式
    if (!cards.ids.length) return h + '<div class="card empty"><div class="big">这个范围没有题</div></div>';
    var q = byId.get(cards.ids[cards.idx]);
    h += '<div class="card fcard" data-act="flip">';
    h += '<div class="qmeta" style="justify-content:center;margin-bottom:16px"><span class="qno">#' + pad(q.i) + '</span>';
    h += '<span class="badge kp">' + esc(chOf(q.c).short) + '</span>';
    h += '<span class="badge">' + esc(q.k) + '</span></div>';
    h += '<div class="stem">' + esc(q.q) + '</div>';
    if (cards.rev) {
      h += '<div class="rev">';
      h += '<div class="fans"><div class="big"><span class="ltr">' + LETTER[q.a] + '</span>' + esc(q.o[q.a]) + '</div></div>';
      h += '<div class="block b-trap" style="margin-top:20px;text-align:left"><div class="h">记住这一句</div><p>' + esc(q.t) + '</p></div>';
      h += '<div class="block b-plain" style="margin-top:10px;text-align:left"><div class="h">为什么</div><p>' + esc(q.p) + '</p></div>';
      h += '</div>';
    } else {
      h += '<div class="hint">先在心里想答案，再点这里 —— 或按空格</div>';
    }
    h += '</div>';

    h += '<div class="card fnav">';
    h += '<button class="btn sm" data-act="cprev"' + (cards.idx === 0 ? ' disabled' : '') + '>←</button>';
    h += '<span class="tiny muted">' + (cards.idx + 1) + ' / ' + cards.ids.length + '</span>';
    h += '<span class="row" style="gap:8px">';
    h += '<button class="btn sm ghost" data-act="creveal">' + (cards.rev ? '收起答案' : '显示答案') + '</button>';
    h += '<button class="btn sm primary" data-act="cnext">下一个 →</button>';
    h += '</span>';
    h += '</div>';
    return h;
  }

  /* ================= 视图：知识框架 ================= */
  function viewFrame() {
    var h = '<div class="flayout">';
    h += '<aside class="card fside">';
    FW.forEach(function (f) {
      h += '<a href="javascript:void(0)" data-act="fwsel" data-v="' + f.id + '" class="' + (fwSel === f.id ? 'on' : '') + '"><span class="i">' + f.id + '</span>' + esc(f.name) + '</a>';
    });
    h += '<div class="sep"></div>';
    h += '<a href="javascript:void(0)" data-act="fwsel" data-v="sum" class="' + (fwSel === 'sum' ? 'on' : '') + '"><span class="i">★</span>必背清单</a>';
    h += '</aside><div class="fmain">';

    if (fwSel === 'sum') {
      h += summaryView();
    } else {
      var f = FW.filter(function (x) { return x.id === fwSel; })[0] || FW[0];
      h += '<div class="search" style="margin-bottom:12px"><span class="muted">🔍</span><input id="fwSearch" placeholder="在框架里搜考点，如 久期 / 15个工作日…" value="' + esc(fwQuery) + '"></div>';
      h += '<div class="card fhero"><h2>' + f.id + '. ' + esc(f.name) + '</h2>';
      h += '<div class="why">' + esc(f.why) + '</div>';
      h += '<div class="logic">逻辑主线：' + esc(f.logic) + '</div></div>';

      var qq = fwQuery.trim().toLowerCase();
      var hit = 0;
      f.sections.forEach(function (sec, si) {
        var pts = sec.points.filter(function (p) {
          return !qq || (p.k + p.v).toLowerCase().indexOf(qq) >= 0;
        });
        if (!pts.length) return;
        hit += pts.length;
        h += '<div class="card fsec"><h3><span class="idx">' + (si + 1) + '</span>' + esc(sec.t) + '</h3>';
        pts.forEach(function (p) {
          var m = qq && (p.k + p.v).toLowerCase().indexOf(qq) >= 0;
          h += '<div class="pt' + (m ? ' hit' : '') + '"><div class="k">' + esc(p.k) + (p.key ? '<span class="star">★</span>' : '') + '</div><div class="v">' + esc(p.v) + '</div></div>';
        });
        h += '</div>';
      });
      if (qq && !hit) h += '<div class="card empty"><div class="big">没有匹配的考点</div><div class="tiny">试试更短的关键词</div></div>';

      if (f.formulas && f.formulas.length) {
        h += '<div class="card fsec"><h3><span class="idx">ƒ</span>公式速查</h3><div class="ftable">';
        f.formulas.forEach(function (x) {
          h += '<div class="fr"><div class="n">' + esc(x.n) + '</div><div class="f">' + esc(x.f) + '</div><div class="u">' + esc(x.u) + '</div></div>';
        });
        h += '</div></div>';
      }
      if (f.must && f.must.length) {
        h += '<div class="card fsec"><h3><span class="idx">!</span>必背数字与结论</h3><div class="list">';
        f.must.forEach(function (x) { h += '<div class="li must"><span class="m">●</span><span>' + esc(x) + '</span></div>'; });
        h += '</div></div>';
      }
      if (f.traps && f.traps.length) {
        h += '<div class="card fsec"><h3><span class="idx">✕</span>易错陷阱</h3><div class="list">';
        f.traps.forEach(function (x) { h += '<div class="li trap"><span class="m">✕</span><span>' + esc(x) + '</span></div>'; });
        h += '</div></div>';
      }
      if (f.mnemonic && f.mnemonic.length) {
        h += '<div class="card fsec"><div class="mnembox"><div class="t">记忆口诀</div>';
        f.mnemonic.forEach(function (x) { h += '<div class="li mnem"><span class="m">✦</span><span>' + esc(x) + '</span></div>'; });
        h += '</div></div>';
      }
    }
    h += '</div></div>';
    return h;
  }

  function summaryView() {
    var h = '<div class="search" style="margin-bottom:12px"><span class="muted">🔍</span><input id="fwSearch" placeholder="搜数字、期限、比例，如 15 / 90日 / 200人…" value="' + esc(fwQuery) + '"></div>';
    var qq = fwQuery.trim().toLowerCase();
    var nums = SUM.numbers.filter(function (x) {
      return !qq || (x.item + x.val + (x.note || '')).toLowerCase().indexOf(qq) >= 0;
    });
    h += '<div class="card fhero"><h2>必背清单</h2><div class="why">把 400 道题里所有能直接考的数字、期限、比例抽出来集中背。闭卷小测里这类题最好拿分，考前 30 分钟看这一张表最划算。</div></div>';

    h += '<div class="card fsec"><h3><span class="idx">#</span>数字·期限·比例（' + nums.length + ' 条）</h3>';
    h += '<div style="max-height:68vh;overflow:auto"><table class="numtable"><thead><tr><th style="width:38%">考点</th><th>答案</th><th style="width:22%">备注</th></tr></thead><tbody>';
    nums.forEach(function (x) {
      h += '<tr><td>' + esc(x.item) + ' <span class="badge kp" style="font-size:10.5px">' + esc(chOf(x.ch).short) + '</span></td>';
      h += '<td class="v">' + esc(x.val) + '</td>';
      h += '<td class="n">' + esc(x.note || '') + '</td></tr>';
    });
    h += '</tbody></table></div></div>';

    var confs = SUM.confusions.filter(function (x) {
      return !qq || (x.a + x.b + x.diff).toLowerCase().indexOf(qq) >= 0;
    });
    if (confs.length) {
      h += '<div class="card wronglist"><div class="tabline"><b style="font-size:14px">最容易混的几组概念</b><span class="tiny muted">' + confs.length + ' 组</span></div>';
      confs.forEach(function (x) {
        h += '<div class="conf"><div class="ab">' + esc(x.a) + '<span class="vs">VS</span>' + esc(x.b) + '</div><div class="d">' + esc(x.diff) + '</div></div>';
      });
      h += '</div>';
    }
    return h;
  }

  /* ================= 视图：进度 ================= */
  function viewStats() {
    var s = stats();
    var h = '<div class="kpis">';
    h += '<div class="card kpi"><div class="k">已练题目</div><div class="v">' + s.seen + '<small> / ' + N + '</small></div></div>';
    h += '<div class="card kpi"><div class="k">累计正确率</div><div class="v">' + s.acc + '<small>%</small></div></div>';
    h += '<div class="card kpi"><div class="k">待巩固错题</div><div class="v" style="color:var(--no)">' + s.todo + '</div></div>';
    h += '<div class="card kpi"><div class="k">今日已练</div><div class="v">' + s.today + '<small> 题</small></div></div>';
    h += '</div>';

    h += '<div class="card fsec" style="margin-bottom:12px"><h3><span class="idx">7</span>最近 7 天</h3><div class="heat">';
    var max = 1, arr = [];
    for (var i = 6; i >= 0; i--) {
      var d = new Date(); d.setDate(d.getDate() - i);
      var c = days[dkey(d)] || 0;
      if (c > max) max = c;
      arr.push({ d: d, c: c });
    }
    arr.forEach(function (x) {
      var px = x.c ? Math.max(6, Math.round(x.c / max * 44)) : 4;
      h += '<div class="d' + (x.c ? ' has' : '') + '"><b>' + (x.c || '') + '</b><i style="height:' + px + 'px"></i><span>' + dayLabel(x.d) + '</span></div>';
    });
    h += '</div></div>';

    h += '<div class="card fsec"><h3><span class="idx">章</span>各章掌握度 <span class="tiny muted" style="font-weight:400">点一行直接开练，右侧为正确率</span></h3>';
    CHS.forEach(function (c) {
      var st = chStats(c.id);
      var pct = st.total ? Math.round(st.seen / st.total * 100) : 0;
      h += '<div class="chrow" data-act="chgo" data-v="' + c.id + '" style="cursor:pointer">';
      h += '<div class="nm">' + esc(c.short) + '<small>' + st.seen + '/' + st.total + '</small></div>';
      h += '<div class="bar"><i style="width:' + pct + '%"></i></div>';
      h += '<div class="pct">' + (st.seen ? '<b>' + st.acc + '%</b> 正确' : '<b class="none">未练</b>') + '</div>';
      h += '</div>';
    });
    h += '</div>';

    h += '<div class="card fsec" style="margin-top:12px"><h3><span class="idx">!</span>数据</h3>';
    h += '<div class="row" style="gap:10px;flex-wrap:wrap"><span class="tiny muted" style="flex:1">记录保存在本机并自动同步云端。切换设备前请确认右下角显示“已同步”。</span>';
    h += '<button class="btn sm ghost danger" data-act="reset">清空全部记录</button></div></div>';

    h += '<div class="foot">公募基金理论与实践题库　|　' + N + ' 题 · 11 个知识模块　<br>数据来源：比赛用题.xlsx　·　解析与框架为学习辅助，考试以教材为准</div>';
    return h;
  }

  /* ================= 渲染 ================= */
  function render() {
    var tabsEl = document.getElementById('tabs');
    Array.prototype.forEach.call(tabsEl.querySelectorAll('button[data-tab]'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-tab') === ui.tab);
    });
    var s = stats();
    var badge = document.getElementById('bWrong');
    badge.textContent = s.todo;
    badge.classList.toggle('zero', s.todo === 0);

    var app = document.getElementById('app');
    if (ui.tab === 'practice') app.innerHTML = viewPractice();
    else if (ui.tab === 'wrong') app.innerHTML = viewWrong();
    else if (ui.tab === 'cards') app.innerHTML = viewCards();
    else if (ui.tab === 'frame') app.innerHTML = viewFrame();
    else app.innerHTML = viewStats();
  }

  /* ================= 交互 ================= */
  function toast(msg) {
    var box = document.getElementById('toast');
    var el = document.createElement('div');
    el.className = 'tmsg';
    el.textContent = msg;
    box.appendChild(el);
    setTimeout(function () {
      el.style.opacity = '0';
      el.style.transition = 'opacity .3s';
      setTimeout(function () { el.remove(); }, 320);
    }, 1900);
  }

  function goTab(t) {
    ui.tab = t;
    save();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.getElementById('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]');
    if (!b) return;
    goTab(b.getAttribute('data-tab'));
  });

  document.getElementById('app').addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act');
    var v = t.getAttribute('data-v');

    if (act === 'ch') { ui.ch = +v; sess = null; save(); render(); return; }
    if (act === 'mode') { ui.mode = v; sess = null; save(); render(); return; }
    if (act === 'order') { ui.order = v; sess = null; save(); render(); return; }
    if (act === 'chgo') { ui.ch = +v; ui.mode = 'all'; sess = null; save(); goTab('practice'); return; }

    if (act === 'pick') { answer(+v); return; }
    if (act === 'prev') { if (sess.pos > 0) { sess.pos--; render(); setTimeout(scrollCard, 20); } return; }
    if (act === 'next') {
      if (sess.pos < sess.ids.length - 1) { sess.pos++; render(); setTimeout(scrollCard, 20); }
      else { sess.pos = 0; render(); toast('一轮刷完，回到第一题'); setTimeout(scrollCard, 20); }
      return;
    }
    if (act === 'mark') {
      var id0 = sess.ids[sess.pos];
      if (marks[id0]) { delete marks[id0]; toast('已取消收藏'); }
      else { marks[id0] = 1; toast('已收藏，可在「收藏」题库里集中看'); }
      save(); render(); return;
    }
    if (act === 'addwrong') {
      var id1 = sess.ids[sess.pos];
      if (!wrong[id1]) wrong[id1] = { n: 1, st: 0, t: Date.now(), pick: chosen.get(id1) };
      save(); render(); toast('已加入错题本'); return;
    }
    if (act === 'unwrong') { removeWrong(v ? +v : sess.ids[sess.pos]); return; }
    if (act === 'relearn') {
      cards.ch = 0; cards.idx = 0; cards.sig = ''; cards.rev = true; cards.shuffled = false;
      cards.jumpTo = sess.ids[sess.pos];
      goTab('cards');
      return;
    }

    if (act === 'wbtab') { wbTab = v; render(); return; }
    if (act === 'wbsort') { wbSort = v; render(); return; }
    if (act === 'wopen') { var k = +v; if (wbOpen[k]) delete wbOpen[k]; else wbOpen[k] = 1; render(); return; }
    if (act === 'redo') { start({ ids: [+v], label: '错题重做' }); return; }
    if (act === 'redrill') {
      var s2 = stats();
      if (!s2.todo) { toast('没有待巩固的错题'); return; }
      var rid = idsFor(ui.ch, 'wrong', 'weak');
      if (!rid.length) rid = idsFor(0, 'wrong', 'weak');
      start({ ids: rid, label: '错题重练', pos: 0 });
      return;
    }
    if (act === 'cleardone') {
      if (!confirm('把「已掌握」的错题从错题本里清掉？错误次数记录也会一起删除。')) return;
      Object.keys(wrong).forEach(function (i) { if ((wrong[i].st || 0) >= 2) delete wrong[i]; });
      save(); render(); toast('已清理'); return;
    }

    if (act === 'cch') { cards.ch = +v; cards.idx = 0; cards.rev = false; render(); return; }
    if (act === 'cmode') { cards.mode = v; render(); return; }
    if (act === 'shuffle') { cards.shuffled = !cards.shuffled; cards.idx = 0; cards.rev = false; cards.sig = ''; render(); return; }
    if (act === 'flip') { cards.rev = !cards.rev; render(); return; }
    if (act === 'creveal') { cards.rev = !cards.rev; render(); return; }
    if (act === 'cnext') { cards.idx = (cards.idx + 1) % cards.ids.length; cards.rev = false; render(); return; }
    if (act === 'cprev') { if (cards.idx > 0) { cards.idx--; cards.rev = false; render(); } return; }
    if (act === 'sopen') { t.classList.toggle('open'); return; }

    if (act === 'fwsel') {
      fwSel = v === 'sum' ? 'sum' : +v;
      fwQuery = '';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    if (act === 'reset') {
      if (!confirm('清空全部练习记录、错题本和收藏？这个操作不可撤销。')) return;
      prog = {}; wrong = {}; marks = {}; days = {}; chosen.clear(); sess = null;
      save(true); render(); toast('已清空'); return;
    }
  });

  function removeWrong(i) {
    if (!wrong[i]) return;
    delete wrong[i];
    save(); render();
    toast('已移出错题本');
  }

  document.getElementById('app').addEventListener('input', function (e) {
    var el = e.target;
    if (el.id === 'fwSearch') {
      fwQuery = el.value;
      var pos = el.selectionStart;
      render();
      var n = document.getElementById('fwSearch');
      if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (err) {} }
    } else if (el.id === 'cardSearch') {
      cards.q = el.value;
      var pos2 = el.selectionStart;
      render();
      var n2 = document.getElementById('cardSearch');
      if (n2) { n2.focus(); try { n2.setSelectionRange(pos2, pos2); } catch (err) {} }
    }
  });

  document.addEventListener('keydown', function (e) {
    var tag = (document.activeElement && document.activeElement.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    var k = e.key.toLowerCase();

    if (ui.tab === 'practice' && sess) {
      if (k === 'a' || k === 'b' || k === 'c' || k === 'd') { e.preventDefault(); answer('abcd'.indexOf(k)); return; }
      if (k === '1' || k === '2' || k === '3' || k === '4') { e.preventDefault(); answer(+k - 1); return; }
      if (k === 'enter' || k === 'arrowright') {
        e.preventDefault();
        if (sess.pos < sess.ids.length - 1) { sess.pos++; render(); setTimeout(scrollCard, 20); }
        else { sess.pos = 0; render(); toast('一轮刷完，回到第一题'); }
        return;
      }
      if (k === 'arrowleft') { if (sess.pos > 0) { e.preventDefault(); sess.pos--; render(); setTimeout(scrollCard, 20); } return; }
    }
    if (ui.tab === 'cards' && cards.mode === 'card' && cards.ids.length) {
      if (k === ' ' || k === 'enter') { e.preventDefault(); cards.rev = !cards.rev; render(); return; }
      if (k === 'arrowright') { e.preventDefault(); cards.idx = (cards.idx + 1) % cards.ids.length; cards.rev = false; render(); return; }
      if (k === 'arrowleft') { e.preventDefault(); if (cards.idx > 0) { cards.idx--; cards.rev = false; render(); } return; }
    }
  });

  // 同步直接更新当前页面，避免刷新循环及旧的内存状态覆盖刚下载的记录。
  window.GongmuApp = {
    snapshot: function () { return {prog:prog, wrong:wrong, marks:marks, days:days}; },
    apply: function (data) {
      prog = window.gongmuNormalize('prog', data.prog);
      wrong = window.gongmuNormalize('wrong', data.wrong);
      marks = window.gongmuNormalize('marks', data.marks);
      days = window.gongmuNormalize('days', data.days);
      chosen.clear(); sess = null;
      save(true);
      render();
    }
  };

  /* ================= 启动 ================= */
  if (ui.tab === 'practice') ensureSess();
  render();
  window.addEventListener('beforeunload', function () { save(true); });
})();

</script>

<style>
#syncStatus{position:fixed;right:15px;bottom:12px;z-index:250;background:#fff;color:#14795c;border:1px solid #e5e9ee;border-radius:12px;padding:8px 11px;box-shadow:0 2px 10px rgba(0,0,0,.07);font-size:12px;max-width:260px;cursor:pointer}
#syncStatus.warn{color:#9b4a13;border-color:#f1d9b9}
@media(max-width:640px){#syncStatus{right:10px;bottom:10px;max-width:180px;font-size:11px}}
</style>
<div id="syncStatus" role="status" aria-live="polite" title="点击重新连接" hidden>☁ 云端准备连接</div>
<script>
(function () {
  'use strict';
  // 与原始刷题脚本完全独立；同步故障不能阻止题库显示。
  var URL = 'https://gongmu-eb7a7-default-rtdb.asia-southeast1.firebasedatabase.app/shared-progress.json';
  var KEY = 'gongmu.v2.';
  var FIELDS = ['prog', 'wrong', 'marks', 'days'];
  var status = document.getElementById('syncStatus');
  var app = document.getElementById('app');
  if (!app || !app.children.length || document.getElementById('appLoadError')) return;  // 原始页面没有加载成功，不进行同步。
  status.hidden = false;
  var ready = false, busy = false, pending = false, retryTimer = null, putTimer = null;
  var synced = null, lastSeen = null;
  function show(label, warn) { status.textContent = 'v4 · ' + label; status.classList.toggle('warn', !!warn); }
  function get(k) { try { return localStorage.getItem(KEY+k); } catch (e) { return null; } }
  function put(k, v) { try { localStorage.setItem(KEY+k, v); return true; } catch (e) { return false; } }
  function remove(k) { try { localStorage.removeItem(KEY+k); } catch (e) {} }
  function snapshot() {
    return normalized(window.GongmuApp.snapshot());
  }
  function normalized(v) {
    var out = {};
    FIELDS.forEach(function (k) { out[k] = window.gongmuNormalize(k, v && v[k]); });
    return out;
  }
  function sig(data) { return JSON.stringify(data); }
  function any(data) { return FIELDS.some(function (k) { return Object.keys(data[k]).length > 0; }); }
  function dirtyMark() { pending = true; put('cloudPending', '1'); }
  function clearPending() { pending = false; remove('cloudPending'); }
  function http(method, body) {
    var c = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = c ? setTimeout(function () { c.abort(); }, 7500) : null;
    return fetch(URL, {
      method: method,
      headers: method === 'PUT' ? {'Content-Type':'application/json'} : undefined,
      body: body,
      signal: c ? c.signal : undefined,
      cache: 'no-store'
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    }).finally(function () { if (timer) clearTimeout(timer); });
  }
  function retrySoon() {
    clearTimeout(retryTimer);
    retryTimer = setTimeout(function () { if (pending) upload(); else readRemote(false); }, 13000);
  }
  function applyRemote(data) {
    var local = snapshot();
    var incoming = normalized(data);
    if (sig(local) === sig(incoming)) return;
    // 备份现有本地记录以防云端覆盖，永远不直接清空用户的进度。
    if (any(local)) put('previousLocalBackup', JSON.stringify(local));
    window.GongmuApp.apply(incoming);
    synced = sig(incoming);
    lastSeen = synced;
    clearPending();
    show('☁ 已同步');
  }
  async function upload() {
    if (!ready || busy || !pending) return;
    busy = true;
    var value = snapshot(), stamp = sig(value);
    show('☁ 正在上传记录…');
    try {
      await http('PUT', JSON.stringify(Object.assign({updatedAt:Date.now()},value)));
      synced = stamp;
      if (sig(snapshot()) === stamp) { clearPending(); show('☁ 已同步'); }
      else { dirtyMark(); setTimeout(upload, 600); }
    } catch (e) {
      show('☁ 上传失败，记录保留本机', true);
      retrySoon();
    } finally { busy = false; }
  }
  function scheduleUpload() {
    if (!ready || !pending) return;
    clearTimeout(putTimer);
    putTimer = setTimeout(upload, 650);
  }
  async function readRemote(first) {
    if (busy) return;
    busy = true;
    if (first) show('☁ 正在连接云端…');
    var before = sig(snapshot());
    if (ready && synced !== before) dirtyMark();
    try {
      var remoteRaw = await http('GET');
      var remote = normalized(remoteRaw);
      var current = snapshot(), currentSig = sig(current), remoteSig = sig(remote);
      ready = true;
      if (pending && !any(current) && any(remote)) {
        clearPending();
        applyRemote(remote);
        return;
      }
      if (pending || before !== currentSig) {
        dirtyMark(); // 如果请求期间做了题，不允许覆盖本机进度。
        show('☁ 待上传本机记录');
      } else if (first && !remoteRaw && any(current)) {
        dirtyMark(); // 云端尚无数据：上传已存在的本机答题进度。
      } else if (remoteSig !== currentSig) {
        applyRemote(remote);
        return;
      } else {
        synced = currentSig;
        show('☁ 已同步');
      }
      if (!pending) synced = currentSig;
    } catch (e) {
      show('☁ 云端不可用，本机仍可刷题', true);
      retrySoon();
    } finally {
      busy = false;
      if (ready && pending) scheduleUpload();
    }
  }
  // 本地存储被禁用时，原有题库仍能运行，但无法保证跨设备同步。
  if (!put('cloudProbe', '1')) { show('☁ 浏览器禁止存储，仅能临时刷题', true); return; }
  remove('cloudProbe');
  lastSeen = sig(snapshot());
  pending = get('cloudPending') === '1';
  status.addEventListener('click', function () { if (pending && ready) upload(); else readRemote(!ready); });
  readRemote(true);
  setInterval(function () {
    var now = sig(snapshot());
    if (now !== lastSeen) {
      lastSeen = now;
      if (synced !== now) { dirtyMark(); scheduleUpload(); }
    }
  }, 600);
  setInterval(function () {
    if (!document.hidden && !pending && ready) readRemote(false);
    else if (!ready && !busy && !document.hidden) readRemote(true);
  }, 12000);
  window.addEventListener('focus', function () { if (ready && !pending) readRemote(false); });
})();
</script>
</body>
