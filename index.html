也是有限的。"},{"i":394,"c":9,"k":"风险调整收益局限","q":"风险调整后收益指标的局限性包括（）。Ⅰ. 理论上的无风险收益率与实际应用中的国债收益率可能不同Ⅱ. 证券波动性会加大统计误差，从而影响对超额收益α的测度Ⅲ. β系数是固定不变的IV. 缺少完全具有代表性的市场指数","o":["Ⅱ、Ⅲ、IV","I、Ⅱ、Ⅲ","I、Ⅱ、Ⅲ、IV","I、Ⅱ、IV"],"a":3,"p":"用CAPM做风险调整有三处局限：理论无风险利率与实际国债收益率对不上，找不到公认的市场基准指数，证券波动会放大统计误差、干扰α的测度，所以Ⅰ、Ⅱ、Ⅳ成立。Ⅲ说β固定不变是错的，β会随杠杆和业务变化。","e":"像用体重秤评判减肥：秤的零点偏了、没有公认的标准秤、每次站姿不同读数会飘，这三条才算局限；说体重不会变就是错话。","t":"β会变不是局限，无风险利率、指数、误差才是","r":"在应用CAPM进行事后风险调整时，应注意：(1)理论上的无风险收益率(证券市场线中使用的无风险收益率)与实际应用中的国债收益率往往不同。(2)没有被普遍接受或使用的完全具有代表性的市场指数。(3)证券的波动性会使统计误差变得很大，并对超额收益α的测度造成实质影响。(4)β系数并不是固定不变的。"},{"i":395,"c":1,"k":"境外托管人条件","q":"接受境内托管人委托，负责境外资产托管业务的境外托管人，必须符合最近（）年未受到监管机构的重大处罚，没有重大事项正在接受司法部门、监管机构的立案调查的要求。","o":["3","1","5","10"],"a":0,"p":"境内托管人把境外资产托管业务委托出去时，境外托管人必须最近3年没有受到监管机构重大处罚，也没有重大事项正被立案调查。干扰项1年太松、5年和10年过严，记住3年干净这条硬门槛。","e":"像校外租房找中介，学校要求这家机构近3年内没被住建部门处罚过、也没有正在被查的纠纷，才允许带学生去看房签约。","t":"境外托管人门槛：最近3年无重大处罚","r":"接受境内托管人委托，负责境外资产托管业务的境外托管人，必须符合最近3年没有受到监管机构的重大处罚，没有重大事项正在接受司法部门、监管机构的立案调查的要求。"},{"i":396,"c":8,"k":"国债期货对冲","q":"债券基金使用国债期货对冲的主要是什么风险？","o":["再投资风险","信用风险","流动性风险","利率风险"],"a":3,"p":"国债期货价格与利率反向走，利率上升时现券下跌、期货空头盈利，两边抵掉的就是利率风险；信用风险靠信用分析和分散化，流动性风险靠控制仓位和券种。干扰项把对冲的对象换成了别类风险。","e":"像奶茶店怕下个月糖价上涨，先在期货上把价格锁住，糖真涨了，现货多花的钱由期货那边赚回来，锁的就是价格波动。","t":"国债期货对冲利率风险，不抵信用风险","r":""},{"i":397,"c":1,"k":"基金监管范围","q":"关于基金的监管，下列哪项描述是正确的？","o":["基金的监管机构不应受到政府部门的制约","基金的监管机构只关注基金的投资运作情况","基金的监管机构负责对基金的合规运作进行全面监管","基金的监管机构不需要对基金的销售进行监管"],"a":2,"p":"监管覆盖募集、投资、销售、信息披露和日常运作全链条，目的是保护投资者，且监管机构本身依法设立、受法律和政府约束。干扰项说只管投资运作或不管销售，把监管范围切窄了，都不成立。","e":"像学校查食堂，从采购、加工到售卖窗口和明码标价都要管，不能只看菜好不好吃，也不能说卖饭就不归学校管。","t":"监管全链条：募、投、销、披、运一个都不落","r":"基金的监管机构负责对基金的投资、销售、运作等多个方面进行全面监管，以确保基金的合法合规运作和投资者的利益保障。因此，C选项描述是正确的。"},{"i":398,"c":11,"k":"证券交收层次","q":"以下属于证券交收内容的是（）。","o":["中国结算公司沪、深分公司与客户之间伪证券交收","中国结算公司沪、深分公司与结算参与人的证券交收","结算参与人、客户、证券公司的证券交收","结算公司与客户之间的证券交收"],"a":1,"p":"证券交收分两层：先是中国结算沪、深分公司与结算参与人之间完成券款划转，再由结算参与人跟自己的客户交收。干扰项让客户直接跟结算公司配对，跳过了中间的结算参与人这一层，层次就乱了。","e":"像寄快递，总部先把整批包裹交给片区网点，网点再派件送到你手上；你不可能绕过网点直接去总仓取件签字。","t":"交收两层：结算公司对参与人，参与人对客户","r":"证券交收包含两个层面的含义：一是中国结算公司沪、深分公司与结算参与人的证券交收。二是结算参与人与客户之间的证券交收。"},{"i":399,"c":2,"k":"督察长职责","q":"督察长的合规应重点关注事项不包括（）","o":["基金及公司的信息披露是否真实、准确、完整、及时是否存在虚假记载、误导性陈述或重大遗漏的等问题。","基金销售是否遵守法律法规、基金合同和招募说明书的规定，是否存在误导、欺诈投资人和不正当竞争的违法行为。","公司发展策略是否符合市场需求及销售策略是否可行","公司资产是否完整，是否出现被抽逃、挪用、违规担保、冻结等情况"],"a":2,"p":"督察长盯的是合规底线：信息披露是否真实准确完整及时、销售有无误导欺诈和不当竞争、公司资产有无被抽逃挪用或违规担保，全是合法合规问题。干扰项讲经营战略和市场可行性，属管理层决策，不是合规审查对象。","e":"像学校教务督导只查老师有没有按大纲上课、有没有乱收费，至于该不该新开一门选修课，那是校长和院系的事。","t":"督察长管合规底线，不管经营战略好坏","r":"C选项不存在"},{"i":400,"c":3,"k":"机构投资者特征","q":"关于基金的机构投资者，下列说法错误的是（）。","o":["社会保障基金中包含养老保险资金，投资期较长，通常投资于风险较高的资产","财险公司收取的保费投资期限较短，通常投资于低风险资产","企业年金基金可投资于货币市场工具、债券、股票等都有严格投資比例限制的资产","寿险公司收取的保费投资期限较长，通常可以投资于风险较高的资产"],"a":0,"p":"社保基金带有公益性质，运作原则是在保证安全性和流动性的前提下再谈增值，不允许为高收益去冒大险。干扰项把投资期长就能买高风险资产这套逻辑套到社保上，忽略了它受严格制度约束这一前提。","e":"像小区的公共维修基金，这笔钱要随时能拿出来修电梯，只能买最稳的存款和国债，绝不能拿去炒股票赌一把。","t":"社保求安全流动，不因期限长就冒高风险","r":"由于社会保障资金的公益性质，其投资运作受到严格的制度约束，其基本原则为：在保证基金安全性、流动性的前提下实现基金资产的增值。因此，社会保障基金不适合投资于风险较高的資产。"}],"fw":[{"id":1,"name":"基金法规与监管","why":"整门课的规则底座：先定基金的法律身份与监管边界，再讲募集、上市、披露等操作规则，最后落到QFII与QDII开放，后续章节都在此框架内展开。","logic":"法律身份定性质 → 募集成立拿牌照 → 上市运作受约束 → 信息披露给判断 → 对外开放扩边界","sections":[{"t":"基金本质与类型","points":[{"k":"集合理财","v":"基金投资优点为集合理财、专业管理、分散风险、费用低廉，风险较高不属于优点","key":true},{"k":"股票型基金","v":"股票型基金股票资产不低于80%，股票基金目标是追求资本增值，风险最高","key":true},{"k":"基金风险等级","v":"风险等级由高到低为股票型、混合型、债券型、货币市场；偏股型风险收益特征为双高","key":false},{"k":"信托型基金主体","v":"信托型基金主体只有持有人、管理人、托管人，有限合伙人不属于；信息不对称易生道德风险","key":false},{"k":"份额持有人权利","v":"持有人享有收益分配权、剩余财产分配权和表决权，不享有基金资产的管理权","key":false},{"k":"多币种份额","v":"QDII设人民币份额与美元份额，受汇率影响两类份额净值涨跌幅度不同","key":true}]},{"t":"治理与监管框架","points":[{"k":"公司核心业务","v":"基金管理公司最核心的业务是投资管理业务，销售、登记等属于辅助业务","key":false},{"k":"基金监管范围","v":"监管机构对募集、运作、披露、销售全面监管；投资者权益保护以知情权和选择权为核心","key":true},{"k":"资管新规","v":"资管新规指《关于规范金融机构资产管理业务的指导意见》，2018年发布实施","key":false},{"k":"注册登记模式","v":"自建登记系统为内置模式，委托中国结算为外置模式；QDII份额登记时效为T+2","key":false},{"k":"境外投资法规","v":"境内股权基金投资境外企业遵循《中外合资经营法》《境外投资项目核准和备案管理办法》","key":false},{"k":"公募不得做空","v":"国内公募权益基金只能做多，做空策略不属于公募基金的可选投资策略","key":false}]},{"t":"募集与成立","points":[{"k":"募集流程","v":"基金募集分四步：申请、注册、发售、基金合同生效，顺序不可颠倒","key":false},{"k":"募集期限","v":"收到核准文件之日起6个月内发售；募集期限自份额发售之日起不超过3个月","key":true},{"k":"募集验资备案","v":"募集期限届满10日内验资，收到验资报告10日内向证监会报送备案材料","key":false},{"k":"募集失败退款","v":"募集失败须在期限届满后30日内退还已交款项，并加计银行同期存款利息","key":false},{"k":"认购与申购","v":"募集期内买入份额叫认购，基金成立开放后买入叫申购，两者费率不同","key":true},{"k":"金额认购","v":"开放式基金认购采取金额认购，按金额申报，赎回时按份额确认与计算","key":false}]},{"t":"上市与终止","points":[{"k":"上市交易条件","v":"上市需募集金额不低于2亿元；按上市持有人数要求，持有人不少于1000人","key":true},{"k":"发起式基金","v":"发起式基金合同生效3年后，若基金资产净值低于2亿元，合同自动终止","key":false},{"k":"基金清盘条件","v":"连续60个工作日资产净值低于5000万元或持有人不足200人等情形都可能触发清盘","key":true},{"k":"更换托管人期限","v":"基金托管人职责终止，基金份额持有人大会应在6个月内选任新托管人","key":false},{"k":"托管人实收资本","v":"托管人实收资本不少于80亿元；托管资格取消指连续3年不开展托管业务","key":true}]},{"t":"披露原则","points":[{"k":"披露原则","v":"内容原则为真实性、准确性、完整性、及时性、公平性；披露准确性要求语言精确不误解","key":true},{"k":"披露形式原则","v":"形式原则为规范性、易得性、易解性、可操作性；披露规范性指按法定内容和格式披露","key":false},{"k":"募集披露文件","v":"募集期三大文件为招募说明书、基金合同、托管协议；募集信息披露不含净值公告","key":true},{"k":"招募说明书内容","v":"招募说明书须载明投资目标、风险收益特征与费用；风险警示披露只在招募说明书全文","key":false},{"k":"虚假记载","v":"将不存在的事实在披露文件中记载即虚假记载，与误导性陈述、重大遗漏并列","key":true},{"k":"信息披露形式","v":"基金信息披露形式包括定期报告与临时报告，另有招募说明书等发行披露文件","key":false}]},{"t":"定期报告与净值","points":[{"k":"季度报告时限","v":"季度结束后15个工作日内编制完成并披露；季报披露时点同为季末15个工作日内","key":true},{"k":"半年报披露","v":"上半年结束后60日内披露半年报摘要和全文；半年报不披露过去5年净值增长率","key":true},{"k":"年报签发要求","v":"年报经2/3以上独立董事签字同意并由董事长签发，两个条件缺一不可","key":true},{"k":"定期报告备案","v":"定期报告在披露后第2个工作日，报证监会及地方证监局、交易所备案","key":false},{"k":"净值披露频率","v":"开放式基金申赎前至少每周1次公告净值；封闭式基金披露频率也是每周1次","key":false},{"k":"重大变动披露","v":"累计买卖超期初资产净值2%的股票须披露明细；净值差错披露门槛为0.5%","key":false}]},{"t":"大会与临时报告","points":[{"k":"持有人大会表决","v":"转换基金运作方式、更换管理人或托管人须经参会持有人表决权2/3以上通过","key":true},{"k":"持有人大会公告","v":"管理人召集大会须至少提前30日公告时间、形式、审议事项、程序和表决方式","key":false},{"k":"临时报告","v":"重大事件发生后2日内编制并披露临时报告书，并报证监会及地方证监局备案","key":true},{"k":"及时性披露","v":"及时性原则要求重大事件2个工作日内发临时报告，法定期限内披露定期报告","key":false}]},{"t":"QFII制度","points":[{"k":"QFII制度","v":"QFII即合格境外机构投资者，汇入外汇结汇后经专门账户投资境内，本利审核后汇出","key":false},{"k":"QFII持股比例","v":"单个境外投资者持一家公司股份不超10%；境外持股上限为所有境外投资者合计不超30%","key":true},{"k":"境外机构准入","v":"资产管理机构申请QFII须经营资管业务2年以上，最近年度管理证券资产不少于5亿美元","key":true},{"k":"本金锁定期","v":"养老基金、保险基金、共同基金等QFII本金锁定期为3个月，其他机构为1年","key":false},{"k":"境外投资者条件","v":"申请人须最近3年未受重大处罚；QDII投资顾问、境外托管人条件同为3年","key":false},{"k":"RQFII风险","v":"RQFII以人民币投资境内市场，不面临汇率风险，但仍有市场风险与流动性风险","key":false}]},{"t":"QDII与互联互通","points":[{"k":"境外投资基金","v":"QDII是境内募集、投资境外市场的基金；合格境内机构即境内募资投资境外证券","key":false},{"k":"QDII范围","v":"QDII投资范围含境外挂牌股票债券基金衍生品；QDII范围与境外投资范围均不含不动产和抵押按揭","key":true},{"k":"QDII额度管理","v":"QDII境外证券投资规模不得超过国家外汇管理局核准的额度，额度需逐笔审批","key":false},{"k":"沪港通机制","v":"沪港通分沪股通与港股通；沪深港通意义在扩大开放、分散风险，与港币联系汇率无关","key":false},{"k":"互联互通结算","v":"沪港通与深港通双向交易以人民币结算，互联互通币种统一为人民币；港股通基金要求港股通标的占非现金资产不低于80%","key":true},{"k":"基金国际化","v":"基金国际化目的在于把握各国证券上涨潜力并分散投资风险；基金互认最早与中国香港启动","key":false}]}],"formulas":[{"n":"股票仓位下限","f":"股票资产 ÷ 基金资产 ≥ 80%","u":"判断股票型基金与港股通基金的投资比例题"},{"n":"外资持股上限","f":"单个境外投资者 ≤ 10%，所有境外投资者合计 ≤ 30%","u":"QFII与RQFII的持股比例计算题"},{"n":"重大事项表决","f":"同意票 ÷ 参会持有人表决权 ≥ 2/3","u":"持有人大会表决转换运作方式等事项"},{"n":"净值差错披露线","f":"计价错误金额 ÷ 基金份额净值 ≥ 0.5%","u":"判断是否须编报临时报告"}],"traps":["认购是募集期买入，申购是成立开放后买入，两者不要混为同一个词。","内容原则含公平性但不含易得性，形式原则含易得性但不含公平性。","单个境外投资者10%、所有境外投资者合计30%，两个比例最容易对调。","临时报告2日、季报15个工作日、半年报60日、年报90日，四个时限别串。","QDII不能投不动产和房地产抵押按揭，但可以投境外挂牌股票、基金和衍生品。","年报要2/3独立董事签字，持有人大会重大事项要2/3表决权，都不是过半数。"],"must":["季度报告：季度结束后15个工作日内编制并披露","半年度报告：上半年结束后60日内披露摘要和全文","年度报告：会计年度结束后90日内披露，经2/3独立董事签字","募集：核准后6个月内发售，募集期限不超过3个月","上市：募集金额不低于2亿元，持有人不少于1000人","托管人：实收资本不少于80亿元，连续3年不开展业务取消资格","境外持股：单个10%，合计30%，本金锁定期3个月"],"mnemonic":["内容五原则真准完及公，形式四原则规易易可，公平不进形式、易得不出内容","认购申购记募认开申，金额认购份额赎回","时间轴：10验资、30退款、6个月发售、15季60半90年"]},{"id":2,"name":"职业道德与合规内控","why":"这一章解决靠什么保证基金公司不违规的问题,把抽象的职业道德落到内控制度、合规管理和人员行为约束上,是基金法律法规落地的执行保障。","logic":"内控五要素搭框架→原则与组织设制衡→合规体系抓落实→人员执业管行为→资料留痕可追溯","sections":[{"t":"内控五要素","points":[{"k":"内控五要素","v":"内部控制由控制环境、风险评估、控制活动、信息沟通、内部监控五个要素构成,缺一不可。","key":true},{"k":"控制环境","v":"是内部控制的基础,包括经营理念和控制文化、公司治理结构、组织结构、员工道德素质。","key":true},{"k":"风险评估","v":"识别和分析经营与投资中的风险并确定风险承受能力,是控制活动的前置环节。","key":false},{"k":"控制活动","v":"针对已识别风险采取授权、复核、隔离、轮岗等政策和程序,把风险控制在可接受范围。","key":false},{"k":"信息沟通","v":"建立清晰的报告系统,使信息在上下级和部门之间及时准确传递,对应信息沟通要素。","key":false},{"k":"内部监控","v":"设督察长和独立的监察稽核部门,持续监督内控制度执行并督促整改,对应内部监控要素。","key":true}]},{"t":"内控原则与文件","points":[{"k":"内控审慎性","v":"公司内控的核心是风险控制,制定制度以审慎经营、防范和化解风险为出发点。","key":true},{"k":"内控有效性","v":"讲求效率和效果,所有控制制度必须得到贯彻执行,执行不到位等于无效。","key":true},{"k":"内控健全性","v":"覆盖各项业务、部门、岗位和环节,制度不留空白和盲区,业务再小也要设控制。","key":false},{"k":"相互制约","v":"一项业务由两个以上岗位或部门共同完成并相互复核,严禁一人包办全流程。","key":false},{"k":"内控机制建设","v":"从目标设定、机构设置、制度建设、检查评价四方面推进,机构设置不能盯眼前的商业利润。","key":false},{"k":"内控大纲","v":"纲领性文件,明确内控目标、原则、要素、机构职责与监督评价,不包括信息披露具体内容。","key":true}]},{"t":"组织与岗位制衡","points":[{"k":"前中后台分工","v":"前台负责投资研究与销售,中台负责交易执行与风险控制,后台负责清算运营和客服。","key":true},{"k":"核心保密区域","v":"投资管理部门中交易部保密要求最严,属核心保密区域,限制人员进出和通讯工具。","key":true},{"k":"操作风险","v":"投资交易执行环节的主要风险是操作风险,表现为交易差错、越权下单、清算交收失误。","key":false},{"k":"信息披露控制","v":"既管披露文件真实准确完整,也管掌握非公开信息人员的行为,如登记、保密、限制交易。","key":false},{"k":"保密义务范围","v":"秘密包括国家秘密、商业秘密、内幕信息和客户隐私,公开的招募说明书不属于秘密。","key":true},{"k":"信息隔离墙","v":"用物理隔离、人员隔离和信息系统隔离,切断敏感信息在投资与销售等部门之间流动。","key":false}]},{"t":"合规管理体系","points":[{"k":"合规政策","v":"体现合规理念、培育合规文化、实现合规目标的纲领性、指导性文件,提原则性要求。","key":true},{"k":"合规管理职责","v":"识别评估合规风险、审查制度和业务、监督检查、报告与培训,不包括决定合规部门设置。","key":false},{"k":"合规独立性","v":"合规部门独立实质是人的独立,负责人不得兼任业务部门职务,才能有效揭示合规风险。","key":true},{"k":"合规管理原则","v":"包括独立性、客观性、公正性、协调性、权威性,协调性指与各部门和监管形成合力。","key":false},{"k":"合规公正性","v":"对同类违规行为坚持统一标准进行风险评估和报告,不因部门或个人而区别对待。","key":false},{"k":"督察长职责","v":"负责合规审查、监督检查和风险揭示,向董事会和监管机构报告,不管销售策略可行性。","key":true}]},{"t":"人员资格与操守","points":[{"k":"基金从业资格","v":"基金销售、投资管理、研究分析、交易、估值核算、登记结算等业务人员均需取得从业资格。","key":true},{"k":"利益冲突处理","v":"机构或个人利益与投资者利益冲突且无法避免时,投资者利益优先,并事前报告留痕。","key":true},{"k":"廉洁从业","v":"不得利用职务便利谋取不正当利益,禁止商业贿赂、利益输送和私下收费。","key":false},{"k":"诚实守信","v":"向投资者披露的信息真实准确完整,不夸大收益、不隐瞒风险、不承诺保本保收益。","key":false},{"k":"专业胜任","v":"持续参加后续职业培训,具备岗位所需专业能力,不熟不做、不懂不荐。","key":false},{"k":"客户适当性","v":"了解客户、了解产品,把合适的产品卖给风险承受能力相匹配的投资者。","key":false}]},{"t":"客户资料与反洗钱","points":[{"k":"客户身份资料保存","v":"反洗钱要求,客户身份资料自业务关系结束或一次性交易记账当年起至少保存5年。","key":true},{"k":"客户资料保存","v":"基金销售机构客户资料自业务关系结束当年起至少保存15年,不能与反洗钱的5年混记。","key":true},{"k":"大额交易报告","v":"符合大额交易标准的,在该笔交易发生后5个工作日内向中国反洗钱监测分析中心报告。","key":true},{"k":"可疑交易报告","v":"发现可疑交易应及时分析并以书面方式报送中国反洗钱监测分析中心,不得瞒报漏报。","key":false},{"k":"录像保存期限","v":"交易时段客户交易区的监控录像资料,保存期限不得少于6个月,须覆盖全部交易时段。","key":false},{"k":"交易记录保存","v":"客户交易记录自交易记账当年起至少保存5年,与客户身份资料的保存期限一致。","key":false}]},{"t":"内控评价与问责","points":[{"k":"内控评价","v":"每年至少开展一次内控有效性自我评价并出具报告,发现问题明确责任人和整改期限。","key":true},{"k":"合规报告路径","v":"合规负责人定期向董事会和监管机构报告合规状况,重大违规事项立即报告。","key":false},{"k":"违规问责","v":"违规行为既追究直接责任人,也追究管理责任人,并与绩效考核和任职资格挂钩。","key":false},{"k":"检查整改","v":"监督检查发现的问题建立台账,限期整改并跟踪验证,形成发现到闭环的链条。","key":false},{"k":"内控文化","v":"合规从高层做起,管理层带头示范、全员参与,内控优先于业务速度和规模。","key":false},{"k":"全程留痕","v":"业务操作、审批、报告全过程留痕,保证可追溯、可复核、可问责。","key":false},{"k":"投诉处理","v":"建立客户投诉处理机制,限时答复并留档,重大投诉同步报送合规部门。","key":false}]}],"formulas":[],"traps":["销售机构客户资料15年与反洗钱身份资料5年极易混,按主体和用途分开记。","合规独立性实质是人的独立,不是部门独立挂牌就完事。","内控有效性讲效率和执行,别与健全性、相互制约、审慎性互换。","内控大纲不含信息披露具体内容,别把制度清单全塞进去。","合规管理职责不含决定合规部门设置,那是董事会层面的权力。","督察长不管销售策略可行性,那是经营管理层的商业决策。"],"must":["监控录像:交易时段客户交易区资料至少保存6个月","客户身份资料与交易记录:自业务年度起至少保存5年","基金销售机构客户资料:自业务关系结束当年起至少保存15年","大额交易:发生后5个工作日内报告反洗钱监测分析中心","内控五要素:控制环境、风险评估、控制活动、信息沟通、内部监控"],"mnemonic":["五要素记环评活通监:环境、评估、活动、沟通、监控。","保密记交易部最严,招募说明书公开所以不算秘密。","数字记6月录像、5年身份、15年客户、5日大额报告。"]},{"id":3,"name":"基金销售与客户服务","why":"销售是把产品卖出去、把客户留下来的环节。本章串起销售资格、适当性、宣传合规、申赎操作与客户服务，数字型考点密集，性价比高。","logic":"制度与适当性 → 市场细分营销 → 申赎操作 → 宣传合规 → 客户服务与投教","sections":[{"t":"制度与原则","points":[{"k":"销售协议","v":"基金销售机构办理销售业务，必须与基金管理人签订书面销售协议；与托管人、其他代销机构签协议都不算。","key":false},{"k":"销售专业性","v":"营销人员必须掌握基金专业知识、能准确讲清产品特征与风险，这就是基金销售的专业性要求。","key":false},{"k":"销售持续性","v":"基金销售不是一锤子买卖，要持续跟踪客户、做持续营销来扩大保有规模，体现销售的持续性。","key":false},{"k":"销售禁止行为","v":"夸大宣传、虚假宣传、承诺收益、诋毁同行都属禁止行为；为销售业绩夸大或虚假宣传即违规。","key":true},{"k":"销售费用范围","v":"基金销售费用包括申购费、赎回费、销售服务费等；基金转换费不属于基金销售费用。","key":false}]},{"t":"投资者画像","points":[{"k":"投资者分类","v":"投资者分普通投资者与专业投资者；专业投资者有认定门槛，并非所有机构投资者都是专业投资者。","key":false},{"k":"机构投资者特征","v":"社会保障基金中含养老保险资金，投资期限较长但风险偏好偏低，通常不投资于风险较高的资产。","key":false},{"k":"生命周期风险","v":"个人投资者年龄越大，风险承受能力与承受意愿逐渐递减；说随年龄增长而递增是典型错误。","key":true},{"k":"开户年龄","v":"我国法律规定，办理基金开户的个人投资者年龄为18至70周岁，须实名并提交有效身份证件。","key":true}]},{"t":"适当性管理","points":[{"k":"销售适用性","v":"把合适的产品卖给合适的投资者：按投资者的风险承受能力销售不同风险等级的产品。","key":true},{"k":"风险等级","v":"基金风险等级由低到高划分，没有零风险等级；最低档也只是低风险，不等于保本保收益。","key":true},{"k":"风险承受能力测试","v":"基金销售机构应在投资人首次购买基金时做风险承受能力测试，此后按实际情况及时更新。","key":true},{"k":"及时性原则","v":"基金产品风险评价与投资人风险承受能力评价应根据实际情况及时更新，对应销售适用性的及时性原则。","key":false}]},{"t":"市场细分","points":[{"k":"市场细分原则","v":"细分市场要同时满足易入、可测、识别等原则；细分的是客户群体，不是把基金产品分类。","key":false},{"k":"易入原则","v":"完成细分后销售机构有能力向该市场提供所需产品和服务，即该市场易于开发、便于进入。","key":false},{"k":"识别原则","v":"每个细分市场有明显的区分标准，能清楚认识客户差异，以便提供个性化产品和服务。","key":false},{"k":"市场细分可测","v":"借助市场调查、专业咨询，能测算出细分市场的客户数量、销售规模、购买潜力等量化指标。","key":false},{"k":"投资者认可度","v":"把基金份额变动情况与持有人结构做比较分析，可以了解投资者对该基金的认可程度。","key":false},{"k":"暂停大额申购","v":"基金规模快速扩大、影响投资策略稳定性时，可暂停大额申购，保护原有持有人的利益。","key":true}]},{"t":"申赎操作","points":[{"k":"认购与申购","v":"认购在募集期、按1元面值；申购在存续期、按当日份额净值；二者场所相同，差别在时点与价格。","key":true},{"k":"申购净值确定","v":"T日15:00前申购按T日净值计算份额；15:00后下单（如15:29）顺延，按T+1日净值计算。","key":true},{"k":"申购费持有期","v":"申购费随持有期递减，持有期低于3年不得免收，满3年以上才可以免收认（申）购费。","key":true},{"k":"基金赎回","v":"开放式基金投资者可以随时发起赎回，成交按当日净值计算，巨额赎回时可能部分确认。","key":false},{"k":"赎回费归属","v":"不收取销售服务费的，对持续持有期长于6个月的，不低于赎回费总额的25%计入基金财产。","key":true}]},{"t":"宣传内容","points":[{"k":"宣传推介要求","v":"基金宣传推介应当突出投资风险，收益表述不得让投资者误以为是对未来收益的承诺。","key":false},{"k":"宣传禁用词","v":"募集期禁用坐享财富成长、安心享受成长、尽享牛市等预测收益、保本保收益类用语。","key":true},{"k":"宣传图表要求","v":"宣传推介材料有统计图表的，应当清晰、准确，不得截取片段或断章取义误导投资者。","key":false},{"k":"宣传材料风险提示","v":"电视、电影、互联网资料、公共网站链接形式的材料，须有至少5秒钟影像提示风险并参考销售文件。","key":true},{"k":"过往业绩披露","v":"可以登载该基金及管理人其他基金的过往业绩，但基金合同生效不足6个月的除外。","key":true}]},{"t":"材料报备","points":[{"k":"管理人备案","v":"基金管理人的宣传材料，自发布之日起5个工作日内报主要经营活动所在地中国证监会派出机构备案。","key":true},{"k":"代销机构备案","v":"其他基金销售机构的宣传材料，5个工作日内报工商注册登记所在地中国证监会派出机构备案。","key":false},{"k":"宣传材料报送","v":"6个月内连续2次被出具监管警示函仍未改正的，发布材料前应当事先报送中国证监会。","key":true}]},{"t":"服务体系","points":[{"k":"客户服务","v":"客户服务含售前咨询、售中辅导与售后跟踪；发行新基金时群发短信广而告之不属于客户服务。","key":false},{"k":"客户服务特点","v":"基金客户服务具有连续性、专业性与规范性，不是一次性行为，成交之后还要长期服务。","key":false},{"k":"客户服务分类","v":"定期为客户提供产品净值信息服务属于售后服务；售前重在咨询，售中重在交易辅导。","key":false},{"k":"客户资料保存","v":"基金经营机构的客户终端信息和电子化开户资料，保存期限不少于20年。","key":false}]},{"t":"服务规范投教","points":[{"k":"客户服务原则","v":"客户服务原则包括有效沟通、规范服务、连续服务等，没有连续沟通原则这一提法。","key":false},{"k":"客户服务规范性","v":"认购、申购、赎回都有详细业务规则，销售机构提供服务必须遵守法律法规和业务规则。","key":false},{"k":"有效沟通","v":"站在客户角度理解、尊重客户，一切为客户着想；出现分歧不臆测需求，耐心细致沟通。","key":false},{"k":"投资者教育","v":"用简单语言向投资者解释投资中的各类问题及应对措施；投资咨询不属于投资者教育内容。","key":true},{"k":"投资决策教育","v":"对投资产品和服务做出选择的行为或过程，是整个投资者教育体系的基础环节。","key":false}]}],"formulas":[{"n":"申购份额","f":"净申购金额=申购金额÷(1+申购费率)；申购份额=净申购金额÷T日基金份额净值","u":"T日15:00前申购、按当日净值确认份额时用"},{"n":"赎回金额","f":"赎回金额=赎回份额×T日净值−赎回费；赎回费=赎回份额×T日净值×赎回费率","u":"计算投资者赎回实际到账金额时用"},{"n":"赎回费归属","f":"计入基金财产=赎回费总额×比例，持有长于6个月且不收销售服务费时比例≥25%","u":"判断赎回费有多少留在基金资产里时用"}],"traps":["认购按1元面值、申购按当日净值，两者场所相同；说认购与申购场所不同是错的。","15:00是申赎分界点，15:29下单顺延到下一交易日，按T+1日净值而非T日。","所有机构投资者都是专业投资者是错的，专业投资者另有认定条件。","赎回费25%是持有长于6个月时的下限，不是全部赎回费都计入基金财产。","风险等级没有零风险档，低风险不等于保本；宣传也不得暗示保本保收益。","客户服务原则里没有连续沟通原则，别把有效沟通与连续服务拼成新原则。"],"must":["宣传材料：发布之日起5个工作日内报证监会派出机构备案","宣传风险提示：影像显示至少5秒钟，提示参考销售文件","过往业绩：基金合同生效不足6个月不得在材料中登载","认（申）购费：持有期低于3年一律不得免收其费用","赎回费：持有长于6个月，不低于25%计入基金财产","客户资料：电子化开户资料保存期限不少于20年","个人开户：年龄18至70周岁，须实名办理"],"mnemonic":["宣传三关：提示5秒、业绩满6个月、材料5个工作日备案","申赎口诀：认购一元、申购净值、三点前当天、三点后顺延","费与档：申购3年才免、赎回6个月25%、资料留20年"]},{"id":4,"name":"基金运作·估值·费用","why":"本章讲基金每天怎么算净值、钱怎么进出、成本谁承担：估值产净值，净值定申赎价，费用税收扣收益，是把投资运作结算为持有人收益的中枢。","logic":"制度定责任人→方法定公允价值→频率出份额净值→净值定申赎价格→费用税收扣收益","sections":[{"t":"估值制度与责任","points":[{"k":"基金资产估值","v":"对基金全部资产与全部负债按一定原则和方法估算，确定公允价值；估值结果决定申赎价格与费用计提基数。","key":true},{"k":"估值原则","v":"以公允价值为主要依据：有市价按市价，无市价或市价失真的用估值技术；并非所有底层资产一律市价法。","key":false},{"k":"估值责任人","v":"基金管理人是估值第一责任人，应理解估值原则与技术，与托管人充分协商后谨慎确定公允价值。","key":true},{"k":"净值计算责任","v":"计算并公告基金资产净值的责任在管理人，托管人只承担复核责任，二者不能互相替代。","key":false},{"k":"估值工作小组","v":"基金业协会下设基金估值工作小组，定期评估行业估值原则与程序，对无市价品种提出具体估值意见。","key":false},{"k":"会计核算频率","v":"我国基金会计核算已细化到日，即每个交易日记账并估值，不再按周或按月核算。","key":false}]},{"t":"估值方法与技术","points":[{"k":"停牌股估值","v":"估值日无市价、最近交易日后经济环境与发行人无重大变化的，按最近交易市价估值，不自行打折。","key":false},{"k":"估值调整阈值","v":"潜在估值调整对前一估值日基金资产净值影响达0.25%以上的，应参考类似品种市价调整最近成交价。","key":true},{"k":"未上市品种","v":"首次发行未上市的股票、债券、权证，用估值技术确定公允价值；技术难以可靠计量的按成本计量。","key":false},{"k":"债券估值方法","v":"债券基金用摊余成本法或市值法（交易所、银行间市价）；相对估值法不属于债券基金的估值方法。","key":false},{"k":"摊余成本法","v":"按买入成本加折溢价摊销计算净值，不受市价波动影响、净值平稳；优点是稳定而非保本，绝不承诺保本。","key":true},{"k":"影子定价偏离度","v":"货币基金同时用影子定价法，两者净值偏离的绝对值达0.5%及以上时，应在2日内进行临时报告。","key":true}]},{"t":"估值频率与披露","points":[{"k":"开放式估值频率","v":"开放式基金每个交易日估值一次，并于次日（T+1）公告份额净值；当日申赎按当日净值成交。","key":true},{"k":"封闭式估值频率","v":"封闭式基金同样每个交易日估值，但份额净值每周披露一次，不能因披露少而减少估值。","key":false},{"k":"估值披露频率","v":"估值与披露是两件事：所有基金每交易日估值，披露则开放次日、封闭每周、QDII估值日后2个工作日。","key":false},{"k":"QDII估值披露","v":"QDII基金份额净值在估值日后2个工作日内披露；其会计核算与资产估值的责任主体是基金管理公司。","key":true},{"k":"基金份额净值","v":"基金资产净值除以基金份额总数，是申购份额与赎回金额的计算基础；与机构持有比例无关。","key":true}]},{"t":"申赎与分红","points":[{"k":"申赎定价依据","v":"申购份额与赎回金额都以申请当日（T日）基金份额净值为基础计算，实行未知价法。","key":false},{"k":"申赎申请时点","v":"交易日15:00前提交的申请按当日净值成交，15:00后提交的顺延按下一交易日净值。","key":true},{"k":"申赎原则","v":"股票基金、债券基金实行金额申购、份额赎回；货币基金实行确定价，按固定1元面值申赎。","key":false},{"k":"认购查询时点","v":"投资者T日提交认购申请，可于T+2日起到办理认购的网点查询认购申请的受理情况。","key":false},{"k":"分红方式","v":"默认现金分红，投资者可改为红利再投资；分红后单位净值等额下降，持有人总资产不变。","key":true}]},{"t":"费用结构","points":[{"k":"基金费用分类","v":"投资者自担申购费、赎回费；从基金资产列支管理费、托管费、销售服务费与运作费；收销售服务费的C类通常不收申购费。","key":false},{"k":"运作费范围","v":"运作费含审计费、律师费、信息披露费、持有人大会费、上市年费，由基金资产承担；申购费不属运作费。","key":false},{"k":"交易费用","v":"交易费用含印花税、过户费、交易佣金、经手费、证管费；托管费属于费用，不属于交易费用。","key":true},{"k":"管理费计提","v":"管理费按前一日基金资产净值乘年费率除以当年天数逐日计提，按月支付，不按规模一次性收取。","key":true},{"k":"管理费率差异","v":"债券型基金管理费率一般低于股票型基金，因债券波动小、管理难度低；货币基金费率最低。","key":false},{"k":"赎回费归属","v":"赎回费扣除手续费后，余额不得低于赎回费总额的25%，这部分归入基金资产，其余归销售机构。","key":true}]},{"t":"基金税收","points":[{"k":"基金所得税","v":"机构投资者在境内买卖基金份额的差价收入需缴企业所得税；个人买卖份额的差价收入暂不缴个税。","key":false},{"k":"个人投资者税","v":"个人从基金分配中取得的收入暂不征个税，但其中的股利（股息红利）收入目前需征收个人所得税。","key":false},{"k":"债券利息税收","v":"基金投资国债、地方政府债的利息收入免征企业所得税；投资商业银行金融债等利息收入需缴所得税。","key":true},{"k":"增值税主体","v":"基金运营中发生的增值税，纳税主体是基金管理人，由管理人申报缴纳，不由份额持有人直接负担。","key":true}]},{"t":"流动性与巨额赎回","points":[{"k":"流动性风险","v":"大额赎回时基金无法以合理价格及时变现资产支付赎回款的风险，债券基金因流动性差最易爆发。","key":false},{"k":"巨额赎回认定","v":"单个开放日基金净赎回申请超过基金总份额的10%，即构成巨额赎回。","key":true},{"k":"巨额赎回处理","v":"管理人可选全额赎回或部分延期赎回；应立即向证监会备案，并在3个工作日内于指定媒体披露。","key":false},{"k":"侧袋机制","v":"把难以合理估值的资产放进侧袋，主袋资产正常估值申赎，用于控制流动性风险、保证持有人公平。","key":true},{"k":"杠杆率上限","v":"封闭式债券型基金杠杆率上限为2倍，即总资产不得超过基金净资产的200%。","key":false}]},{"t":"财务报告与列支","points":[{"k":"财务报告构成","v":"基金财务会计报告含会计报表、会计报表附注等；不含基金持有人明细，后者属登记业务资料。","key":false},{"k":"财务报告披露","v":"至少披露会计报表和附注的是半年度报告与年度报告，年度报告须审计；季度报告只披露会计报表。","key":true},{"k":"基金收入来源","v":"基金收入主要来自利息收入、投资收益、公允价值变动收益等；管理费是基金的费用，不是基金收入。","key":false},{"k":"费用列支","v":"持有人大会费、审计费、信息披露费从基金资产中列支；申购费由投资者另行支付，不进基金资产。","key":false}]}],"formulas":[{"n":"基金份额净值","f":"基金份额净值 = 基金资产净值 ÷ 基金份额总数","u":"申购份额、赎回金额、费用计提基数的统一计算口径。"},{"n":"基金资产净值","f":"基金资产净值 = 基金资产总值 − 基金负债","u":"先算净值再算份额净值，估值日每天算一次。"},{"n":"管理费计提","f":"每日管理费 = 前一日基金资产净值 × 年费率 ÷ 当年天数","u":"按日计提、按月支付，托管费同法计算。"},{"n":"赎回费归基金资产","f":"归入基金资产 = 赎回费总额 × (1 − 手续费率)，且不低于总额 × 25%","u":"判断赎回费归属比例时的下限检验。"},{"n":"影子定价偏离度","f":"偏离度 = |影子定价净值 − 摊余成本法净值| ÷ 摊余成本法净值 × 100%","u":"货币基金判断是否达0.5%并触发临时报告。"},{"n":"巨额赎回比例","f":"净赎回比例 = 当日净赎回申请 ÷ 基金总份额 × 100%","u":"判断是否超过10%而构成巨额赎回。"}],"traps":["估值频率不等于披露频率：封闭式基金每交易日都估值，但每周才披露一次份额净值。","赎回费余额不低于总额25%归基金资产，不是全部归基金资产，其余部分归销售机构。","申购费由投资者承担，既不是基金运作费，也不从基金资产列支，别与持有人大会费混。","货币基金偏离度0.5%是绝对值口径，且为2日内临时报告，不是2个工作日。","基金分红默认现金分红而非红利再投资；分红后净值下降不是亏损，总资产不变。","债券基金可用摊余成本法，但摊余成本法只是净值平稳，不等于保本，仍有偏离与流动性风险。"],"must":["估值调整阈值：潜在影响达前一估值日净值0.25%以上需调整估值","货币基金影子定价偏离度绝对值≥0.5%，2日内临时报告","巨额赎回：单个开放日净赎回超总份额10%，3个工作日内披露","QDII份额净值：估值日后2个工作日内披露","赎回费：扣除手续费后余额不低于总额25%归基金资产","申赎申请：交易日15:00前按当日净值，认购查询T+2","封闭式债券基金杠杆率上限2倍"],"mnemonic":["数字串：0.25调估值，0.5报偏离，10%算巨额，25%留基金，2倍是杠杆","披露节奏三句：开放次日、封闭每周、QDII两日","费用两条线：投资者付申购赎回，基金资产付管理托管运作"]},{"id":5,"name":"投资组合理论","why":"组合理论回答为什么分散、分散到什么程度、怎样才算最优，把各类资产的收益与风险统一成可计算的组合，是基金投资管理与业绩评价的方法论底座。","logic":"收益与两类风险→相关性决定分散效果→均值方差求有效前沿→无风险资产引出CML与β→落到配置流程与主被动选择","sections":[{"t":"收益与风险基础","points":[{"k":"期望收益含义","v":"预期收益是各种结果按概率加权平均，为正只说明平均不亏，单次仍可能亏损。","key":true},{"k":"实际利率","v":"实际利率约等于名义利率减通胀率，名义10%、通胀-2%时实际为12%，通胀为负反而抬高实际收益。","key":false},{"k":"复利计息","v":"每经过一个计息期就把所生利息并入本金再计息，终值FV=PV×(1+r)^n，长期收益远高于单利。","key":false},{"k":"系统性风险","v":"利率、汇率、战争、紧缩政策冲击整个市场，题目里4类情形都算系统性，无法靠分散消除。","key":true},{"k":"非系统性风险","v":"个股或行业特有的经营、财务、信用风险，增加组合内资产数量即可分散掉。","key":true},{"k":"政策风险","v":"央行调整存款准备金率、财政货币政策变动属政策风险，政治事件致股价波动体现股票风险性。","key":false}]},{"t":"资产配置与流程","points":[{"k":"投资规划阶段","v":"形成资本市场预期、建立战略资产配置属于投资组合管理的规划阶段，是整个流程的起点。","key":false},{"k":"战略资产配置","v":"按长期目标与长期资本市场预期确定各大类资产长期比例，不随短期波动频繁调整，后者是战术配置。","key":true},{"k":"资产配置因素","v":"投资期限、流动性高低、收益要求、风险承受力决定配置，业绩比较基准选择不属于。","key":false},{"k":"投资政策说明书","v":"写明投资目标、范围、策略、业绩比较基准与投资限制，绝不包含收益承诺。","key":true},{"k":"投资决策说明书","v":"列明决策依据、决策权限与审批流程，最低收益保障不属于其内容。","key":false},{"k":"投资交易流程","v":"四个环节：形成投资策略、构建组合并执行交易指令、风险控制、绩效评估与组合调整。","key":true}]},{"t":"组合构建与分散化","points":[{"k":"相关系数","v":"相关系数取值-1到1，不完全相关即0<|ρ|<1，ρ=1无分散效果，ρ=-1降险最多。","key":true},{"k":"相关系数与分散化","v":"构建组合应优先选与现有资产收益负相关的品种，相关性越低，分散降险的效果越好。","key":false},{"k":"分散化投资","v":"一只基金持有多种股票的目的是降低风险，分散化效果就是降险，不是提高收益。","key":true},{"k":"完全正相关","v":"ρ=1时组合风险是两资产风险的加权平均，任何配比都不能降低风险。","key":false},{"k":"组合方差","v":"组合方差由权重、各资产方差和两两协方差决定，协方差项为负才有分散降险效果。","key":false},{"k":"分散化边界","v":"资产数量增加只能削掉非系统性风险，系统性风险构成下限，继续增加边际效果递减。","key":false}]},{"t":"现代组合理论","points":[{"k":"均值方差模型","v":"马科维茨提出，用期望收益衡量收益、方差衡量风险，现代组合理论由此起步。","key":true},{"k":"有效前沿","v":"可行集的上边界，同风险下收益最高、同收益下风险最低，理性投资者只选这一段。","key":true},{"k":"分离定理","v":"引入无风险资产后最优风险组合与风险偏好无关，偏好只决定无风险资产与风险组合的配比。","key":false},{"k":"资本市场线","v":"无风险利率与市场组合M的连线，斜率即夏普比率，风险溢价与风险成正比、与风险偏好无关。","key":true},{"k":"Beta系数","v":"β=ρ×σi÷σm，β等于2表示与市场同向且波动幅度是市场的2倍。","key":true},{"k":"市场组合Beta","v":"市场组合的β等于1，是衡量其他资产系统性风险的标尺，β大于1则更敏感。","key":false}]},{"t":"风险度量指标","points":[{"k":"风险价值VaR","v":"一周98%置信度下VaR为0.5%，意为98%的概率损失不超过0.5%，超过的概率是2%。","key":true},{"k":"预期损失","v":"损失超过VaR时的平均损失，满足次可加性、更善度量尾部风险，因此受监管重视。","key":false},{"k":"亏损与回本","v":"净值跌33%需上涨50%才回本，回本涨幅=跌幅÷(1-跌幅)，亏损后回本要求更陡。","key":true},{"k":"收益波动率","v":"收益波动率用收益率标准差衡量，数值越大风险越高，它等于方差的正平方根。","key":false},{"k":"风险度量比较","v":"VaR直观但不满足次可加性、忽略尾部极端损失，预期损失正好补这个短板。","key":false}]},{"t":"主动与被动投资","points":[{"k":"主动比重","v":"主动比重=0.5×Σ|组合权重-基准权重|，等于0说明组合与基准完全相同。","key":true},{"k":"主动比重局限","v":"只衡量与基准的持仓差异大小、不含方向，与基准不同不代表一定跑赢或跑输。","key":false},{"k":"被动投资目标","v":"被动投资者在成本允许的情况下尽可能减小跟踪误差，而不是追求超额收益。","key":true},{"k":"跟踪误差","v":"组合收益与基准收益偏离程度的波动，数值越小说明复制基准越成功。","key":false},{"k":"投资策略稳定性","v":"基金的投资策略应当保持长期稳定，不得因短期市场波动而频繁漂移。","key":true},{"k":"市场风险管理","v":"跟踪重仓股、监控个股成交量占流通股比例，是组合市场风险的日常管理措施。","key":false}]},{"t":"市场有效性与仓位","points":[{"k":"市场有效性","v":"半强有效市场已反映全部公开信息，基本面分析难获超额收益，但内幕信息仍可获利。","key":true},{"k":"弱式有效","v":"价格已反映历史交易信息，技术分析失效，基本面分析仍可能获得超额收益。","key":false},{"k":"半强式有效","v":"价格已反映所有公开信息，基本面分析失效，只有尚未公开的内幕信息有价值。","key":false},{"k":"强式有效","v":"价格已反映全部信息包括内幕信息，任何分析方法都无法获得超额收益。","key":false},{"k":"基金平均仓位","v":"88魔咒的88%指纳入统计的开放式基金股票仓位的平均值，不是某只基金自己的仓位。","key":false},{"k":"有效性与策略","v":"市场越有效越应选被动投资，无效性越强主动管理空间越大，这是选策略的判据。","key":false}]}],"formulas":[{"n":"复利终值","f":"FV = PV×(1+r)^n","u":"算多期复利本息和，对照单利PV×(1+r×n)"},{"n":"实际利率","f":"实际利率 = 名义利率-通胀率","u":"给名义利率与通胀率求真实购买力收益"},{"n":"组合方差","f":"σp² = w1²σ1² + w2²σ2² + 2×w1×w2×ρ×σ1×σ2","u":"两资产组合算风险，看相关性如何影响降险"},{"n":"Beta","f":"β = ρ×σi÷σm = Cov(Ri,Rm)÷σm²","u":"衡量资产相对市场的系统性风险"},{"n":"CAPM","f":"E(Ri) = Rf + β×(E(Rm)-Rf)","u":"用β求资产必要收益率，对应证券市场线"},{"n":"主动比重","f":"主动比重 = 0.5×Σ|wi-wb,i|","u":"衡量组合与基准的持仓差异度"},{"n":"回本涨幅","f":"回本涨幅 = 跌幅÷(1-跌幅)","u":"已知跌幅算需要多少涨幅才回本"}],"traps":["系统性风险不等于政策风险，前者含利率汇率战争政策等多类，政策风险只是其中一种。","预期收益为正不等于不会亏，它只是概率加权平均，单期仍可能亏损。","主动比重高只说明与基准不同，不代表能跑赢基准，别把差异度当成业绩好坏。","β=1是市场组合，β=2是同向但波动更大，不是反向，也不是风险更小的意思。","风险溢价与市场组合风险成正比，题目常改成反比或与风险偏好相关来设错。","分散化只能消除非系统性风险，说它能消除全部风险是典型错误选项。"],"must":["实际利率：名义利率10%、通胀-2%时实际为12%","市场组合β=1，β=2即波动幅度为市场的2倍","亏损33%需上涨50%回本，跌幅越大回本越难","VaR：一周98%置信度0.5%，损失超0.5%概率为2%","半强有效市场：公开信息无效，内幕信息可获超额收益","主动比重为0表示与基准完全相同，为1表示完全不同"],"mnemonic":["马克维茨均值方差，有效前沿看可行集上边界","系统性风险躲不掉，非系统性靠数量散掉","弱式技术废，半强基本面废，强式连内幕都没用"]},{"id":6,"name":"股票投资与估值","why":"本章解决买什么股票、值多少钱、怎么买三个问题，是基金公司权益投资的核心能力，上承组合管理，下接交易执行与业绩评价。","logic":"证券属性与分类→投资策略选择→研究与财务分析→绝对与相对估值→指数基准与流动性","sections":[{"t":"权益证券基础","points":[{"k":"股票特征","v":"股票是股份公司签发的所有权凭证，具有收益性、风险性、流动性、永久性、参与性；永久性指不能退股只能转让，公司不还本。","key":false},{"k":"资本类型","v":"权益资本靠发行股票筹集，不用还本、可分享剩余收益；债务资本靠借债筹集，要还本付息，说权益资本靠借债即错。","key":false},{"k":"普通股权利","v":"普通股股东享有表决权、剩余收益分配权、剩余财产分配权、优先认股权，是最基本股份；优先股一般无表决权。","key":true},{"k":"一股一票","v":"普通股一股一票、同股同权，表决权大小取决于持股比例；题目问哪种证券有投票权，答案就是普通股。","key":false},{"k":"优先股特征","v":"优先股股息率固定，先于普通股分配利润和剩余财产，风险较低、收益也较低，一般无表决权、不参与经营决策。","key":true},{"k":"清偿顺序","v":"公司清算时受偿顺序为债券持有人先于优先股股东，优先股股东先于普通股股东，普通股最后受偿。","key":true}]},{"t":"风格与股东回报","points":[{"k":"价值与成长风格","v":"价值风格买低市盈率、低市净率、高股息的便宜股；成长风格买高增长股，估值更高，故价值风格持股估值更低。","key":true},{"k":"价值型基金","v":"基金平均市盈率和平均市净率都低于市场指数，判为价值型基金；两个指标都低才最确定，只低一个只是参考。","key":true},{"k":"成长型基金","v":"成长型基金平均市盈率、平均市净率高于市场指数，重仓高成长行业，追求资本利得，波动通常大于价值型。","key":false},{"k":"科技传媒通信","v":"TMT是科技、传媒、通信三个行业的合称，TMT基金只投这三类，煤炭等传统能源行业不属于TMT。","key":false},{"k":"红利策略","v":"红利策略的选股核心是高股息，买股息率高、分红稳定、现金流好的公司，赚分红和估值修复的钱。","key":false},{"k":"股票回购","v":"回购方式只有场内公开市场回购、场外协议回购、要约回购三种；正回购是回购协议工具，不属于股票回购。","key":true}]},{"t":"投资策略框架","points":[{"k":"自上而下策略","v":"先分析宏观经济、产业政策、行业景气选出行业，再在行业内选股，落脚点是行业配置，如申购半导体ETF。","key":true},{"k":"自下而上策略","v":"从公司基本面出发精选个股，落脚点是个股选择；股票仓位由选股结果决定，不取决于对宏观经济的预测。","key":true},{"k":"投资策略类型","v":"按选股路径分自上而下和自下而上，按是否跟踪指数分主动和被动；买行业ETF同时属自上而下和被动投资。","key":false},{"k":"主动投资策略","v":"主动投资靠选股、选行业、择时获取超额收益，目标是跑赢基准，换手率和费率通常高于被动投资。","key":false},{"k":"被动投资策略","v":"被动投资复制指数、追求跟踪误差最小，目标是获取市场平均收益，费率低、持仓透明，如ETF和指数基金。","key":false},{"k":"长期价值投资","v":"基金投资策略应以长期价值投资为主，靠企业内在价值增长获利，不做频繁择时和追涨杀跌的短期交易。","key":true}]},{"t":"研究方法与团队","points":[{"k":"研究部职能","v":"基金公司研究部为投资运作提供支持，负责宏观、行业和上市公司投资价值研究，不直接下单交易。","key":false},{"k":"宏观经济指标","v":"宏观经济指标看GDP、CPI、PPI、失业率、利率、汇率；资本结构属企业财务概念，不是宏观经济指标。","key":false},{"k":"基本面分析","v":"基本面分析研究宏观、行业和公司财务，测算内在价值并与市价比较；技术分析只看市场自身数据。","key":false},{"k":"技术分析","v":"技术分析只研究价、量、时、空等市场本身数据，用K线、均线、形态判断买卖点，不考虑基本面因素。","key":true},{"k":"相对强度","v":"相对强度比较个股走势与大盘走势，强于大盘的强势股可关注，弱于大盘的股票应尽可能回避。","key":false}]},{"t":"财务分析基础","points":[{"k":"流动资产","v":"流动资产是一年内或一个营业周期内可变现、出售或耗用的资产，如存货、应收账款、货币资金；固定资产不是。","key":true},{"k":"现金流量表","v":"现金流量表按经营、投资、筹资三类活动反映现金流入流出，可评价现金来源去向和偿债、支付投资利润能力。","key":true},{"k":"现金流量表局限","v":"现金流量表不能直接反映盈利状况与获利能力，那要看利润表；它能评价企业未来产生现金净流量的能力。","key":false},{"k":"长期偿债能力","v":"长期偿债能力看资产负债率、产权比率、利息保障倍数；流动比率、速动比率属短期偿债能力，别混用。","key":false},{"k":"杜邦分析","v":"杜邦分析把ROE拆开找驱动因素；收入增10%而总资产、净资产、净利润不变时，权益乘数和ROE都不变。","key":false},{"k":"杜邦恒等式","v":"ROE等于销售净利率乘总资产周转率再乘权益乘数，恒等式不含资产负债率；权益乘数等于1除以1减资产负债率。","key":true}]},{"t":"绝对估值模型","points":[{"k":"风险溢价","v":"风险溢价是投资风险资产相对无风险资产多要求的补偿；同一市场条件下风险溢价越高，风险资产期望收益率越高。","key":true},{"k":"必要收益率","v":"必要收益率等于无风险利率加风险溢价，是估值的折现率；折现率越高，同一笔未来现金流估值越低。","key":false},{"k":"股利贴现模型","v":"把未来各期股利按必要收益率折现求和得内在价值；含零增长、不变增长、两阶段、三阶段，没有负增长模型。","key":true},{"k":"零增长模型","v":"假设股利每年保持不变，V等于每股股利D除以必要收益率k，适合分红稳定的优先股和成熟公司。","key":false},{"k":"不变增长模型","v":"即戈登模型，V等于D1除以k减g，D1是下一期股利，必须满足股利增长率g小于必要收益率k。","key":false},{"k":"两阶段模型","v":"先逐年折现高增长期股利，再把稳定期股利用戈登模型折现到高增长期末，两段相加即为内在价值。","key":false}]},{"t":"相对估值方法","points":[{"k":"相对价值法","v":"用可比公司或行业乘数估值，含市盈率、市净率、市销率、EV/EBITDA；经济附加值属绝对估值，不是相对价值法。","key":true},{"k":"市盈率估值","v":"市盈率等于股价除以每股收益，可理解为收回投资的年数；适合盈利稳定的成熟行业，公司亏损时指标失效。","key":true},{"k":"市净率估值","v":"市净率等于股价除以每股净资产，适合银行、钢铁等重资产行业；净资产为负时市净率就失去意义。","key":false},{"k":"经济附加值","v":"EVA等于税后净营业利润减资本成本，衡量企业创造的经济利润，属绝对估值模型，常被设为相对价值法干扰项。","key":false}]},{"t":"指数与流动性","points":[{"k":"股价平均法","v":"股价平均法用样本股票价格的算术平均编制指数，代表是道琼斯指数；属价格加权，高价股对指数影响更大。","key":false},{"k":"指数编制方法","v":"指数编制分算术平均、几何平均和加权法；沪深300指数采用派氏加权法，以报告期成交量或成交金额为权数。","key":true},{"k":"派氏加权法","v":"派氏加权以报告期成交量为权数，拉氏加权用基期；沪深300用派氏加权，属市值加权的综合指数。","key":false},{"k":"股票流动性","v":"大盘蓝筹股流通市值大、成交活跃、买卖价差小，流动性最好；小盘股流动性差、冲击成本更高。","key":false}]}],"formulas":[{"n":"杜邦恒等式","f":"ROE＝销售净利率×总资产周转率×权益乘数","u":"拆解净资产收益率，判断ROE变化由哪个环节驱动"},{"n":"权益乘数","f":"权益乘数＝1÷(1－资产负债率)","u":"已知资产负债率时换算权益乘数，检验杜邦三因素"},{"n":"零增长模型","f":"V＝D÷k","u":"股利长期保持不变的股票或优先股估值"},{"n":"不变增长模型","f":"V＝D1÷(k－g)","u":"股利按固定增长率g增长时求内在价值，须g小于k"},{"n":"市盈率","f":"市盈率＝股价÷每股收益","u":"相对估值，以及判断基金属价值型还是成长型"},{"n":"市净率","f":"市净率＝股价÷每股净资产","u":"重资产行业相对估值，配合市盈率判断风格"}],"traps":["正回购不是股票回购方式，回购只有场内公开市场、场外协议、要约三种。","杜邦恒等式里没有资产负债率，但权益乘数由资产负债率决定，考试常在这里设陷阱。","现金流量表不能直接看盈利，看盈利要利润表；它能评价未来现金净流量。","价值型基金要市盈率和市净率都低于指数，只看一个指标容易误判，两个都低才最确定。","经济附加值EVA属绝对估值，不是相对价值法，相对价值法只有乘数类方法。","自上而下落脚行业配置，自下而上落脚个股；买行业ETF是被动加自上而下。"],"must":["清算受偿：债券持有人先于优先股股东，优先股股东先于普通股股东","杜邦恒等式：ROE＝销售净利率×总资产周转率×权益乘数","戈登模型必须满足股利增长率g小于必要收益率k","沪深300用派氏加权法；道琼斯指数用股价算术平均法","普通股一股一票，优先股通常无表决权，只有普通股有投票权","现金流量表三类活动：经营活动、投资活动、筹资活动","股票回购三方式：场内公开市场、场外协议、要约"],"mnemonic":["清偿顺序：债先优，优先普，普通股垫底","自下而上选个股，自上而下配行业","杜邦三拆：净利率、周转率、权益乘数"]},{"id":7,"name":"债券投资","why":"债券是公募基金最大的底层资产类别，本章解决债券怎么定价、价格为什么波动、风险从哪里来，是组合管理与风险控制的操作基础。","logic":"债券分类与发行人→基金投资范围→可转债→定价与收益率→曲线形态→久期调仓→信用与免疫","sections":[{"t":"债券图谱","points":[{"k":"债券发行人","v":"中央政府、地方政府、金融机构、企业四类主体都可发债，选项出现这四类通常全选，没有排除项。","key":false},{"k":"国债信用","v":"国债以国家信用背书，违约概率视为零，是组合里最安全的品种，也是其他债券定价的无风险基准。","key":false},{"k":"贴现债券","v":"发行时不规定利率、券面不附息票，按低于面值折价发行，到期按面值偿还，收益全来自折价。","key":true},{"k":"浮动利率债券","v":"票面利率在偿付期内随基准利率定期重定，利率上行时价格波动明显小于固定利率债。","key":false},{"k":"银行永续债","v":"永续债没有明确到期日、可按约定续期，二级资本债有固定期限，两者不能混为一谈。","key":false},{"k":"短期融资券","v":"发行主体是非金融企业法人，由商业银行承销，银行间市场机构投资者认购，通常不需担保。","key":true}]},{"t":"基金定位","points":[{"k":"债券基金特点","v":"与股票基金相比是较低风险、较低收益；组合分散后净值波动小于单只债券。","key":true},{"k":"与债券的区别","v":"债券基金没有明确到期日，不能持有到期拿回本金，净值随持仓债券市价天天变动。","key":false},{"k":"债券基金范围","v":"可投债券、存款、回购等，不含股指期货；债券资产占基金资产80%以上才算债券基金。","key":true},{"k":"债券基金收益","v":"来源有票息收入、资本利得、杠杆放大、可转债与打新增厚，问收益来源通常全选。","key":false},{"k":"中长债投资范围","v":"中长债基金只做纯债，股票和可转债都不能投，可转债是它被明确排除的品种。","key":false}]},{"t":"可转债专题","points":[{"k":"可转债属性","v":"兼具债性与股性，正股上涨可转股分享涨幅，权益市场大涨时可转债基金表现最好。","key":false},{"k":"可转债要素","v":"票面利率普通公司债也有，不是特有要素；转换价格、转换比例、赎回、回售才是特有。","key":true},{"k":"可转债赎回条款","v":"赎回权归发行人，约定赎回条件被触发时发行人可行使，作用是迫使投资者尽快转股。","key":false},{"k":"转换比例","v":"转换比例等于债券面值除以转换价格，面值500元、转换价25元，可转20股正股。","key":true},{"k":"可转债指标","v":"分析看平价、转股溢价率、纯债溢价率；跟踪误差是基金评价指标，不属于可转债指标。","key":false},{"k":"可转债基金","v":"股性最强，一般情况下收益波动在各类债券基金中最大，涨得快跌得也狠。","key":false}]},{"t":"定价与收益","points":[{"k":"利率与债价","v":"其他条件不变，利率下降则债券价格上升、债券基金净值上升，两者同向变动。","key":true},{"k":"债券利率风险","v":"按面值买入后市场利率上升，债券只能折价卖出，损失来自利率风险不是信用风险。","key":false},{"k":"利率风险","v":"债券价格与市场利率反向变动，期限越长、票息越低，价格反向幅度越大。","key":false},{"k":"到期收益率假设","v":"使未来现金流现值等于价格的贴现率即到期收益率，两个隐含假设是持有到期、利息按该收益率不变再投资。","key":true},{"k":"风险溢价","v":"债券预期到期收益率减去同期限同票息无风险债券收益率，这个差额就是风险溢价。","key":true},{"k":"债券收益率因素","v":"流动性风险、期限风险、供需变化、对未来收益率变化的预期，四项全都影响收益率。","key":false}]},{"t":"收益率曲线","points":[{"k":"收益率曲线","v":"国债收益率曲线反映市场对未来利率的预期即远期利率，不是即期利率，这点最爱设错。","key":true},{"k":"拱形收益率曲线","v":"短端利率与期限同向、长端反向，曲线先升后降呈拱形，是曲线四种形态之一。","key":true},{"k":"即期与远期利率","v":"即期利率是当前各期限零息利率，远期利率是未来某特定日期才适用的利率，远期由即期推出。","key":false},{"k":"即期利率","v":"即期利率由当前市场报价直接得到，不含预期成分，用来给零息债券定价。","key":false},{"k":"远期利率","v":"远期利率含市场对未来利率的预期，由即期利率曲线推导得出，当前不能直接成交。","key":false}]},{"t":"久期与调仓","points":[{"k":"久期含义","v":"久期是各期现金流按现值加权的平均到期时间，直接衡量组合对利率变动的敏感度。","key":false},{"k":"久期敏感度","v":"净值变动约等于负久期乘利率变动；久期3年、利率降0.5%，净值约增加1.5%。","key":true},{"k":"久期策略","v":"预期利率下降就拉长久期放大涨幅；说降息要缩短久期以规避价格下跌，方向是反的。","key":true},{"k":"降息应对","v":"预期降息应同时提高杠杆率与提高组合久期，只选这两项，降低杠杆或缩短久期都错。","key":true},{"k":"利率风险应对","v":"应对利率风险调期限结构与组合久期；信用结构和行业类别管的是信用风险，不选。","key":false}]},{"t":"信用与流动性","points":[{"k":"信用风险","v":"发行人不能按期足额还本付息的可能，评级越低、票息越高的债信用风险越大。","key":false},{"k":"信用风险管理","v":"手段是信用评级、分散持仓、限制单一主体集中度；久期管理属利率风险，不在其列。","key":true},{"k":"高收益债策略","v":"主要投垃圾债，投资级别属投机级，靠高票息补偿明显偏高的信用风险。","key":false},{"k":"高收益债信用风险","v":"各类债券基金中高收益债基金信用风险最高，可转债基金则是收益波动最大。","key":true},{"k":"国债投资要素","v":"投国债看利率走势、剩余期限和流动性，不用考虑发行人违约概率，国债无违约风险。","key":false},{"k":"买卖价差","v":"买卖价差越大，变现时折价越多，流动性风险越大；说价差大流动性风险小正好说反。","key":true}]},{"t":"免疫策略","points":[{"k":"免疫策略","v":"通过匹配资产与负债的久期和现值，让组合价值不受利率变动影响，锁定既定收益。","key":false},{"k":"免疫策略种类","v":"只有价格免疫、所得免疫、或有免疫三类，收益免疫是编出来干扰的，不存在。","key":true},{"k":"所得免疫","v":"保证组合有稳定现金流入应付支出，适合养老金等支出型投资者，不适合股票型基金。","key":false}]}],"formulas":[{"n":"久期敏感度","f":"净值变动 ≈ −久期 × 利率变动","u":"已知组合久期和利率变动幅度，快速估算净值涨跌幅。"},{"n":"转换比例","f":"转换比例 = 债券面值 ÷ 转换价格","u":"算一张可转债能转成几股正股时用。"},{"n":"风险溢价","f":"风险溢价 = 债券到期收益率 − 同期限无风险收益率","u":"判断信用与流动性补偿够不够时用。"}],"traps":["利率下降时拉长久期是放大收益，不是规避价格下跌，方向千万别记反。","可转债的票面利率不是特有要素，特有在转换价格、转换比例与赎回回售。","国债不看违约概率，买卖价差越大流动性风险越大，这两处最爱倒着设选项。","两个最容易串的最：高收益债基金信用风险最高，可转债基金波动最大。","债券基金没有到期日，别当成一只债持有到期，净值是天天变的。","信用风险管理里不含久期管理，久期管理属于利率风险的活儿。"],"must":["可转债面值500元÷转换价25元=20股，100元面值则10股。","组合久期3年，利率每降0.5%，净值约涨1.5%，降1%约涨3%。","债券资产占基金资产80%以上才是债券基金，中长债基金不得投可转债。","预期央行降息25个基点：提高杠杆率、提高组合久期，两条同时做。"],"mnemonic":["降息拉久期加杠杆，升息缩久期降杠杆，一降一升记牢。","可转债四件套：转股价、转换比例、赎回、回售。","免疫三兄弟：价格、所得、或有，没有收益免疫。"]},{"id":8,"name":"衍生工具","why":"本章承接债券与股票现货知识，回答基金用什么工具对冲风险、怎么交易、风险在哪，是投资管理从现货走向对冲的关键一环，也是判断与计算题的高频区。","logic":"工具分类 → 交易机制 → 品种运用 → 定价与保证金 → 功能与风险判断","sections":[{"t":"衍生工具基础","points":[{"k":"衍生工具定义","v":"价值取决于基础资产（股票、债券、利率、汇率、商品）价格变动的金融合约，本身不代表对基础资产的所有权，只是权利义务的跨期安排。"},{"k":"四大基础分类","v":"按合约形态分远期、期货、期权、互换四类，四类都是跨期交易，构成衍生工具的四种基本类型，任何新品种都是它们的组合。"},{"k":"衍生品杠杆性","v":"只需缴纳少量保证金即可控制数倍合约资产，保证金5%即放大20倍，收益与亏损同比例放大，这是衍生工具最本质的特征。","key":true},{"k":"衍生品风险类型","v":"交易对手到期不履约属信用风险，不是流动性风险；流动性风险指无法以合理价格平仓或变现，两者常被互换设陷阱。","key":true},{"k":"跨期与联动性","v":"跨期性指合约现在签订、未来交割清算；联动性指标的价格与基础资产价格同向或反向联动，现货微动衍生品大幅动。"},{"k":"衍生品高风险性","v":"杠杆叠加联动，使标的资产价格小幅波动就造成保证金大幅盈亏，设计初衷是避险，误用则成为放大风险的投机工具。"}]},{"t":"远期与期货合约","points":[{"k":"远期合约特征","v":"场外一对一协商、非标准化、无交易所担保，到期一次交割，信用风险大、流动性差，适合个性化的大额避险需求。"},{"k":"期货合约定义","v":"交易所统一制定的标准化合约，约定在未来某一日期按约定价格买卖一定数量标的资产，价格由场内公开竞价产生。"},{"k":"期货远期风险","v":"期货有交易所中央对手方担保和每日无负债结算，信用风险远小于远期；远期才是信用风险大的一方，别记反。","key":true},{"k":"标准化条款","v":"标的数量、质量等级、交割月份、交割地点由交易所统一规定，只有价格由交易者竞价决定，标准化换来高流动性。"},{"k":"保证金与逐日盯市","v":"买卖双方开仓即缴保证金，每日按结算价盯市，亏损方须次日开市前补足，否则被强制平仓，故无违约累积。","key":true},{"k":"平仓与交割","v":"绝大多数合约在到期前对冲平仓了结，只有极少数进入实物交割，交割由交易所统一组织，中小投资者一般不参与交割。"}]},{"t":"期货品种与国债","points":[{"k":"金融期货分类","v":"分利率期货、股权类（股指）期货、外汇期货三类；我国场内主要是股指期货和国债期货，金融期货都在中金所交易。"},{"k":"国债期货品种","v":"中金所已上市2年、5年、10年、30年期四个品种，没有1年期国债期货，考“不包括”时先排除1年期。","key":true},{"k":"国债期货对冲","v":"债券基金用国债期货对冲利率风险：预期利率上行时卖出（空头）套保，现券跌价损失由期货盈利弥补，久期缺口被抹平。","key":true},{"k":"债券远期限额","v":"任何一家市场参与者（基金按单只基金计）单只债券远期买入、卖出总余额分别不得超过该债券流通量的20%。","key":true},{"k":"债券远期要素","v":"在银行间同业拆借中心交易，期限最长365天，双方须缴纳保证金或提供保证券，属场外衍生品，信用风险高于国债期货。"},{"k":"套保方向判断","v":"持有现券怕跌就卖出期货做空头套保，未来要买怕涨就买入期货做多头套保，期货方向永远与现货敞口相反。"}]},{"t":"期权定价与交易","points":[{"k":"期权买卖权","v":"买方付权利金获得按执行价格买卖标的资产的权利，卖方收权利金承担履约义务；看涨是买权越涨越赚，看跌是卖权越跌越赚。","key":true},{"k":"欧式与美式","v":"欧式期权只能在到期日行权，美式期权到期前任意时点都可行权；美式权利更大，同样条件下权利金更高。"},{"k":"期权价格因素","v":"影响因素有标的价、执行价、期限、波动率、无风险利率、红利六项；无风险利率上升看涨期权涨、看跌期权跌。","key":true},{"k":"期权卖方风险","v":"卖出看涨期权风险最大，标的暴涨时理论亏损无限；买方最大亏损仅为已付权利金，故卖方必须缴保证金。","key":true},{"k":"期货期权保证金","v":"期货买卖双方都要开立保证金账户；期权买方只付权利金，不缴保证金、不开保证金账户，只有卖方需缴保证金。","key":true},{"k":"期货期权杠杆","v":"期货和期权都具有杠杆效应：期货靠保证金放大，期权靠少量权利金撬动大额标的，两者都能以小博大。"}]},{"t":"互换与信用衍生","points":[{"k":"互换定义","v":"交易双方约定在未来一段期限内交换一系列现金流的场外合约，期限长、金额大、非标准化，信用风险高于场内期货。"},{"k":"利率互换","v":"同种货币下交换固定利率与浮动利率的利息流，不交换本金，用于降低融资成本或调整组合久期。"},{"k":"货币互换","v":"交换不同货币的本金及利息，期初、期末各换一次本金，用于规避汇率风险、降低跨币种融资成本。"},{"k":"信用违约互换","v":"CDS：买方定期支付费用，卖方在标的债券违约时赔付损失；它是2008年全球金融危机的重要推手，属信用衍生品。","key":true},{"k":"信用风险缓释","v":"信用风险缓释合约与信用违约互换最类似，本质都是把信用风险从保护买方转移给保护卖方，换个名字考同一逻辑。"},{"k":"期货互换区别","v":"期货在交易所标准化交易，有保证金和逐日盯市；互换主要在场外非标准化交易，期限更长、信用风险更大，并非都在交易所。","key":true}]},{"t":"期货市场功能","points":[{"k":"风险管理功能","v":"期货最基本的功能是风险管理，但不能消除风险，只是把风险在不同投资者之间转移，说“消除风险”必错。","key":true},{"k":"期货市场功能","v":"两大基本功能是风险管理和价格发现；投机提供流动性是派生作用，功能里不包括稳定经济，这是常见错误选项。","key":true},{"k":"价格发现功能","v":"标准化合约集中竞价形成公开、连续、权威的预期价格，提高供求信息利用效率，为现货市场提供参考价。"},{"k":"投机功能","v":"投机交易不是减弱而是增强市场流动性，还承担套期保值者转移的风险，是期货市场正常运营的保证。","key":true},{"k":"投机交易功能","v":"投机者以承担价格风险换取价差收益，为套保者提供对手盘；没有投机，套保盘找不到成交对手，市场将萎缩。"},{"k":"套期保值类型","v":"买入套保锁定未来采购成本，卖出套保锁定现有存货售价；基差变动决定套保的最终效果，基差风险无法完全消除。"}]},{"t":"风险识别与运用","points":[{"k":"衍生品六大风险","v":"市场风险、信用风险、流动性风险、操作风险、法律风险、结算风险六类；对手违约归信用风险，不归流动性风险。","key":true},{"k":"杠杆两面性","v":"保证金5%时价格反向波动5%即亏光本金，杠杆同比例放大收益与亏损，是危机中风险快速传染的根源。"},{"k":"2008危机教训","v":"CDS等场外衍生品层层嵌套、杠杆过高、对手方风险不透明，引发系统性风险，此后监管推动中央清算与信息报备。"},{"k":"基金运用目的","v":"基金参与衍生品只能用于对冲风险、有效管理组合，不得用于放大杠杆投机，且须与基金的风险承受能力和合同约定匹配。","key":true},{"k":"对冲效果衡量","v":"套保后盯基差：基差走强对卖出套保有利，走弱对买入套保有利；基差风险是套保无法消除的残余风险。"},{"k":"场内场外选择","v":"要个性化、长期限、大金额选场外远期或互换；要流动性、低信用风险选场内期货期权，本质是成本与风险的权衡。"}]}],"formulas":[{"n":"杠杆倍数","f":"杠杆倍数 = 合约价值 ÷ 保证金 = 1 ÷ 保证金比例","u":"算保证金交易的放大倍数，如保证金5%即20倍。"},{"n":"看涨期权内在价值","f":"看涨期权内在价值 = max(标的资产价格 − 执行价格, 0)","u":"判断看涨期权是否实值及最低价值。"},{"n":"看跌期权内在价值","f":"看跌期权内在价值 = max(执行价格 − 标的资产价格, 0)","u":"判断看跌期权是否实值及最低价值。"},{"n":"期权价值构成","f":"期权价格 = 内在价值 + 时间价值","u":"解释临近到期时间价值趋零、期权只剩内在价值。"},{"n":"基差","f":"基差 = 现券价格 − 期货价格 × 转换因子","u":"判断国债期货期现套利空间与套保效果。"}],"traps":["期货信用风险比远期小，因为有中央对手方和逐日盯市，别把两者记反。","无风险利率上升，看涨期权涨、看跌期权跌，不是都跌。","期货只能转移风险不能消除风险，功能里没有稳定经济。","交易对手违约是信用风险，不是流动性风险，这是经典偷换。","期权买方不缴保证金只付权利金，期货买卖双方都要缴保证金。","互换主要在场外非标准化交易，并非和期货一样都在交易所。"],"must":["债券远期：单只债券买入、卖出总余额分别不超过流通量的20%","中金所国债期货：2年、5年、10年、30年期，无1年期","债券远期交易期限最长365天，银行间同业拆借中心交易","保证金5%对应杠杆20倍，价格反向动5%即亏光本金","期货市场两大基本功能：风险管理、价格发现","国债期货合约标的为面值100万元、票面利率3%的名义国债"],"mnemonic":["期货四品种记“二五十三”，唯独没有一年期","期权六因素：标价、执行、期限、波动、利率、红利","期货功能只记“避险加发现”，投机送流动性，没有稳经济"]},{"id":9,"name":"业绩评价与归因","why":"业绩评价把基金从赚了多少钱翻译成靠能力还是靠运气，它承接前面的投资理论与风险度量，又直接服务于投资者选基和管理人改进，是收官判断环节。","logic":"先立GIPS制度规范→再算收益与风险→用风险调整后收益横向比较→靠归因拆解超额收益来源→最后看回撤判断真实体验","sections":[{"t":"制度与体系","points":[{"k":"GIPS业绩年限","v":"公司成立满5年，公告GIPS合规业绩时至少汇报最近5年；不足5年则汇报自成立以来全部年份，此后每年补报一年直至10年","key":true},{"k":"组合群收益计算","v":"自2006年1月1日起，投资管理机构必须至少每季度计算一次组合群收益，并用个别投资组合的收益按资产加权计算","key":true},{"k":"GIPS核心原则","v":"自愿采用，但一旦宣称合规就必须全面遵守：覆盖公司全部实际管理资产，公平、完整、一致地披露业绩","key":false},{"k":"GIPS披露内容","v":"须披露业绩比较基准、费率、资产规模、收益计算方法、组合群定义，以及业绩是否经过独立第三方验证","key":false},{"k":"评价三大功能","v":"评价基金经理的投资管理能力、为投资者选择基金提供依据、为管理人改进投资流程提供反馈","key":false},{"k":"评价流程","v":"收集数据→选定业绩比较基准→计算风险调整后收益→业绩归因→形成评价报告，五步顺序不能颠倒","key":false},{"k":"指标三大分类","v":"分收益指标、风险指标、风险调整后收益指标三类；管理费率只是收费项目，不属于业绩评价指标","key":true}]},{"t":"收益计量","points":[{"k":"时间加权收益率","v":"各期收益率连乘、剔除申购赎回现金流影响，反映基金经理主动管理能力，是评价业绩的首选口径","key":true},{"k":"资金加权收益率","v":"考虑现金流发生的时间和规模，相当于投资者实际拿到的内部收益率，与时间加权收益率可能不同","key":false},{"k":"几何平均收益率","v":"对各期收益率连乘后开n次方，考虑复利效应，数值低于算术平均，更真实反映长期收益水平","key":false},{"k":"基金区间收益率","v":"区间收益等于（期末净值−期初净值+期间分红）÷期初净值，分红再投资的部分必须还原计入","key":false},{"k":"年化收益率","v":"把不足一年或超过一年的收益折算成一年口径，便于不同期限产品横向比较，长期宜用几何年化","key":false},{"k":"业绩比较基准","v":"须事先约定并公开披露，与组合风格匹配、可复制可投资，是衡量超额收益和做归因的标尺","key":true}]},{"t":"风险指标","points":[{"k":"收益标准差","v":"收益率偏离均值的离散程度，衡量基金总风险；数值越大波动越大，它就是夏普比率的分母","key":true},{"k":"贝塔系数","v":"衡量组合相对市场的系统性风险，市场β为1；β大于1涨跌放大，组合β为各证券β的加权平均","key":false},{"k":"股票基金风险指标","v":"股票基金风险指标主要是标准差和β；久期衡量债券对利率变动的敏感度，属于债券指标，不能反映股票基金风险","key":true},{"k":"跟踪误差","v":"基金收益率与基准收益率之间日差异收益率的标准差；选指数基金最重要的参考指标，越小跟踪越紧","key":true},{"k":"预期损失","v":"又称条件风险价值CVaR、条件尾部期望或尾部损失，衡量损失超过VaR时的平均损失水平","key":false},{"k":"下行标准差","v":"只统计低于目标收益的波动，不惩罚上涨；局限是考察期内一直跑赢目标时下行数据点不足，无法计算","key":false}]},{"t":"风险调整收益","points":[{"k":"夏普比率","v":"（组合收益−无风险利率）÷标准差，单位总风险获得的超额收益，数值越大风险调整后表现越好","key":true},{"k":"特雷诺比率","v":"（组合收益−无风险利率）÷β，单位系统风险获得的超额收益，适合已充分分散化的组合","key":false},{"k":"詹森阿尔法","v":"实际收益减去CAPM按β算出的预期收益，α大于0说明获得了超越市场风险的选股超额收益","key":false},{"k":"信息比率","v":"超额收益÷跟踪误差，即单位跟踪误差对应的超额收益；30%减20%得10%，10%÷50%等于0.2","key":true},{"k":"索提诺比率","v":"（组合收益−无风险利率）÷下行标准差，只惩罚下行波动，更适合收益分布不对称的基金","key":false},{"k":"指标归类","v":"夏普、特雷诺、詹森α、信息比率属风险调整后收益；下行波动率只是风险指标，不属于这一类","key":true}]},{"t":"局限与选用","points":[{"k":"信息比率与夏普","v":"夏普比率用标准差衡量总风险，信息比率用跟踪误差衡量主动风险；说两者都经总风险调整就是错的","key":true},{"k":"风险调整收益局限","v":"无风险利率理论值与国债实际收益率不同；波动加大统计误差影响α测度；缺少完全代表性的市场指数；β并非固定不变","key":true},{"k":"指标不可单用","v":"任何单一指标只反映一个侧面，须多指标交叉并配合定性分析，还要看考察期长短和市场环境","key":false},{"k":"指数基金选择","v":"首先要看跟踪误差，其次比较管理费率、基金规模与流动性；跟踪误差越小越能贴近指数收益","key":true},{"k":"主动基金评价","v":"重点看信息比率和α的大小与稳定性，超额收益应来自选股和配置能力而不是某段行情的运气","key":false},{"k":"考察期选择","v":"考察期至少覆盖一个完整市场周期，通常取3至5年，短期排名受风格和市场情绪干扰很大","key":false}]},{"t":"归因分析","points":[{"k":"Brinson模型","v":"基于持仓数据，把组合与基准的收益差异分解为资产配置效应、证券选择效应和交互效应","key":true},{"k":"归因数据来源","v":"Brinson模型基于持仓数据做归因；另有基于收益率数据的多因子归因，不需要持仓明细","key":true},{"k":"资产配置效应","v":"（组合行业权重−基准行业权重）×（基准行业收益−基准总收益），衡量超配低配行业的贡献","key":false},{"k":"证券选择效应","v":"基准行业权重×（组合行业收益−基准行业收益），衡量同一行业内选股能力的贡献","key":false},{"k":"归因步骤","v":"确定基准→拆分组合与基准的收益→量化各项效应→解释超额收益来源并形成结论","key":false},{"k":"归因意义","v":"判断超额收益究竟来自资产配置还是证券选择，据此评估基金经理能力的来源与可持续性","key":false}]},{"t":"回撤控制","points":[{"k":"最大回撤","v":"考察期内净值从最高点跌到最低点的最大跌幅，衡量极端下行风险和投资者最差的持有体验","key":true},{"k":"控制回撤方法","v":"分散持股、控制股票仓位、行业均衡配置、严格执行止损纪律，用低相关资产对冲系统性风险","key":true},{"k":"回撤与波动","v":"回撤看净值从峰值下跌的幅度，与路径有关；波动率看收益的离散程度，两者不能互相替代","key":false},{"k":"回撤修复","v":"下跌50%需要上涨100%才能回本，回撤越深修复越难，控制回撤比一味追求高收益更重要","key":false},{"k":"综合结论","v":"把收益、风险、风险调整后收益和归因结果放在一起看，避免只看短期排名或单一指标下结论","key":false}]}],"formulas":[{"n":"夏普比率","f":"Sp=（Rp−Rf）÷σp","u":"衡量单位总风险的超额收益，用于同类基金横向比较"},{"n":"特雷诺比率","f":"Tp=（Rp−Rf）÷βp","u":"只用系统风险调整，评价已充分分散的组合"},{"n":"信息比率","f":"IR=（Rp−Rb）÷跟踪误差","u":"评价主动管理获取超额收益的稳定性和效率"},{"n":"詹森α","f":"α=Rp−[Rf+βp×（Rm−Rf）]","u":"判断是否获得超越CAPM预期的超额收益"},{"n":"索提诺比率","f":"（Rp−Rf）÷下行标准差","u":"收益分布不对称、只在意下跌风险时使用"},{"n":"跟踪误差","f":"TE=日差异收益率序列的标准差","u":"选指数基金的首要指标，越小跟踪越紧"},{"n":"基金区间收益","f":"R=（期末净值−期初净值+分红）÷期初净值","u":"计算单只基金某一区间的净值增长率"},{"n":"最大回撤","f":"（峰值净值−谷值净值）÷峰值净值","u":"衡量极端下行风险与最差持有体验"}],"traps":["夏普用标准差衡量总风险，信息比率用跟踪误差衡量主动风险，说两者都经总风险调整就错","久期是债券利率风险指标，只能衡量债券基金，不能用来反映股票基金的风险","下行波动率是风险指标，不属于风险调整后收益指标，四类风险调整收益里没有它","算信息比率先减基准收益：30%减20%得10%，再除以50%跟踪误差，答案0.2不是0.6","下行标准差长期跑赢目标时缺少下行数据点，是局限而不是优点，别理解成更全面","预期损失就是条件风险价值、条件尾部期望、尾部损失，考别名时不要另找新指标"],"must":["GIPS：成立满5年至少汇报5年，不足5年汇报自成立以来，之后逐年补报至10年","组合群收益：2006年起至少每季度计算一次，按个别组合收益资产加权","信息比率=超额收益÷跟踪误差，衡量单位跟踪误差的超额收益","夏普比率分母是标准差，特雷诺比率分母是β","Brinson归因模型基于持仓数据，拆配置、选股、交互效应","最大回撤：下跌50%需上涨100%才能回本"],"mnemonic":["三个分母记牢：夏普标准差、特雷诺β、信息比率跟踪误差","GIPS记五季：五年业绩起步、每季度算组合群","归因看持仓：先配置后选股，交互效应别漏掉"]},{"id":10,"name":"另类投资与创新产品","why":"本章把投资视野从传统股债扩展到另类资产，并把ETF、LOF、FOF、货币基金等创新产品纳入统一产品谱系，是产品选择与风险判断的落脚点。","logic":"界定另类范围→分清产品类型→掌握ETF、LOF、FOF运作→用估值与套利标准判断","sections":[{"t":"另类投资界定","points":[{"k":"另类投资范围","v":"另类投资是传统股票、债券之外的金融和实物资产；对冲基金、私募股权、房地产、大宗商品属于，权益与固收不属于。","key":true},{"k":"另类资产","v":"REITs、大宗商品、私募股权、对冲基金、艺术品是另类资产；股票、债券等传统资产不是。","key":false},{"k":"另类投资基金","v":"另类投资基金是投资于传统股票、债券之外金融和实物资产的基金，如房地产基金、证券化资产基金。","key":false},{"k":"另类投资特征","v":"特点是涵盖范围广、发展速度快、监管难度大；同时透明度低、流动性差、费用高。","key":false},{"k":"另类投资局限","v":"局限是估值基于一系列假设、数据来源不可靠、准确性较低，且流动性差、透明度低。","key":true},{"k":"另类投资分类","v":"主流分类为私募股权、对冲基金、房地产、大宗商品四类；公募REITs是房地产的证券化形式。","key":false}]},{"t":"私募股权基金","points":[{"k":"私募股权风险","v":"私募股权投资非上市企业股权，整体风险高；其中风险投资处于高风险领域，投向早期与初创企业。","key":false},{"k":"风险投资退出","v":"风险投资不靠分红，而是通过IPO、并购、回购等资本退出，从股权增值中获取回报。","key":true},{"k":"私募J曲线","v":"J曲线横轴是时间（基金存续期），纵轴是累计收益或收益率，前期为负、后期转正。","key":true},{"k":"J曲线成因","v":"前期管理费与投资成本使收益为负，后期项目退出、股权增值使曲线抬升，形态像字母J。","key":false},{"k":"私募股权流动性","v":"私募股权投非上市股权、封闭期长、无公开交易市场，流动性差，估值只能依靠模型测算。","key":false}]},{"t":"对冲与商品","points":[{"k":"对冲基金策略","v":"对冲基金策略灵活、可加杠杆；长期资本管理公司采用收敛套利，持有低流动性资产、卖空高流动性资产。","key":false},{"k":"对冲基金风险","v":"该案例涉及市场风险、流动性风险和信用风险，没有涉及操作风险；流动性错配是失败关键。","key":true},{"k":"大宗商品特征","v":"大宗商品是同质化、可交易的资产，不是异质化；价格主要受供求、美元、通胀和地缘政治影响。","key":true},{"k":"大宗商品作用","v":"大宗商品与股债相关性低，可分散组合风险并对冲通胀，但无现金流、波动大。","key":false}]},{"t":"房地产与REITs","points":[{"k":"房地产与通胀","v":"宏观经济因素中对房地产投资影响最大的是通货膨胀，通胀会推高租金与物业价格。","key":true},{"k":"零售房地产","v":"零售房地产指购物中心、商铺、超市等零售物业；住宅、写字楼、工业、酒店不属于零售类。","key":false},{"k":"房地产投资信托","v":"REITs主要投资房地产，可在证券交易所挂牌上市，收益来自租金，通常强制分红。","key":false},{"k":"公募REITs","v":"我国公募REITs底层资产以基础设施为主，如收费公路、产业园区、仓储物流，采用封闭式运作。","key":false},{"k":"底层资产计量","v":"公募REITs底层资产通常采用成本模式计量，不是公允价值模式，这是最常设的错误选项。","key":true}]},{"t":"ETF交易机制","points":[{"k":"ETF参考净值频率","v":"开市后按申赎清单和组合证券实时成交价计算，参考净值频率为每15秒发布一次。","key":true},{"k":"折价套利","v":"ETF价格低于基金份额净值时，在二级市场买入份额、再到一级市场赎回，赚取折价。","key":true},{"k":"溢价套利","v":"ETF价格高于基金份额净值时，在一级市场申购份额、再到二级市场卖出，赚取溢价。","key":false},{"k":"ETF申赎对价","v":"场内申赎对价是一篮子组合证券加现金替代；场外申购赎回对价均为现金。","key":false},{"k":"ETF份额折算","v":"份额折算后净值归一，持有人按折算后的基金份额享有权利并承担义务，权益不受影响。","key":false},{"k":"建仓期限","v":"ETF建仓期不超过3个月，建仓期内仓位可不足，建仓完成后追求跟踪指数。","key":true}]},{"t":"ETF类型披露","points":[{"k":"宽基行业主题","v":"股票ETF按投资范围分为宽基、行业、主题三类，不存在高换手ETF这一分类。","key":false},{"k":"ETF联接比例","v":"ETF联接基金投资于目标ETF的资产不得低于基金资产净值的90%，其余可投现金等。","key":true},{"k":"持有人披露","v":"相比场外股票基金，股票ETF多披露前十大持有人，持有人结构更透明。","key":true},{"k":"ETF上市交易","v":"ETF在交易所上市，二级市场按市价买卖、一级市场按净值申赎，两个价格靠套利收敛。","key":false}]},{"t":"LOF与FOF","points":[{"k":"上市开放式基金","v":"LOF即上市开放式基金，是我国对证券投资基金的本土化创新，可场外申赎、也可场内买卖。","key":false},{"k":"LOF交易机制","v":"LOF既能在交易所买卖，也能在指定网点申购赎回，两个系统通过跨系统转托管衔接。","key":true},{"k":"LOF交易规则","v":"T日买入的LOF份额，T+1日才能卖出或赎回；T日买入当日卖出或赎回是错误说法。","key":true},{"k":"FOF投资对象","v":"FOF主要投资其他基金产品，通过专业筛选实现分散配置，但存在双重收费。","key":false},{"k":"FOF优势","v":"FOF的优势是分散风险、降低选基门槛、由专业机构管理，适合无暇研究基金的投资者。","key":false}]},{"t":"货币基金","points":[{"k":"货币基金风险","v":"货币市场基金投资短期货币工具，通常被认为是风险最低的基金类型，流动性好。","key":false},{"k":"重要货基指标","v":"重要货币市场基金平均剩余期限不得超过120天，不是60天；流动性受限资产另有10%上限。","key":true},{"k":"快速赎回上限","v":"单只货币基金单日快速赎回（T+0）金额上限为1万元，超出部分只能走普通赎回。","key":true},{"k":"货币基金杠杆","v":"除巨额赎回等情形外，货币基金债券正回购资金余额不得超过基金资产净值的20%。","key":true},{"k":"货币基金收益起算","v":"申购当日不享收益，T+1个工作日起计息；9月30日申购、10月8日复市，则10月8日起算。","key":false}]}],"formulas":[{"n":"折价率","f":"折价率 =（基金份额净值 − 二级市场价格）÷ 基金份额净值 × 100%","u":"ETF价格低于净值、判断折价套利空间时用"},{"n":"溢价率","f":"溢价率 =（二级市场价格 − 基金份额净值）÷ 基金份额净值 × 100%","u":"ETF价格高于净值、判断溢价套利空间时用"},{"n":"联接基金投资比例","f":"投资目标ETF资产 ÷ 基金资产净值 ≥ 90%","u":"判断ETF联接基金是否符合投资比例要求"}],"traps":["权益、固定收益不算另类，另类是对冲基金、私募股权、房地产、大宗商品。","J曲线横轴是投资金额、纵轴是收益率：错；横轴是时间，纵轴是累计收益或收益率。","折价套利方向记反：价格低于净值应买入并赎回，价格高于净值才申购并卖出。","LOF当日买入当日可卖可赎：错，T日买入要到T+1日才能卖出或赎回。","公募REITs底层资产按公允价值计量：错，通常采用成本模式计量。","重要货基平均剩余期限记成60天：应为120天；正回购上限20%不是40%。"],"must":["ETF基金份额参考净值：每15秒发布一次","ETF建仓期不得超过3个月，即成立后3个月内完成","ETF联接基金投资目标ETF不低于净值90%","单只货币基金单日快速赎回（T+0）上限为1万元","货币基金债券正回购资金余额不超过净值20%","重要货币市场基金平均剩余期限不超过120天","LOF份额T日买入，T+1日才可卖出或赎回"],"mnemonic":["另类四宝：私募股权、对冲基金、房地产、大宗商品，股债不算。","J曲线先抑后扬：横轴时间、纵轴收益，先负后正。","折价买赎、溢价申卖；15秒净值、3月建仓、90%联接。"]},{"id":11,"name":"交易·结算·市场","why":"这一章回答基金的钱怎么变成券、券怎么变成钱：市场分层决定交易机制，报价与指令形成价格，结算完成钱券交割，是投资决策走向落地的执行底座。","logic":"市场分层定机制→参与者双向报价→指令撮合形成价格→合规执行→钱券交收闭环","sections":[{"t":"货币市场定位","points":[{"k":"货币市场功能","v":"货币市场融通短期资金、管理流动性、传导货币政策，是商业银行调节头寸的工具，不提供长期资金。","key":true},{"k":"货币市场利率","v":"货币市场交易的是资金使用权，价格就是利率，由供求决定，是基准利率和市场利率体系的基础。","key":false},{"k":"货币市场工具特征","v":"期限在1年以内、流动性高、风险低、收益稳定，是货币基金和现金管理类产品的底层资产。","key":false},{"k":"同业拆借主体","v":"同业拆借主体是金融机构法人，包括商业银行、证券公司、保险公司、基金公司，不包括中央银行。","key":true},{"k":"回购市场功能","v":"回购是短期融资和流动性调节工具，正回购融入资金、逆回购融出资金，期限多在1年以内。","key":false}]},{"t":"参与者与驱动","points":[{"k":"做市商收入","v":"报价驱动市场中做市商连续报出买卖双向价格，收入来源是买卖价差，靠承担存货风险换取价差收益。","key":true},{"k":"做市商经纪人","v":"做市商是流动性的主要提供者，双向报价并承担库存风险；经纪人是买卖指令的执行者，只撮合收佣金。","key":true},{"k":"经纪人市场","v":"商品特殊或只在少数投资者之间交易时形成经纪人市场，经纪人牵线撮合，自己不持仓也不报价。","key":false},{"k":"报价驱动与指令驱动","v":"报价驱动靠做市商报价成交，用于场外债券、外汇；指令驱动靠买卖指令集中竞价撮合，用于交易所股票。","key":false},{"k":"竞价成交原则","v":"指令驱动市场按价格优先、时间优先撮合，成交价由买卖双方指令共同决定，没有做市商居中报价。","key":false}]},{"t":"报价与价格形成","points":[{"k":"报价最小变动单位","v":"封闭式基金竞价申报价格最小变动单位为0.001元，以100份为一手，与股票0.01元不同。","key":true},{"k":"申报价格单位","v":"LOF申报价格最小变动单位也是0.001元，ETF同为0.001元，只有股票是0.01元，这是最易混的对照。","key":true},{"k":"开盘价形成","v":"开盘价由集合竞价产生，未成交的申报自动进入连续竞价继续参与，不是作废。","key":true},{"k":"收盘价规则","v":"上交所股票收盘价由收盘集合竞价产生，当日无成交的，以前一交易日收盘价作为当日收盘价。","key":false},{"k":"首日开盘参考价","v":"ETF上市首日开盘参考价取前一工作日的基金份额净值，不是发行价，也不是面值1元。","key":false},{"k":"集合竞价时段","v":"开盘集合竞价9:15—9:25，其中9:20后不可撤单；收盘集合竞价14:57—15:00，沪深两市均设。","key":false}]},{"t":"特殊交易安排","points":[{"k":"大宗交易","v":"大宗交易受理不止收盘后：上交所9:30—11:30、13:00—15:30均可申报，15:00—15:30为成交申报时段。","key":true},{"k":"回转交易","v":"深交所对专项资产管理计划收益权份额协议交易实行当日回转交易，即T+0，当日买入当日可卖。","key":true},{"k":"固收平台交易","v":"上交所固定收益证券综合电子平台上，交易商当日买入的固定收益证券当日可以卖出，实行T+0。","key":false},{"k":"融资融券","v":"融资是借证券公司的资金买入证券即买空，融券是借证券卖出即卖空，两者都要交保证金并付利息费用。","key":false},{"k":"质押式回购","v":"质押式回购只质押冻结债券、所有权不转移；买断式回购债券所有权发生转移，到期再约定买回。","key":true}]},{"t":"交易成本","points":[{"k":"隐性成本","v":"隐性成本不直接出现在账单上，包括冲击成本、买卖价差和延迟成本，冲击成本是大额交易的主要隐性成本。","key":true},{"k":"显性成本","v":"显性成本直接计入账单，包括佣金、印花税、过户费、交易经手费，按成交金额比例或笔数收取。","key":false},{"k":"场内交易费用","v":"场内证券交易费用包括佣金、过户费、印花税、经手费和证管费，不包括销售服务费。","key":false},{"k":"过户费归属","v":"过户费由中国结算公司收取，是成交后办理证券过户登记的费用，最终收取方不是交易所也不是券商。","key":false},{"k":"印花税调节","v":"证券交易印花税单边征收、税率1‰、只对卖方收取，税率和征收方向可由主管部门调节，并非固定不变。","key":true}]},{"t":"指令与内控","points":[{"k":"交易指令流程","v":"基金公司内部顺序固定：基金经理下达指令，相关人员审核，交易员择机执行，先审后交不可颠倒。","key":false},{"k":"交易指令审核","v":"投资指令的合法合规性由交易主管等人员审核，交易员不承担审核职责，也不得以可能不盈利为由拒单。","key":true},{"k":"交易员职责","v":"交易员按已审核指令择机执行、争取最优价格，发现指令违规应拒绝执行并立即报告，不得自行改单。","key":false},{"k":"公平交易与留痕","v":"同一指令涉及多只基金时按公平交易原则分配，禁止向特定账户输送利益，交易记录全程留痕备查。","key":false}]},{"t":"结算制度与方式","points":[{"k":"净额结算","v":"多边净额结算把应收应付轧差后只交割净额，适用于中小板股票、主板股票和基金等场内品种。","key":true},{"k":"结算方式","v":"单笔交易规模大的债券市场适合逐笔全额结算，一笔一清、不做轧差，能有效降低本金风险。","key":true},{"k":"共同对手方","v":"共同对手方介入买卖双方、成为各自对手方，一方违约时由它先履约完成交收，不会冻结守约方。","key":true},{"k":"证券交收层次","v":"证券交收分两级：中国结算沪、深分公司与结算参与人交收，结算参与人再与客户交收。","key":true},{"k":"结算代理资格","v":"银行间债券市场开展结算代理业务的金融机构法人，须经中国人民银行批准，不是证监会或交易所。","key":false},{"k":"见券付款","v":"见券付款是先划券、后付款，属先券后款；日终仍无付款指令则结算失败，债券解冻退回。","key":false},{"k":"券款对付","v":"券款对付即DVP，钱券同步划转、一手交钱一手交券，是银行间市场本金风险最低的结算方式。","key":false}]},{"t":"债券流通与登记","points":[{"k":"债券流通起始","v":"国债、政策性金融债可交易期限在366天含以下的，交易流通起始日为债权债务登记日的次一个工作日。","key":true},{"k":"交易流通起始日","v":"国债、政策性金融债可交易期限在366天以上的，交易流通起始日为债权债务登记日后的第三个工作日。","key":false},{"k":"债券分销","v":"分销业务中承销商过户给分销认购人的是承销债券的额度，认购人据此在登记托管机构登记债权。","key":false},{"k":"债券登记托管","v":"债券实行登记托管，中央结算公司托管银行间债券、交易所登记公司托管场内债券，过户即变更登记。","key":false},{"k":"银行间市场","v":"银行间债券市场是机构投资者的场外市场，以询价谈判、逐笔全额结算为主，结算代理须央行批准。","key":false}]}],"formulas":[{"n":"印花税","f":"印花税 = 成交金额 × 1‰","u":"卖出证券时单边缴纳，只在卖方账单上出现"},{"n":"佣金","f":"佣金 = 成交金额 × 佣金率","u":"买卖双向收取，费率上限3‰、单笔起点5元"},{"n":"结算净额","f":"净额 = 应收资金 − 应付资金","u":"多边净额结算下只交割轧差后的净额"},{"n":"维持担保比例","f":"维持担保比例 = (现金 + 信用证券市值) ÷ (融资买入金额 + 融券市值 + 利息费用) × 100%","u":"融资融券账户监控是否触及平仓线"}],"traps":["质押式回购债券所有权不转移，只是冻结质押；买断式回购才发生所有权转移，两者别混。","交易员不是审核主体，合法合规审核由交易主管负责，交易员也不能以不盈利为由拒单。","场内交易费用不含销售服务费，销售服务费由基金投资者承担，不属于交易环节收费。","集合竞价未成交的申报不是作废，而是自动进入连续竞价继续撮合，这是高频陷阱。","大宗交易不是收盘后才受理，上交所9:30起可申报，15:00起为成交申报。","净额结算用于股票、基金等场内品种；单笔金额大的债券用逐笔全额结算，别记反。"],"must":["封闭式基金与LOF申报价格最小变动单位：0.001元","债券流通起始：366天含以下为登记日次一个工作日","债券流通起始：366天以上为登记日后第三个工作日","印花税：单边征收、税率1‰、只对卖方收取","大宗交易成交申报时段：15:00—15:30","交易指令流程：经理下达、人员审核、交易员执行"],"mnemonic":["先审后交：经理下单、主管审核、交易员跑单，顺序不能倒。","366以内次一日，366以上第三日，含与不含看天数。","质不转、买断转；见券先券，见款先款。"]}],"sum":{"numbers":[{"item":"基金季度报告披露时限","val":"季度结束后15个工作日内","ch":1,"note":"记：季报15个工作日、半年报60日、年报90日"},{"item":"基金半年度报告披露时限","val":"上半年结束后60日内","ch":1,"note":"60日内披露摘要和全文"},{"item":"基金年度报告披露时限","val":"年度结束后90日内","ch":1,"note":"年报90、半年报60、季报15个工作日"},{"item":"年度报告独立董事签字比例","val":"2/3以上独立董事签字同意，并由董事长签发","ch":1,"note":"独董2/3，董事长签发"},{"item":"基金募集期限","val":"收到核准文件之日起6个月内进行发售","ch":1,"note":"6个月内发售"},{"item":"募集验资与备案时限","val":"募集期限届满之日起10日内验资，收到验资报告之日起10日内提交备案","ch":1,"note":"10日验资加10日备案"},{"item":"募集失败退款时限","val":"募集期限届满后30日内返还并加计银行同期存款利息","ch":1,"note":"30日退款"},{"item":"基金份额持有人大会公告提前期","val":"至少提前30日公告","ch":1,"note":"30日公告时间、形式、事项、程序、表决方式"},{"item":"持有人大会特别决议表决比例","val":"参加大会的基金份额持有人所持表决权的2/3以上通过","ch":1,"note":"转换运作方式等重大事项2/3"},{"item":"基金托管人职责终止后选任新托管人期限","val":"6个月内选任","ch":1,"note":"持有人大会6个月内选任"},{"item":"基金托管资格取消条件","val":"连续3年没有开展基金托管业务","ch":1,"note":"3年无业务即取消资格"},{"item":"基金临时报告编制披露时限","val":"重大事件发生之日起2日内编制并披露，并报证监会及地方证监局备案","ch":1,"note":"2日临时报告"},{"item":"基金定期报告备案时限","val":"披露后第2个工作日备案","ch":1,"note":"报证监会、地方证监局、上市交易所"},{"item":"基金份额净值计价错误临时报告阈值","val":"计价错误金额达基金份额净值的0.5%","ch":1,"note":"0.5%净值差错编临时报告"},{"item":"QFII单个境外投资者持股上限","val":"不超过该公司股份总数的10%","ch":1,"note":"单个10%、全部境外合计30%"},{"item":"全部境外投资者持有单一上市公司A股合计上限","val":"合计不超过该公司股份总数的30%","ch":1,"note":"10%看单个，30%看合计"},{"item":"QFII托管人实收资本要求","val":"不少于80亿元人民币","ch":1,"note":"托管人80亿"},{"item":"QFII资产管理机构准入门槛","val":"经营资产管理业务2年以上，最近一个会计年度管理的证券资产不少于5亿美元","ch":1,"note":"2年加5亿美元"},{"item":"境外机构及境外托管人最近无重大处罚年限","val":"最近3年未受所在国家或地区监管机构重大处罚","ch":1,"note":"QDII顾问、QFII申请人、境外托管人一律3年"},{"item":"合格境外投资者投资本金锁定期","val":"3个月","ch":1,"note":"养老、保险、共同基金及开放式中国基金为3个月"},{"item":"发起式基金自动终止条件","val":"基金合同生效3年后基金资产净值低于2亿元","ch":1,"note":"3年加2亿元自动终止"},{"item":"公募基金份额上市交易条件","val":"募集金额不低于2亿元人民币，基金份额持有人不少于1000人","ch":1,"note":"2亿元加1000人"},{"item":"股票型基金股票投资比例下限","val":"不低于基金资产的80%","ch":1,"note":"股票型80%投股，债券型80%投债"},{"item":"港股通基金港股投资比例","val":"投资港股通标的股票不低于非现金资产的80%","ch":1,"note":"80%按非现金资产算"},{"item":"基金净值公告最低频率","val":"封闭式基金以及开办申赎前的开放式基金至少每周1次","ch":1,"note":"每周1次"},{"item":"半年度报告净值增长率披露年限","val":"不需披露过去5年的净值增长率","ch":1,"note":"半年报不披露5年，年报才披露"},{"item":"股票投资组合重大变动披露阈值","val":"报告期内累计买入或卖出价值超出期初基金资产净值2%的股票","ch":1,"note":"2%门槛"},{"item":"QDII基金份额登记日期","val":"T+2","ch":1,"note":"QDII份额登记T+2"},{"item":"资管新规发布时间","val":"2018年","ch":1,"note":"2018年发布资管新规"},{"item":"交易时段客户交易区监控录像保存期限","val":"不得少于6个月","ch":2,"note":"录像6个月"},{"item":"客户身份资料保存期限","val":"自业务关系结束当年起至少保存15年","ch":2,"note":"销售机构15年；一次性交易记录自记账当年起5年"},{"item":"客户交易终端信息与电子化开户资料保存期限","val":"不少于20年","ch":2,"note":"电子资料20年，比身份资料15年更长"},{"item":"大额交易报告时限","val":"大额交易发生后5个工作日内","ch":2,"note":"5个工作日向反洗钱监测分析中心报告"},{"item":"认（申）购费免收的持有期门槛","val":"持有期低于3年的不得免收","ch":3,"note":"3年内不免申购费"},{"item":"宣传推介材料风险提示影像时长","val":"至少5秒钟","ch":3,"note":"影视、网络宣传至少5秒风险提示"},{"item":"基金宣传推介材料备案时限","val":"向公众分发或发布之日起5个工作日内","ch":3,"note":"管理人报主要经营地证监局，代销机构报工商注册地证监局"},{"item":"宣传材料登载过往业绩的限制","val":"基金合同生效不足6个月的除外","ch":3,"note":"6个月内不得登载过往业绩"},{"item":"个人投资者开户年龄","val":"18至70周岁","ch":3,"note":"18到70周岁"},{"item":"被出具监管警示函后的报送要求","val":"6个月内连续2次被出具警示函仍未改正的，宣传材料须事先报送证监会","ch":3,"note":"6个月2次"},{"item":"开放式基金估值与净值披露","val":"每个交易日估值，次日披露份额净值","ch":4,"note":"T日估值、T+1披露"},{"item":"封闭式基金估值频率","val":"每个交易日估值","ch":4,"note":"每日估值但每周只披露1次"},{"item":"QDII基金净值披露时限","val":"估值日后2个工作日内","ch":4,"note":"QDII是2个工作日，境内基金次日"},{"item":"申购赎回申请净值截止时点","val":"交易日15:00前按当日净值，15:00后按下一交易日净值","ch":4,"note":"15:00是分界线"},{"item":"认购申请查询时点","val":"T+2日","ch":4,"note":"认购T+2可查询受理情况"},{"item":"货币基金影子定价偏离度报告阈值","val":"偏离度绝对值达到或超过0.5%，事件发生之日起2日内临时报告","ch":4,"note":"0.5%加2日"},{"item":"估值调整影响净值阈值","val":"对前一估值日基金资产净值的影响在0.25%以上","ch":4,"note":"0.25%以上要调整公允价值"},{"item":"巨额赎回认定标准","val":"单个开放日净赎回申请超过基金份额总额的10%","ch":4,"note":"10%即巨额赎回"},{"item":"巨额赎回披露时限","val":"3个工作日内","ch":4,"note":"报证监会备案并在指定媒体披露"},{"item":"赎回费计入基金财产比例","val":"不低于赎回费总额的25%","ch":4,"note":"25%归基金财产，持有期长于6个月且不收销售服务费同样25%"},{"item":"封闭式债券基金杠杆率上限","val":"2倍","ch":4,"note":"封闭式债基杠杆上限200%"},{"item":"基金会计核算频率","val":"已细化到日","ch":4,"note":"每日核算"},{"item":"管理费计提方式","val":"按前一日基金资产净值逐日计提，按月支付","ch":4,"note":"按日计提、按月支付"},{"item":"市场组合的Beta","val":"1","ch":5,"note":"市场组合β等于1"},{"item":"Beta为2的基金波动特征","val":"与市场同向变动，幅度约为市场的2倍","ch":5,"note":"β等于2即两倍波动"},{"item":"净值下跌后的回本涨幅","val":"下跌33%需上涨50%才能回本","ch":5,"note":"跌1/3要涨1/2"},{"item":"实际利率计算","val":"名义利率10%、通胀率-2%时实际利率为12%","ch":5,"note":"实际利率约等于名义利率减通胀率"},{"item":"主动比重为0的含义","val":"组合与基准完全相同","ch":5,"note":"主动比重0等于完全复制基准"},{"item":"杜邦恒等式三因子","val":"净资产收益率等于销售净利率乘总资产周转率乘权益乘数","ch":6,"note":"三因子连乘，不含资产负债率"},{"item":"沪深300指数加权方法","val":"派氏加权法","ch":6,"note":"沪深300用派氏加权，道琼斯用算术平均"},{"item":"可转换债券转换比例","val":"面值500元、转换价格25元时转换比例为20","ch":7,"note":"转换比例等于面值除以转换价格"},{"item":"久期估算净值变动","val":"久期3年、市场利率下降0.5%，净值约上涨1.5%","ch":7,"note":"净值变动约等于久期乘利率变动"},{"item":"债券远期交易限额","val":"单只债券远期交易买入或卖出总余额不超过该债券流通量的20%","ch":8,"note":"20%流通量"},{"item":"期货保证金与杠杆倍数","val":"保证金为合约金额5%时可控制20倍于所投资金额的合约资产","ch":8,"note":"5%保证金等于20倍杠杆"},{"item":"中金所国债期货品种","val":"2年期、5年期、10年期","ch":8,"note":"没有1年期国债期货"},{"item":"期权买方保证金要求","val":"买方无需开立保证金账户，也无需缴纳保证金","ch":8,"note":"买方零保证金，卖方要缴"},{"item":"GIPS组合群收益计算频率","val":"自2006年1月1日起至少每季度计算一次，以资产加权","ch":9,"note":"每季度一次"},{"item":"GIPS业绩历史汇报年限","val":"至少5年","ch":9,"note":"5年以上GIPS业绩"},{"item":"信息比率计算示例","val":"组合收益30%、基准20%、跟踪误差50%，信息比率为0.2","ch":9,"note":"超额收益除以跟踪误差"},{"item":"ETF联接基金投资目标ETF比例","val":"不低于基金资产净值的90%","ch":10,"note":"90%"},{"item":"ETF份额参考净值发布频率","val":"每15秒","ch":10,"note":"15秒一次"},{"item":"ETF建仓期","val":"不超过3个月","ch":10,"note":"3个月建仓"},{"item":"单只货币基金日内快速赎回上限","val":"1万元","ch":10,"note":"快速赎回1万元"},{"item":"货币基金债券正回购余额上限","val":"不得超过基金资产净值的20%","ch":10,"note":"20%，巨额赎回情形除外"},{"item":"重要货币市场基金平均剩余期限","val":"不超过90天","ch":10,"note":"普通货基120天，重要货基90天"},{"item":"LOF份额回转限制","val":"T日买入，T+1日方可卖出或赎回","ch":10,"note":"LOF当日买不能当日卖"},{"item":"场内基金申报价格最小变动单位","val":"0.001元","ch":11,"note":"封闭式基金与LOF都是0.001元"},{"item":"债券交易流通起始日（366天及以下）","val":"债权债务登记日的次一个工作日","ch":11,"note":"短券次日流通"},{"item":"债券交易流通起始日（366天以上）","val":"债权债务登记日后的第三个工作日","ch":11,"note":"长券第三个工作日"},{"item":"深交所专项资产管理计划收益权份额回转交易","val":"当日回转交易","ch":11,"note":"T+0"},{"item":"ETF上市首日开盘参考价","val":"前一工作日的基金份额净值","ch":11,"note":"前一日净值作参考"}],"confusions":[{"a":"夏普比率","b":"特雷诺比率","diff":"分母是分水岭：夏普除以总风险σ，非系统性风险也罚进去，适合未分散组合；特雷诺除以β，只罚系统性风险，适合已分散组合。同一组合两者排序可能相反。"},{"a":"夏普比率","b":"信息比率","diff":"夏普减无风险利率、分母用总风险σ，衡量绝对收益；信息比率减业绩比较基准、分母用跟踪误差，衡量主动管理能力，评价指数增强和主动基金看它。"},{"a":"ETF","b":"LOF","diff":"ETF用一篮子股票申赎、场内实时成交、有瞬时套利、多被动跟踪指数；LOF用现金申赎、多主动管理、套利靠转托管跨市场搬券，效率低。两者都能场内买卖。"},{"a":"开放式基金","b":"封闭式基金","diff":"份额是否可变：开放式份额随申赎增减、按每日净值成交、无折溢价；封闭式份额固定、存续期内不能赎回、只能场内按市价买卖，因此常有折价。"},{"a":"期货","b":"期权","diff":"权利义务是否对称：期货双方对等、都缴保证金、盈亏线性；期权买方付权利金、只享权利不担义务、不缴保证金，卖方收权利金并缴保证金，风险可能无限。"},{"a":"远期合约","b":"期货合约","diff":"期货是交易所标准化合约、每日无负债结算、有中央对手方、可平仓，信用风险低；远期场外一对一、条款自定、到期才交割，违约风险高、流动性差。"},{"a":"期货","b":"互换","diff":"期货集中竞价、合约标准化、逐日盯市、随时平仓；互换场外双方按约定交换现金流，期限可达数年、条款定制，只在约定时点结算，信用风险更高。"},{"a":"QDII","b":"QFII","diff":"资金方向相反：QDII是境内机构募人民币投境外，投资者在境内；QFII是境外机构汇外汇投境内，投资者在境外。一个走出去，一个请进来。"},{"a":"QFII","b":"RQFII","diff":"QFII汇入外汇、需结汇成人民币、占外汇额度并有本金锁定期；RQFII直接用境外人民币投资、额度以人民币计、无结汇环节，投资范围已趋同。"},{"a":"公募基金","b":"私募基金","diff":"公募向不特定公众发行、可公开宣传、披露严、随时可申赎；私募向合格投资者非公开募集、禁止公开宣传、人数受限、多有锁定期、策略灵活但披露少。"},{"a":"股票基金","b":"债券基金","diff":"股票基金至少80%资产投股票，净值大起大落、长期收益高；债券基金至少80%投债，收益靠票息和利率变动，波动小，管理费率也更低。"},{"a":"混合基金","b":"货币市场基金","diff":"混合基金股债比例灵活、净值每日波动；货币基金只投短期限高等级货币工具，用摊余成本法、净值恒定1元、收益每日结转，风险最低收益也最低。"},{"a":"认购","b":"申购","diff":"认购在募集期、按1元面值、成立后封闭不能赎回；申购在开放日、按当日份额净值成交、次日起可赎回。认购费率通常更低，但资金要先被锁定。"},{"a":"管理费","b":"托管费","diff":"管理费付基金管理人、按前一日资产净值逐日计提，是基金公司主要收入；托管费付托管银行、费率低得多，对应保管资产和复核净值。两者都从基金资产列支。"},{"a":"申购费","b":"销售服务费","diff":"申购费买入时一次性收取、属交易费用，持有越久越可能免收；销售服务费按日从基金资产计提、持续收取，对应不收申购赎回费的C类份额。"},{"a":"摊余成本法","b":"市值法","diff":"摊余成本法按成本加摊销、净值平滑不反映市价，只适用货币基金等；市值法按公允价值计量、净值随市价跳动。影子定价偏离0.5%就是揭示摊余成本的风险。"},{"a":"系统性风险","b":"非系统性风险","diff":"系统性风险来自宏观因素、作用于全部资产、无法分散，只能靠股指期货对冲；非系统性风险是单个公司或行业特有，增加组合资产数量即可分散掉。"},{"a":"自上而下策略","b":"自下而上策略","diff":"自上而下先判断宏观、政策和行业景气再选个股，选股服从行业判断；自下而上直接从个股基本面精选公司，基本不预测宏观，最终落在个股。"}]}}</script>
<script>
// Firebase 的数字题号可能返回带 null 空位的数组，统一还原为题号字典。
window.gongmuNormalize = function (field, value) {
  var out = {};
  if (!value || typeof value !== 'object') return out;
  function count(v) { return typeof v === 'number' && isFinite(v) ? Math.max(0, Math.floor(v)) : 0; }
  Object.keys(value).forEach(function (key) {
    var v = value[key];
    if (field === 'days') {
      if (/^\d{4}-\d{2}-\d{2}$/.test(key) && count(v)) out[key] = count(v);
      return;
    }
    if (!/^[1-9]\d*$/.test(key) || +key > 400 || v == null) return;
    if (field === 'marks') {
      if (v === 1 || v === true) out[key] = 1;
      return;
    }
    if (typeof v !== 'object' || Array.isArray(v)) return;
    if (field === 'prog') {
      var n = count(v.s);
      if (n) out[key] = {s:n, r:Math.min(n, count(v.r)), t:count(v.t)};
    } else if (field === 'wrong') {
      var w = {n:count(v.n), st:count(v.st), t:count(v.t)};
      if (Number.isInteger(v.pick) && v.pick >= 0 && v.pick <= 3) w.pick = v.pick;
      out[key] = w;
    }
  });
  return out;
};
</script>

    '<button id="retryPractice" style="background:#2f62d8;border-radius:8px;padding:9px 12px;color:white">恢复默认页面（保留答题记录）</button>';
