、5年定期利率排成一条线，你能倒推它觉得未来钱会变贵还是变便宜，这就是远期视角。","t":"国债曲线反映远期利率，不是即期利率","r":"国債收益率曲线是反映远期利率的有效途径，它的水平和斜率反映了经济主体对未来通货膨胀的预期和对未来基本的经济形势的判断，蕴含了关于经济主体的风险态度的信息。而且由于国债的发行主体是国家，其被认为不存在违约风险，所以国债收益率曲线便成为对市场无风险利率最合适的替代，从而为其他债券和金融资产以及投资项目提供定价的基准。"},{"i":170,"c":11,"k":"做市商经纪人","q":"关于做市商和经纪人的作用，以下表述正确的是（）。","o":["做市商和经纪人的利润主要来自于证券买卖差价","做市商和经纪人都可以代客买卖证券，获取佣金收入","做市商是市场流动性的主要参与者，经纪人是投资者买卖指令的执行者","做市商和经纪人在证券市场上发挥的作用不同，不可能共同完成证券交易"],"a":2,"p":"做市商自己报出买卖双向价格，用自有库存承接交易，是流动性的主要提供者，赚的是买卖价差；经纪人只替客户找对手方、传递并执行指令，收佣金，不担库存风险。两者分工不同却能配合成交，另三项都错。","e":"像菜市场摊主自己囤菜、挂出买价和卖价赚差价，那是做市商；中介只负责帮你找摊位、收跑腿费，自己不囤货，那是经纪人。","t":"做市商赚价差担库存，经纪人只收佣金","r":"在报价驱动市场中，做市商是市场流动性的主要提供者和维持者，而在指令驱动市场中，市场流动性是由投资者的买卖指令提供的，经纪人只是执行这些指令。"},{"i":171,"c":11,"k":"首日开盘参考价","q":"关于ETF的交易规则，正确的是","o":["上市首日的开盘参考价为前一工作日的基金份额净值","实行涨跌幅限制；涨跌幅设置为20%","买入申报是为 100 份及其整数倍,不足 100 份的不可以卖出","基金申报价最小变动单位为1元"],"a":0,"p":"ETF上市首日没有前收盘价，交易所就用前一工作日的基金份额净值当开盘参考价，让首日涨跌有基准。涨跌幅限制是10%，申报100份起，最小变动单位0.001元，其余三项都说错了。","e":"像二手转卖新款手机，第一天没有成交历史，就按官方指导价当开盘参考，之后才随行就市涨跌，参考价只是起点。","t":"首日开盘参考价取前一工作日份额净值","r":""},{"i":172,"c":3,"k":"认购与申购","q":"关于开放式基金份额认购与申购区别说法错误的是（）","o":["认购费一般低于申购费，认购期购买一般会享受优惠","认购按1元认购，而申购时未知价确认","认购份额在基金合同生效确认，并且有封闭期，而申购常在T+2确认，下一工作日即可赎回。","认购与申购的场所不同"],"a":3,"p":"认购是募集期买新基金，申购是成立后买老基金，两者都能在直销柜台和代销网点办理，场所并无区别，所以说场所不同的是错的。认购费更低、按1元面值，申购按未知价，认购份额还要等合同生效并有封闭期。","e":"像奶茶店开业前卖预售券、开业后正常点单，都在同一个门店或同一个小程序里买，只是时间和价格规则不同。","t":"认购申购走同一批渠道，只差时间和价格","r":"认购与申购场所均可在基金代销网点和直销机构办理"},{"i":173,"c":2,"k":"内控审慎性","q":"基金管理人内部控制制定原则中审慎性指（）","o":["公司内部控制的核心是风险控制，制定内部控制制度应当以审慎经营、防范和化解风险为出发点","公司内部控制制度应符合国家法律法规","内控制制度应涵盖公司经营管理的各个环节，不得留有管理空白","应随着法规的调整和公司经营方针及时修改"],"a":0,"p":"审慎性的落点是风险控制，要求制度从审慎经营、防范和化解风险出发，宁可把风险想得重一些。符合法律法规是合法性，覆盖各环节不留空白是全面性，随法规和方针及时修订是适时性。","e":"像租房签合同，先把押金被扣、房东提前收房怎么办写进条款，条款都往保守里写，而不是等出了事再补，多想一步。","t":"审慎性以风险控制为核心，别混合法全面","r":"审慎性指司内部控制的核心是风险控制，制定内部控制制度应当以审慎经营、防范和化解风险为出发点"},{"i":174,"c":4,"k":"估值责任","q":"关于基金资产估值责任，以下表述正确的是（）。","o":["基金管理人只要参考中国证券投资基金业协会的估值指引，即可免除估值相关责任","基金管理人应充分理解基金相关估值原则及技术，在与托管人充分协商的基础上，谨慎确定公允价值","基金资产估值的责任人是基金管理人和基金托管人","基金管理人选择估值业务外包给服务机构，可以免除基金管理人的估值相关责任"],"a":1,"p":"估值的第一责任人是基金管理人，托管人只负复核责任，参考协会指引或外包给服务机构都不能免责，出问题仍由管理人担。所以管理人必须吃透估值原则，与托管人充分协商后谨慎确定公允价值。","e":"像小组作业外包给打印店排版，格式错了还是你担责，不能说付了钱就不管，交稿前得和组员一起对一遍，责任推不掉。","t":"估值管理人负责、托管人复核，外包不免责","r":"选项 A、D,基金管理人和托管人在进行基金估值、计算基金份额净值及相关复核工作时，可参考基金业协会的估值指引，但是并不能免除相关责任。即使基金管理人选择服务机构进行估值，也不能免除管理人的相关责任。选项 C,我国基金资产估值的责任人是基金管理人，基金托管人对基金管理人的估值结果负有复核责任。"},{"i":175,"c":1,"k":"披露形式原则","q":"基金信息披露形式方面原则不包括（）","o":["公平性原则","规范性原则","易解性原则","易得性原则"],"a":0,"p":"形式管的是材料长什么样、怎么送到投资者手里，所以要求规范、易解、易得；公平性管的是内容，要求所有投资者同时拿到同样的信息。题干问的是形式原则，公平性自然被排除在外。","e":"像发班级通知：格式统一、话说得让人看懂、群里人人查得到，这是形式；保证没有一个人提前知道，那才是内容公平。","t":"形式原则是规范、易解、易得，公平归内容","r":"公平性原则属于基金信息披露内容方面原则"},{"i":176,"c":9,"k":"信息比率","q":"信息比率指标主要用来评价基金的（）","o":["绝对收益","业绩波动","风险调整后收益","相对收益"],"a":2,"p":"信息比率等于超额收益除以跟踪误差，衡量每承担一单位主动偏离基准的风险能多赚多少超额收益，本质是风险调整后收益。它比的是与基准的相对表现，既不等于绝对收益，也不只是看波动。","e":"像校运会跑步，你比标准配速快多少，要除以自己配速忽快忽慢的幅度，跑得越不稳，这个比值就越难看，跑得稳才划算。","t":"信息比率除跟踪误差，夏普除总波动","r":""},{"i":177,"c":7,"k":"债券基金范围","q":"以下不属于债券型基金投资范围的是？","o":["股票","债券","资产支持证券","股指期货"],"a":3,"p":"债券基金主要投国债、金融债、企业债和资产支持证券，靠票息和利率变动赚钱，股票只能少量参与。股指期货是股票市场的衍生工具，风险收益特征与债券基金定位不符，不在其投资范围。","e":"像专做二手教材的摊位，顺带卖点文具可以，但不会摆一柜子显卡，那不属于这个摊位的经营范围，进错了压货。","t":"债券基金买债和资产支持证券，不碰股指期货","r":""},{"i":178,"c":1,"k":"基金投资优点","q":"以下哪个不是基金投资的优点？","o":["专业管理","风险较高","资产多元化","利益共享"],"a":1,"p":"基金靠专业团队管理、把钱分散到一篮子资产、收益按份额由持有人共享，这三条都是买基金实实在在的好处。风险较高恰恰是要付的代价，属于必须承担的不确定性，不能算优点。","e":"像拼单买整箱芒果，有人会挑、大家分摊运费、按份分果都是好处；但整箱也可能烂掉一半，那属于风险不是优点。","t":"专业、分散、共享是优点，高风险是代价","r":"基金投资的优点包括专业管理、资产多元化、利益共享等。而风险较高是基金投资的潜在风险之一，不是其优点。因此，答案为B。"},{"i":179,"c":6,"k":"相对价值法","q":"下列股票估值方法不属于相对价值法的是（）。","o":["市盈率模型","企业价值倍数","市销率模型","经济附加值模型"],"a":3,"p":"相对价值法靠可比公司的倍数定价，市盈率、市净率、市销率、企业价值倍数都是价格比上某个财务指标。经济附加值模型是把未来创造的超额价值折现，属于绝对估值的内在价值法。","e":"像买二手车先看同款同年份的车卖多少钱，这是相对法；请师傅拆开算它还能开几年值多少，那是内在价值法。","t":"带倍数的是相对法，EVA折现属内在法","r":"股票估值可分为内在价值法和相对价值法两种基本方法。其中，相对价值法包括市盈率模型、市净率模型、市现率模型、市销率模型和企价值倍数。"},{"i":180,"c":5,"k":"复利计息","q":"每经过一个计息期，要将所生利息加入本金再计算利息的是（）。","o":["复利","浮动利率","单利","固定利率"],"a":0,"p":"复利是把每期生出的利息滚进本金，下一期连利息一起再生息，本金越滚越大，长期差距惊人。单利只对最初本金计息，浮动利率和固定利率说的是利率会不会变，与是否利滚利无关。","e":"像存1000元每年5%，第一年利息50元，第二年按1050元计息拿52.5元，多出的2.5元就是利滚利。","t":"复利就是利滚利，单利只认最初本金","r":"按照复利计算，每经过一个计息期，要将所生利息加入本金再计利息。"},{"i":181,"c":7,"k":"久期敏感度","q":"纯债基金a的组合久期为3年，当市场利率下降0.5%时，可以简单估算该基金的资产净值将（）左右。","o":["增加1.5%","增加0.5%","减少1.5%","减少0.5%"],"a":0,"p":"久期是价格对利率变动的敏感度，近似算法是净值变动率等于久期乘上利率变动幅度。久期3年、利率下降0.5%，3乘0.5%得1.5%，利率下降价格就涨，所以净值大约增加1.5%。","e":"像手里有一张固定利率的借条，市场利率降0.5%，剩余3年的那张比1年的涨得多，涨幅大约等于3乘0.5%，久期越长越敏感。","t":"净值变动约等于久期乘利率变动，方向相反","r":""},{"i":182,"c":11,"k":"经纪人市场","q":"在某些特定商品的交易中，由于商品具有特殊性或只在少数投资者之间交易，因此产生了（）。","o":["保证金交易市场","指令驱动市场","经纪人市场","报价驱动市场"],"a":2,"p":"大宗股票、债券、房地产这类标的特殊，只在少数机构间转手，买卖双方难碰面，于是由经纪人牵线撮合、成交后收佣金，形成经纪人市场。指令驱动靠集中竞价，报价驱动靠做市商挂双向价，都不适合小众交易。","e":"像想卖掉一台旧钢琴，买家难找，你就托琴行老师帮忙介绍，成交后给他抽一笔佣金，只牵线不收货，这就是经纪人干的活。","t":"标的特殊、人少难撮合，就该经纪人出场","r":"在某些特定商品的交易中，如大宗股票或债券、房地产等，由于商品具有特殊性或只在少数投资者之间交易，经纪人市场便出现了。"},{"i":183,"c":2,"k":"合规政策","q":"（）是基金管理人体现合规理念、培育合规文化、实现合规目标的纲领性、指导性文件，对基金管理人开展合规工作提出了原则性要求。","o":["合规管理","合规文化","合规政策","合规审核"],"a":2,"p":"合规政策是纲领性、指导性文件，把合规理念写下来，定下合规目标和原则性要求，是整套合规工作的总纲。合规文化是氛围，合规审核是具体动作，合规管理是总称，都对不上这份文件。","e":"像宿舍公约，一张纸写清什么能做什么不能做，是全楼的纲领；具体查寝怎么扣分是执行，不是那张纸本身，纲领只管方向。","t":"纲领性文件就是合规政策，别选合规管理","r":"合规政策是基金管理人体现合规理念、培育合规文化、实现合规目标的纲领性、指导性文件，对基金管理人开展合规工作提出了原则性要求。"},{"i":184,"c":7,"k":"国债信用","q":"在债券型基金的投资组合中，以下哪种类型的债券通常被认为是最安全的？","o":["国债","地方政府债","城投债","商业银行金融债"],"a":0,"p":"国债的发行人是国家，有征税和发钞能力，违约概率极低，被视为无风险资产，在一堆债券里最安全。地方政府债、城投债、商业银行金融债都带不同程度信用风险，收益率更高正是风险补偿。","e":"像借钱给有稳定工资的亲戚，还是借给刚创业的同学，前者利息低但基本能还上，国债就是那个靠谱的亲戚，睡得着觉。","t":"国债等于无风险基准，收益低但最安全","r":""},{"i":185,"c":2,"k":"内控大纲","q":"内控大纲明确内容不包括（）","o":["内控目标","内控原则","控制环境","信息披露"],"a":3,"p":"内部控制大纲定的是目标、原则、控制环境这些顶层框架，回答为什么控、按什么控、在什么环境下控。信息披露属于基本管理制度层面的具体安排，是配套制度，不会写进大纲里。","e":"像球队手册只写赛季目标和战术原则，谁负责发赛程通知属于队务细则，不会写进这份总纲里头去，那是另一本册子。","t":"大纲管目标原则环境，信息披露归基本制度","r":"信息披露属于基本管理制度内容"},{"i":186,"c":6,"k":"现金流量表","q":"下列关于现金流量表的作用，正确的是（）。Ⅰ.可以方便评价企业现金来源及去向Ⅱ.可以评价企业偿还债务、支付投资利润的能力Ⅲ.可以直接了解企业的盈利状况与获利能力Ⅳ.分析净收益与现金流量间的差异，并解释差异产生的原因","o":["Ⅰ、Ⅱ、Ⅳ","Ⅰ、Ⅲ、Ⅳ","Ⅱ、Ⅲ、Ⅳ","Ⅰ、Ⅱ、Ⅲ、Ⅳ"],"a":0,"p":"现金流量表记录真金白银的进出，能看清钱从哪来花到哪去，判断还债付息和分红的能力，还能解释账面利润与手头现金为何对不上。盈利和获利能力要看利润表，所以带第三项的选项都不成立。","e":"像翻一个月的微信零钱流水，进多少出多少、还剩多少能还花呗一目了然，但你赚不赚钱还得看收入减成本，两本账。","t":"现金流量表看钱进出，盈利能力归利润表","r":"现金流量表的作用包括反映企业的现金流量，评价企业未来产生现金净流量的能力；评价企业偿还债务、支付投资利润的能力，谨慎判断企业财务状况；分析净收益与现金流量间的差异，并解释差异产生的原因；通过对现金投资与融资、非现金投资与融资的分析，全面了解企业财务状况。选项Ⅲ属于利润表的作用。"},{"i":187,"c":10,"k":"折价套利","q":"当ETF的价格低于基金份额净值时，（）ETF份额，可实现折价套利。","o":["买入并赎回","买入并申购","卖出并申购","卖出并赎回"],"a":0,"p":"场内价格低于净值叫折价，等于打折买资产，做法是在二级市场按低价买入份额，再到一级市场按净值赎回换成股票卖出，赚回差价。方向反了就是溢价套利，按净值申购再到场内高价卖。","e":"像超市酸奶临期打八折，你先低价买下，再按原价找厂家退货拿回全款，中间那一截差价就是套利空间，白赚差价。","t":"折价先买入再赎回，溢价先申购再卖出","r":""},{"i":188,"c":1,"k":"净值差错披露","q":"基金份额净值计价错误金额达基金份额净值的（）时，应编制基金临时报告","o":["0.15%","0.25%","0.5%","0.75%"],"a":2,"p":"份额净值算错的钱达到净值的0.5%，影响已经不小，必须编临时报告对外说明。差错到0.25%就要先向监管报告，那是更早的一道线，0.15%和0.75%都不在这个披露档位。","e":"像奶茶店算错账，差几毛钱自己改过来；要是错到当天流水的半个百分点，就得贴告示说明并报给店长处理，不能瞒着。","t":"算错达净值0.5%发临时报告，0.25%先上报","r":"基金份额净值计价错误金额达基金份额净值的0.5%应编制基金临时报告"},{"i":189,"c":7,"k":"可转债指标","q":"以下哪个指标不是可转债的分析指标？","o":["转股溢价率","隐含波动率","跟踪误差","到期收益率"],"a":2,"p":"可转债看转股溢价率判断股性强弱，看隐含波动率给期权部分定价，看到期收益率衡量纯债底，三项都贴着转债条款。跟踪误差衡量复制指数的偏离度，是评价指数基金的工具，与单只转债无关。","e":"像评价一辆混动车，看油耗、纯电续航、油箱大小都有用，但拿它去比自行车的链条松紧，那就完全跑题了，工具不对。","t":"转债看溢价率、隐含波动率、到期收益率","r":""},{"i":190,"c":5,"k":"有效前沿","q":"有效前沿指可投资组合集的哪个部分？","o":["上边界","下边界","左边界","右边界"],"a":0,"p":"同样风险下收益最高、同样收益下风险最低的组合连成一条曲线，正好在可行集的上边界，这条上边界就是有效前沿。下边界的组合同风险收益更低，属于无效组合，理性投资者不会选。","e":"像挑手机，同样价钱配置最高、同样配置最便宜的那几款排成一条线，只有线上的才值得买，其余买回去就是亏钱。","t":"有效前沿是可行集上边界，下边界无效率","r":""},{"i":191,"c":6,"k":"红利策略","q":"红利策略的选股逻辑是什么？","o":["高景气度","高股息","低估值","高增速"],"a":1,"p":"红利策略专挑股息率高、分红稳定的公司，靠持续的现金分红取得回报，这类企业多在成熟期、现金流充沛，股价弹性小但抗跌。高景气、高增速是成长股逻辑，低估值是价值策略的另一条线。","e":"像租房选租客稳定的老小区，租金不高但每月准时到账，比赌房价大涨的毛坯房更让人安心，现金流看得见摸得着。","t":"红利策略盯股息率，不追高景气高增速","r":""},{"i":192,"c":6,"k":"股票回购","q":"上市公司回购股份的方式有（）。Ⅰ.正回购Ⅱ.场外协议回购Ⅲ.要约回购Ⅳ.场内公开市场回购","o":["Ⅱ、Ⅲ、Ⅳ","Ⅰ、Ⅱ","Ⅰ、Ⅲ","Ⅰ、Ⅱ、Ⅲ、Ⅳ"],"a":0,"p":"上市公司回购只有三条路：在交易所场内公开市场买回、与特定股东场外协议买回、向全体股东发出要约买回。正回购是央行在公开市场收回流动性的操作，主体和含义都不同，把它算进来就错了。","e":"像收回自己卖出去的二手书：可以在跳蚤市场慢慢收、跟某个同学私下谈价、或贴告示向所有人开价，就这三条路。","t":"股票回购三条路：场内、场外协议、要约","r":"股票回购的方式主要包括三种：（1）场内公开市场回购。（2）场外协议回购。（3）要约回购"},{"i":193,"c":1,"k":"港股通基金","q":"港股通基金是指投资港股通标的股票占基金非现金资产比重不低于（）的权益基金","o":["0.9","0.8","0.7","0.6"],"a":1,"p":"港股通基金要求投资港股通标的股票占非现金资产的比例不低于80%，剩下两成可以放A股或现金做灵活调配。70%、60%是更宽松的口径，90%又过高，都不是监管划的这条线。","e":"像规定一箱水果里进口车厘子至少占八成，剩下两成才能混苹果，低于这个比例就不算车厘子专箱，得改标签。","t":"港股通基金：非现金资产80%投港股通","r":""},{"i":194,"c":1,"k":"上市持有人数","q":"封闭式基金份额上市交易，基金份额持有人不少于（）人。","o":["300","500","200","1000"],"a":3,"p":"封闭式基金要上市交易，基金份额持有人不少于1000人，募集金额不低于2亿元，持有人持有份额也要达到规定比例。500人、300人都是把门槛记低了，容易和其他产品的投资者人数要求混淆。","e":"像小区要凑业主团购，人数太少谈不下批发价，得凑够1000户才够格跟供应商谈条件，人少只能零散地买。","t":"封闭式基金上市：持有人至少1000人","r":"封闭式基金份额上市交易，基金份额持有人不少于1000人"},{"i":195,"c":9,"k":"预期损失","q":"条件风险价值度、条件尾部期望或尾部损失又被称为（）。","o":["最大回撤","下行标准差","风险价值","预期损失"],"a":3,"p":"预期损失也叫条件风险价值、条件尾部期望或尾部损失，算的是损失超过某个阈值之后那段极端行情的平均亏损，比风险价值更保守。最大回撤看历史高点跌下来的幅度，下行标准差只看负向波动。","e":"像出门带伞，风险价值说九成日子雨量不超过多少，预期损失则算最倒霉那一成的平均雨量，得按大的那档备。","t":"预期损失算极端部分的平均亏损，比VaR狠","r":"预期损失也被称为条件风险价值度或条件尾部期望或尾部损失。"},{"i":196,"c":1,"k":"份额登记时效","q":"QDII基金份额登记的日期是（）","o":["T+0","T+1","T+2","T+3"],"a":2,"p":"QDII要跨时区、跨市场结算，申购赎回的份额登记在T+2日完成，比境内基金慢一步。T+0、T+1是境内普通基金的节奏，T+3就更慢了，都不符合QDII的规定。","e":"像海淘下单，钱当天就扣，但仓库在海外，得等两天才对完账入库，比国内快递慢一拍，急也急不来，催客服也没用。","t":"QDII份额登记T+2，境内基金多为T+1","r":""},{"i":197,"c":1,"k":"资管新规","q":"《关于规范金融机构资产管理业务的指导意见》（简称“资管新规”）的发布时间为（）。","o":["2017年","2018年","2019年","2020年"],"a":1,"p":"资管新规由央行等四部门在2018年4月发布，核心是打破刚兑、禁止资金池、压降通道和嵌套，统一各类资管产品的监管标准。2017年是征求意见的年份，2019和2020属于过渡期安排。","e":"像学校突然统一所有社团的财务规矩：不许私下收钱、不许拆东墙补西墙，2018年春天这张通知贴出来，全行业都得改。","t":"资管新规2018年4月发布，破刚兑禁资金池","r":""},{"i":198,"c":1,"k":"股票型基金","q":"股票型基金是指将不低于（）的基金资产投资于股票的基金","o":["0.8","0.65","0.9","1"],"a":0,"p":"股票型基金要求股票资产占基金资产的比例不低于80%，用高仓位换贴近股市的涨跌弹性，不到这条线的通常归入混合型。90%、100%都超出规定，0.65更是把门槛记低了。","e":"像规定一杯果汁里真果汁至少占八成，剩下两成才能加水加冰，低于八成只能叫果汁饮料，牌子不敢写纯果汁。","t":"股票型基金股票仓位至少80%，别记成90%","r":""},{"i":199,"c":11,"k":"大宗交易","q":"关于大宗交易，以下表述错误的是（）。","o":["大宗交易是指单笔数额较大的证券买卖","每个交易日15:00以后，上海证券交易所开始接受大宗交易","对于当天全天停牌的股票，沪深交易所都不接受其大宗交易申请","证券交易所可以根据市场实况调整大宗交易的最低限额"],"a":1,"p":"上交所接受大宗交易申报的时间是每个交易日9:30到11:30、13:00到15:30，盘中就能报，并非15点后才开始。单笔数额较大是定义，全天停牌不受理，交易所可调整最低限额，其余三项都对。","e":"像食堂的大锅菜预订窗口，上午和下午都能下单，不是等到下午三点才开门，错过时段就真订不上了，只能等明天。","t":"大宗交易盘中就能报，15:30才收摊","r":"上海证券交易所接受大宗交易的时间为每个交易日9：30一一11：30、13：00一15:30。但如果在交易日15：00前处于停牌状态的证券，则不受理其大宗交易的申报。"},{"i":200,"c":6,"k":"技术分析","q":"关于股票分析方法，以下说法正确的是（）。","o":["技术分析的基本前提是空间和时间里不存在可以复制的模式","按照“量价\"理论体系，如果一只股票放量下跌，则发出多头信号","股票的市场价格决定股票的内在价值","技术分析只关心证券市场本身的变化，不考虑基本面因素"],"a":3,"p":"技术分析只看价格、成交量这些市场自身的数据，假设历史模式会重复，不研究公司基本面，这条说法成立。它认为时空里存在可复制模式，放量下跌是空头信号，内在价值决定市场价格，另三项都说反了。","e":"像看奶茶店排队长度判断要不要跟风买，只看人气和出杯速度，不问配方和成本，这就是纯技术派的做法，赌的是趋势。","t":"技术分析只看价和量，基本面一概不问","r":"技术分析的基本前提是空间和时间里存在可以复制的模式。按照“量价\"理论体系，当一只股票（或大盘）放量上涨或者呈现价升量增的态势时，则表明买方意愿强烈，股票有望再续升势。相反，如果一只股票（或大盘）放量下跌，则表明卖压较为沉重，发出空头信号。股票的内在价值决定股票的市场价格。"},{"i":201,"c":1,"k":"投资者权益保护","q":"关于基金的投资者权益保护，下列哪项描述是正确的？","o":["投资者权益保护只需要关注投资者的投资收益","投资者权益保护应以投资者的风险承受能力为准绳","投资者权益保护应以保护投资者的知情权和选择权为核心","投资者权益保护应以保护投资者的利益最大化为核心"],"a":2,"p":"保护的重心是让投资者看得懂、选得了：信息披露充分、产品的风险收益特征讲清楚，买不买由投资者按自己的承受能力决定。把核心说成收益最大化，等于让机构替投资者承诺赚钱，既做不到，也违背买者自负的基本逻辑。","e":"像租房前中介必须把房龄、漏水、隔音全说清，租不租你自己定；只夸住着舒服、缺点一句不提的，才是最坑的那种。","t":"护的是知情权和选择权，不是收益","r":"投资者权益保护的核心是保护投资者的知情权和选择权，确保投资者能够了解基金的风险和运作情况，并根据自己的风险承受能力和投资目标做出明智的投资决策。因此，C选项描述是正确的。"},{"i":202,"c":8,"k":"期货期权保证金","q":"关于金融期货与金融期权的比较，下列说法正确的是（）","o":["期货合约和期权合约都通过对冲相抵消","金融期货与金融期权交易双方的权利与义务是对称的","期货合约用保证金交易，而期权合约不用保证金交易","金融期货交易双方均需开立保证金账户，金融期权的买方无需开立保证金账户，也无需缴纳保证金"],"a":3,"p":"期货买卖双方都背了未来必须履约的义务，所以两边都要开保证金账户、天天盯市补钱；期权买方只付一笔权利金，义务全压在卖方身上，买方不必再押保证金。说两者权利义务对称正好说反了，期权天生就是不对称的。","e":"像交定金订奶茶店档口：付定金的人只亏定金、来不来随自己，出租方必须留位还要押一笔钱；期货是双方都签死合同，谁都得押钱。","t":"期权买方只付权利金，不交保证金","r":"A项，期货合约绝大多数通过对冲相抵消，而期权合约则是买方根据当时的情况判断行权对自己是否有利来决定行权与否；B项，期货合约包括买卖双方在未来应尽的义务，与此相反，期权合约只有卖方在未来有义务；C项，期貨合约通常采用保证金交易，有明显的杠杆效应，期权合约中买方需要支付期权费，卖方需要缴纳保证金，也存在杠杆效应。"},{"i":203,"c":5,"k":"资本市场线","q":"以下关于资本市场线(CML)的说法中错误的是（）。","o":["CML是指表明有效组合的期望收益率和标准差之间的一种简单的线性关系的一条射线","它是CAPM理论中市场均衡状态下从无风险利率到市场组合M的线","市场组合的风险溢价与市场投资组合M的方差和投资者的典型风险偏好成反比","线上不同的点之间的差异在于市场组合M与无风险资产的配比不同"],"a":2,"p":"市场组合的风险溢价补偿多少，跟市场组合的方差、投资者对风险的厌恶程度同方向走：波动越大、越怕风险，要求的补偿越高，所以是正比关系。说成反比是把价格与需求那套关系硬套到风险补偿上，方向正好颠倒。","e":"像健身房私教课：器械区越危险、你越怕受伤，教练报的保护费越高；风险大而补偿反而更低，没人肯掏钱进场。","t":"风险溢价与方差、风险厌恶成正比","r":"市场组合的风险溢价与市场组合的方差和投资者的典型风险偏好成正比。"},{"i":204,"c":8,"k":"风险管理功能","q":"下列关于期货市场的论述中，正确的是（）。","o":["由于期货价格变动剧烈，因此期货市场损害了金融体系抵御风险的能力","期货交易是“零和游戏\"，因此期货市场不具有经济功能","期货市场并不能消除风险，只是将风险在不同投资者之间进行转移","期货价格经常非理性波动，因此期货市场扰乱了现货市场的运行"],"a":2,"p":"期货把价格波动的后果从怕风险的人手里，转到愿意承担的人手里，风险总量没有减少，只是重新分配，所以它既提高了体系抗风险的能力，也不扰乱现货。说它是零和游戏就没有经济功能，忽略了套保方买到的是确定的成本。","e":"像二手转卖演唱会门票：票砸手里的风险没消失，只是从怕亏的人转到愿意赌的人身上，这个市场照样有价值。","t":"期货只转移风险，不能消灭风险，也不是零和","r":"期货市场的最基本的功能就是风险管理，由于期货市场的存在，金融体系抵御风险的能力也得到了提高。期货市场具有风险管理、价格发现和投机三种基本功能。调整资产组合的行动以及现货和期货市场的套利活动将对现货市场产生影响，使得现货市场的价格能够更好地反映其内在价值。正是因为有投机者参与，套期保值才能顺利进行，而使期货市场具有经济功能。"},{"i":205,"c":9,"k":"下行标准差","q":"以下关于下行标准差的局限性，说法正确的是（）","o":["只能基于交易数据计算","只能选用0作为目标收益率","若在考察期间表现一直超越目标，将得不到足够的数据点计算下行标准差","无法刻画基金收益率不达目标的风险"],"a":2,"p":"这个指标只挑低于目标的那些收益来算波动，组合一路跑赢目标时下跌样本是零，分母凑不出东西，指标就算不出来。目标收益率其实可以自己定，比如取无风险利率，说它只能取零并不对。","e":"像记奶茶店的亏本日：连开三个月天天盈利，一张亏损单都没有，你就没法算出平均一天亏多少钱，这个账根本算不起来。","t":"全程跑赢目标，下行标准差算不出来","r":"下行标准差的局限性在于，其计算需要获取足够多的收益低于目标的数据。如果投资组合在考察期间表现一直超越目标，该指标将得不到足够的数据点进行计算。"},{"i":206,"c":4,"k":"申赎原则","q":"下列关于开放式基金申购和赎回原则的说法，错误的是（）","o":["股票基金、债券基金的申购和赎回按份额申购、金额赎回原则","股票基金、债券基金的申购和赎回按未知价交易原则","货币市场基金的申购和赎回按金额申购、份额赎回原则","货币市场基金的申购和赎回按确定价原则"],"a":0,"p":"股票和债券基金是金额申购、份额赎回：买的时候报投多少钱，卖的时候报赎多少份，因为成交净值当天收盘后才知道，前端只能先按金额下单。A项把两个词顺序调反了，恰好与除货币基金之外的通行做法相反。","e":"像买奶茶喊来20块钱的，取货时说退两杯；没人会反过来说买3杯、退20块钱，方向一颠倒就对不上账。","t":"金额申购、份额赎回，货币基金才确定价","r":""},{"i":207,"c":7,"k":"债券基金特点","q":"与债券相比，债券基金的特点不包括？","o":["债券基金的收益不如债券的利息固定","债券基金的收益率比买入并持有到期的单个债券的收益率更难以预测","债券基金有明确的到期日","债券基金可以通过分散投资分散信用风险"],"a":2,"p":"债券基金是一篮子债券不断换仓的开放式产品，没有到期日，也没有固定利息，净值跟着持仓债券的价格浮动；只有单只债券才有票面利率和到期还本。所以把有明确到期日这条安在债券基金身上并不成立。","e":"像合租公寓和整租一套房：整租房合同到期就结束，合租公寓有人走有人进，一直往下续，根本没有统一到期日。","t":"债基无到期日无固定利息，别混同单只债券","r":""},{"i":208,"c":4,"k":"估值工作小组","q":"（）定期评估基金行业的估值原则和程序，并对活跃市场上没有市价的投资品种、不存在活跃市场的投资品种提出具体估值意见","o":["基金管理公司","托管银行","基金估值工作小组","基金注册登记机构"],"a":2,"p":"行业层面的估值原则和程序由基金估值工作小组定期评估，碰上停牌股、没有活跃市场的品种这类难题，也由它出具体处理意见，各家管理人和托管人照着执行。管理人算的是自家产品每份值多少，定不了全行业规则。","e":"像食堂各档口自己算成本，但全校统一的价格指导意见由膳食委员会出，遇到没见过的菜，口径也由它来定。","t":"行业规则找估值工作小组，具体估值找管理人","r":""},{"i":209,"c":11,"k":"报价最小变动单位","q":"封闭式基金交易报价最小变动单位是（）元人民币","o":["0.0001","0.001","0.01","0.1"],"a":1,"p":"封闭式基金在交易所挂牌，申报价格最小变动单位是0.001元，报得太粗会让买卖价差撑大、撮合不够细。0.01元是股票等品种的习惯，挪到基金上就差了一个量级，也就掉进了干扰项。","e":"像菜市场的电子秤精确到克：三块二的青菜能报到三块二零一，要是只准报到角，几毛钱的价差根本没法谈。","t":"封闭式基金最小变动0.001元，不是一分","r":""},{"i":210,"c":8,"k":"期货市场功能","q":"有两条关于期货市场功能的论述：\nⅠ. 期货市场最基本的功能就是风险管理，期货市场可以消除金融风险，增强了整个金融系统的稳定性\nⅡ. 期货市场提高了供求信息的利用效率，标准合约又增加了市场流动性，为现货市场提供了参考价格，起到了价格发现的功能。\n对这两条论述判断正确的是（）。","o":["Ⅰ正确；Ⅱ错误","Ⅰ错误；Ⅱ错误","Ⅰ错误；Ⅱ正确","Ⅰ正确；Ⅱ正确"],"a":2,"p":"第二条成立：标准化合约把各地供求信息聚到一起，流动性好，形成的价格真实反映供需，给现货做参考，这就是价格发现。第一条错在消除两个字，套期保值只是把风险转出去，总量一点没少，说它能消除整个金融系统的风险属于夸大。","e":"像小区门口的二手房挂牌价：看的人多、成交快，价格就有参考性；但挂牌消灭不了房价下跌，只能让怕跌的人先脱手。","t":"期货能转移风险、发现价格，但消不掉风险","r":"期货市场的最基本的功能就是风险管理，具体表现为利用商品期货管理价格风险、利用外汇期货管理汇率风险、利用利率期货管理利率风险以及利用股指期货管理股票市场系统性风险。期货市场上来自各个地方的交易者带来了大量的供求信息，标准化合约的转让又增加了市场流动性，期货市场中形成的价格能真实地反映供求状况，同时又为现货市场提供了参考价格，起到 了“价格发现”的功能。"},{"i":211,"c":11,"k":"融资融券","q":"某投资者通过借入所在证券公司资金购买有价证券的交易方式为（）。","o":["融券交易","融资交易","期货交易","现货交易"],"a":1,"p":"借来的是钱、动作是买入证券，两个特征都落在融资这一边，也就是俗称的买空，到期要还本付息。融券借的是券、卖出后等跌了再买回来还，方向正好相反，押的是下跌。","e":"像向室友借200块先抢下五折球鞋，等生活费到账再还；借的是钱不是鞋，转手卖贵了差价归你，跌了也得照还。","t":"借钱买券是融资买空，借券卖出是融券","r":"在我国，保证金交易被称为“融资融券”。 融资即投资者借入资金购买证券，也叫买空交易。"},{"i":212,"c":10,"k":"ETF参考净值","q":"证券交易所在开市后根据ETF申购、赎回清单和组合证券内各只证券的实时成交价格，计算并每（）秒发布一次家基金份额参考净值","o":["10","15","30","60"],"a":1,"p":"ETF的份额参考净值由交易所在开市后按申赎清单和成分股实时成交价算出来，每15秒发布一次，让投资者能随时盯住折溢价。10秒、30秒、60秒都太疏或太密，只有15秒这个节奏才对得上它的实时估值。","e":"像打车软件的预估价每15秒刷一次，你才知道眼下这单贵不贵、要不要再等等；刷太慢就错过价差了。","t":"ETF参考净值每15秒发布一次，别记成10秒","r":""},{"i":213,"c":1,"k":"上市交易条件","q":"公募基金份额上市交易，应当符合基金募集金额不低于（）亿元人民币、基金份额持有人不少于（）人的要求","o":["1；1000","2；1000","1；2000","2；2000"],"a":1,"p":"公募基金份额要上交易所，募集金额不低于2亿元、持有人不少于1000人，一个门槛看资金规模够不够厚，一个看持有人够不够分散，防止少数人控盘。记成1亿元或2000人，都会正好落进干扰项。","e":"像小区团购开团：凑够2万块、至少1000户参与才开，钱太少撑不起配送，人太少就是几个大户自己玩。","t":"上市交易门槛：2亿元、1000人","r":""},{"i":214,"c":1,"k":"基金风险等级","q":"一般而言，以下哪类基金的投资风险最高","o":["股票型基金","债券型基金","货币型基金","稳健型FOF基金"],"a":0,"p":"四类产品按投资标的排风险：股票基金把八成以上资产压在股价上，波动最大；债券基金次之；货币基金投短债和存单，几乎不波动；稳健FOF还要再分散一层。比下来风险最高的只能是股票基金。","e":"像四种出行方式：股票是骑摩托上高速，债券是坐公交，货币是步行，稳健FOF是坐地铁换乘，摔跤概率差很远。","t":"风险排序：股票高于债券，债券高于货币","r":""},{"i":215,"c":7,"k":"债券利率风险","q":"某投资者按面值购买了一只附息债券，一个月后市场利率上升，如果此时该投资者想将该债券出售；则该债券将以（）出售，该投资者所承担的风险是（）。","o":["折价；再投资风险","溢价；流动性风险","折价；利率风险","溢价；通胀风险"],"a":2,"p":"债券价格和利率反向走，买入后利率一升，手里这张票的固定利息就不香了，想卖只能降价，票面价之上就变成折价成交。亏的原因是价格被利率推着跌，跟再投资、通胀不是同一类风险。","e":"像办了年卡的健身房，隔壁突然开新店打折，你手里的卡想转手只能降价，亏的是当初锁定的那个价。","t":"利率上升债券价格下跌，这是利率风险","r":"利率风险是指利率变动引起债券价格波动的风险。债券的价格与利率呈反向变动关系；利率上升时，债券价格下降；而当利率下降时， 债券价格上升。"},{"i":216,"c":7,"k":"可转债要素","q":"与普通公司债券相比，（ ）不是可转换债券的特有因素。","o":["转换价格","标的股票","转换期限","票面利率"],"a":3,"p":"可转债等于一张普通债加一份转股权，转换价格、标的股票、转换期限都是转股这条线才长出来的要素；票面利率普通公司债一样有，可转债只是把它压得更低来省融资成本，谈不上独有。","e":"像奶茶店卖可换新品的会员卡：换购价、能换哪款、多久内能换是它独有，卡本身收你多少钱，普通储值卡也照收。","t":"票面利率普通债也有，不算可转债特有","r":"可转换债券的基本要素包括标的股票、票面利率、转换期限、转换价格、转换比例、赎回条款、回售条款等。票面利率也属于普通公司债券的因素。"},{"i":217,"c":4,"k":"流动性风险","q":"当基金出现大额赎回时，基金未能以合理价格及时变现基金资产以支付赎回款项，这类风险称为什么？","o":["违约风险","市场风险","流动性风险","操作风险"],"a":2,"p":"风险叫什么，看它卡在哪一环：想卖却卖不掉，或者一卖就得狠打折，那才叫流动性风险。大额赎回时持仓停牌或成交量太小，变现要砸价，正是这个场景。违约是对方赖账，市场风险是价格整体波动。","e":"像急着退租：房子挂出去一个月没人接，只能降两千才租掉，亏的不是房价本身，而是转手太难、太费时间。","t":"想卖卖不掉、变现要打折，就是流动性风险","r":""},{"i":218,"c":1,"k":"风险警示披露","q":"风险警示内容在（）披露","o":["基金合同","基金招募说明书","基金托管协议","基金运作方式"],"a":1,"p":"招募说明书是给投资者看的主文件，风险揭示和风险警示专门放在这里，买之前必须摆在明面上。基金合同管的是当事人之间的权利义务，托管协议管的是管理人与托管人怎么分工，都不承担这个提示功能。","e":"像买二手手机前商家必须贴风险提示：电池健康度多少、有没有进水、保修多久，这张纸相当于招募说明书。","t":"风险警示写在招募说明书，不在合同里","r":"风险警示内容在基金招募说明书披露"},{"i":219,"c":3,"k":"过往业绩披露","q":"基金宣传推介材料可以登载该基金、基金管理人管理的其他基金的过往业绩，但基金合同生效不足（）个月的除外。","o":["36","24","12","6"],"a":3,"p":"宣传材料可以登过往业绩，但基金合同生效不满6个月的不许登，因为建仓期还没走完，业绩没有代表性，容易被当成短期爆发力去卖。36个月、24个月、12个月都是拿持有期或评价期来凑的干扰项。","e":"像新店开业才5个月就挂出年度销量冠军，连一整年都没走完，这块牌子摆出来没人会信，纯属自嗨。","t":"合同生效不满6个月，不许登过往业绩","r":"基金宣传推介材料可以登载该基金、基金管理人管理的其他基金的过往业绩，但基金合同生效不足6个月的除外。"},{"i":220,"c":1,"k":"互联互通结算","q":"沪港通和深港通的开通，在内地与香港之间搭建起资本流通的桥梁，沪港通和深港通的双向交易以（）作为结算货币。","o":["人民币","美元","欧元","港币"],"a":0,"p":"沪港通、深港通一头在内地一头在香港，但双向交易都用人民币报价和结算，港币只在中间换汇环节出现，资金闭环挂在人民币上。这样跨境买卖不用先换美元，也顺势推了人民币走出去。","e":"像两个校区食堂互通：两边饭卡系统不一样，但统一按人民币充值结算，学生不用先换成对方学校的代币。","t":"沪港通深港通双向都以人民币结算","r":"沪港通和深港通的双向交易均以人民币作为结算单位，这在一定程度上促进了人民币的交投量与流转量增加，为人民币国际化打下坚实的基础。"},{"i":221,"c":4,"k":"基金份额净值","q":"计算基金投资者申购基金份额、赎回资金金额的基础是（）。","o":["基金份额净值","基金总资产","基金资产总值","基金总份额"],"a":0,"p":"份额净值等于基金净资产除以总份额，是每一份值多少钱，申购能买到几份、赎回能拿多少钱都拿它乘。总资产和资产总值是没扣负债的毛数，总份额只是分母，都不能直接当单价用。","e":"像一锅奶茶分成100杯，锅里剩下的钱除以杯数就是每杯价，你买三杯、退两杯都按这个单价结算。","t":"申赎都按份额净值算，别拿总资产除","r":"基金份额净值是计算投资者申购基金份额、赎回资金金额的基础，也是评价基金投资业绩的基础指标之一。"},{"i":222,"c":3,"k":"市场细分可测","q":"（）指根据市场调查、专业咨询等途径提供的各个细分市场的特征要素，能够测算出细分市场的客户数量、销售规模、购买潜力等量化指标。","o":["易入原则","可测原则","成长原则","利润原则"],"a":1,"p":"可测原则说的是细分出来的这块市场能量化：客户有多少、一年能卖多少、潜力还能挖多深，都得算得出数来。易入看的是进场门槛高不高，成长看增速，利润看赚钱空间，三者都不管能不能量化。","e":"像奶茶店选商圈：先数清这条街每天过多少学生、人均消费15块，能算出一个月流水，才敢去签租约。","t":"能量化出客户数、销量，才叫可测原则","r":"可测原则指根据市场调查、专业咨询等途径提供的各个细分市场的特征要素，能够测算出细分市场的客户数量、销售规模、购买潜力等量化指标。"},{"i":223,"c":1,"k":"境外持股上限","q":"所有境外投资者对单个上市公司A股的持股比例总和，不超过该上市公司股份总数的（）。","o":["10%","15%","20%","30%"],"a":3,"p":"全部境外投资者合起来持一家A股公司，上限是股份总数的30%；单个境外机构的限制是10%，一个管总量一个管个体。记成20%是把单个投资者或战略投资的比例混了进来。","e":"像合租约定：所有外来朋友加起来最多占三成床位，单个朋友最多占一成，超了就得让出位置，规矩写在租约里。","t":"境外合计30%，单个境外10%","r":"所有境外投资者对单个上市公司A股的持股比例总和，不超过该上市公司股份总数的30%。"},{"i":224,"c":1,"k":"半年报披露","q":"基金定期报告的半年度报告中不需要披露过去（）的净值增长率。","o":["1个月","1年","3年","5年"],"a":3,"p":"半年报要求披露过去1个月、1年、3年的净值增长率，5年这一档只出现在年报里，因为半年报的篇幅和时效都撑不起拉五年。题目问的是不需要披露，所以答案是5年这一项。","e":"像学期小结只写这学期和近三次考试，不会把小学成绩也贴上去，那种长跨度是年度总结才做的事，写不下也没意义。","t":"半年报披露1月、1年、3年，不披露5年","r":"半年度报告需要披露过去1个月的净值增长率，但无须披露过去5年的净值增长率。"},{"i":225,"c":4,"k":"申赎申请时点","q":"投资者在交易日（）前提出的赎回申请，将按当日净值进行计算。","o":["14:30","15:00","15:30","16:00"],"a":1,"p":"T日15:00是申购赎回的切分点，之前提交按当日净值成交，之后顺延到下一个交易日，因为净值要等收盘后才算得出来。14:30还落在当天，15:30和16:00都已过点，只能算T+1。","e":"像食堂11点半截止订餐：之前下单按今天的菜单算钱，过了点只能等明天那锅，菜价还未必一样，只能认了。","t":"15:00前按当日净值，过后顺延一天","r":""},{"i":226,"c":3,"k":"风险承受能力测试","q":"基金销售机构应在基金投资人（）购买基金时，为投资人做风险承受能力测试。","o":["首次","第二次","第五次","第十次"],"a":0,"p":"销售机构要在投资人首次购买时做风险承受能力测试，之后定期更新，产品风险等级高过测评结果的就不能硬卖。等到第二次、第五次才测，等于前几次完全没做适当性，属于违规。","e":"像健身房第一次进门先测体脂和伤病史，再决定给你排轻课还是重课，不能一进门就让你去卧推50公斤。","t":"首次购买先做风险测评，不能以后再补","r":"基金销售机构应在基金投资人首次购买基金时，为投资人做风险承受能力测试。"},{"i":227,"c":7,"k":"高收益债信用风险","q":"以下类型的债券型基金中信用风险相对较高的是？","o":["高收益债基金","国债基金","高等级信用债基金","政金债基金"],"a":0,"p":"高收益债就是评级偏低、违约概率偏高的一类债，靠更高的票息来补偿，所以信用风险最高。国债和政金债背后是国家或政策性银行，高等级信用债评级在AA以上，到期不还钱的可能小得多。","e":"像借钱给三种人：亲戚有工资担保，老同学信用一般，牌桌上认识的肯给高利息，最后这种最容易不还。","t":"高收益债票息高，正是因为违约风险高","r":""},{"i":228,"c":1,"k":"互联互通币种","q":"沪港通和深港通双向交易中的结算币种是（）。","o":["美元","英镑","人民币","港币"],"a":2,"p":"两个通道买卖的是对方市场的股票，但报价和结算统一用人民币，港币只在换汇那一步出现，资金不进美元体系。币种是按制度设计定的，不是按股票挂牌地定，这正是推人民币国际化的抓手。","e":"像两个校区食堂互通，结算都刷校园卡里的人民币余额，不管窗口阿姨收进来的是不是港币现金，刷卡那刻统一折算。","t":"沪深港通不看交易地，结算只认人民币","r":"沪港通和深港通的双向交易均以人民币作为结算单位。"},{"i":229,"c":3,"k":"申购费免除","q":"对于持有期低于（）年的投资人，不得免收其认（申）购费。","o":["1","2","3","10"],"a":2,"p":"持有满3年才允许对投资者免收认申购费，本意是防止销售机构拿免申购费当诱饵诱导短线频繁进出，把长期资金留在产品里。1年、2年都太短挡不住，10年又长得没法操作。","e":"像健身年卡想免手续费转卡，得持满3年才行；只练三个月就要走，那笔工本费照收不误，一分都少不了。","t":"持有不足3年，不得免收认申购费","r":"对于持有期低于3年的投资人，不得免收其认（申）购费。"},{"i":230,"c":4,"k":"净值计算责任","q":"附有计算并公告基金资产净值的责任的机构为（）","o":["登记结算公司","基金托管人","基金管理人","证券交易所"],"a":2,"p":"基金资产净值由管理人负责计算并对外公告，托管人负责复核，两边互相制衡；登记结算公司管份额登记，交易所只是提供交易平台。把计算和公告推给托管人，等于自己记账让别人签字。","e":"像合租房的水电账：住的人负责算清每月多少贴在群里，房东只负责核对，不能反过来让房东替你算。","t":"管理人算并公告净值，托管人只复核","r":""},{"i":231,"c":10,"k":"ETF申赎对价","q":"场外申购赎回ETF的对价均为（）","o":["组合证券","其他对价","现金","基础份额"],"a":2,"p":"场内申赎ETF要用一篮子组合证券去换份额，为的是让持仓跟指数成分对齐；场外走的是代销渠道，销售机构手里没有股票，只能收现金再转成份额，所以场外对价一律是现金。","e":"像换购超市礼盒：到店里可以拿一堆散装零食去换，线上下单只能先付钱，让店家替你配货，数量还得按清单算。","t":"ETF场内换一篮子股票，场外只收现金","r":"场外申购赎回ETF的对价均为现金"},{"i":232,"c":10,"k":"房地产投资信托","q":"下列关于房地产投资信托（基金）的说法中，错误的是（）。","o":["投资于房地产或者房地产抵押贷款","不能在证券交易所挂牌上市","通过发行受益凭证或者股票募集资金","是一种资产证券化的产品"],"a":1,"p":"REITs把不动产或房地产抵押贷款打包成份额，像股票一样在交易所挂牌买卖，流动性好正是它的卖点，所以说不能上市就错了。它靠发行受益凭证或股票募资，本质是资产证券化，其余三项都成立。","e":"像把一栋公寓拆成一千份来卖，每份几百块，想脱手就挂到二手平台，不用真去把整栋楼卖掉，一周就能成交。","t":"REITs能在交易所上市，不是不能流通","r":"房地产投资信托是一种资产证券化产品，可以采取上市的方式在证券交易所挂牌交易。"},{"i":233,"c":8,"k":"衍生品风险类型","q":"下列关于衍生工具风险的论述中，错误的是（）。","o":["我国沪深300 指数价格走势会影响股指期货沪深300指数合约的价格走势","因为交易对手无法按时付款或者按时交割会带来结算风险","因为资产价格或指数变动会导致价格风险","衍生工具中交易双方某方违约的风险属于流动性风险"],"a":3,"p":"交易对手到期不付款、不交割，属于违约风险也叫信用风险；流动性风险说的是想平仓却找不到对手方、报价差得离谱。把违约说成流动性风险，是把两种风险的成因搞混了。","e":"像约好周末二手转卖球鞋，对方到点不出现也不转账，这是人赖账，跟鞋子卖不卖得掉是两回事，别混一起。","t":"对手违约是信用风险，不是流动性风险","r":"交易双方中某方违约称之为违约风险。"},{"i":234,"c":3,"k":"宣传禁用词","q":"关于宣传推介材料原则要求和禁止性规定说法错误的是（）","o":["制作基金宣传推介材料的基金销售机构应当对其内容负责，保证其内容的合规性，并确保向公众分发、公布的材料与备案的材料一致。","应培养投资人长期投资理念，注重公司品牌、形象宣传，避免有悖于基金合同的宣传手段","在基金募集期可以使用“坐享财富成长”“安心享受成长”“尽享牛市”等词汇","不得有虚假记载、误导性陈述或者重大遗漏"],"a":2,"p":"坐享、安心享受、尽享牛市这类词暗示保本保收益，属于宣传推介材料明令禁止的表述，募集期同样不能用。其余三项要求对内容负责、与备案口径一致、不得虚假误导，都是正常规矩。","e":"像奶茶店不能写喝了必瘦十斤，只能老实标配料和热量；一写效果承诺，就变成违规广告了，是要挨罚的。","t":"保收益、必赚一类词，募集期也禁用","r":"禁止使用“坐享财富成长”“安心享受成长”“尽享牛市”"},{"i":235,"c":10,"k":"ETF份额折算","q":"下列关于ETF份额折算与变更登记的表述，正确的是（）","o":["基金托管人办理ETF份额折算","基金管理人办理变更登记","折算后基金份额持有人持有的基金份额占基金份额总额的比例发生变化","基金份额持有人按折算后的基金份额享有权利并承担义务"],"a":3,"p":"折算只是把净值从一块多压到接近1元、份额按比例放大，持有人占总额的比例一点没变，权利义务跟着折算后的份额走。折算由管理人办，登记结算机构做变更登记，托管人不干这活。","e":"像把一张100元换成十张10元，钱没多也没少，你能花的还是那100块，只是张数变了，能买的东西一样多。","t":"折算只改份额和净值，持有比例不变","r":""},{"i":236,"c":6,"k":"现金流量表","q":"以下关于现金流量表的说法中，正确的是","o":["现金流量表可反映企业的资本结构","现金流量表可评价企业未来产生现金净流量的能力","现金流量表无法反映企业的长期资本筹集状况","现金流量表基本结构分为两部分：经营性现金流和投资性现金流"],"a":1,"p":"现金流量表把经营、投资、筹资三块现金流摆出来，看的是钱怎么进来又怎么出去，能判断未来产生现金净流入的能力。资本结构归资产负债表管，说它只分两部分，也漏掉了筹资活动。","e":"像记一个月的微信账单：工资进、房租出、买基金出，三栏一列，就大概知道下个月还能剩多少，心里有底。","t":"现金流量表分经营、投资、筹资三块","r":"资产负债表揭示了企业的资本结构是否合理。现金流量表的作用包括反映企业的现金流量，评价企业未来产生现金净流量的能力。现金流量表的基本结构分为三部分，即经营活动产生的现金流量、投资活动产生的现金流量和筹资（也称融资）活动产生的现金流量。筹资活动产生的现金流量反映的是企业长期资本（股票和债券、贷款等）筹集资金状况。"},{"i":237,"c":4,"k":"公允价值估值","q":"关于基金的估值方法，下列哪项描述是正确的？","o":["基金的估值方法应根据基金的投资目标确定","基金的估值方法应以市场价值作为主要依据","基金的估值方法应以历史成本作为主要依据","基金的估值方法应以公允价值作为主要依据"],"a":3,"p":"基金估值以公允价值为主：能上市交易的按市价，停牌的找可比价格或估值模型，目标是让净值反映当下能变现的价值，而不是当初买入的成本。历史成本会让净值脱离市场，投资目标决定的是策略不是会计口径。","e":"像二手转卖游戏机：账上记的是当年3000块买的，实际现在只值1800，挂牌当然按1800挂。","t":"基金估值看公允价值，不看历史成本","r":"根据会计准则和基金业协会的规定，基金的估值方法应以公允价值作为主要依据，以确保基金净值的准确性和公允性。因此，D选项描述是正确的。"},{"i":238,"c":6,"k":"价值与成长风格","q":"以下说法正确的是？","o":["持有期债基不同持有人的持有期开始日和结束日是相同的","基金的季度报告必须在季度结束后10个工作日内公布","价值风格基金通常比成长风格基金的持股估值水平更低","基金规模越大代表着投资者认可度越高，因此在挑选基金时规模越大越好"],"a":2,"p":"价值风格挑低PE、低PB、分红稳的公司，成长风格买高增速、高估值的故事，所以前者的持股估值水平通常更低。持有期债基每人的起止日各不相同，季报是15个工作日内公布，规模也并非越大越好。","e":"像买球鞋：价值派挑打折的基础款，实用耐穿；成长派追限量联名，贵就贵在对它还会涨的预期，一个求稳一个赌涨。","t":"价值看便宜、成长看增速，估值高低不同","r":""},{"i":239,"c":5,"k":"市场风险管理","q":"以下属于投资组合市场风险管理措施的是（）。","o":["分析投资组合持有人结构和特征","计算各类证券历史平均交易量、换手率和相应的变现周期","限制与同一交易对手的交易集中度","跟踪分析基金重仓股、个股交易量占该股流通量显著比例"],"a":3,"p":"市场风险来自价格波动，重仓股交易量占流通盘的比例过高时，一抛就砸价、想走也走不动，盯这个比例就是盯价格冲击，属于市场风险措施。持有人结构和变现周期管的是流动性，限制单一交易对手管的是信用。","e":"像班里只有你在抛某款限量笔，一挂出去全班都看见，价格立刻被压低，所以要盯自己占班里存量的比例。","t":"盯价格冲击是市场风险，变现难才是流动性","r":"选项A、B属于流动性风险的管理措施，选项C属于信用风险管理措施。"},{"i":240,"c":5,"k":"预期损失","q":"关于预期损失，以下表述正确的是（）。","o":["预期损失，又称在险价值、尾部损失、条件风险价值度","预期损失由于其在尾部风险度量、次可加性等方面的优势，越来越受到金融行业与监管机构的重视","预期损失是一个分位值","预期损失的估值方法有参数法、历史模拟法和蒙特卡洛模拟法"],"a":1,"p":"预期损失取的是超过VaR那部分损失的期望值，所以它是个平均数而不是某个分位点；它满足次可加性，能把尾部损失也算进来，因此越来越受监管和业界看重。参数法、历史模拟法、蒙特卡洛是VaR的算法，别挪过来。","e":"像给车险估损失：不看最坏那天亏多少这一个点，而是把超过免赔额的事故平均一下，才知道一年大概赔多少。","t":"预期损失是尾部平均，VaR才是分位点","r":"选项A，预期损失也被称为条件风险价值度或条件尾部期望或尾部损失。选项C，预期损失是指在给定时间区间和置信区间内，投资组合损失的期望值，预期损失是一个平均值。选项 D，风险价值常用的估算方法有参数法、历史模拟法和蒙特卡洛模拟法。"},{"i":241,"c":6,"k":"优先股特征","q":"一般情况下，相比于普通股，优先股具有（）风险和（）收益的特征。","o":["较高；较低","较低；较低","较低；较高","较高；较高"],"a":1,"p":"优先股在分红和破产清算时都排在普通股前面，先拿到固定股息，所以风险明显更低；但正因为收益被锁定为固定股息，公司大赚时也分不到超额部分，收益上限也就更低。干扰项错在把优先当成高收益，其实优先只是先拿钱，不是多拿钱。","e":"跟朋友合伙开奶茶店，你出钱只拿每年固定6%的分红，店赚翻也不多分，店亏了也先给你结，图的就是稳。","t":"优先股先拿固定股息，风险低但收益封顶","r":"优先股在分配股利和清算时剩余财产的索取权优先于普通股，因而风险较低。此外，固定的股息收益也降低了优先股的风险。然而，优先股的收益也因此被限定为固定的股息收益，当公司盈利多时，相比普通股而言，优先股获利更少。"},{"i":242,"c":5,"k":"相关系数","q":"两个证券收益率不完全相关意味着这两者的相关系数p的取值范围是（）。","o":["0<p<1","一1 <p <0","0≤|P|≤1","0<|P|<1"],"a":3,"p":"相关系数衡量两条收益率曲线同向或反向的紧密程度，完全同向取1、完全反向取-1、毫无关系取0；不完全相关就是既非1也非-1也非0，取绝对值后落在0和1之间。干扰项漏掉绝对值，等于把完全不相关当成不完全相关。","e":"食堂两家窗口的排队时长一个涨另一个也涨，相关系数0.8属于不完全相关；若完全同步就是1，一涨一跌就是-1。","t":"相关性看绝对值，0和1两个端点都不算","r":"0 < |P| < 1时两个证券收益率不完全相关。"},{"i":243,"c":10,"k":"货币基金风险","q":"以下哪种基金类型通常被认为是风险最低的？","o":["股票型基金","混合型基金","债券型基金","货币市场基金"],"a":3,"p":"货币基金只买短期国债、同业存单、回购这类几个月内到期、价格几乎不波动的工具，本金损失概率最低，所以风险最小。债券基金虽然也稳健，但久期长、利率一波动净值就会跌，干扰项把稳健直接等同于最低风险。","e":"把生活费放进余额宝，随时能取，一天利息几毛钱，几乎不会亏本金；要是买三年期债基，急着用钱时可能还得割肉。","t":"货币基金投短债，风险最低不是收益最高","r":"货币市场基金主要投资于短期、低风险的金融工具，因此其风险相对较低。"},{"i":244,"c":8,"k":"投机交易功能","q":"期货市场有多种不同目的的交易形态，（）增强了市场流动性，承担了套期保值交易转移的风险，是期货市场正常运营的保证。","o":["价差套利交易","点价交易","期现套利交易","投机交易"],"a":3,"p":"投机者主动进场博价差，愿意在别人套保卖出时接盘，既把成交量做大，也把套保者想转嫁的价格风险接了过去，所以是市场正常运转的保证。价差套利赚的是两个合约之间的价差，主要起纠偏作用，不承担单向风险。","e":"球赛门口黄牛低价收票再高价卖出，他赚差价也承担砸手里的风险，正因为他敢接，临时想退票的人才卖得掉。","t":"投机接盘转嫁的风险，套保才敢进场","r":"投机交易增强了市场的流动性，承担了套期保值交易转移的风险，是期货市场正常运营的保证。"},{"i":245,"c":1,"k":"定期报告备案","q":"基金定期报告在披露的第（）个工作日，应分别报中国证监会及其地方证监局、基金上市的证券交易所备案。","o":["1","2","5","10"],"a":1,"p":"定期报告的备案时点卡在披露后的第2个工作日，因为披露当天还要走流程，多给一个工作日让报送真正落地，证监会、地方局和交易所三处都要报。1个工作日太赶、5或10个工作日又太松，都是别的披露事项的期限。","e":"像交作业：周五晚上发到群里，最晚周一上班第一件事把纸质版交给三个老师，中间那个工作日就是缓冲。","t":"定期报告披露后第2个工作日备案","r":"定期报告在披露的第2个工作日，应分别报中国证监会及其证监局、基金上市的证券交易所备案。"},{"i":246,"c":11,"k":"过户费归属","q":"我国场内证券交易结算费用中，过户费的最终收取方是（）。","o":["券商","国家税务机关","证券交易所","中国结算公司"],"a":3,"p":"过户费是买卖成交后变更证券登记名册的工本费，登记结算由谁办钱就归谁，所以最终落到中国结算公司账上，券商只是代扣代缴。印花税才归国家税务机关，交易所收的是经手费，别把这几笔混成一笔。","e":"租客换人要改房产证上的名字，跑腿的是房管局，那几十块更名费自然进房管局口袋，中介只是帮你代交。","t":"过户费进中国结算，印花税才进税务局","r":"过户费是委托买卖的股票、基金成交后，买卖双方为变更证券登记所支付的费用。这笔收入属于中国结算公司的收入，由证券经纪商在同投资者清算交收时代为扣收。"},{"i":247,"c":5,"k":"分散化投资","q":"一只股票型基金的投资组合通常包括多种股票，以实现：","o":["降低风险","提高收益","管理方便","以上都是"],"a":0,"p":"把资金摊到不同行业、不同股票上，个别公司暴雷时其他持仓能顶住，组合波动被摊薄，所以核心作用是降低风险。它不能让收益必然变高，也不能把系统性风险消掉，更不是为了管理省事，以上都是那种选项错在这里。","e":"宿舍四个人凑钱买零食，分别买薯片、辣条、果冻、酸奶，某样断货也不至于没得吃；全买同一种，涨价就全砸了。","t":"分散只降非系统性风险，消不掉全部","r":""},{"i":248,"c":6,"k":"价值型基金","q":"如果股票基金的平均市盈率小于市场指数的市盈率，则可以认为该股票基金属于（）","o":["成长型基金","价值型基金","防御型基金","积极型基金"],"a":1,"p":"市盈率低说明股价相对每股盈利便宜，这类基金专挑被低估、分红稳的公司，属于价值型；成长型恰恰相反，愿意为高增长付高市盈率。防御型看的是行业需求稳不稳，不是市盈率高低，别混。","e":"菜市场快收摊时那筐有点蔫的青菜，五块钱一大把，别人嫌丑你算过够吃两顿，这就是价值型挑便宜货的思路。","t":"市盈率低是价值，市盈率高是成长","r":""},{"i":249,"c":11,"k":"债券流通起始","q":"中央政府债券、政策性金融债券（可交易期限在366天【含】以下的），交易流通起始日为该债券债权债务登记日的（）工作日","o":["当天","次一个","次两个","上市时的"],"a":1,"p":"这类短期限利率债登记当天还要完成债权债务确认，所以交易流通从登记日的次一个工作日才开始，口径是366天含以下。当天就上市太急，次两个工作日又拖沓，是别的品种或别的环节的期限。","e":"网上买的二手自行车今天刚签收登记，平台要核一晚信息，第二天上午才挂出来能转卖，规矩就是隔一个工作日，急也没用。","t":"366天以内利率债，登记次一工作日可交易","r":"中央政府债券、政策性金融债券（可交易期限在366天【含】以下的）该债券债权债务登记日的次一工作日"},{"i":250,"c":1,"k":"募集验资备案","q":"基金管理人应当自募集期限届满之日起（）日内聘请法定验资机构验资。自收到验资报告之日起（）日内，向中国证监会提交备案申请和验资报告，办理基金备案手续。","o":["10 10","7 7","15 15","10 20"],"a":0,"p":"募集期结束后10日内必须请法定验资机构验资，拿到报告后再10日内向证监会交备案申请，两个10日一前一后串起来算。7日、15日都是别的环节的期限，20日容易被凑成第二个10日来设套。","e":"奶茶店开张前先花十天找会计查账验资，拿到报告后再十天去工商办登记，两步各有各的十天，不能并成一步。","t":"验资10日、备案10日，两个10日别记串","r":"基金管理人应当自募集期限届满之日起10日内聘请法定验资机构验资。 自收到验资报告之日起10日内，向中国证监会提交备案申请和验资报告，办理基金备案手续。"},{"i":251,"c":7,"k":"转换比例","q":"可转换债券面值为500元，规定其转换价格为25元，则转换比例为（)。","o":["15","25","30","20"],"a":3,"p":"转换比例等于债券面值除以约定转换价格，500除以25正好20股，也就是一张债券能换成20股股票。选项里25是把转换价格当成了股数，15和30多半是拿面值去凑别的除数算出来的。","e":"超市积分500分能抵25元，那500分就是20个25元，一张券换几份货，用总面值除以单价这份数就出来了。","t":"转换比例等于面值除以转换价格得股数","r":"转换比例=可转换债券面值/转换价格= 500 /25 = 20。"},{"i":252,"c":4,"k":"份额净值","q":"下列与基金份额净值的计算无关的是（）。","o":["基金总资产","基金总负债","机构持有比例","基金总份额"],"a":2,"p":"份额净值就是基金总资产减掉总负债得到净资产，再除以基金总份额，三个数据缺一不可。机构持有比例只是持有人结构，分子分母里都没有它，所以怎么算都不影响每份值多少钱。","e":"一锅汤总重两斤，去掉锅和调料剩一斤八两，分给六个人每人三两；谁出钱多谁出钱少，跟每人喝多少没关系。","t":"净值看资产减负债除份额，跟谁持有无关","r":""},{"i":253,"c":11,"k":"场内交易费用","q":"场内证券交易涉及的费用不包括（）","o":["佣金","过户费","印花税","销售服务费"],"a":3,"p":"场内买卖股票基金要付券商佣金、登记结算的过户费和卖出时的印花税，这三笔都是交易环节的过路费。销售服务费是按持有份额从基金资产里按日计提的，属于养基金的钱，跟下单成交没关系。","e":"打车有起步价、里程费和高速过路费，这三笔是上车才产生的；车险和保养费不管今天坐不坐车都得交，性质不一样。","t":"佣金过户费印花税是交易费，销售服务费是持有费","r":"场内证券交易涉及的费用为选项ABC"},{"i":254,"c":1,"k":"公司核心业务","q":"我国基金管理公司最核心的业务是（）","o":["基金资产保管业务","基金募集业务","投资管理业务","基金销售业务"],"a":2,"p":"基金公司靠替持有人做投资决策来创造价值，投资管理能力决定了业绩和规模，募集、销售、保管都是围着它转的配套。资产保管是托管银行的活，不是基金公司的本业，这个干扰项错在把托管职责搬了过来。","e":"饭店的核心是后厨炒菜，前台点单、采购、洗碗都围着它转；让老板去管保险柜钥匙，那是托管银行干的事。","t":"基金公司靠投资管理吃饭，保管归托管行","r":""},{"i":255,"c":10,"k":"对冲基金风险","q":"长期资本管理公司曾是世界著名的对冲基金，它的投资策略是收敛套利，即持有低流动性资产，卖空高流动性资产。在1998年索罗斯对其主权外债违约后，市场基金开始选择安全性高的资产，一系列金融机构试图将他们那些被视为难以出售且具有较高潜在风险的投资进行清算，用低风险的投资取而代之，这对于长期资本管理公司的收敛套利策略非常不利，并最终导致了这家著名基金公司的倒闭，上述案例解析没有涉及的风险是（）。","o":["市场风险","操作风险","信用风险","流动性风险"],"a":1,"p":"案例里资产价格同向下跌是市场风险，外债违约是信用风险，想卖卖不掉、被迫贱卖是流动性风险，三样齐全。操作风险指人、系统、流程出错或欺诈，案例没有提到任何内部失误，所以没涉及。","e":"你借同学钱买球鞋，结果球鞋全网降价、同学又催债、二手挂三天没人要，一路都是价格、信用和变现的坑，没人手滑点错。","t":"价格跌是市场，还不上是信用，卖不掉是流动性","r":"操作风险是来源于人力、系统、流程出错，以及其他不可控但会影响公司运营的风险。例如人为失误、内外部欺诈、系统失灵和合同纠纷等。本案例中未涉及该风险。"},{"i":256,"c":1,"k":"临时报告","q":"当发生对基金份额持有人权益或者基金价格产生重大影响的事件时，应在（）日内编制并披露临时报告书，并分别报中国证监会及地方证监局备案。","o":["1","2","3","5"],"a":1,"p":"发生影响持有人权益或基金价格的重大事件，管理人要在2日内编好并披露临时报告，同时报证监会和地方证监局备案，时限从事件发生之日起算。1日过于苛刻，3日和5日是定期报告或其他备案事项的期限。","e":"宿舍水管爆了，群里当晚就发通知，最迟后天一早把纸质说明贴到宿管、辅导员、后勤三个地方，两天内办完。","t":"重大事件发生2日内必须披露临时报告","r":"当发生对基金份额持有人权益或者基金价格产生重大影响的事件时，应在2日内编制并披露临时报告书，并分别报中国证监会及其证监局备案。"},{"i":257,"c":8,"k":"期货市场功能","q":"关于期货市场的基本功能，以下表述错误的是（）。","o":["风险管理","价格发现","稳定经济","投机"],"a":2,"p":"期货市场的三大功能是风险管理、价格发现和投机，投机还负责提供流动性，标准说法里没有稳定经济。稳定经济是宏观调控追求的目标，期货最多帮着发现价格，没那么大本事。","e":"小区团购群能提前锁定菜价、能看出明天菜贵不贵、还有人专门低买高卖赚差价，但指望它让物价不涨，那是想多了。","t":"期货三功能：风险管理、价格发现、投机","r":"一般而言，期货市场的基本功能有以下三种：(1)风险管理。(2)价格发现。(3)投机。"},{"i":258,"c":2,"k":"利益冲突处理","q":"基金销售人员应避免所在机构和个人利益与投资者利益冲突，如无法避免应以（）优先。","o":["所在机构","投资者利益","基金管理人","销售人员自身"],"a":1,"p":"销售人员的佣金和机构销量考核都跟自身利益挂钩，一旦和客户利益撞上，规矩是客户优先，因为受托关系要求把持有人放在前面。机构利益、管理人利益和自身利益都排在后面，选了就等于让客户为你的业绩买单。","e":"健身房私教想让你办三年卡拿提成，可你膝盖已经受伤，他该先劝你别办，而不是先把提成揣兜里赚钱。","t":"机构、自己、客户打架，客户排第一","r":"基金销售人员应避免所在机构和个人利益与投资者利益冲突，如无法避免应以投资者利益为优先。"},{"i":259,"c":5,"k":"分散化效果","q":"投资者利用分散化投资的方法可以（）。","o":["度量风险","监测风险","降低风险","消除风险"],"a":2,"p":"分散只能摊掉各家公司的个别风险，市场整体涨跌带来的系统性风险怎么配都躲不开，所以结果是降低而不是消除。度量、监测是风险管理流程里的动作，不是分散投资本身能办到的事，这两个选项属于答非所问。","e":"宿舍四人各买一只不同股票，某家暴雷只亏四分之一，但大盘整体暴跌时四只一起绿，这就是躲不掉的系统性风险。","t":"分散降得了个别风险，降不掉系统性风险","r":"通过投资资产组合，可以降低风险，但不能完全消除风险。"},{"i":260,"c":6,"k":"股票流动性","q":"相比之下，（）流动性较好，买卖价差小。","o":["成长股","新兴市场股票","大盘蓝筹股","小盘股"],"a":2,"p":"大盘蓝筹股市值大、股东多、每天成交额高，买卖盘随时接得上，所以买卖价差被压得很窄。小盘股和新兴市场股票关注度低、成交清淡，想卖只能降价，价差自然拉大，成长股也常因盘子小而不占优。","e":"菜市场最火的那个摊位一天卖三百斤土豆，随时买随时卖都是两块一斤；角落那摊一天卖十斤，你要买他抬价，你要卖他压价。","t":"盘子越大越好卖，买卖价差也越小","r":""},{"i":261,"c":4,"k":"管理费计提","q":"基金的管理费如何计提？","o":["按日计提","按周计提","按月计提","按季计提"],"a":0,"p":"管理费按前一日基金净资产乘年费率再除以365，每天都算一笔，按月支付给管理人，这样净值每天都能真实反映成本。按周、按月、按季计提都会让某几天净值虚高，跟每日估值对不上。","e":"租房的水电费不是月底拍脑袋算，而是每天抄表按用量记，月底一次性结，这样每天都知道自己花了多少。","t":"管理费每天算一笔，月底才付给公司","r":""},{"i":262,"c":10,"k":"货币基金杠杆","q":"除非发生巨额赎回，货币市场基金债券正回购的资金余额不得超过（）。","o":["10％","15％","20％","30％"],"a":2,"p":"货币基金靠正回购加杠杆，规则把债券正回购余额压在基金资产净值的20%以内，只有巨额赎回这种极端情况才临时放开。10%和15%设得太紧，30%又太松，20%是监管给货基杠杆划的红线。","e":"开奶茶店自己出八成本钱，最多再借两成周转，借多了遇上突然一堆人要退卡，现金流立刻断，两成就是那条线。","t":"货基正回购余额卡在20%这条线","r":"一般情况下，货币市场基金财务杠杆的运用程度越高，其潜在的收益可能越高，但风险相应也越大，另外，按照规定，除非发生巨额赎回，货币市场基金債券正回购的资金余额不得超过20％。"},{"i":263,"c":1,"k":"及时性披露","q":"基金信息披露内容及时性原则要求以最快速度公开信息，在法定期限内披露招募说明书，定期报告等，在重大事件发生（）个工作日内发布临时报告。","o":["1","2","5","10"],"a":1,"p":"及时性原则要求信息以最快速度公开，重大事件发生后2个工作日内必须出临时报告，让持有人第一时间知道。1个工作日太紧，5日和10日拖得太久，会让人在信息真空中交易，损害公平。","e":"宿舍楼突然停水，楼长当天晚上就在群里发通知，而不是等下周开会再说，越早知道大家越能提前接水。","t":"重大事件两个工作日内必须披露报告","r":"及时性：要求以最快速度公开信息，在法定期限内披露招募说明书，定期报告等，在重大事件发生2个工作日内发布临时报告。"},{"i":264,"c":10,"k":"宽基行业主题","q":"下列哪项不是股票ETF可划分为的类型","o":["宽基ETF","行业ETF","主题ETF","高换手ETF"],"a":3,"p":"股票ETF按跟踪标的分为宽基、行业和主题三类，宽基覆盖全市场，行业按板块切，主题按概念切，边界清楚。高换手说的是交易活跃度，是结果不是分类标准，任何ETF都可能换手高。","e":"奶茶店分水果茶、奶茶、咖啡三类，按卖什么分；要说哪家排队长，那是生意好坏，不能算一个新品类。","t":"ETF按宽基行业主题分，换手率不是类别","r":""},{"i":265,"c":4,"k":"分红方式","q":"关于基金分红方式，以下表达错误的是（）。","o":["封闭式基金只能采用现金分红","开放式基金可以采用现金分红或分红再投资方式","基金收益分配默认为采用分红再投资方式","分红再投资方式是指将投资者应分配的净利润折算成一定的基金份额给投资者"],"a":2,"p":"默认方式是现金分红，钱直接回到投资者账户，要改成红利再投得自己提出申请，因为现金是更保守的默认值。封闭式基金受份额固定限制只能现金分红，说默认红利再投正好把方向说反了。","e":"公司发年终奖默认打到你银行卡，想换成公司股票得自己签字同意，不会不打招呼就把现金变成股份。","t":"默认现金分红，要再投得自己申请","r":"根据相关规定，基金收益分配默认为采用现金方式。"},{"i":266,"c":7,"k":"利率风险","q":"下列关于债券利率风险的表述中，正确的是（）。","o":["浮动利率债券相比固定利率债券在利率下行的环境中具有较低的利率风险","固定利率债券和零息债券的价格与市场利率无关","浮动利率债券相比固定利率债券在利率上升的环境中具有较高的利率风险","债券的价格与利率呈反向变动关系"],"a":3,"p":"市场利率上升，新发债券票息更高，老债券只能降价才卖得掉，所以价格和利率永远反向走。浮动利率债的票息跟着市场重定价，利率上行时风险反而更小，说它上行风险高是把方向弄反了。","e":"去年抢的三年期存单利率三个点，今年新存单给四个点，你那张三点的想提前转手，只能让价才有人接。","t":"利率涨债券就跌，跷跷板永远反向","r":"债券的价格与利率呈反向变动关系：利率上升时，债券价格下降；而当利率下降时，债券价格上升。债券价格受市场利率影响，而浮动利率债券的利息在支付日根据当前市场利率重新设定，从而在市场利率上升的环境中具有较低的利率风隆，而在市场利率下行的环境中具有较高的利率风险。"},{"i":267,"c":11,"k":"货币市场功能","q":"货币市场工具在金融市场中发挥重要功能，以下表述错误的是（）。","o":["货币市场工具为企业融通长期资金提供了有效手段","货币市场工具交易形成的短期利率常常在整个市场的利率体系中充当基准利率","货币市场工具为商业银行管理流动性提供了有效手段","货币市场工具交易形成的短期利率常常被用来判断市场的银根松紧程度"],"a":0,"p":"货币市场工具期限都在一年以内，解决的是短期头寸和流动性周转，说它融通长期资金就把期限搞反了。形成基准利率、帮银行管流动性、判断银根松紧，这三条都是货币市场真实干的事。","e":"手头紧时找同事借两百块撑到发工资，这叫短期周转；想凑首付买房得找银行贷二十年，那是资本市场的事。","t":"货币市场管一年内的钱，长期归资本市场","r":"货币市场工具为商业银行管理流动性以及企业融通短期资金提供了有效的手段。"},{"i":268,"c":8,"k":"期货互换区别","q":"下列关于期货合约和互换合约的区别的说法中，错误的是（）。","o":["期货合约和互换合约都只在交易所交易","期货合约通常用现金结算，互换合约通常用实物交割","期货合约和大部分互换合约都是双边合约","期货合约有明显的杠杆效应"],"a":0,"p":"期货是交易所内标准化的合约，互换绝大多数在场外由双方私下约定，所以都只在交易所这句就错了。其余说法如期货多现金结算、有明显杠杆，方向都对，只有把互换也塞进交易所才不通。","e":"买电影票上平台下单，价格座位都统一，这是交易所的玩法；跟邻居私下换车位用，条件两家谈，就是场外互换。","t":"期货在交易所，互换大多私下场外谈","r":"期货合约只在交易所交易，期权合约大部分在交易所交易，远期合约和互换合约通常在场外交易。"},{"i":269,"c":7,"k":"银行永续债","q":"以下关于商业银行永续债和商业银行二级资本债的说法正确的是？","o":["永续债偿还顺序优先于二级资本债","永续债没有明确到期日","二级资本债含有利率跳升机制","二级资本债不含减记条款"],"a":1,"p":"永续债名字就说明它没有约定到期日，只在特定条件下才可能赎回，所以清偿顺序排二级资本债后面而不是前面。利率跳升和减记条款其实两类债都可能有，把这两个当成区分点容易判断错。","e":"跟房东签的租房合同写到明年六月，到期就得搬；永续那种是只要双方不说停就一直住下去，没有那个日子。","t":"永续债没到期日，二级资本债有期限","r":""},{"i":270,"c":6,"k":"风险溢价","q":"关于权益类证券风险溢价的表述，正确的选项是（）。","o":["只有非系统性风险才要求相应的风险溢价","风险资产的期望收益率与其风险溢价正相关","当无风险资产收益率上升时，风险资产的风险溢价随之上升","风险资产的风险溢价上升时，无风险资产收益率随之上升"],"a":1,"p":"风险溢价是投资者多承担风险要求多拿的补偿，要求的补偿越高，资产的期望收益率自然越高，两者同向变动。只有系统性风险才配拿溢价，非系统性风险靠分散就能消掉，这是另一个常见错点。","e":"借钱给隔壁开水果店的朋友，比存银行多要三个点利息才肯借，因为怕他亏；多要的这三点就是风险溢价。","t":"溢价是风险的补偿，越怕越要多给","r":"对于可以进行充分分散化投資的投資者而言，只有系统风险才是最重要的，而系统风险用系数来衡量。投资者要求的资产风险溢价与系数成正比。"},{"i":271,"c":11,"k":"共同对手方","q":"关于场内证券交易结算的共同对手方制度，以下说法中错误的是（）。","o":["共同对手方是指在结算过程中，同时作为所有买方和卖方的交收对手，并保证交收顺利完成的主体","如果买卖双方中的一方不能履约交收，共同对手方会暂时冻结卖出方的证券或买入方的资金，直到另一方履约时，再完成交收","共同对手方一般由证券登记结算机构充当","卖出证券的投资者相当于将证券卖给了共同对手方，买入证券的投资者相对于从共同对手方买入证券"],"a":1,"p":"结算机构当共同对手方，一方违约时它要按规则先替违约方向守约方垫付证券或资金，保证交收不断，事后才追偿。说它冻结守约方的东西等对方履约，等于把保护变成了拖延，方向完全反了。","e":"网购付款先打给平台，卖家不发货平台先垫钱退你，它再去追卖家，不会让你干等着对方履行，这才叫担保。","t":"对手方先垫付给守约方，不是冻结","r":"如果买卖双方中的一方不能按约定条件履约交收，结算机构也要依照结算规则向守约一方先行垫付其应收的证券或资金。"},{"i":272,"c":8,"k":"期货期权杠杆","q":"关于期货和期权，下列表述正确的是（）。","o":["买卖双方都要缴纳保证金","期货和期权都具有杠杆效应","期货和期权都是双边合约","交易双方的损益都具有不对称性"],"a":1,"p":"期货交保证金就能控制大额合约，期权买方只付一笔权利费，两样都是用少量钱撬动大额标的，杠杆都在。期权只有买方有权利、卖方担义务，损益不对称，也不是双方都交保证金，另外几个选项都错在这。","e":"奶茶店加盟交两万定金就能锁定二十万的设备，两万撬二十万就是杠杆；买张五十块的观影券随时能看，也是小钱办大事。","t":"期货押保证金，期权付权利金，都有杠杆","r":"期货合约通常采用保证金交易，因此，有明显的杠杆效应，期权合约中买方需要支付期权费，而卖方则需要缴纳保证金，也会有杠杆效 应。A 项错误，B 项正确。期权合约和信用违约互换合约只有一方在未来有义务，因此，被称作单 边合约。而远期合约、期货合约和大部分互换合约都包括买卖双方在未来应尽的义务，因此，它们有时被称为远期承诺或者双边合约。C 项错误。 期权合约与远期合约以及期货合约的不同之处是它的损益的不对称性。D项错误。"},{"i":273,"c":4,"k":"停牌股估值","q":"对某上市公司股票价格的估值，如估值日该股票停牌，最近交易日证券市场未发生重大涨跌，且该上市公司也未发生重大事件，则基金管理人应（）。","o":["按该股票的成本价估值","参考同行业其他上市公司股票的现行市价估值","采用该股票的最近交易市价估值","采用普遍认同的估值技术确定该股票的公允价值"],"a":2,"p":"股票停牌但最近交易日市场没大波动、公司也没出大事，说明最近那个收盘价依然公允，直接沿用即可，不必另起炉灶。成本价只在长期停牌且无法取得公允价值时用，行业类比和估值技术都是更靠后的备选。","e":"常买的那款面包店临时关门三天，这几天它还是八块一个，你就按八块记账，不用去猜别家卖多少，它这三天也没变过价。","t":"停牌期间无重大事件，沿用最近收盘价","r":"对存在活跃市场且能够获取相同资产或负债报价的投资品种，在估值日有报价的，除会计准则规定的例外情况外，应将该报价不加调整地应用于该资产或负债的公允价值计量。估值日无报价且最近交易后未发生影响公允价值计量的 重大事件的，应采用最近交易日的报价确定公允价值。有充足证据表明估值日或最近交易日的报价不能真实反映公允价值的，应对报价进行调整，确定公允价值。"},{"i":274,"c":2,"k":"客户资料保存","q":"基金销售机构的客户身份资料，自业务关系结束当年起至少保存（）年","o":["5","8","10","15"],"a":3,"p":"反洗钱规则要求客户身份资料自业务关系结束当年起至少保存15年，账户销了资料还得留着，方便日后追查可疑交易。5年、8年、10年都是其他合规档案的常见期限，拿来套在这里就少了好几年。","e":"大学毕业退宿舍，宿管还要把你的入住登记和查寝记录留十几年，将来有事能翻出来，不会当年就碎掉。","t":"客户身份资料，销户后还要留15年","r":"客户身份资料自业务关系结束当年起至少保存15年"},{"i":275,"c":4,"k":"巨额赎回","q":"当发生巨额赎回时，基金管理人立即向证监会备案，并在（）个工作日内在证监会指定媒体披露。","o":["10","18","5","3"],"a":3,"p":"巨额赎回发生后管理人要立刻向证监会备案，并在3个工作日内在指定媒体上公告，让还在场内的持有人知道流动性出了状况。5日、10日都太慢，1日又和备案的即时性混在一起。","e":"奶茶店突然来了三十个人排队，店长一边打电话跟总部报备，一边三天内在门口贴出限购说明，不能闷着不吭声。","t":"巨额赎回先备案，3个工作日内公告","r":"当发生巨额赎回时，基金管理人立即向证监会备案，并在3个工作日内在证监会制定媒体披露。"},{"i":276,"c":3,"k":"销售协议","q":"基金销售机构办理基金销售业务应当由基金销售机构与（）签订书面销售协议","o":["基金份额持有人","基金托管人","基金管理人","基金监管机构"],"a":2,"p":"基金销售机构是替基金管理人卖基金，产品和管理人都是委托方，所以书面销售协议只能跟基金管理人签，明确双方权利义务。跟持有人签的是销售合同，跟托管人、监管机构更谈不上签销售协议。","e":"超市要卖某品牌的酸奶，供货合同是跟厂家签的，不是跟每天来买酸奶的顾客签，也不是跟仓库管理员签。","t":"卖基金先跟管理人签协议，再卖给客户","r":"基金销售机构应与基金管理人签订书面协议"},{"i":277,"c":4,"k":"侧袋机制","q":"公募基金侧袋机制是为了控制（）风险","o":["政策","利率","流动性","操作"],"a":2,"p":"某只债券或股票停牌、暴雷卖不掉时，把它单独放进侧袋账户，剩下的主袋照常申赎，这样先跑的人就没法把难卖的资产甩给后来者接盘。它防的是挤兑式的流动性风险，跟利率、政策、操作不搭。","e":"合租退房时，那台坏掉的洗衣机先单独放储物间不折价，其余家具照常算钱分摊，免得有人先搬走占便宜。","t":"难卖的单独装袋，防的是挤兑式赎回","r":""},{"i":278,"c":5,"k":"投资规划阶段","q":"形成资本市场预期，建立战略资产配置，是投资组合管理中（）的主要内容。","o":["规划阶段","反馈阶段","监控阶段","执行阶段"],"a":0,"p":"组合管理分规划、执行、监控反馈几步，形成资本市场预期、定下战略资产配置都在动手之前完成，属于规划阶段。执行阶段是选证券、调仓位，监控阶段看偏离，反馈阶段做修正，把预期放进执行就颠倒了顺序。","e":"出门旅游先定去哪个城市、带多少钱，再订票订房；到了当地现找景点那是执行，别把做计划当成上路。","t":"先做资本市场预期和战略配置，再执行","r":"规划阶段完成的工作包括：确定并量化投资者的投资目标和投资限制；制定投资政策说明书；形成资本市场预期；建立战略资产配置。"},{"i":279,"c":9,"k":"跟踪误差","q":"基金收益率与基准组合收益率之间的日差异收益率的标准差，通常被称为（）","o":["跟踪误差","信息比率","相对误差","相对收益"],"a":0,"p":"跟踪误差就是基金日收益和基准日收益之差的波动幅度，用这串差异收益率的标准差来算，衡量的是跟得稳不稳，跟跑得快不快无关。信息比率是拿这个误差当分母、超额收益当分子算出来的比值，别弄反。","e":"跟着导航走，你今天早到两分钟、明天晚到三分钟，这种忽快忽慢的幅度就是跟踪误差，说明跟得不稳。","t":"跟踪误差看偏差的波动，不看超额收益","r":""},{"i":280,"c":3,"k":"客户服务","q":"客户服务是基金销售的重要组成部分，下列不属于客户服务的是（ ）。","o":["在发行新基金时群发手机短信以广而告之新基金发行的信息","向基金持有人解答各类疑问","通过电视向基金投资者传输正确的投资理念","向基金持有人邮寄投资策略报告"],"a":0,"p":"客户服务是给已有客户答疑、寄资料、做投资者教育，属于持续维护关系的事；新基金发行时群发短信广而告之是促销拉新，属于营销推介。其余三项都在服务存量客户，性质不同。","e":"健身房给老会员发体测报告、教怎么练是服务；跑去地铁口发传单拉新人办卡，那叫拉客，跟服务是两码事。","t":"服务老客户是服务，拉新客户是营销","r":""},{"i":281,"c":1,"k":"QDII投资范围","q":"QDII基金的投资范围不包括","o":["股票","存托凭证","不动产","金融衍生品"],"a":2,"p":"QDII只能买境外挂牌的股票、存托凭证、债券和金融衍生品等可流通证券，不动产是实物资产，估值难、变现慢，被明确排除。存托凭证虽叫凭证，却代表境外股票、能在交易所买卖，仍在允许范围内。","e":"找人代购，只买商场里明码标价、能当场结账的东西；房子要过户、要评估，代购清单上直接划掉不接单。","t":"QDII买证券不买楼，不动产是禁区","r":""},{"i":282,"c":11,"k":"结算方式","q":"在单笔交易规模较大的债券市场中，比较适合的结算方式是（）。","o":["券款净额结算","双边净额结算","逐笔全额结算","多边净额结算"],"a":2,"p":"逐笔全额结算是一笔交易对应一笔钱券足额划付，不做轧差，单笔金额大、笔数少的债券市场用它对手方风险最低；净额结算要把多笔交易对冲后只划差额，适合笔数多金额小的市场，用在这里反而放大风险。","e":"买一台五万元的相机，一手交钱一手交货一次结清；只有每天几十杯奶茶这种小额高频，才适合月底一起算总账。","t":"大额单笔走逐笔全额，小额多笔才轧差","r":"逐笔全额结算是最基本的结算方式，适用于高度自动化系统的单笔交易规模较大的市场。"},{"i":283,"c":3,"k":"投资者教育","q":"基金投资者教育活动的内容不包括（ ）。","o":["风险教育","投资咨询","风险提示","投资者维权"],"a":1,"p":"投资者教育是普及风险知识、做风险提示、教人怎么维权，属于公益性的教，不能替客户挑产品；投资咨询针对具体客户的具体情况给买卖建议，是收费的个性化服务，两者界限必须分清。","e":"驾校只教交规和怎么踩刹车，不会替你决定今天开去哪条路；想让人规划路线，那得另外花钱请导航。","t":"教育讲道理，咨询给建议，别混一起","r":""},{"i":284,"c":5,"k":"主动比重","q":"某投资组合的主动比重为（ ）时，意味着该投资组合与基准完全相同。","o":["20％","100％","0","50％"],"a":2,"p":"主动比重衡量组合各成分权重与基准权重的偏离，权重完全一致时偏离为零，组合其实就是复制基准的指数基金；只有偏离达到100%才表示与基准毫无重合，20%和50%都只是部分偏离。","e":"照着菜谱一模一样备料，一克不差，端出来就是标准味道；哪怕只把糖换成盐，偏离度也不再是零了。","t":"主动比重零就是抄基准，一百才完全不像","r":"主动比重为0意味着该投资组合实质上是一个指数基金。主动比重为100％表示该投資组合与基准完全不同。"},{"i":285,"c":4,"k":"交易费用","q":"下列与基金相关的费用中，属于交易费用的是（）。","o":["开户费","上市年费","分红手续费","过户费"],"a":3,"p":"过户费是买卖成交后变更证券登记时按成交金额收的钱，跟着每一笔交易走，所以归入交易费用；开户费、上市年费、分红手续费是运营环节一次性或按年收的费用，不随交易发生，不算交易费用。","e":"二手房过户要交登记费，只有真成交过户才掏这笔钱；小区的物业费和门禁卡工本费，跟这单买卖没关系。","t":"过户费随交易走，开户年费属运营","r":"目前，我国证券投资基金的交易费用主要包括印花税、交易佣金、过户费、经手费、证管费。"},{"i":286,"c":3,"k":"客户服务原则","q":"基金客户服务原则不包括","o":["连续沟通原则","客户至上原则","安全第一原则","专业规范原则"],"a":0,"p":"客户服务的四项原则是客户至上、有效沟通、安全第一、专业规范；有效沟通强调把问题沟通清楚、解决掉，而不是没完没了地联系，连续沟通是硬造出来的说法，多两个字就错。","e":"谈恋爱讲究把话说到点子上，一天发十条早安晚安却解决不了问题，那不叫有效沟通，只能叫打扰人。","t":"有效沟通不是连续沟通，多两字就错","r":"基金客户服务原则包括：客户至上、有效沟通、安全第一、专业规范"},{"i":287,"c":9,"k":"信息比率","q":"某基金区间收益30%，同期业绩比较基准收益为20%，跟踪误差为50%，则该基金在这一区间的信息比率为","o":["0.1","0.2","0.3","0.4"],"a":1,"p":"信息比率等于超额收益除以跟踪误差，先用30%减20%得超额收益10%，再除以跟踪误差50%，结果是0.2；它衡量每承担一单位主动偏离基准的风险能换来多少超额收益，分母里不含总风险。","e":"送外卖多绕一段多挣10块钱，代价是路上多颠50下，平均每颠一下只多赚两毛，这笔主动加码值不值很清楚。","t":"超额收益除以跟踪误差，分母不是总风险","r":""},{"i":288,"c":6,"k":"普通股权利","q":"甲机构在投资时，希望获得乙公司的重大事务表决权，则一般情况下，甲机构应该投资乙公司发行的（）。","o":["优先股","长期债券","股票期权","普通股"],"a":3,"p":"普通股是公司的基本股份，股东按一股一票在股东大会上表决，能决定重大事务；优先股股息固定但通常没有表决权，长期债券和股票期权根本不是股权，持有人拿不到股东身份，自然也投不了票。","e":"小区业委会投票，只有真买了房的业主手里有票；租客租金交得再久也只是住户，照样进不了投票现场。","t":"要表决权就买普通股，一股一票说了算","r":"普通股股东享有股东的基本权利，概括起来为收益权和表决权。表决权是指普通股股东享有决定公司一切重大事务的决策权。"},{"i":289,"c":1,"k":"募集信息披露","q":"基金募集期的三大信息披露文件不包括（）","o":["基金合同","基金招募说明书","基金托管协议","基金净值公告"],"a":3,"p":"募集期要披露的是基金合同、招募说明书、基金托管协议这三份文件，把产品怎么运作、钱由谁管讲清楚；基金净值公告是基金成立后每个估值日都要披露的运作期信息，募集时还没有净值可公告。","e":"奶茶店开张前先贴菜单、配方表和卫生承诺书，让人知道卖什么、谁来管；开张后每天更新的营业额，是另一码事。","t":"募集期看合同招募书托管协议，净值公告属运作期","r":"基金净值公告属于基金运作期间披露的信息文件"},{"i":290,"c":11,"k":"交易流通起始日","q":"中央政府债券、政策性金融债券（可交易期限在366天以上的）的交易流通起始日为该债券债权债务登记日后的（）工作日","o":["第一个","第二个","第三个","第四个"],"a":2,"p":"国债和可交易期限超过366天的政策性金融债，从债权债务登记日算起，第三个工作日才开始交易流通，中间要留给登记确权和系统处理；第一个、第二个工作日都太急，时间还没走完。","e":"网购大件下单后要等三天才发货，第一天揽收、第二天分拣、第三天出库，急也急不来，系统得一步步走完。","t":"366天以上，登记后第三个工作日可交易","r":"中央政府债券、政策性金融债券（可交易期限在366天以上的）该债券债权债务登记日后的第三个工作日"},{"i":291,"c":1,"k":"披露准确性","q":"要求用精确的语言表达信息，不能使人误解，不能使用模棱两可的语言。属于基金信息披露的内容方面的（）原则","o":["真实性原则","准确性原则","及时性原则","公平性原则"],"a":1,"p":"准确性管的是话说得清不清楚，要求用词精确、不模棱两可、不让人误解；真实性管内容是否属实，及时性管披露早不早，公平性管所有人是否同时看到，四个原则各管一段，别互相串。","e":"体检报告上写疑似还是写确诊，差一个字就整晚睡不着，所以医生下笔必须精确，含糊其辞等于误导人。","t":"准确管措辞，真实管真假，及时管早晚","r":"准确性：要求用精确的语言表达信息，不能使人误解，不能使用模棱两可的语言。"},{"i":292,"c":7,"k":"浮动利率债券","q":"下列各类债券中，其利率在偿付期限内发生变化的是（）。","o":["贴现债券","附息债券","息票累计债券","浮动利率债券"],"a":3,"p":"浮动利率债券的票面利率由基准利率加利差构成，每个付息期按新的基准利率重新设定，所以偿付期内利率会变；贴现债券折价发行不付息，附息债券和息票累计债券的票面利率签约时就固定了。","e":"租房合同约定每年按LPR重定价，市场利率一涨房租跟着涨；签死三年的固定租约，中途市场怎么变都不动。","t":"浮动利率每期按基准重设，其余票息固定","r":"浮动利率债券的利息在每个支付期期初都会根据基准利率的变化而重新设置。在每期期末支付的利息额是在本支付期期初基准利率的基础上设定的，也就是说，在每个利息支付日利息由上一支付日的基准利率和利差共同决定。"},{"i":293,"c":6,"k":"股价平均法","q":"以下常见的股票市场指数中，采用样本股票价格的算术平均法编制而成的是","o":["沪深300","上证综指","标普500","道琼斯指数"],"a":3,"p":"道琼斯指数把入选股票的价格直接相加再除以除数，股价越高权重越大，是典型的价格算术平均法；沪深300和标普500按市值加权，上证综指按总市值加权，都不看股价的绝对高低。","e":"三家人凑钱吃饭，直接按各人钱包里现金多少分摊，谁带的现钞多谁说话响；按收入比例分就是另一套规则。","t":"道指看股价不看市值，高价股权重大","r":""},{"i":294,"c":1,"k":"信托型基金主体","q":"信托型基金的参与主体不包括","o":["基金投资者","有限合伙人","基金托管人","基金管理人"],"a":1,"p":"信托型基金按信托关系设立，参与方就是基金投资者、基金管理人和基金托管人三方，投资者既是委托人也是受益人；有限合伙人是合伙型基金里的出资人角色，属于另一套法律架构，不在信托三方之内。","e":"租房是房东、中介、租客三方签约，各担一份责任；合伙开店才分普通合伙人和有限合伙人，完全两套玩法。","t":"信托型三方，有限合伙人只出现在合伙型","r":""},{"i":295,"c":2,"k":"合规独立性","q":"合规管理部门的独立，实质上是（）的独立，直接关系到合规风险能否有效揭示。","o":["部门","人","管理层","资产"],"a":1,"p":"合规管理部门的独立说到底是人的独立，人事任免、薪酬考核和汇报路线不受业务部门牵制，合规人员才敢说真话；只有部门牌子独立而人受制于人，风险照样捂得住、揭不出来。","e":"公司设了独立质检岗，可质检员的工资和考核归生产车间管，他还敢挑车间的毛病吗？人独立才算真独立。","t":"部门独立只是层壳，人的独立才是核心","r":"合规管理部门的独立，实质上是“人”的独立，直接关系到合规风险能否有效揭示。"},{"i":296,"c":7,"k":"债券发行人","q":"债券的发行人包括（）。Ⅰ.中央政府Ⅱ.地方政府Ⅲ.金融机构IV.企业","o":["Ⅰ、Ⅱ、Ⅳ","Ⅰ、Ⅲ、Ⅳ","Ⅰ、Ⅱ、Ⅲ、Ⅳ","Ⅱ、Ⅲ、Ⅳ"],"a":2,"p":"中央政府发国债、地方政府发地方债、金融机构发金融债、工商企业发公司债，这四类主体都能借债融资，所以四项全选；只选三项等于否认其中一类有发债权，组合型题要把选项当整体看。","e":"一条街上，房东能借钱、连锁品牌能借钱、银行网点能借钱、夫妻小店也能借，四类主体都能发债融资。","t":"国债地方债金融债公司债，四类都能发","r":"债券的发行人主要包括中央政府、地方政府、金融机构及企业。"},{"i":297,"c":1,"k":"封闭式基金披露","q":"封闭式基金至少每周披露（）次资产净值和份额净值","o":["1","2","3","4"],"a":0,"p":"封闭式基金份额在交易所买卖，没有每日申赎，所以只要求至少每周披露一次资产净值和份额净值；开放式基金才按每个开放日披露净值，两者频率别记反，一个是一周一次，一个是天天有。","e":"小区公告栏一周贴一次水电公摊，住户看着就够了；天天有人进出的便利店，才需要每小时核对一次库存。","t":"封闭式每周一次，开放式每个开放日","r":"封闭式基金至少每周披露1次资产净值和份额净值"},{"i":298,"c":3,"k":"宣传推介要求","q":"基金的宣传推介应当突出（ ）。","o":["有保障、高收益","业绩稳健","投资风险","尽享牛市"],"a":2,"p":"宣传推介必须把投资风险放在突出位置，把可能亏损讲透，不能承诺收益；有保障高收益、业绩稳健、尽享牛市都是暗示保本或必赚的措辞，属于禁止性表述，监管查的就是这类话术。","e":"健身房卖卡只喊三个月瘦十斤，却不说可能拉伤、退卡怎么算，合规的销售得先把受伤风险和退卡规则讲清楚。","t":"宣传必谈风险，高收益稳赚都是禁区","r":""},{"i":299,"c":2,"k":"前中后台分工","q":"关于基金管理人前、中、后台说法错误的是","o":["基金管理人的前台是直接基础客户的行政前台、投资、研究、销售等部门","基金的中台部门主要是为客服提供的综合业务部门，目标是客户满意度最大化。","中台部门包括：市场营销、风险控制、财务部、监察稽核和产品研发部门","由于基金管理人的后台部门需要与监管部、门、政府其他相关部门、机构投资者、法律顾问、审计师等主体沟通与联系，后台部门人员业务行为控制十分重要。"],"a":1,"p":"直接面对客户、做投资研究和销售的属于前台；中台是风险控制、财务、监察稽核、产品研发这类支撑和管控部门；前台服务客户、追求满意度，把这句安到中台上，就是张冠李戴。","e":"餐厅里点菜上菜的服务员是前台，后厨质检和采购是中台，洗碗修水电的是后台，谁直接见客人一眼分清。","t":"前台见客户，中台管风控，后台做保障","r":"基金管理人的前台主要是为客服提供的综合业务部门，目标是客户满意度最大化。"},{"i":300,"c":1,"k":"份额持有人权利","q":"我国目前的契约型证券投资基金中，投资人如果购买了一定数量的基金份额，拥有的权利不包括（）。","o":["基金份额的所有权","基金份额的处置权","基金份额的收益权","基金资产的管理权"],"a":3,"p":"买基金份额买到的是份额所有权、处置权和收益权，钱交给管理人打理，基金资产的管理权属于基金管理人；持有人只能通过持有人大会行使监督权，不能自己下场买卖基金资产。","e":"办了奶茶店会员卡，卡能转让、能消费、能享折扣，可配方和门店怎么经营，仍然由店长一个人拍板。","t":"份额归你，管理权始终在管理人手里","r":"最大回撤是从资产最高价格到接下来最低价格的损失。投资的期限越长，这个指标就越不利，因此在不同的基金之间使用该指标的时候，应尽量控制在同一个评估期间。"},{"i":301,"c":3,"k":"投资者分类","q":"关于普通投资者和专业投资者的说法，以下选项错误的是（）。","o":["普通投资者和专业投资者在一定条件下可以互相转化","专业投资者之外的投资者为普通投资者","所有的机构投资者都是专业投资者","并非所有的个人投资者都是普通投资者"],"a":2,"p":"专业投资者之外的投资者才是普通投资者，两类在满足条件时可以互相转化；机构不一定都是专业投资者，个人也不一定都是普通投资者，凡是带所有的绝对说法都错在把例外抹掉了。","e":"球场上分专业队和业余队，职业俱乐部也有打不上主力的，街球高手也能被选进专业队，身份不是一刀切。","t":"机构不都是专业，个人不都是普通","r":"专业投资者之外的投资者为普通投资者。并非所有的机构投资者都是专业投资者，同样，并非所有的个人投资者都是普通投资者。普通投資者和专业投资者在一定条件下可以互相转化。"},{"i":302,"c":10,"k":"另类投资特征","q":"关于另类投资的优势和局限，以下表述正确的是（）。","o":["另类投资属于高风险投资，只会增加投资组合的风险","另类投资属于长期投资，投资期限都要在5年以上","另类投资涵盖范围广，发展速度快，监管难度大","另类投资属于创新投资，房地产投资历史悠久，不属于另类投资"],"a":2,"p":"另类投资涵盖房地产、大宗商品、私募股权、对冲基金等，品种多、创新快、跨市场，监管口径难统一，所以监管难度大；加进组合反而可能降低波动，期限也不都要求五年以上，房地产同样算另类。","e":"小区门口的杂货铺越开越多，从卖菜、代收快递到修鞋全包，街道办想拿一套标准去管，根本管不过来。","t":"范围广、创新快、监管难，别当都高风险","r":"在多元化投资组合中加入另类投资产品，有可能得到比传统股票和债券组合更高的收益和更低的波动性。房地产投资属于另类投资。另类也并不意味着都是创新，房地产和大宗商品投资都有着悠久的历史。"},{"i":303,"c":7,"k":"所得免疫","q":"所得免疫策略不适合（ ）投资者。","o":["养老基金","股票型基金","保险基金","社保基金"],"a":1,"p":"所得免疫用债券组合锁定稳定现金流，满足养老基金、保险基金、社保基金这类要按期支付固定支出的机构；股票型基金追的是资本增值、现金流不稳定，用不上这套利率免疫工具，方向根本不搭。","e":"退休老人靠房租和养老金过日子，要的是月月有钱进账；创业的年轻人盼的是一把赚大钱，需求完全不同。","t":"要稳定现金流用所得免疫，炒股用不上","r":""},{"i":304,"c":11,"k":"开盘价形成","q":"关于开盘价与收盘价说法不正确的是（）","o":["在我国开盘价由集合竞价产生，不能产生开盘价的以连续竞价产生","上交所收盘价为该日最后一笔交易前1分钟所有交易的成交量的加权平均价（含最后一笔交易）。当日无成交的，以前收盘价为当日收盘价。","深交所证券的收盘价通过集合竞价产生。","集合竞价产生开盘价后，未成交的买卖申报自动作废"],"a":3,"p":"集合竞价只负责撮出开盘价，没成交的申报不会作废，而是自动进入连续竞价继续排队；作废的说法把两个阶段硬生生割裂了。开盘价由集合竞价产生、产生不了才用连续竞价，其余说法都对。","e":"早市开摊先集中喊价成交一批，没谈拢的摊位不会收摊走人，转头在散客里继续挂价，一直卖到收市。","t":"集合竞价没成交的申报接着进连续竞价","r":"未成交的申报自动进入连续竞价阶段"},{"i":305,"c":5,"k":"亏损与回本","q":"某基金净值下跌了33%，那么需要上涨（ ）投资者方能回本","o":["33%","50%","100%","200%"],"a":1,"p":"净值从100跌到67，想回100要补33，可分母已经变成67，33除以67约等于50%，所以跌三分之一要涨一半才回本；直接答33%是拿原来的100当分母，基数搞错了。","e":"100块的奶茶卡缩水到67块，想再攒回100得补33块，可本金只剩67块，等于要多赚近一半才行。","t":"跌33%要涨50%，亏损后基数变小","r":""},{"i":306,"c":10,"k":"风险投资退出","q":"关于风险投资，以下表述正确的是（）。","o":["风险投资被认为是私募股权投资中处于低风险领域的投资","风险投资通过资本的退出，从股权增值中获取回报","风险投资的主要收益来自企业本身的分红","风险资本的主要目的是为了取得对企业的长久控制权"],"a":1,"p":"风险资本投的是早期高成长企业，目标不是长久控股，也不靠企业分红，而是等企业做大后通过上市、并购、股权转让退出，赚股权增值的差价；说它低风险、图分红、要控制权，都搞错了盈利模式。","e":"低价收一辆二手自行车，擦干净修好再转手卖出赚差价，并没打算骑一辈子，也不是靠收租金过日子。","t":"风投赚退出差价，不靠分红不图控股","r":"风险资本的投资目的并不是取得对企业的长久控制权以及获得企业的利润分配，而是通过资本的退出，从股权增值当中获取高回报。"},{"i":307,"c":11,"k":"回转交易","q":"深圳证券交易所对专项资产管理计划收益权份额协议交易实行（）回转交易。","o":["当日","次交易日","次日","滚动日"],"a":0,"p":"回转交易指买入成交后、交收完成前就卖出，深交所对专项资产管理计划收益权份额的协议交易实行当日回转，当天买当天就能卖；记成次交易日或次日，等于白白多锁一天资金。","e":"早市批来的鱼，中午就能加价摆上摊卖掉，不用压到第二天，一笔本钱一天转两回，小生意才做得活。","t":"专项资管收益权份额，深交所当日可回转","r":"证券的回转交易是指投资者买入的证券，经确认成交后，在交收完成前全部或部分卖出。深圳证券交易所对专项资产管理计划收益权份额协议交易实行当日回转交易。"},{"i":308,"c":4,"k":"估值调整阈值","q":"对存在活跃市场的投资品种，如估值日无市价的，且最近交易日后经济环境发生了重大变化或证券发行机构发生了影响证券价格的重大事件，使潜在估值调整对前一估值日的基金资产净值的影响在（）以上的，应参考类似投资品种的现行市价及重大变化因素，调整最近交易市价，确定公允价值。","o":["0.1%","1%","0.35%","0.25%"],"a":3,"p":"活跃市场品种在估值日没有市价，且事后经济环境或发行人出了重大事件，只要潜在估值调整对前一日基金资产净值的影响达到0.25%以上，就得参考类似品种市价调整、确定公允价值；0.1%和1%都是烟雾弹。","e":"家里记账，差几毛钱可以随手忽略，可一笔偏差超过总存款的千分之二点五，就必须重新核账、把数字改过来。","t":"影响净值0.25%以上，必须调整估值","r":"对存在活跃市场的投资品种，如估值日无市价的，且最近交易日后经济环境发生了重大变化或证券发行机构发生了影响证券价格的重大事件，使潜在估值调整对前一估值日的基金资产净值的影响在0.25%以上的，应参考类似投资品种的现行市价及重大变化因素，调整最近交易市价，确定公允价值。"},{"i":309,"c":4,"k":"巨额赎回","q":"单个开放日基金净赎回申请超过基金份额总额的（），为巨额赎回","o":["5%","10%","15%","50%"],"a":1,"p":"单个开放日的净赎回申请超过基金份额总额的10%，就构成巨额赎回，管理人可以选择全额赎回或部分延期办理；5%和15%都是干扰数字，10%这条线决定要不要启动延期。","e":"奶茶店一天之内有一成会员同时来退卡，现金流马上就顶不住，店家只能分批退或者往后排期慢慢兑付。","t":"单日净赎回超总额10%，算巨额赎回","r":"单个开放日基金净赎回申请超过基金份额总额的10%，为巨额赎回"},{"i":310,"c":5,"k":"风险价值VaR","q":"\"某投资组合在持有期为一周、置信水平为98%的情况下，计算的风险价值为0.5%,下列说法中正确的有（）。 \nⅠ. 该组合在一周中的损失，有98%的可能性会超过0.5% \nⅡ. 该组合在一周中的损失，有98%的可能性不会超过0.5% \nⅢ. 若未来一周市场震荡加剧，损失超过0.5%的可能性将大于2% \nⅣ. 若未来一周市场震荡加剧，损失超过0.5%的可能性将大于98%","o":["Ⅰ、Ⅳ","Ⅰ、Ⅲ","Ⅱ、Ⅲ","Ⅱ、Ⅳ"],"a":2,"p":"一周持有期、置信水平98%、VaR为0.5%，意思是损失不超过0.5%的把握有98%，超过0.5%的可能只有2%；若市场震荡加剧，突破这条线的概率会高于2%而不是高于98%，所以Ⅱ和Ⅲ成立。","e":"天气预报说今天98%不会下超过5毫米的雨；真遇上强对流，下超5毫米的概率就比2%高，不是比98%高。","t":"98%是不超过，突破的可能只有2%","r":"某投资组合在持有期为一周、置信水平为98％的情况下，计算的风险价值为-0.5％，表明该资产组合在一周中的损失有98％的可能性不会超过-0.5％。"},{"i":311,"c":4,"k":"未上市品种估值","q":"首次发行未上市的股票、债券和权证，采用估值技术确定公允价值，在估值技术难以可靠计量公允价值的情况下按（）计量","o":["收益","收益折现","成本","估值技术"],"a":2,"p":"首次发行未上市的股票、债券和权证，优先用估值技术算公允价值，只有技术上也难以可靠计量时才退回按成本计量；成本是最后的兜底，不是首选，收益折现只是估值技术里的一种方法。","e":"朋友转手一台没拆封的旧款手机，先查二手行情估个价；实在查不到行情，才按当初的买入价先记着。","t":"技术估不出价才退到成本，成本是兜底","r":"首次发行未上市的股票、债券和权证，采用估值技术确定公允价值，在估值技术难以可靠计量公允价值的情况下按成本计量"},{"i":312,"c":5,"k":"Beta系数","q":"若基金的Beta为2，其与市场变动方向通常（），价格变动幅度通常（）。","o":["相同，更小","相同，更大","相反，更小","相反，更大"],"a":1,"p":"Beta衡量组合对市场波动的敏感度，等于2表示市场涨1%它同向涨约2%，跌1%也同向跌约2%；方向看正负号，正数同向、负数反向，幅度看绝对值，2大于1所以波动更大。","e":"坐同一趟过山车，别人上下一米你就上下两米，方向一致、幅度翻倍，心脏承受的刺激也跟着翻一倍。","t":"Beta看正负定方向，看绝对值定幅度","r":""},{"i":313,"c":1,"k":"QDII额度管理","q":"某合格境内机构投资者计划发行QDII基金，在获得发行许可后，其进行境外证券投资的规模不得超过（）核准的额度。","o":["中国人民银行","中国证监会","境内托管行","国家外汇管理局"],"a":3,"p":"QDII要过两道关：证监会发境外证券投资业务许可文件，国家外汇管理局批境外证券投资额度，实际投资不能超过外汇局核准的额度；证监会管资格不管额度，托管行只是办业务。","e":"出国留学先拿到学校录取通知，再去银行换外汇，能换多少由外汇额度说了算，学校可不管你换多少。","t":"证监会管资格，外汇局管额度，别记反","r":"境内机构投资者在获得中国证监会颁发的境外证券投资业务许可文件后，应按照有关规定向国家外汇管理局申请境外证券投资额度，并在国家外汇管理局核准的境外证券投资额度内进行投资。"},{"i":314,"c":5,"k":"投资交易流程","q":"基金公司投资交易流程包含的环节有（）。\nⅠ. 形成投资策略\nⅡ. 构建投资组合和执行交易指令\nⅢ. 风险控制\nⅣ. 绩效评估与组合调整","o":["Ⅱ","Ⅰ、Ⅱ、Ⅲ、Ⅳ","Ⅰ、Ⅱ","Ⅰ、Ⅱ、Ⅳ"],"a":1,"p":"完整的投资交易流程是闭环：先形成投资策略，再构建组合、执行指令，之后做绩效评估并调整组合，全过程还有风险控制把关；四项缺一不可，只选前两项就漏掉了反馈和约束环节。","e":"开奶茶店也是闭环：先定卖什么，再进货上架，卖完看哪款好卖，回头改配方，全程还得盯着食品安全。","t":"策略建仓执行评估风控，一个都不能少","r":"基金公司投资交易包括形成投资策略、构建投资组合、执行交易指令、绩效评估与组合调整、风险控制等环节。"},{"i":315,"c":6,"k":"一股一票","q":"一般情况下，下列证券类型中有投票权的是（）。","o":["优先股","普通股","可转债","公司债"],"a":1,"p":"普通股股东按一股一票在股东大会上表决，能选董事、决定重大事项；优先股一般只在涉及自身利益时才有表决权，可转债在转股前还是债，公司债持有人只有还本付息请求权。","e":"业主大会按房本投票，一套房一票；只交物业费的租户和只拿利息的债主，都进不了这张投票的名单。","t":"一股一票只有普通股，债主手里没票","r":"普通股股东享有股东的基本权利，包括收益权和表决权。其中，表决权是指普通股股东享有决定公司一切重大事务的决策权。股东的表决权是通过股东大会来行使的，通常是每一股份的股东享有一份表决权，即所谓的“一股一票”。"},{"i":316,"c":8,"k":"债券远期限额","q":"在债券远期交易中，任何一家市场参与者的单只债券的远期交易卖出与买入总余额分别不得超过该只债券流通量的（）。","o":["10%","20%","5%","15%"],"a":1,"p":"债券远期交易中，任何一家参与者的单只债券远期卖出与买入总余额，分别不得超过该只债券流通量的20%；另有卖出总余额不超过自有可用债券余额200%的规定，两个比例别混。","e":"小区总共100套房，一家中介最多同时接20套的卖房委托，接多了就等于坐庄，别的买家根本没得挑。","t":"单只债券远期余额各自不超流通量20%","r":"任何一家市场参与者(基金管理公司运用基金财产进行远期交易的，为单只基金)的单只债券的远期交易卖出与买入总余额分别不得超过该只债券流通量的20%,远期交易卖出总余额不得超过其可用自有债券总余额的200%。"},{"i":317,"c":3,"k":"销售费用范围","q":"基金销售费用不包括","o":["申购费","赎回费","基金转换费","销售服务费"],"a":2,"p":"基金销售费用包括申购费、赎回费和销售服务费，都是围绕买、卖和持有份额收的钱；基金转换费是投资人把一只基金换成另一只时收的费用，发生在账户内部转换环节，不算销售费用。","e":"健身房收开卡费、退卡费和每月维护费很正常；可把年卡换成半年卡，那是另一道手续，不算卖卡的钱。","t":"申购赎回加销售服务费，转换费不算","r":""},{"i":318,"c":5,"k":"政策风险","q":"因中央银行调整存款准备金率而带来的风险属于","o":["操作风险","信用风险","流动性风险","政策风险"],"a":3,"p":"央行调整存款准备金率是货币政策动作，属于政策变动带来的系统性风险，整个市场一起受影响；操作风险是内部流程和人员出错，信用风险是对方不还钱，流动性风险是想卖却卖不掉。","e":"整条街突然统一规定晚上十点必须关门，所有店铺一起受影响，这可不是哪一家店自己经营不善造成的。","t":"央行调准是政策风险，全体一起扛","r":""},{"i":319,"c":1,"k":"招募说明书内容","q":"基金招募说明书中的重要信息不包括（）","o":["基金风险提示","基金托管协议摘要","基金运作方式","基金销售协议摘要"],"a":3,"p":"招募说明书要写基金风险提示、托管协议摘要、运作方式这些投资者必须知道的事；销售协议是基金公司和代销渠道之间的商业安排，不面向投资者，所以摘要不进招募说明书。","e":"餐馆贴在门口的菜单，不会写它跟菜贩谈下来的进货折扣，那是后厨和采购之间算的账，顾客不必看。","t":"招募书写产品，销售协议是渠道间的账","r":""},{"i":320,"c":6,"k":"相对强度","q":"根据“相对强度”理论体系，对于走势（）的股票，则应尽可能地采取回避的态度。","o":["波动较小","强于大盘","波动较大","弱于大盘"],"a":3,"p":"相对强度把个股走势和大盘比，强于大盘说明有资金追捧、值得关注，弱于大盘说明跑输市场、趋势偏弱，应当回避；波动大小只是幅度，不是这套理论判断强弱的标准。","e":"班里跑步测试，总比平均线慢一截的同学，教练不会把他排进接力队，看的是相对名次不是状态起伏。","t":"相对强度只比大盘，弱于大盘就回避","r":"根据“相对强度”理论体系，对于走势弱于大盘的股票，则应尽可能地采取回避的态度。"},{"i":321,"c":4,"k":"流动性风险","q":"当投资者纷纷赎回债券基金时，债券基金所面临的较大风险是（）","o":["合规风险","流动性风险","操作风险","运营风险"],"a":1,"p":"投资者集中赎回时，基金必须快速把债券变现付钱，可债券市场成交清淡、买卖价差又大，只能压价抛售，代价落在留下的持有人身上，这就是流动性风险。合规、操作、运营风险讲的是违规和流程失误，不是赎回逼着贱卖资产。","e":"奶茶店把现金全压成原料，三十个会员同时来退卡，只能把封口机半价卖给隔壁店，被赎回逼着贱卖资产，就是流动性风险。","t":"赎回一挤，资产变现难就是流动性风险","r":""},{"i":322,"c":1,"k":"重大变动披露","q":"基金股票投资组合重大变动的披露内容包括：报告期内累计买入、累计卖出价值超出期初基金资产净值（）的股票明细","o":["1%","2%","3%","4%"],"a":1,"p":"股票投资组合重大变动的界线是期初基金资产净值的百分之二：报告期内累计买入或累计卖出金额超过这条线，就得把涉及的股票逐只列明披露。百分之一、百分之三、百分之四都不是法规画的那条线，只是把数字记混了。","e":"帮室友管十万元账户，约好单只股票一年内买卖合计超过两千元就写进周报，两千正好是十万的百分之二，这条线就是他定的披露门槛。","t":"重大变动门槛2%，买卖累计双向算","r":"基金股票投资组合重大变动的披露内容包括：报告期内累计买人、累计卖出价值超出期初基金资产净值2％的股票明细"},{"i":323,"c":7,"k":"短期融资券","q":"关于短期融资券，以下表述正确的是（）。\nⅠ. 发行主体是具有法人资格的金融机构\nⅡ. 发行时需要提供担保\nⅢ. 发行时由商业银行承销\nⅣ. 投资者为银行间债券市场的机构投资者","o":["Ⅲ、Ⅳ","Ⅱ、Ⅳ","Ⅰ、Ⅱ","Ⅰ、Ⅲ"],"a":0,"p":"短期融资券是境内具法人资格的企业在银行间市场发行的短期债务工具，由商业银行承销，采无担保的信用方式发行，买家只能是银行间市场的机构投资者。第一项错在发行主体是企业而非金融机构，第二项错在它恰恰不需要担保。","e":"一家建材厂要周转三个月，请银行牵头在银行间市场发债，只凭企业信用不押厂房，买的都是机构账户，散户根本买不到，这就是短融。","t":"短融无担保，企业发、银行间机构买","r":"中国的短期融资券是境内具有法人资格的企业发行的，仅在银行间债券市场上流通的短期债务工具。短期融资券由商业银行承销并采用无担保的方式发行(信用发行),通过市场招标 确定发行利率。发行者必须为具有法人资格的企业，投资者则为银行间债券市场的机构投资者。"},{"i":324,"c":1,"k":"注册登记模式","q":"基金管理人自建注册登记系统属于（）模式","o":["内置","外置","混合","其他"],"a":0,"p":"自建注册登记系统指基金公司自己搭台、自己记账、自己管份额，这叫内置模式；外置则是把登记过户业务整体外包给中国结算这类第三方机构去做。系统是不是建在自己手里，正是内置与外置的分水岭。","e":"宿舍小卖部自己记赊账本，属于内置；把账本交给楼下超市代为登记和结算，就成外置，系统放在自家机房当然算前者。","t":"自己建系统自己管份额，就是内置","r":"基金管理人自建注册等级系统属于内置模式"},{"i":325,"c":5,"k":"市场组合Beta","q":"市场组合的Beta是（）。","o":["-1","0","1","2"],"a":2,"p":"市场组合就是市场上全部资产的加权平均，它和自己完全同步，协方差等于市场方差，一除下来Beta正好等于1。Beta为0表示与市场无关，负1是反向变动，2是波动幅度达到市场的两倍，都不是市场组合的特征。","e":"拿全班平均分当基准，当某个人的分数就是平均分本身时，它和平均分同涨同跌，倍数永远是1，市场组合的Beta就是这么来的。","t":"市场组合与自己同步，Beta永远是1","r":""},{"i":326,"c":2,"k":"内控五要素","q":"基金管理人应当建立有效的内部监控制度，设置督察长和独立的监察稽核部门，对公司内部控制制度执行情况进行持续监督，保证内控制度落实。是基金管理人内部控制的（）要素","o":["风险评估","控制活动","内部监控","信息沟通"],"a":2,"p":"设督察长、设独立的监察稽核部门、对制度执行情况持续监督，这三件事都是在事后盯着有没有照做，属于内部监控要素。风险评估是事前找风险点，控制活动是具体控制措施，信息沟通是让信息顺畅流动。","e":"健身房请教练定训练计划是控制活动，前台天天查谁没打卡、没打卡就通报，这就是内部监控，督察长和稽核部门就是那个查岗的人。","t":"督察长加稽核部门，盯的就是内部监控","r":"内部控制指.基金管理人应当建立有效的内部监控制度，设置督察长和独立的监察稽核部门，对公司内部控制制度执行情况进行持续监督，保证内控制度落实。"},{"i":327,"c":2,"k":"合规管理原则","q":"合规人员应当正确处理与公司其他部门及监管部门的关系，努力形成公司的合规合力，避免内部消耗。是合规管理的（）原则","o":["客观性","公正性","专业性","协调性"],"a":3,"p":"题干的关键词是处理与其他部门及监管机构的关系、形成合规合力、避免内部消耗，讲的都是配合与协同，所以是协调性原则。客观性讲实事求是，公正性讲同一标准不偏袒，专业性讲的是业务胜任能力。","e":"小组做课程设计，组长专门负责跟老师和其他组对接、把分歧谈拢，别让内部吵架耗时间，这种角色对应的就是协调。","t":"讲配合、讲合力、怕内耗，选协调性","r":"协调性指合规人员应当正确处理与公司其他部门及监管部门的关系，努力形成公司的合规合力，避免内部消耗。"},{"i":328,"c":3,"k":"开户年龄","q":"我国法律规定，办理基金开户的个人投资者年龄为（）周岁","o":["18-70","18-65","18-60","18-75"],"a":0,"p":"法规把个人投资者办理基金开户的年龄定在十八周岁到七十周岁之间：十八岁是完全民事行为能力的起点，七十岁是这道口子的上限。十八到六十五、十八到六十、十八到七十五都是把上限记错了。","e":"刚满十八岁的大一新生可以自己开基金账户，隔壁七十二岁的爷爷再想新开户就落在区间外，只能走别的安排。","t":"个人开户年龄，18起步70封顶","r":"我国法律规定，办理基金开户的个人投资者年龄为18-70周岁"},{"i":329,"c":4,"k":"基金费用列支","q":"需要从基金资产中列支的费用为（）","o":["申购费","赎回费","转换费","持有人大会费"],"a":3,"p":"申购费、赎回费、转换费都是投资者买卖基金时自己掏的销售费用，不进基金资产这本账；持有人大会是基金自己的事，开会公告等开销按法规从基金财产中列支。所以只有持有人大会费由基金资产承担。","e":"租房时中介费是租客自己付，但整栋楼业主开会商量换物业的费用，得从公共维修基金里出，不从某一个业主口袋掏。","t":"销售费用投资者掏，基金自己的事基金出","r":"销售过程中的费用不是从基金财产列支的，ABC为基金销售费用"},{"i":330,"c":3,"k":"市场细分原则","q":"（）指每个细分市场有明显的区分标准，让销售机构能够清楚地认识不同细分市场的客户差异，提供个性化的产品和服务，以确保营销策略具有针对性。","o":["利润原则","可测原则","成长原则","识别原则"],"a":3,"p":"题干强调有明显的区分标准、能清楚认识不同细分市场的客户差异，讲的是能不能把人群辨认出来，这就是识别原则。可测原则说的是细分市场的规模和购买力能否量化，利润原则和成长原则讲的是这个市场值不值得做。","e":"奶茶店把客人分成考研党、健身党、加班党，靠的是点单时间和糖度这些能辨认的特征，先认得出人群才谈得上做针对性产品。","t":"能分清不同客户差异，就是识别原则","r":"识别原则指每个细分市场有明显的区分标准，让销售机构能够清楚地认识不同细分市场的客户差异，提供个性化的产品和服务，以确保营销策略具有针对性。"},{"i":331,"c":3,"k":"投资者教育","q":"投资者教育的目的为（）","o":["用简单的语言向投资者解释他们在投资过程中所面临的的各种问题以及应对措施","使得投资者在投资过程中能够知道如何躲开风险","投资者了解如何购买产品","为投资者能够在自己的投资计划上有所收获"],"a":0,"p":"投资者教育是用通俗的语言把投资过程中会遇到哪些问题、该怎么应对讲清楚，核心是让投资者看懂风险、明白自己的权利。躲开风险并不现实，风险只能识别和管理；只讲怎么买产品或泛泛谈收获，又把教育做窄了。","e":"健身教练不会承诺你不受伤，而是教你哪个动作容易伤腰、该怎么调整姿势，投资者教育教的正是识别问题和应对办法。","t":"教育是讲清问题加应对，不是保证赚钱","r":"投资者教育的目的为用简单的语言向投资者解释他们在投资过程中所面临的的各种问题以及应对措施"},{"i":332,"c":6,"k":"清偿顺序","q":"关于债券持有者、优先股股东、普通股股东的清偿顺序，以下表述正确的是（)。","o":["普通股股东先于优先股股东","债券持有者先于优先股股东","优先股股东先于债券持有者","普通股股东先于债券持有者"],"a":1,"p":"公司破产清算时先还外人再还股东：债券持有人是债权人排在最前，优先股股东在股东里排位靠前、先于普通股股东，普通股股东最后分剩余。另外三个选项都把这条顺序颠倒了，把股东排到了债权人前面。","e":"奶茶店倒闭清算，先还供货商货款和房东租金这类债，再退给约定优先的合伙人，最后才轮到普通合伙人分剩下的碎钱。","t":"债先于优先股，优先股先于普通股","r":"公司解散或破产清算时，公司的资产在不同证券持有者中的清偿顺序为：债券持有者先于优先股股东，优先股股东先于普通股股东。"},{"i":333,"c":7,"k":"久期策略","q":"关于债券型基金的久期以下表述错误的是（）。","o":["组合中各个债券的权重为各个债券在组合中的比重","组合的久期可以用组合中所有债券的久期的加权平均来计算","在预期利率下降时，应当增加组合久期，以规避债券价格下降的风险","若投资的某债券为到期日一笔付清的零息债券，则该债券的麦考利久期等于到期期限"],"a":2,"p":"利率下降时债券价格会上涨，久期越长涨得越多，此时应当拉长久期去多赚价差，而不是为了躲价格下跌风险。规避价格下跌风险对应的是预期利率上升时缩短久期，这一项把方向说反了，所以它是错误表述。","e":"手里有张固定利息的借条，预感利率要跌，就换成期限更长、更吃香的那种，涨得更多；怕利率涨才赶紧换成短期的。","t":"利率降拉长久期赚价差，不是躲跌","r":"根据对市场利率水平的预期，在预期利率下降时，增加组合久期》以较多地获得债券价格上升带来的收益；在预期利率上升时，减小组合久期，以规避债券价格下降的风险。"},{"i":334,"c":1,"k":"境外投资者条件","q":"下列关于申请合格境外投资者资格应当具备的条件，说法错误的是（）。","o":["申请人的从业人员符合所在国家或者地区的有关从业资格的要求","申请人近5年未收到监管机构的重大处罚","申请人有健全的治理结构和完善的内控制度，经营行为规范","申请人所在国家或者地区有完善的法律和监管制度"],"a":1,"p":"申请合格境外投资者资格的门槛是近三年未受到监管机构的重大处罚，而不是五年。其余三项，从业人员符合所在国从业资格要求、治理结构健全内控完善经营规范、所在国家或地区有完善的法律和监管制度，都是必备条件。","e":"就像申请交换生要提交最近三个学年的操行记录，学校只往前查三年，你按五年去准备材料，时间窗口一错就白忙一场。","t":"境外投资者处罚门槛是近3年，别记5年","r":"申请人有健全的治理结构和完善的内控制度，经营行为规范、近3年未受到监管机构的重大处罚。"},{"i":335,"c":1,"k":"QDII投资范围","q":"下列不属于QDII基金的投资范围的是（）。","o":["在全球各证券市场挂牌交易的普通股、优先股和全球存托凭证","银行存款、可转让存单、银行承兑汇票","政府债券、公司债券、可转换债券","远期合约、互换及经中国证监会认可的境外交易所上市交易的权证、期权、期货等金融衍生产品"],"a":0,"p":"QDII能投的境外股票，限于与中国证监会签署双边监管合作谅解备忘录的国家和地区市场挂牌的品种，而这一项说的是全球各证券市场，范围被无限放大，所以不属于可投范围。货币市场工具、各类债券、境外衍生品都在允许清单内。","e":"学校只批准去签了交换协议的几所海外院校，你说全世界任何学校都能去就超出批文，这一项的毛病正出在那个各字上。","t":"QDII只投备忘录市场，不是全球都行","r":"根据有关规定，除中国证监会另有规定外，QDⅡ基金可投资于下列金融产品或工具： (1)银行存款、可转让存单、银行承兑汇票、银行票据、商业票据、回购协议、短期政府债券等货币市 场工具。(2)政府债券、公司债券、可转换债券、住房按揭支持证券、资产支持证券等及经中国证监会认可的国际金融组织发行的证券等。(3)与中国证监会签署双边监管合作谅解备忘录的国家或地区证券市场挂牌交易的普通股、优先股、全球存 托凭证和美国存托凭证、房地产信托凭证。(4)在已与中国证监会签署双边监管合作谅解备忘录的国家或地区证券监管机构登"},{"i":336,"c":5,"k":"主动比重局限","q":"关于主动比重的局限性，以下表述正确的是（）。","o":["只能衡量损失的大小，不能衡量损失发生的可能频率","与基准不同并不意味着投资组合一定会跑赢或跑输基准","计算需要获取足够多的收益低于目标的数据","与基准不同意味着投资组合的业绩表现一定会与基准有显著区别"],"a":1,"p":"主动比重只说明持仓和基准差多少，偏离大不等于一定跑赢或跑输，还得看偏离的时机和方向对不对，所以这一项成立。与之相反的那项错在说业绩一定会有显著区别，因为主动比重很高时持仓也可能和基准高度相关。","e":"做菜和食堂标准菜谱配料不同，不代表一定更好吃，也可能味道差不多，差别大只说明不一样，不等于结果不一样。","t":"偏离基准不等于跑赢，主动比重大不等于业绩差别大","r":"主动比重的局限性在于：（1）与基准不同并不意味着投资组合一定会跑贏或跑输基准。投资组合要跑贏基准必须在适当的时候以适当的方式偏离基准。（2）与基准不同并不意味着投资组合的业绩表现会与基准有显著区别。有的组合主动比重很高，但其持仓可能和基准有较高的相关性。"},{"i":337,"c":3,"k":"销售适用性","q":"基金销售适用性要求基金销售机构在销售基金和相关产品的过程中，应注重（）","o":["审慎地对投资者进行调查","对投资的风险进行评价","根据基金投资者的风险承受能力销售不同风险等级的产品","对投资者进行投资知识教育"],"a":2,"p":"销售适用性的核心是把合适的产品卖给合适的人：先给投资者做风险测评，再按风险承受能力匹配相应风险等级的产品。调查投资者、评价产品风险、做投资知识教育都是配套动作，最终落点还是风险等级与人的匹配。","e":"健身房不会把高强度间歇课直接推给刚做完手术的会员，而是先测体能，再按体能分班配课程，这就是把合适的东西给合适的人。","t":"适用性讲匹配：风险承受能力对上产品风险等级","r":""},{"i":338,"c":3,"k":"投资者认可度","q":"通过对（）和（）的比较分析，可以了解投资者对该基金的认可程度。","o":["基金份额变动情况；持有人结构","基金盈利能力；基金规模变动情况","基金分红比例；持有人结构","基金规模变动情况；基金仓位变动情况"],"a":0,"p":"份额是增是减，说明资金在流入还是流出；持有人结构是散户多还是机构多，两者合起来才能看出投资者认不认可这只基金。盈利能力、分红比例、规模变动、仓位变动讲的都是基金自身的运作表现，不是投资者的态度。","e":"奶茶店看会员卡是越办越多还是有人退卡，再看办卡的是学生还是上班族，两下一对照就知道街坊到底认不认这家店。","t":"看认可度，一查份额增减二看持有人结构","r":""},{"i":339,"c":11,"k":"固收平台交易","q":"下述关于上海证券交易所固定收益证券综合电子平台的表述，错误的是（）。","o":["固定收益证券现券交易实行净价申报","交易商当日买入的固定收益证券，当日不可以卖出","交易价格实行涨跌幅限制，涨跌幅比例为10％","固定收益证券申报价格变动单位为0．001元"],"a":1,"p":"上交所固定收益证券综合电子平台实行当日回转，交易商当日买入的债券当日就可以卖出，只有被待交收处理的才要等下一交易日，所以这一项说反了。净价申报、百分之十的涨跌幅限制、零点零零一元的最小变动单位都是对的。","e":"早市上买了斤排骨，中午就能转手卖给邻居；只有还在路上没到手的那份才得等第二天，这一项把所有人都说成要等一天。","t":"固收平台T+0，当日买入当日可卖","r":"交易商当日买入的固定收益证券，当日可以卖出。当日被待交收处理的固定收益证券，下一交易日可以卖出。"},{"i":340,"c":2,"k":"合规公正性","q":"合规人员在业务部门进行核查时，应当坚持统一标准对违规行为风险评估和报告，是合规管理的（）原则","o":["客观性","公正性","专业性","独立性"],"a":1,"p":"关键词是坚持统一标准、对违规行为做风险评估和报告，用同一把尺子量所有部门，不因亲疏远近而松紧，这就是公正性原则。客观性讲实事求是、不带主观臆断，独立性讲不受业务部门干预，专业性讲业务胜任能力。","e":"学生会查寝室卫生，不管查的是部长宿舍还是普通同学宿舍都用同一张评分表，标准不上下浮动，这就是公正两个字的意思。","t":"一把尺子量到底、不偏不倚是公正性","r":"公正性指合规人员在业务部门进行核查时，应当坚持统一标准对违规行为风险评估和报告。"},{"i":341,"c":4,"k":"QDII净值披露","q":"QDII基金份额净值应当在估值日后（）工作日内披露","o":["2个","5个","7个","10个"],"a":0,"p":"QDII投资境外市场，估值牵扯海外时差和汇率折算，法规给的口子是份额净值在估值日后两个工作日内披露，比境内基金次日披露要宽松。五个、七个、十个工作日都超出了这条规定，属于凭感觉加天数。","e":"海淘退款要等国外仓库确认再走汇率结算，到账总比国内退货慢两天，QDII净值披露多给的两个工作日就是留给这段时差的。","t":"QDII净值披露：估值日后2个工作日","r":""},{"i":342,"c":5,"k":"资产配置因素","q":"影响个人投资者资产配置的因素包括（）。Ⅰ.投资期限的长短Ⅱ.业绩比较标准的选择Ⅲ.流动性的高低Ⅳ.收益要求","o":["Ⅰ.Ⅲ.Ⅳ","Ⅱ.Ⅲ","Ⅰ.Ⅱ.Ⅳ","Ⅰ.Ⅱ.Ⅲ.Ⅳ"],"a":0,"p":"个人做资产配置要看投资期限长短、对流动性的要求高低、收益目标多少，还要兼顾风险承受能力和税收。业绩比较基准是事后评价基金业绩用的尺子，属于绩效评价环节，并不决定个人怎么分配资产，所以不选它。","e":"大二学生把生活费分成活期、定期和基金：下学期要交的学费必须随时能取，四年都不用的钱才敢买波动大的，期限和流动性一摆就分好了。","t":"配置看期限、流动性、收益要求，比较基准不掺和","r":"短期投资者与长期投资者、个人投资者与机构投资者等，不同类型的投资者对资产配置也会有不同的选择。一般而言，进行资产配置主要考虑的因素有：（1）影响投资者风险承受能力和收益要求的各项因素。（2）影响各类资产的风险、收益状况以及相关关系的资本市场环境因素。（3）资产的流动性特征与投资者的流动性要求相匹配的问题。（4）投资期限。（5）税收考虑。"},{"i":343,"c":11,"k":"债券分销","q":"在分销业务中，承销商过户给分销认购人的是（）。","o":["承销的资格","承销债券的手续费","承销的债券","承销债券的额度"],"a":3,"p":"分销是承销商在发行期内把手里的承销额度过户给其他结算成员或分销认购人，转的是额度以及额度对应的债券，不是承销资格，也不是手续费。资格是批给特定机构的、不能转让，手续费是一笔钱而不是交易标的。","e":"团购群主抢到一百箱水果的提货额度，转三十箱给隔壁群，转过去的是提货额度，不是把群主身份和跑腿费一并过户。","t":"分销过户的是承销额度，不是资格","r":"分销业务是指承销商在发行期内将承销债券向其他结算成员(和分销认购人)进行承销额度的过户。"},{"i":344,"c":5,"k":"被动投资目标","q":"作为被动投资者，其目标就是在成本允许的情况下，尽可能地（）。","o":["超越跟踪指数","减少跟踪误差","扩大投资收益","其他三项均不正确"],"a":1,"p":"被动投资不去猜个股，目标是让组合复制指数走势，所以在成本允许的前提下尽量压低跟踪误差，误差越小越像指数。超越跟踪指数是主动投资追求的事，扩大投资收益也不是被动策略的考核点。","e":"复印一份笔记，目标是让复印件和原件一个字都不差，而不是把复印件改得比原件更漂亮，被动投资要的就是这份像。","t":"被动投资不求超越，只求跟踪误差小","r":"强有效市场宜采用被动投资策略，作为被动型投资者，其目标就是在成本允许的情况下，尽可能地减少跟踪误差。"},{"i":345,"c":6,"k":"长期偿债能力","q":"下列可用于分析企业长期偿债能力的是（）。","o":["营运效率比率","资产负债率","流动比率","速动比率"],"a":1,"p":"长期偿债能力看的是企业扛长期债务的本钱，资产负债率等于负债除以资产，衡量整体杠杆高低，属于长期偿债指标。流动比率和速动比率看一年内能否还上短债，营运效率比率衡量的是资产周转快慢。","e":"判断室友能不能扛住四年助学贷款，要看他家总资产和总负债的比例；而月底能不能还上花呗，看的是手头现金，这是两码事。","t":"长期偿债看杠杆，资产负债率是代表","r":"财务杠杆比率衡量的是企业的长偿债能力，常用的财务杠杆比率有资产负债率、权乘数和债权益比、利息倍数。"},{"i":346,"c":1,"k":"净值披露频率","q":"开放式基金在开始办理申购或者赎回前，至少每周公告（）次资产净值和份额净值","o":["1","2","3","5"],"a":0,"p":"开放式基金在正式开始办理申购赎回之前，还没进入逐日披露阶段，法规要求至少每周公告一次资产净值和份额净值。等开始申赎后，才改为每个开放日披露，两次三次五次都不是这个阶段的频率要求。","e":"新开的奶茶店还没正式营业，只在群里每周报一次今天备了多少料，等开门接单之后才改成每天报账，披露节奏就是这么变的。","t":"申赎开始前，每周至少披露1次净值","r":"开放式基金在开始办理申购或者赎回前，至少每周公告1次资产净值和份额净值"},{"i":347,"c":1,"k":"道德风险","q":"在证券市场中，信息不对称会给基金投资人与基金管理人的信托关系带来（）","o":["道德风险","波动风险","破产风险","系统风险"],"a":0,"p":"基金管理人管着投资者的钱，信息不对称让投资人看不清管理人有没有偷懒、有没有为自己谋利，这种委托代理关系里的隐患就是道德风险。波动风险和系统风险说的是市场价格起伏，破产风险是公司经营不下去，都不对应这个问题。","e":"把宿舍钥匙交给室友代喂猫，你不在场就不知道他有没有按时喂，这种看不见就可能偷懒的隐患，正是道德风险四个字的意思。","t":"信息不对称加委托代理，生的是道德风险","r":"在证券市场中，信息不对称会给基金投资人与基金管理人的信托关系带来道德风险。"},{"i":348,"c":8,"k":"衍生品杠杆性","q":"如果期货交易保证金为合约金额的5%,则可以控制20倍于所投资金额的合约资产，这属于衍生工具的（）。","o":["杠杆性","流动性","跨期性","联动性"],"a":0,"p":"只交合约金额百分之五的保证金就能控制整份合约，百分之五对应二十倍的合约资产，这是典型的小资金撬动大资金，叫杠杆性。跨期性指交易在未来交割，联动性指价格跟着现货走，流动性说的是转手难易程度。","e":"租房押一付三只掏一个月押金就能住进去，押金占房价比例越低，你能撬动的居住权越大，二十倍杠杆讲的就是这个道理。","t":"5%保证金撬20倍合约，这就是杠杆性","r":"杠杆性表明衍生工具只要支付少量保证金或权利金就可以买入。例如，如果期货交易保证金为合约金额的5%,则可以控制20倍于所投资金额的合约资产，实现小资金撬动大资金，这也在很大程度上决定了衍生工具所具有的高风险性。"},{"i":349,"c":10,"k":"另类投资范围","q":"下列各项中属于另类投资的是（）。\nⅠ. 权益资产\nⅡ. 固定收益资产\nⅢ. 对冲基金\nⅣ. 私募股权","o":["Ⅱ、Ⅲ","Ⅲ、Ⅳ","Ⅰ、Ⅲ","Ⅰ、Ⅱ"],"a":1,"p":"另类投资指传统股债之外的品种，对冲基金和私募股权都在这个范围里。权益资产和固定收益资产恰恰对应股票与债券这两类传统资产，是另类投资拿来对照的坐标，所以不能算另类，两个选项都要排除。","e":"食堂窗口里米饭和炒菜是常规套餐，旁边新加的现烤披萨和手冲咖啡才算花样，对冲基金和私募股权就是投资菜单里的披萨。","t":"股债之外才叫另类，对冲基金私募股权上榜","r":"另类投资没有统一的定义，通常包括私募股权、另类资产、对冲基金和另类投资策略。"},{"i":350,"c":1,"k":"虚假记载","q":"（）是指信息披露义务人将不存在的事实在基金信息披露文件中予以记载的行为","o":["虚假记载","误导陈述","重大有遗漏","承诺收益"],"a":0,"p":"把根本不存在的事写进信息披露文件，属于无中生有，叫虚假记载。误导陈述是说的都是真话、但表达方式让人理解偏；重大遗漏是该说的没说；承诺收益是违规的保本保收益表示，三者性质各不相同。","e":"简历上写曾在某投行实习但根本没去过，这是编造；写成参与过亿级项目让人自行误会，那是误导，两者不是一回事。","t":"无中生有是虚假记载，真话说歪是误导","r":"虚假记载是是指信息披露义务人将不存在的事实在基金信息披露文件中予以记载的行为"},{"i":351,"c":4,"k":"债券估值方法","q":"以下不属于债券型基金估值方法的是？","o":["市值法","摊余成本法","相对估值法","混合估值法"],"a":2,"p":"债券估值走的是未来现金流折现这条路，常用市值法和摊余成本法，近年还有把两者结合的混合估值法。相对估值法是拿可比公司的乘数给股票定价的思路，用于股票而非债券，所以它不属于债券估值方法。","e":"给二手车定价看同款车网上卖多少，那是相对估值；给一张固定还本付息的借条定价，只能把未来每笔钱折成今天，两条路不一样。","t":"债券用市值法摊余成本法，相对估值是股票","r":""},{"i":352,"c":7,"k":"利率风险应对","q":"若投资经理预期央行将降息25个基点，最常见的做法是通过调整债券投资组合的（）来应对利率风险。Ⅰ.信用结构Ⅱ.期限结构Ⅲ.行业类别Ⅳ.组合久期","o":["Ⅰ、Ⅲ","Ⅱ、Ⅲ","Ⅰ、Ⅳ","Ⅱ、Ⅳ"],"a":3,"p":"降息二十五个基点会让债券价格上涨，能吃到多少涨幅由久期决定，所以要调组合久期；降息还常伴随收益率曲线形变、短端先动，因此要调期限结构。信用结构和行业类别对应的是信用风险，与利率预期无关。","e":"预感银行要下调存款利率，你会把三个月定期换成三年期去锁高息，换的既是期限，也是对利率变化有多敏感，久期就是这个敏感度。","t":"赌利率变化，只动期限结构和久期","r":"不同于股票投资组合，债券投资组合构建还需要考虑信用结构、期限结构、组合久期、流动性和杠杆率等因素。有些机构投资者会在投资政策说明中限制非投资级債券的比例。期限结构、组合久期的选择则与投资经理对市场利率变化的预期相关。"},{"i":353,"c":9,"k":"风险调整收益","q":"（）不属于衡量风险调整后收益的指标。","o":["Sharpe","Jensen","信息比率","下行波动率"],"a":3,"p":"夏普、詹森、信息比率都是把收益除以某个风险量，得到的才是风险调整后的收益。下行波动率本身就是一种风险度量，只统计跌破目标的那部分波动，没有和收益相除，所以它不是风险调整收益指标。","e":"比两个骑手谁技术好，不能只看摔了几次，要看跑单收入除以摔跤风险；下行波动率只是摔跤统计，不是性价比。","t":"下行波动率是风险本身，不是风险调整收益","r":""},{"i":354,"c":6,"k":"杜邦恒等式","q":"杜邦恒等式中不涉及的财务指标是（）。","o":["权益乘数","资产负债率","总资产周转率","销售利润率"],"a":1,"p":"杜邦恒等式是净资产收益率等于销售利润率乘总资产周转率再乘权益乘数，三项分别代表赚钱能力、周转效率和财务杠杆。资产负债率虽然也是杠杆类指标，却不在等式里，等式用的是权益乘数。","e":"评价一家奶茶店赚不赚钱，看一杯赚几成、一天翻几台、开店借了多少钱，这三样乘起来就是股东回报，资产负债率是另一种算账口径。","t":"杜邦三件套：利润率、周转率、权益乘数","r":"杜邦恒等式为：净资产收益率=销售利润率×总资产周转率×权益乘数。"},{"i":355,"c":3,"k":"客户服务分类","q":"定期为客户提供产品净值信息服务属于基金客户（）","o":["售前服务","售中服务","售后服务","以上均不是"],"a":2,"p":"买之前发资料、做风险测评、讲产品是售前，办申购赎回是售中，产品成立之后定期送净值、对账单和市场解读，属于持续陪伴的售后服务。净值信息服务发生在投资者持有期间，所以归入售后服务。","e":"买完奶茶后店家每月发新品券和积分到账提醒，这是成交之后的维护，净值短信和季度对账单就是基金版的售后回访。","t":"买完之后的净值、对账单都算售后服务","r":"提供净值属于售后服务"},{"i":356,"c":4,"k":"债券利息税收","q":"公募基金投资以下债券的利息收入需要缴纳所得税的是？","o":["地方政府债","政策银行债","商业银行金融债","国债"],"a":2,"p":"国债和地方政府债的利息收入免征所得税，政策性银行债同样免税；商业银行金融债属于一般金融债券，利息要照章缴纳所得税。判断的关键在发行主体有没有免税待遇，而不是债券期限或票面利率高低。","e":"同样是借钱收利息，借给国家拿到的利息不交税，借给商业银行拿到的利息要交，选债时这层税差会直接影响到手收益。","t":"国债地方债政策债免税，商业银行金融债要缴","r":""},{"i":357,"c":9,"k":"GIPS业绩年限","q":"某公司于1998年成立，若该公司想公告符合GlPS标准，需至少汇报（）年以上满足GIPS的历史业绩。","o":["5","3","10","8"],"a":0,"p":"想公告符合GIPS标准，成立满五年的机构至少要汇报五年符合标准的业绩，此后每年滚动更新，一直报到十年以上。三年、八年、十年都不是起步年限，十年是最终要补满的上限而非起点。","e":"就像申请奖学金要提交最近五个学期的成绩单，之后每学期补一张，最终补满十个学期，起步线就是五，少了不够看。","t":"GIPS起步报5年，逐年补到10年","r":"除成立未满5年的投资管理机构外，所有机构必须汇报至少5年以上符合GIPS的业绩，并于此后每年更新业绩》一直汇报至10年以上的业绩。"},{"i":358,"c":4,"k":"QDII估值责任","q":"（）是QDII基金的会计核算和资产估值的责任主体。","o":["基金管理公司","基金托管银行","中国证监会","基金投资人"],"a":0,"p":"QDII基金的会计核算和资产估值由基金管理人负责，托管银行只负责复核估值结果、保管基金资产，证监会是监管者，投资者是受益人，都不承担估值责任。所以责任主体落在基金管理公司身上。","e":"宿舍聚餐谁收钱谁记账，管钱的同学只负责核对余额，账本记得对不对要算在记账那个人头上，管理人就相当于那个记账的。","t":"估值和核算归管理人，托管只负责复核","r":""},{"i":359,"c":5,"k":"相关系数与分散化","q":"在分散化投资组合构建过程中，为了降低投资组合风险，人们更愿意选择与现有资产在收益上呈现（）关系的资产。","o":["不相关","完全正相关","正相关","负相关"],"a":3,"p":"分散化靠的是资产之间不同步，负相关意味着一头涨另一头跌，波动相互抵消，组合风险降得最多。正相关会同涨同跌，分散作用很小；完全正相关等于没分散；不相关能降风险，但效果不如负相关。","e":"白天卖冰粉晚上卖烤红薯，天热冰粉好卖、天冷红薯好卖，两门生意此消彼长，比只卖一样更稳，这就是负相关的价值。","t":"对冲要负相关，同涨同跌分散没用","r":"相关系数越小，越有利于投资组合分散风险。"},{"i":360,"c":10,"k":"货币基金收益起算","q":"国庆节假期为10月1日至10月7日，10月8日为第一个工作日，某投资者于9月30日申购货币型基金，那么其收益计算开始日为","o":["9月30日","10月1日","10月8日","10月2日"],"a":2,"p":"货币基金申购后要下一个交易日确认份额才开始享受收益，九月三十日申购正好撞上国庆七天长假，得等到假期后第一个工作日十月八日确认，收益也从这天算起。九月三十日到十月七日这段不产生收益。","e":"九月三十日在奶茶店下单，店家放假七天，十月八日开门才给你做，做好的那杯从八日起算你的，放假那几天不算数。","t":"节前申购遇长假，节后首个工作日才起息","r":"假期前最后一个开放日申购，假期后第一个工作日开始计算收益"},{"i":361,"c":1,"k":"风险收益特征","q":"偏股型基金的风险（），预期收益率（）","o":["较高、较高","较高、较低","较低、较高","较低、较低"],"a":0,"p":"股票仓位高，涨跌就跟着股票走，赚得多也亏得多，风险与预期收益同向变动。货币基金那种才对得上低风险低收益，选项把两者当成反向关系，等于说承担更大波动反而回报更低，讲不通。","e":"像开奶茶店，敢把全部积蓄押在写字楼档口，忙时日流水三千，也可能整个月赔光；钱放余额宝，每天几毛利息，稳但少得可怜。","t":"风险收益同向，偏股的高波动才换来高预期","r":""},{"i":362,"c":6,"k":"股利贴现模型","q":"股利贴现模型不包括（）。","o":["零增长模型","多元增长模型","负增长模型","不变增长模型"],"a":2,"p":"按股利增长率的假定分类，只有零增长、不变增长、多元增长（含三阶段）这几类，增长率取正取负只是模型里的参数，负增长并不是一类独立模型。干扰项把“比率为负”误当成了一种算法名称。","e":"估奶茶店未来分红：每年固定给2元叫零增长，每年涨5%叫不变增长，前三年涨10%之后降到3%叫多元增长，生意下滑少给钱也还是套原公式。","t":"零增长、不变增长、多元增长三分法，没有负增长","r":"根据对股利增长率的不同假定，股利贴现模型可以分为零增长模型、不变增长模型、三阶段增长模型和多元增长模型。"},{"i":363,"c":7,"k":"国债投资要素","q":"以下选项中不属于债券基金管理人在投资国债时需要考虑的因素的是？","o":["发行人的违约概率","债券的到期收益率","债券的久期","债券的流动性"],"a":0,"p":"国债以国家信用背书，视同没有违约风险，所以违约概率根本不是筛选国债要看的东西；真正要盯的是到期收益率决定收益、久期衡量利率敏感度、流动性决定能不能快速变现。干扰项把信用债的分析框架硬套给国债。","e":"把钱借给国家，好比存进总行金库，几乎不用担心赖账；借给隔壁奶茶店老板，才要先掂量他下个月还不还得上，这就是违约概率。","t":"国债无违约，只看收益率、久期和流动性","r":""},{"i":364,"c":10,"k":"LOF交易机制","q":"以下关于LOF基金的说法，错误的是","o":["LOF基金是我国对证券投资基金的一种本土化创新","LOF可以是指数基金，也可以是主动管理基金","投资者只能在指定网点申购与赎回基金份额，不可以在交易所买卖该基金。","LOF基金和ETF基金的申购赎回机制不同"],"a":2,"p":"LOF既能在场外按净值申购赎回，又能把份额转托管到交易所像股票一样买卖，两个通道并存才是它的本土化创新所在。说它不能上市交易正好说反了；ETF走的是实物组合申赎，机制确实不同。","e":"像同一张健身年卡，既能在前台直接续费，也能挂在二手平台转卖给别人，两边价格还不一样，脑子快的人就能低买高卖赚差价。","t":"两个通道并存：场外按净值申赎，场内像股票买卖","r":""},{"i":365,"c":11,"k":"收盘价规则","q":"下列关于上海证券交易所上市交易股票的收盘价的说法中，正确的是（）。","o":["当日无成交的，以前一交易日收盘价为当日收盘价","收盘价为股票最后一笔交易前1分钟所有交易的成交量加权平均（不含最后一笔交易）","收盘价为股票最后一笔交易前3分钟所有交易的成交量加权平均（不含最后一笔交易）","收盘价通过集合竞价的方式产生"],"a":0,"p":"上交所收盘价取最后一笔交易前1分钟全部成交的成交量加权均价，且含最后一笔；全天一笔没成交，就直接沿用上一交易日收盘价，保证有价可依。干扰项把1分钟改成3分钟，或说不含最后一笔，都记岔了。","e":"像二手平台某款球鞋今天没人下单，页面仍挂昨天的成交价2000元，买家心里有数；一旦成交，就按最后1分钟那几笔的平均价算。","t":"收盘价看最后1分钟加权，无成交沿用昨收","r":"上海证券交易所证券交易的收盘价为当日该证券最后一笔交易前1分钟所有交易的成交量加权平均价（含最后一笔交易）。当日无成交的，以前收盘价为当日收盘价。"},{"i":366,"c":1,"k":"信息披露形式","q":"关于基金的信息披露，下列哪项描述是正确的？","o":["基金的信息披露只需要在基金合同中约定","基金的信息披露只需要公开定期报告","基金的信息披露包括定期报告、临时报告等形式","基金的信息披露不需要公开关键投资信息和风险警示"],"a":2,"p":"披露是持续义务，除了季报、半年报、年报这些定期报告，碰上重大事项还要发临时报告，并揭示关键投资信息和风险警示。干扰项说只靠合同约定或只发定期报告，把披露的形式和范围缩得太窄了。","e":"像奶茶加盟总部，不光每月发经营月报，临时换供应商、被查出原料问题也要当天在群里通知加盟商，不能压到下个月月报再说。","t":"定期报告加临时报告，重大事项不能等月报","r":"根据相关法律法规和行业规范，基金的信息披露包括定期报告、临时报告等形式，以帮助投资者了解基金的运作情况和风险状况。因此，C选项描述是正确的。"},{"i":367,"c":11,"k":"交易指令审核","q":"下列关于基金公司投资交易流程的表述中，错误的是（）。","o":["交易员接收到指令后有权根据自身对市场的判断选择合适时机完成交易","在自主权限内，基金经理通过交易系统向交易室下达交易指令","交易员负责审核投资指令(价格、数量)的合法合规性，对于可能不盈利指令可以拒绝","基金公司投资交易包括形成投资策略、构建投资组合、执行交易指令、绩效评估与组合调整、风险管理等环节"],"a":2,"p":"指令的价格、数量是否合法合规由交易总监统一把关，违规指令会被拦截退回基金经理；交易员只在授权范围内挑时机执行，不能因为觉得“可能不赚钱”就拒单。干扰项把审核权和拒单权都安到了交易员头上。","e":"像外卖站点，调度先核对地址和金额无误才派单，骑手只管挑路线和时机送到，不能因为觉得这单不划算就撂挑子。","t":"合规审核归交易总监，交易员只负责择时执行","r":"交易总监审核投资指令（价格、数量）的合法合规性，违规指令将被拦截，反馈给基金经理。其他指令被分发给交易员。"},{"i":368,"c":6,"k":"资本类型","q":"关于资本类型的说法，错误的是（）","o":["权益资本是通过借债方式筹集的资金","债权资本是公司向债权人借入资金，定期向他们支付利息，并到期偿还本金","普通股是股份有限公司发行的一种基本股票","优先股的股息是事先规定好的、固定的"],"a":0,"p":"借钱要还本付息，形成的是债权资本；发行股票、置换所有权拿到的钱才是权益资本，区分标准是资金性质而非用途。说权益资本靠借债，正好把债权资本的定义张冠李戴。普通股是基本股票、优先股股息固定这两句本身没错。","e":"开奶茶店找银行借20万元，每月付息、到期还本，这是债权；拉同学入股出20万元、按股份分红，生意赔了不用还本，这是权益。","t":"借债是债权资本，发股票才是权益资本","r":"债权资本是通过借债方式筹集的资本，权益资本是通过发行股票或置换所有权筹集的资本。"},{"i":369,"c":7,"k":"买卖价差","q":"以下关于基金持仓债券的流动性风险的说法不正确的是？","o":["摊余成本法债券基金不需要重点关注持仓债券的流动性风险","债券交易越活跃，流动性风险越低","一般来说买卖价差越大，流动性风险越小","债券的流动性主要用于衡量基金持有债券的变现难易程度"],"a":2,"p":"买卖价差是买方最高报价与卖方最低报价的缺口，价差越大意味着想出手就得大幅让价，变现越贵、流动性风险越大。干扰项把方向说反了；摊余成本法基金同样要盯持仓能否变现，只是净值波动被平滑了。","e":"像转卖演唱会门票，挂1000元没人接手、一路降到800元才秒出，中间那200元的砍价空间就是价差，砍得越狠说明这票越难出手。","t":"价差越大越难出手，流动性风险越高","r":""},{"i":370,"c":6,"k":"自下而上策略","q":"关于采用自下而上策略的股票型基金，下列说错误的是（）。","o":["基金经理可以不考虑行业与风格的配置，只是选择个股","基金资产中股票的配置比例不低于80％","股票投资比例主要取决于基金经理对宏观经济形势的预测","个股的选择与权重受到基金契约、基金合规等方面的限制"],"a":2,"p":"自下而上从个股出发，股票仓位高低取决于能挖到多少值得买的标的，不靠宏观预测定比例；先判断经济形势再决定股债配置的是自上而下。干扰项把自上而下的做法安到自下而上头上，方向正好弄反。","e":"像逛菜市场挑苹果，自下而上的人挨个捏一遍，好果子多就多买几斤；自上而下的人先看天气预报猜今年收成，再决定买多少。","t":"自上而下看宏观定仓位，自下而上靠选股","r":"在不超出设立目标所允许的范围内，信奉自上而下理念的投资经理需要结合自己对宏观经济形势的预测来选择合适的股票投资比例，信奉自下而上理念的投资经理在股票上的投资比例则主要取决于其掌握的可投资股票的深度和广度。"},{"i":371,"c":2,"k":"合规管理职责","q":"合规管理部门职责不包括（）","o":["持续关注法律法规的最新发展，把握法规对基金经营的影响，及时为高层提供合规建议。","制定并执行合规管理计划，包括特定政策和程序的实施与评价、合规风险评估、合规性测试、合规培训等。","决定公司的合规管理部门的设置和职能。","收集、筛选可能预示潜在合规问题的数据，如消费者投诉增长数、异常交易等，建立合规风险监测指标，按照风险矩阵衡量合规风险发生的可能性和影响，确定合规风险的优先考虑序列。"],"a":2,"p":"合规部门是执行层，负责跟踪法规动态、制定并落实合规计划、监测投诉增长和异常交易等风险信号；决定合规部门怎么设、管什么，属于董事会层面的治理权力。干扰项把董事会的职权错记成合规部自己的职责。","e":"像健身房请的私教，只管按课表带练、记录你的体测数据；要不要新设私教岗、给多少课时，得老板在店务会上拍板。","t":"设不设合规部由董事会定，合规部只管执行","r":"C属于董事会的合规责任"},{"i":372,"c":5,"k":"系统性风险","q":"关于股票基金的风险，以下表述正确的是（）。","o":["不同类型的股票基金所面临的系统性风险相同的","股票基金的风险水平低于混合型基金","股票基金面临的投资风险可以分为系统性风险和非系统性风险","股票基金通过分散投资可以大大降低个股投资的系统性风险"],"a":2,"p":"股票组合的风险可以拆成两块：系统性风险来自利率、政策等全市场因素，分散不掉；非系统性风险是单家公司的特殊风险，多买几十只股票能大幅削弱。干扰项说分散能降系统性风险，恰好说反了。","e":"像开三家奶茶店，分别守学校、地铁口、医院，一家店长跑路只伤一家，属非系统风险；整条街封路修地铁，三家一起没客流，属系统风险。","t":"分散只降非系统性风险，系统性躲不掉","r":"选项A，不同类型的股票基金所面临的系统性风险是不同的；选项B,股票基金的风险水平高于混合型基金；选项D，股票基金通过分散投資可以大大降低个股投資的非系统性风险。"},{"i":373,"c":3,"k":"申购净值确定","q":"小张在T交易日15:29申购了一只偏股混合型基金，其申购份额应该按（）的净值计算。","o":["T日","T+1日","T+2日","T-1日"],"a":1,"p":"15点是当天申赎的截止线，15点前下单按当天收盘后算出的净值成交，15点29分已经过线，只能算下一交易日也就是T+1的委托，按T+1净值确认份额。干扰项直接按T日算，是把这条时间界线忽略了。","e":"像赶末班地铁，15点整闸机就落锁，你15点29分才跑到站台，只能等明天第一班车，票价也按明天公布的来算，急也没用。","t":"15点前算当日净值，过点顺延到下一交易日","r":""},{"i":374,"c":3,"k":"客户资料保存","q":"基金经营机构的客户终端信息，和电子化开户资料保存期限不少于（）年。","o":["5","15","20","30"],"a":2,"p":"客户终端信息和电子化开户资料属于身份与交易凭证，监管要求保存期限不少于20年，方便日后核查追责。干扰项5年、15年是其他档案材料的常见期限，混进来就容易选错，记住开户资料是20年这一档。","e":"像学校把入学登记表和体检表一直存到毕业20年后，万一学籍有争议还能翻出原件来核对，只存三五年就查无对证。","t":"客户开户资料保存20年，别和5年的旧印象混了","r":"基金经营机构的客户终端信息，和电子化开户资料保存期限不少于20年。"},{"i":375,"c":1,"k":"合格境内机构","q":"在（）募集资金可以进行（）证券投资的机构就被称为合格境内机构投资者","o":["境内，境内","境内，境外","境外，境外","境外，境内"],"a":1,"p":"合格境内机构投资者是在境内募集人民币资金，换成外汇后投向境外市场买股票债券，钱从境内来、投到境外去。四个选项里只有境内募集加境外投资这个组合对得上，其余都把两头弄混了。","e":"像班级团购，报名和交钱都在国内群里完成，货却从海外仓直邮过来，QDII就是替你出海代购的那只基金，钱没出门先换了汇。","t":"两头别记反：境内募集人民币，境外市场做投资","r":""},{"i":376,"c":6,"k":"指数编制方法","q":"沪深300指数编制方法采用的是（）。","o":["成交额加权法","几何平均法","派氏加权法","算数平均法"],"a":2,"p":"沪深300从沪深两市选300只A股，以2004年12月31日为基日、基点1000点，按调整股本加权，用派氏加权综合价格指数公式计算，权重随股本变动调整。干扰项的算术平均、几何平均都不是它的加权方式。","e":"像宿舍均摊水电费，不是每人交一样多，而是按各自用电度数占比来分摊，用电多的人自然摊得多，这就是加权。","t":"沪深300选300只样本，基点1000点，用派氏加权计算","r":"沪深300指数在上海和深圳证券市场中选取300只A股作为样本，以2004年12月31日为基期，基点为1000点，其计算以调整股本为权重，采用派民加权综合价格指数公式进行计算。"},{"i":377,"c":3,"k":"宣传材料备案","q":"基金管理人的基金宣传推介材料，自向公众分发或者发布之日起（）个工作日内报主要经营活动所在地中国证监会派出机构备案。","o":["1","5","10","15"],"a":1,"p":"宣传推介材料自向公众分发或发布起5个工作日内，报主要经营活动所在地证监会派出机构备案，属事后备案而非事前审批。干扰项1个、10个、15个工作日都是把期限记岔；只有被连续警示的机构才改成事前报送。","e":"像奶茶店印好新海报先贴出去，5个工作日内再把样张交到街道市场监管所留档，不用等批文就能上墙，改版也方便。","t":"宣传材料5个工作日内报派出机构备案","r":"基金管理人的基金宣传推介材料，自向公众分发或者发布之日起5个工作日内报主要经营活动所在地中国证监会派出机构备案。"},{"i":378,"c":5,"k":"投资决策说明书","q":"下列关于投资决策说明书包含的内容，说法错误的是","o":["最低收益保障","业绩比较基准","投资范围","投资回报率目标"],"a":0,"p":"说明书要写清投什么（投资范围）、奔着什么去（回报率目标）、拿什么尺子量（业绩比较基准），唯独不能写最低收益保障，公募基金不得保本保收益。干扰项这句正是监管明令禁止出现在材料里的表述。","e":"像健身房卖年卡，可以写清器械区和泳池都能用、目标是一年帮你减掉10斤，但不能保证你一定瘦，敢保证就是忽悠。","t":"能定目标定基准，不能写最低收益保障","r":""},{"i":379,"c":7,"k":"风险溢价","q":"债券的预期到期收益率与具有相同期限和票面利率的无风险债券的到期收益率之间的差额，称为（）。","o":["信用利差","期限结构","风险溢价","信用评级"],"a":2,"p":"在期限和票面利率都相同的条件下，风险债券的预期到期收益率高出无风险债券的那一截补偿，就是风险溢价，本质是对违约和变现不确定性的要价。干扰项信用利差数值上接近，但教材把这一差额定义为风险溢价。","e":"像同样借出1万元、期限一年，借给国家只收3%利息，借给开奶茶店的同学要收7%，多要的那4个点就是为可能赖账买的保险。","t":"风险债券多要的那截收益，叫风险溢价","r":"某一风险债券的预期到期收益率与某一具有相同期限和票面利率的无风险债券的到期收益率之间的差额，称为风险溢价。"},{"i":380,"c":5,"k":"投资政策说明书","q":"以下不属于投资政策说明书内容的是（）","o":["收益承诺","投资目标","投资限制","业绩比较基准"],"a":0,"p":"投资政策说明书是投资管理的总纲，写明投资目标、投资限制、资产配置和业绩比较基准，用来约束行为、考核结果，绝不会写收益承诺。干扰项收益承诺与卖者尽责、买者自负的原则直接冲突，一定不出现。","e":"像租房合同里写清租金多少、押金几万、能不能养猫、参照周边均价定，但房东绝不会写保证你住着还能升值这种话。","t":"政策书写目标、限制、基准，不写收益承诺","r":"投资政策说明书并没有标准格式，大部分的投资政策说明书都包含了以下内容：介绍、目的陈述、責任和义务的陈述、流程、投资目标、投資限制、资产配置、投资指导方针、业绩考核指标与业绩比较基准、评估与回顾。除以上内容外，有些机构还将投资决策流程、投资策略与交易机制等内容纳入投资政策说明书。"},{"i":381,"c":1,"k":"半年报披露","q":"在上半年结束后（）日内，在指定报刊上披露半年度报告摘要，在管理人网站上披露半年度报告全文。","o":["30","60","90","120"],"a":1,"p":"半年度报告要在上半年结束后的60日内完成，指定报刊登摘要、管理人网站挂全文，两边同时进行、内容一致。干扰项30日、90日、120日是把季报和年报的期限混了进来，年报才是结束后90日内披露。","e":"像期末成绩，考完60天内必须把分数条发到家长群，完整试卷分析再传到班级网盘，拖过这个期限老师就要被问责。","t":"半年报60日、年报90日、季报15日，三个期限别记串","r":"在上半年结束后60日内，在指定报刊上披露半年度报告摘要，在管理人网站上披露半年度报告全文。"},{"i":382,"c":1,"k":"股票基金目标","q":"股票型基金的主要投资目标是：","o":["追求资本的增值","获取稳定的收益","保存本金","分散投资风险"],"a":0,"p":"股票型基金把八成以上资产压在股票上，靠企业盈利增长和股价上涨赚差价，主要目标就是资本增值；求稳定收益是债券基金的诉求，保住本金是货币基金的定位。干扰项把其他类型的目标张冠李戴过来。","e":"像买下奶茶店的一小份股份，你图的是这家店越开越多、手里的股份越来越值钱，而不是每月领一笔固定利息。","t":"股票型图增值，债券型求收益，货币保本金","r":""},{"i":383,"c":8,"k":"信用风险缓释","q":"下列与信用风险缓释合约最类似的是（）。","o":["利率互换","信用违约互换","股权互换","货币互换"],"a":1,"p":"信用风险缓释合约和信用违约互换都是把债券的违约风险单独打包卖出去，买方定期付保费、违约时获赔，结构一一对应。利率互换、货币互换换的是利率和汇率，股权互换换股票收益，都不管违约。","e":"像给租房买一份租客跑路险，每月交几十元保费，真被欠租就由保险公司补上，跟替债券违约买保险是同一个逻辑。","t":"缓释合约对标CDS，都是给债券违约上保险","r":"信用违约互换是境外金融市场中较为常见的信用风险管理工具。在境内，与信用违约互换具有类似结构特征的工具是信用风险缓释工具。"},{"i":384,"c":9,"k":"控制回撤","q":"基金经理可通过以下哪种方法来控制回撤？","o":["分散持股","追涨杀跌","提高杠杆","提高权益仓位"],"a":0,"p":"回撤是净值从高点往下掉的最大幅度，分散持股让不同股票涨跌互相抵消，组合整体波动小、回撤也浅；追涨杀跌、加杠杆、加权益仓位都会放大波动。干扰项提高仓位反而把回撤做得更深。","e":"像把生活费分开放进微信、银行卡和一点现金，手机丢了也不至于断粮；钱全押在一只股票上，一个跌停就伤筋动骨。","t":"降回撤靠分散和降仓，加杠杆只会放大","r":""},{"i":385,"c":3,"k":"客户服务特点","q":"基金客户服务的特点不包括（）","o":["专业性","规范性","一次性","时效性"],"a":2,"p":"客户服务要专业、合规、及时，还得从申购一直陪到赎回，所以特点是专业性、规范性、持续性、时效性，而不是一次性。干扰项把基金销售当成收完钱就结束的一锤子买卖，与持续陪伴的要求相反。","e":"像健身房私教，办卡之后每次训练都要跟进你的饮食和体测，不是收完钱就消失，否则续卡率马上归零，教练也活不下去。","t":"客户服务四特点：专业、规范、持续、时效","r":"基金客户服务特点包括，专业性、规范性、持续性、时效性"},{"i":386,"c":3,"k":"宣传材料报送","q":"对在（）个月内连续（）次被出具监管警示函仍未改正的基金管理公司或基金代销机构，该公司或机构在分发或公布基金宣传推介材料前，应当事先将材料报送中国证监会。","o":["6 两","12 三","24 四","3 三"],"a":0,"p":"这是对屡教不改机构的加码监管：6个月内连着两次收到监管警示函且未改正，宣传材料就从普通备案升级为分发前先报证监会。干扰项改动的是月数和次数，记住6个月配两次这组搭配即可。","e":"像宿舍卫生连续两次被通报还不整改，之后每次办活动都得提前把方案交给辅导员审批，不能像以前那样先办后报。","t":"6个月内两次警示不改，宣传材料改事前报","r":"对在6个月内连续两次被出具监管警示函仍未改正的基金管理公司或基金代销机构，该公司或机构在分发或公布基金宣传推介材料前，应当事先将材料报送中国证监会。"},{"i":387,"c":4,"k":"估值频率","q":"基金管理人（ ）对开放式基金资产估值后，将基金份额净值结果发给托管人。","o":["A·每月","每周","每半个月","每个交易日"],"a":3,"p":"开放式基金每天都有申购赎回，必须每个交易日估值一次，算出份额净值后发给托管人复核，核对无误才对外披露。干扰项每周、每月把频率记低了，会让申赎价格滞后，对留下来的持有人不公平。","e":"像奶茶店每天打烊都要盘一次库存、算当天每杯成本，第二天才能按新价卖；一周盘一次，中间卖亏了都不知道。","t":"开放式基金每个交易日估值，净值交托管人复核","r":"基金管理人每个交易日对基金资产估值后，将基金份额净值结果发给基金托管人。"},{"i":388,"c":3,"k":"销售持续性","q":"基金销售不是一锤子买卖，要学会跟踪客户，扩大基金规模。说明基金销售的（）","o":["持续性","规范性","服务性","适用性"],"a":0,"p":"卖完基金还得跟踪客户持仓和盈亏、持续做陪伴，才有加购和转介绍，体现的是持续性；规范性讲合规，适用性讲风险匹配，服务性讲体验，都不是跟踪客户这个点。干扰项只覆盖了某一个侧面。","e":"像健身房卖完年卡，还每周发训练计划、到期前提醒你续卡，会员留存率上去了，第二年的营业额才跟着往上涨。","t":"卖完还要跟着客户，考的就是持续性","r":"金销售不是一锤子买卖，要学会跟踪客户，扩大基金规模。说明基金销售的持续性"},{"i":389,"c":11,"k":"申报价格单位","q":"LOF申报价格最小变动单位为（）","o":["0.1","0.01","0.001","0.0001"],"a":2,"p":"LOF份额在交易所买卖，申报价格最小变动单位是0.001元，比股票的0.01元细十倍，因为基金份额净值本身才几元钱，价格刻度必须更小才报得准。干扰项0.01元是股票和多数债券用的单位。","e":"像电子秤称黄金，要按0.001克一跳才够精确；称一袋大米，按1克一跳就绰绰有余了，东西越轻刻度越得细，不然误差太大。","t":"LOF报价最小变动是0.001元，比股票细十倍，别记成0.01","r":"LOF申报价格最小变动单位为0.001"},{"i":390,"c":11,"k":"同业拆借主体","q":"下列不属于同业拆借交易主体的是（）。","o":["商业银行","保险公司","中央银行","基金公司"],"a":2,"p":"同业拆借是金融机构之间互相调剂短期头寸的市场，主体是商业银行、保险公司、证券公司、基金公司等机构。中央银行是流动性的调控者，通过公开市场操作投放资金，不进场跟机构做拆借。干扰项把裁判当成了球员。","e":"像宿舍楼里同学之间临时借着用充电宝，宿管阿姨只负责开关电闸、维持楼里秩序，不会掺和到同学之间借和还的账里去。","t":"央行是裁判不是球员，不参与同业拆借","r":"同业拆借市场属于银行间市场，交易主体为商业银行、保险公司、证券公司、基金公司等大型金融机构。"},{"i":391,"c":10,"k":"建仓期限","q":"ETF建仓期不超过（）个月","o":["1","2","3","6"],"a":2,"p":"ETF成立后要在3个月内按标的指数把组合建好，让跟踪误差尽快收敛；建仓期内可以灵活操作，期满就要紧贴指数。干扰项1个月、2个月太短来不及，6个月又拖太久，规模会被闲置资金拖累。","e":"像新开奶茶店试营业，规定3个月内把菜单配齐、出品稳定下来，时间太短来不及招人培训，拖太久顾客早就跑光了。","t":"ETF建仓期限3个月，建完就得紧贴标的指数","r":"ETF建仓期不超过3个月"},{"i":392,"c":9,"k":"业绩评价指标","q":"在评估股票型基金的业绩时，以下哪种指标不是常用的？","o":["年化收益率","最大回撤","夏普比率","管理费率"],"a":3,"p":"看业绩要看赚了多少（年化收益率）、最狠跌过多少（最大回撤）、每单位风险换来多少收益（夏普比率），都是业绩或风险指标；管理费率反映收费高低，属于持有成本。干扰项把成本混进了业绩评价。","e":"像评价一个健身教练，要看他帮你减了几斤、体脂降了多少，而不是看他每小时收多少钱，收费高不代表教得好。","t":"费率是成本不是业绩，别混进业绩排名","r":""},{"i":393,"c":8,"k":"期权卖方风险","q":"下列期权交易中风险最大的是（）。","o":["买入看涨期权","买入看跌期权","卖出看跌期权","卖出看涨期权"],"a":3,"p":"卖出看涨期权收的是一笔权利金，收益封顶就是这笔钱，可股价涨到多高，就得按约定的低价把股票交出去，亏损理论上没有上限。买方最多亏掉权利金，所以风险最大的是看涨期权的卖方。","e":"像收了朋友50元，答应他随时能按10元买走你那双限量球鞋，鞋被炒到2000元也只能10元卖，赚的是50元，赔的却是1990元，这就是卖出看涨期权的处境。","t":"卖看涨收小钱担无限亏，四类里风险最大","r":"看涨期权买方的亏损是有限的，其最大亏损额为期权价格，而盈利可能是无限大的。 相反，看涨期权卖方的盈利是有限的，其最大盈利为期权价格，而亏损可能是无限大的。看跌期权的卖方的盈利和买方的亏损是有限的。看跌期权卖方的亏损
